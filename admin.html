<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FBBF24'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' fill='%23111827' font-family='sans-serif' font-weight='900' font-size='32'%3EC%3C/text%3E%3C/svg%3E" />
  <title>城巴報站音檔 · 手動配對工作台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
  <style>
    body {
      font-family: "Inter", "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", sans-serif;
      background-color: #F8F9FA;
      color: #111827;
      font-variant-numeric: tabular-nums;
    }
    .row-item { transition: background-color 0.12s ease; }
    .row-item:hover { background-color: #F1F5F9; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="bg-white border-b-2 border-[#111827] sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-10 h-10 rounded-lg bg-[#FBBF24] border-2 border-[#111827] flex items-center justify-center font-black text-lg text-[#111827] shrink-0">
          C
        </div>
        <div class="min-w-0">
          <h1 class="text-base sm:text-lg font-black tracking-tight text-[#111827] truncate">城巴報站音檔 · 手動配對工作台</h1>
          <p class="text-xs text-slate-500 font-medium truncate">純人手配對與核對，支援來回同名共用／只限此方向車站與刪除管理</p>
        </div>
      </div>

      <div class="flex items-center gap-2 shrink-0">
        <button id="btnSettings" class="px-3 py-2 rounded-lg bg-white hover:bg-slate-50 text-[#111827] text-xs font-bold border border-slate-300">
          GitHub 設定
        </button>
        <button id="btnPublishMapping" class="px-3.5 py-2 rounded-lg bg-[#059669] hover:bg-[#047857] text-white text-xs font-bold">
          同步已確認表
        </button>
        <a href="./index.html" class="px-3.5 py-2 rounded-lg bg-[#0052CC] hover:bg-[#0041A3] text-white text-xs font-bold">
          返回報站器
        </a>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

    <aside class="lg:col-span-4 space-y-5 lg:sticky lg:top-22">
      <section class="bg-white rounded-xl border border-slate-200 p-4 space-y-3">
        <h2 class="text-sm font-black text-[#111827]">篩選與搜尋</h2>
        <div>
          <label class="block text-[11px] font-bold text-slate-600 mb-1">搜尋檔名、站名、備註或站號</label>
          <input id="searchInput" type="text" placeholder="例如 796X / 北角 / 1277 / 機場" class="w-full px-3 py-2 rounded-lg bg-slate-50 border border-slate-300 text-xs font-bold outline-none focus:border-[#0052CC] focus:bg-white" />
        </div>
        <div>
          <label class="block text-[11px] font-bold text-slate-600 mb-1">只看包含指定資料夾／類型</label>
          <select id="folderFilterSel" class="w-full px-3 py-2 rounded-lg bg-slate-50 border border-slate-300 text-xs font-bold outline-none focus:border-[#0052CC]">
            <option value="stops_only" selected>只看車站報站檔（排除特別廣播與 Terminus）</option>
            <option value="all">全部音檔（含特別廣播與系統音檔）</option>
          </select>
        </div>
        <div class="pt-1 flex items-center justify-between text-[11px]">
          <span id="deletedCountLabel" class="text-slate-500 font-bold">已刪除：0 項</span>
          <button id="btnRestoreDeleted" class="text-[#0052CC] hover:underline font-bold">復原已刪除項目</button>
        </div>
      </section>

      <section class="bg-white rounded-xl border border-slate-200 p-4 space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-black text-[#111827]">上傳新報站錄音</h2>
          <span class="text-[11px] font-bold px-2 py-0.5 rounded bg-[#FBBF24]/25 text-[#111827]">WAV / MP3</span>
        </div>
        <p class="text-xs text-slate-500 leading-relaxed">
          上傳後自動轉為輕量 MP3，並加入未配對清單供你試聽及手動指定車站。
        </p>
        <label class="block w-full border-2 border-dashed border-slate-300 hover:border-[#0052CC] rounded-xl p-4 text-center cursor-pointer transition-colors bg-slate-50/70">
          <span class="block text-xs font-black text-[#0052CC]">選擇本地錄音檔（支援多選）</span>
          <span class="block text-[11px] text-slate-400 mt-0.5">支援 .wav / .mp3 / .m4a</span>
          <input id="newAudioUploadInput" type="file" accept=".wav,.mp3,.m4a,.ogg" multiple class="hidden" />
        </label>
      </section>
    </aside>

    <section class="lg:col-span-8 bg-white rounded-xl border border-slate-200 overflow-hidden">
      <div class="grid grid-cols-3 border-b border-slate-200 bg-slate-50">
        <button id="tabUnmatched" data-cat="unmatched" class="cat-tab px-3 py-4 text-left border-b-2 border-[#111827] bg-white">
          <div class="text-xs font-bold text-slate-500">類別一</div>
          <div class="flex items-baseline justify-between gap-2 mt-0.5">
            <span class="text-sm sm:text-base font-black text-[#111827]">未配對</span>
            <span id="cntUnmatched" class="text-sm font-black text-slate-700">0</span>
          </div>
        </button>

        <button id="tabAiMatched" data-cat="ai_matched" class="cat-tab px-3 py-4 text-left border-b-2 border-transparent hover:bg-slate-100/70">
          <div class="text-xs font-bold text-amber-700">類別二</div>
          <div class="flex items-baseline justify-between gap-2 mt-0.5">
            <span class="text-sm sm:text-base font-black text-[#111827]">待核對</span>
            <span id="cntAiMatched" class="text-sm font-black text-amber-600">0</span>
          </div>
        </button>

        <button id="tabConfirmed" data-cat="confirmed" class="cat-tab px-3 py-4 text-left border-b-2 border-transparent hover:bg-slate-100/70">
          <div class="text-xs font-bold text-emerald-700">類別三</div>
          <div class="flex items-baseline justify-between gap-2 mt-0.5">
            <span class="text-sm sm:text-base font-black text-[#111827]">已確認</span>
            <span id="cntConfirmed" class="text-sm font-black text-[#059669]">0</span>
          </div>
        </button>
      </div>

      <div class="px-5 py-3 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2 bg-white">
        <div id="tabHelperText" class="text-xs font-medium text-slate-500">
          正在載入音檔庫與車站表...
        </div>
        <div class="flex items-center gap-2">
          <button id="btnClearAiDrafts" class="px-3 py-1.5 rounded-lg bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 text-xs font-bold">
            清除未確認自動紀錄
          </button>
          <button id="btnExportJson" class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold">
            匯出對照 JSON
          </button>
        </div>
      </div>

      <div id="audioListBody" class="divide-y divide-slate-200">
        <div class="py-12 text-center text-sm font-bold text-slate-400">正在載入音檔庫與車站表...</div>
      </div>

      <div id="paginationBar" class="px-5 py-3 border-t border-slate-200 bg-slate-50 flex items-center justify-between text-xs font-bold">
        <button id="btnPagePrev" class="px-3 py-1.5 rounded-lg bg-white border border-slate-300 hover:bg-slate-100 disabled:opacity-40">上一頁</button>
        <span id="pageInfoText" class="text-slate-600">第 1 / 1 頁</span>
        <button id="btnPageNext" class="px-3 py-1.5 rounded-lg bg-white border border-slate-300 hover:bg-slate-100 disabled:opacity-40">下一頁</button>
      </div>
    </section>
  </main>

  <div id="stopPickerModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
    <div class="w-full max-w-lg rounded-2xl bg-white border border-slate-200 p-5 space-y-3 shadow-2xl">
      <div class="flex items-center justify-between">
        <div>
          <h3 class="text-base font-black text-[#111827]">手動指定對應車站</h3>
          <p id="pickerAudioLabel" class="text-xs text-slate-500 truncate max-w-sm mt-0.5"></p>
        </div>
        <button id="btnClosePicker" class="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-bold">關閉</button>
      </div>
      <input id="pickerSearchInput" type="text" placeholder="輸入中文站名、副站名、英文站名、站號或途經路線（如 796X）" class="w-full px-3.5 py-2.5 rounded-lg bg-slate-50 border border-slate-300 text-xs font-bold outline-none focus:border-[#0052CC]" />
      <div id="pickerResults" class="max-h-72 overflow-y-auto divide-y divide-slate-100 border border-slate-200 rounded-xl"></div>
    </div>
  </div>

  <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
    <div class="w-full max-w-md rounded-2xl bg-white border border-slate-200 p-5 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between">
        <h3 class="text-base font-black text-[#111827]">GitHub 雲端同步設定</h3>
        <button id="btnCloseSettings" class="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-bold">關閉</button>
      </div>
      <div class="space-y-1.5">
        <label class="block text-xs font-black text-slate-800">GitHub Personal Access Token（選填，用於一鍵寫回 audio_mapping.json）</label>
        <input id="ghTokenInput" type="password" placeholder="ghp_..." class="w-full px-3.5 py-2.5 rounded-lg bg-slate-50 border border-slate-300 text-xs font-mono outline-none focus:border-[#059669]" />
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button id="btnClearKeys" class="px-3 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-700">清除 Token</button>
        <button id="btnSaveKeys" class="px-4 py-2 rounded-lg bg-[#0052CC] hover:bg-[#0041A3] text-white text-xs font-bold">儲存設定</button>
      </div>
    </div>
  </div>

  <div id="adminToast" class="hidden fixed bottom-6 right-6 z-50 px-4 py-3 rounded-xl bg-[#111827] text-white text-xs font-bold shadow-xl max-w-sm"></div>

<script>
const AUDIO_CDN_BASE = 'https://kenyip0244.github.io/CTB-LECIP-Audio';
const GH_OWNER = 'kenyip0244';
const GH_WEB_REPO = 'CTB-LECIP-Web';
const GH_AUDIO_REPO = 'CTB-LECIP-Audio';
const STORAGE_DB_KEY = 'ctb_lecip_gemini_audio_db_v1';
const PAGE_SIZE = 30;

let audioManifest = [];
let uniqueStops = [];
let stopById = new Map();
let audioDb = {};

let currentTab = 'unmatched';
let currentPage = 0;
let curAudio = null;
let playingPath = '';
let pickerTargetPath = '';

function esc(v) {
  return String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function toast(msg) {
  const el = document.getElementById('adminToast');
  if (!el) return;
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(window._t);
  window._t = setTimeout(() => el.classList.add('hidden'), 3200);
}

function cleanJoint(raw) {
  const s = String(raw || '').trim();
  if (!s || !s.includes('/')) return s;
  const parts = s.split(/\s*\/\s*/).map(p => p.trim()).filter(Boolean);
  if (parts.length !== 2) return s;
  const [p1, p2] = parts;
  if (/^(G|UG|LG|M|B\d?|\d+)$/i.test(p1) && /^F$/i.test(p2)) return s;
  if (/\/\s+/.test(s) || (p1 === p1.toUpperCase() && p2 !== p2.toUpperCase())) return p2;
  return s;
}

function normText(s) {
  return String(s || '')
    .toLowerCase()
    .replace(/[\(（][^\)）]*[\)）]/g, '')
    .replace(/[\s,，\.。\-－·・、'"`]/g, '');
}

function saveLocalDb() {
  try {
    localStorage.setItem(STORAGE_DB_KEY, JSON.stringify(audioDb));
  } catch (e) {
    toast('瀏覽器儲存空間不足：' + e.message);
  }
}

function getRecord(path) {
  if (!audioDb[path]) {
    audioDb[path] = {
      status: 'unmatched',
      transcript: '',
      heardTc: '',
      heardEn: '',
      type: 'stop',
      matchedStopId: '',
      matchScore: 0,
      scope: 'single',
      candidates: [],
      deleted: false
    };
  }
  if (!audioDb[path].scope) audioDb[path].scope = 'single';
  return audioDb[path];
}

function deleteRecord(path) {
  const rec = getRecord(path);
  if (rec.status === 'confirmed' || rec.status === 'ai_matched') {
    rec.status = 'unmatched';
    rec.matchedStopId = '';
    rec.matchScore = 0;
    rec.transcript = '';
    rec.heardTc = '';
    rec.heardEn = '';
    rec.candidates = [];
    rec.deleted = false;
    saveLocalDb();
    toast('已刪除配對並退回「未配對」');
  } else {
    rec.deleted = true;
    saveLocalDb();
    toast('已從清單刪除（可按左側「復原已刪除項目」）');
  }
  renderList();
}

function buildAudioUrl(relPath) {
  const clean = String(relPath).replace(/^\/+/, '');
  return `${AUDIO_CDN_BASE}/${clean.split('/').map(encodeURIComponent).join('/')}`;
}

function togglePreview(relPath) {
  if (curAudio && playingPath === relPath) {
    curAudio.pause();
    curAudio = null;
    playingPath = '';
    renderList();
    return;
  }
  if (curAudio) { try { curAudio.pause(); } catch (_) {} }
  playingPath = relPath;
  renderList();
  curAudio = new Audio(buildAudioUrl(relPath));
  curAudio.onended = () => { playingPath = ''; renderList(); };
  curAudio.onerror = () => { playingPath = ''; renderList(); toast('音檔播放失敗'); };
  curAudio.play().catch(e => { playingPath = ''; renderList(); toast('播放失敗：' + e.message); });
}

function getFilteredManifest() {
  const folderMode = document.getElementById('folderFilterSel')?.value || 'stops_only';
  return audioManifest.filter(p => {
    if (folderMode === 'stops_only') {
      if (p.includes('/announcements/') || p.startsWith('audio/announcements/')) return false;
      const fn = p.split('/').pop();
      const lower = fn.toLowerCase();
      if (fn.startsWith('+') || lower === 'terminus.mp3' || lower.startsWith('welcome')) return false;
      if (!/^\d+_/.test(fn)) return false;
    }
    return true;
  });
}

function getItemsByCategory(cat) {
  const kw = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
  const baseList = getFilteredManifest();
  const res = [];
  for (const path of baseList) {
    const rec = getRecord(path);
    if (rec.deleted) continue;
    if (rec.status !== cat) continue;
    if (kw) {
      const st = rec.matchedStopId ? stopById.get(rec.matchedStopId) : null;
      const hay = [path, rec.transcript, rec.heardTc, rec.heardEn, rec.matchedStopId, st?.tc || '', st?.subTc || '', st?.en || '', (st?.routes || []).join(' ')].join(' ').toLowerCase();
      if (!hay.includes(kw)) continue;
    }
    res.push({ path, rec });
  }
  return res;
}

function updateCountsAndBadges() {
  const baseList = getFilteredManifest();
  let cUn = 0, cAi = 0, cConf = 0, cDel = 0;
  for (const p of baseList) {
    const rec = getRecord(p);
    if (rec.deleted) { cDel++; continue; }
    if (rec.status === 'confirmed') cConf++;
    else if (rec.status === 'ai_matched') cAi++;
    else cUn++;
  }
  const elUn = document.getElementById('cntUnmatched');
  const elAi = document.getElementById('cntAiMatched');
  const elCo = document.getElementById('cntConfirmed');
  const elDel = document.getElementById('deletedCountLabel');
  if (elUn) elUn.textContent = String(cUn);
  if (elAi) elAi.textContent = String(cAi);
  if (elCo) elCo.textContent = String(cConf);
  if (elDel) elDel.textContent = `已刪除：${cDel} 項`;
}

function renderList() {
  updateCountsAndBadges();
  document.querySelectorAll('.cat-tab').forEach(btn => {
    const active = btn.dataset.cat === currentTab;
    btn.className = active
      ? 'cat-tab px-3 py-4 text-left border-b-2 border-[#111827] bg-white'
      : 'cat-tab px-3 py-4 text-left border-b-2 border-transparent hover:bg-slate-100/70';
  });

  const helper = document.getElementById('tabHelperText');
  if (helper) {
    if (currentTab === 'unmatched') {
      helper.textContent = '尚未配對的錄音檔。點「▶ 試聽」聽聲後按「手動配對」指定車站，或按「刪除」。';
    } else if (currentTab === 'ai_matched') {
      helper.textContent = '待核對清單。可切換「來回同名共用／只限此方向車站」，確認後按「✓ 確認分類」，或按「刪除」退回。';
    } else {
      helper.textContent = '已核實的正式對照庫。按右上角「同步已確認表」即可寫入 audio_mapping.json。';
    }
  }

  const items = getItemsByCategory(currentTab);
  const totalPages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
  if (currentPage >= totalPages) currentPage = totalPages - 1;
  if (currentPage < 0) currentPage = 0;

  const slice = items.slice(currentPage * PAGE_SIZE, (currentPage + 1) * PAGE_SIZE);
  const pageInfo = document.getElementById('pageInfoText');
  const btnPrev = document.getElementById('btnPagePrev');
  const btnNext = document.getElementById('btnPageNext');
  if (pageInfo) pageInfo.textContent = `第 ${currentPage + 1} / ${totalPages} 頁（本類別共 ${items.length} 項）`;
  if (btnPrev) btnPrev.disabled = currentPage <= 0;
  if (btnNext) btnNext.disabled = currentPage >= totalPages - 1;

  const body = document.getElementById('audioListBody');
  if (!body) return;
  if (slice.length === 0) {
    body.innerHTML = `<div class="py-14 text-center text-sm font-bold text-slate-400">此類別目前沒有項目</div>`;
    return;
  }

  body.innerHTML = slice.map(({ path, rec }) => {
    const fileName = path.split('/').pop();
    const isPlaying = playingPath === path;
    const st = rec.matchedStopId ? stopById.get(rec.matchedStopId) : null;
    const candOpts = (rec.candidates || []).map(c => {
      const cs = stopById.get(c.stopId);
      if (!cs) return '';
      return `<option value="${esc(cs.stopId)}" ${cs.stopId === rec.matchedStopId ? 'selected' : ''}>${esc(cs.tc)}${cs.subTc ? ' [' + esc(cs.subTc) + ']' : ''} (#${esc(cs.numId)})</option>`;
    }).join('');

    return `
      <div class="row-item p-4 sm:px-5 space-y-2.5">
        <div class="flex flex-wrap items-start justify-between gap-3">
          <div class="min-w-0 flex-1 space-y-1">
            <div class="flex flex-wrap items-center gap-2">
              <span class="text-sm font-black text-[#111827] break-all">${esc(fileName)}</span>
              ${st ? `<span class="px-2 py-0.5 rounded-md text-xs font-black ${currentTab === 'confirmed' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-900'}">→ ${esc(st.tc)}（站號 ${esc(st.numId)}）</span>` : (rec.heardTc ? `<span class="px-2 py-0.5 rounded-md text-xs font-bold bg-slate-100 text-slate-700">${esc(rec.heardTc)}</span>` : '')}
            </div>
            ${st ? `<div class="text-xs text-slate-600 flex flex-wrap items-center gap-x-2 gap-y-1">${st.subTc ? `<span class="px-1.5 py-0.5 rounded bg-blue-50 text-[#0052CC] font-bold">副站名：${esc(st.subTc)}</span>` : ''}<span class="font-bold">${esc(st.en)}</span>${st.routes.length ? `<span class="text-[11px] text-slate-400">途經：${esc(st.routes.slice(0, 8).join(' / '))}</span>` : ''}</div>` : ''}
            ${rec.transcript ? `<div class="text-xs text-slate-600 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 leading-relaxed"><span class="font-black text-[#0052CC] mr-1">備註：</span>${esc(rec.transcript)}</div>` : ''}
          </div>

          <div class="flex flex-wrap items-center gap-1.5 shrink-0">
            <button data-play="${esc(path)}" class="btn-play px-3 py-1.5 rounded-lg text-xs font-bold border ${isPlaying ? 'bg-red-600 border-red-600 text-white' : 'bg-white border-slate-300 text-[#111827] hover:bg-slate-100'}">${isPlaying ? '停止' : '▶ 試聽'}</button>
            <button data-pick="${esc(path)}" class="btn-pick px-3 py-1.5 rounded-lg bg-[#0052CC] hover:bg-[#0041A3] text-white text-xs font-bold">${rec.matchedStopId ? '改選車站' : '手動配對'}</button>
            ${currentTab === 'ai_matched' ? `<button data-confirm="${esc(path)}" class="btn-confirm px-3 py-1.5 rounded-lg bg-[#059669] hover:bg-[#047857] text-white text-xs font-bold">✓ 確認分類</button>` : ''}
            <button data-del="${esc(path)}" class="btn-del px-2.5 py-1.5 rounded-lg bg-white border border-red-200 text-red-600 hover:bg-red-50 text-xs font-bold">刪除</button>
          </div>
        </div>

        ${(currentTab === 'ai_matched' || currentTab === 'confirmed') && rec.matchedStopId ? `
          <div class="flex flex-wrap items-center justify-between gap-2 pt-1.5 border-t border-slate-100">
            <div class="flex items-center gap-1.5">
              <span class="text-[11px] font-bold text-slate-500">套用範圍：</span>
              <div class="inline-flex rounded-lg bg-slate-100 p-0.5 border border-slate-200 text-[11px] font-bold">
                <button data-scope-path="${esc(path)}" data-scope-val="bidirectional" class="scope-btn px-2.5 py-1 rounded-md ${rec.scope === 'bidirectional' ? 'bg-[#0052CC] text-white' : 'text-slate-600 hover:text-black'}">來回同名共用</button>
                <button data-scope-path="${esc(path)}" data-scope-val="single" class="scope-btn px-2.5 py-1 rounded-md ${rec.scope !== 'bidirectional' ? 'bg-[#111827] text-white' : 'text-slate-600 hover:text-black'}">只限此方向車站</button>
              </div>
            </div>
            ${(rec.candidates || []).length > 1 ? `
              <div class="flex items-center gap-1.5 flex-1 min-w-[220px] max-w-md">
                <span class="text-[11px] font-bold text-slate-500 shrink-0">改選候選：</span>
                <select data-candsel="${esc(path)}" class="cand-select flex-1 px-2 py-1 rounded-lg bg-white border border-slate-300 text-xs font-bold">${candOpts}</select>
              </div>
            ` : ''}
          </div>
        ` : ''}
      </div>
    `;
  }).join('');

  body.querySelectorAll('.btn-play').forEach(b => { b.onclick = () => togglePreview(b.dataset.play); });
  body.querySelectorAll('.btn-pick').forEach(b => { b.onclick = () => openStopPicker(b.dataset.pick); });
  body.querySelectorAll('.btn-confirm').forEach(b => {
    b.onclick = () => { getRecord(b.dataset.confirm).status = 'confirmed'; saveLocalDb(); toast('已確認分類'); renderList(); };
  });
  body.querySelectorAll('.btn-del').forEach(b => { b.onclick = () => deleteRecord(b.dataset.del); });
  body.querySelectorAll('.cand-select').forEach(sel => {
    sel.onchange = () => { getRecord(sel.dataset.candsel).matchedStopId = sel.value; saveLocalDb(); renderList(); };
  });
  body.querySelectorAll('.scope-btn').forEach(b => {
    b.onclick = () => {
      const rec = getRecord(b.dataset.scopePath);
      rec.scope = b.dataset.scopeVal;
      saveLocalDb();
      toast(rec.scope === 'bidirectional' ? '已設為：來回同名共用' : '已設為：只限此方向車站');
      renderList();
    };
  });
}

function openStopPicker(audioPath) {
  pickerTargetPath = audioPath;
  const lbl = document.getElementById('pickerAudioLabel');
  if (lbl) lbl.textContent = audioPath.split('/').pop();
  const rec = getRecord(audioPath);
  const inp = document.getElementById('pickerSearchInput');
  if (inp) {
    inp.value = rec.heardTc || rec.heardEn || '';
    renderPickerResults();
    document.getElementById('stopPickerModal')?.classList.remove('hidden');
    inp.focus();
  }
}

function renderPickerResults() {
  const kw = (document.getElementById('pickerSearchInput')?.value || '').trim().toLowerCase();
  const box = document.getElementById('pickerResults');
  if (!box) return;
  const hits = uniqueStops.filter(st => {
    if (!kw) return true;
    return st.tc.toLowerCase().includes(kw) || (st.subTc && st.subTc.toLowerCase().includes(kw)) || st.en.toLowerCase().includes(kw) || st.numId.includes(kw) || st.routes.some(r => r.toLowerCase().includes(kw));
  }).slice(0, 60);

  if (hits.length === 0) {
    box.innerHTML = `<div class="py-8 text-center text-xs font-bold text-slate-400">找不到符合的城巴車站</div>`;
    return;
  }
  box.innerHTML = hits.map(st => `
    <button data-sid="${esc(st.stopId)}" class="pick-stop-row w-full px-4 py-2.5 text-left hover:bg-blue-50 flex items-center justify-between gap-2">
      <div class="min-w-0">
        <div class="text-sm font-black text-[#111827] truncate">${esc(st.tc)} ${st.subTc ? `<span class="text-xs font-bold text-amber-700">[${esc(st.subTc)}]</span>` : ''} <span class="text-xs font-bold text-[#0052CC]">#${esc(st.numId)}</span></div>
        <div class="text-xs text-slate-500 truncate">${esc(st.en)}</div>
      </div>
      <span class="px-2.5 py-1 rounded bg-[#059669] text-white text-xs font-bold shrink-0">選定並確認</span>
    </button>
  `).join('');

  box.querySelectorAll('.pick-stop-row').forEach(btn => {
    btn.onclick = () => {
      const rec = getRecord(pickerTargetPath);
      rec.matchedStopId = btn.dataset.sid;
      rec.matchScore = 100;
      rec.status = 'confirmed';
      rec.deleted = false;
      saveLocalDb();
      document.getElementById('stopPickerModal')?.classList.add('hidden');
      toast('已手動配對並歸入「已確認」');
      renderList();
    };
  });
}

function buildConfirmedMappingObject() {
  const confirmed = {};
  const details = {};
  const nameToStops = new Map();
  for (const st of uniqueStops) {
    if (st.normTc) {
      if (!nameToStops.has(st.normTc)) nameToStops.set(st.normTc, []);
      nameToStops.get(st.normTc).push(st);
    }
  }
  for (const [path, rec] of Object.entries(audioDb)) {
    if (!rec.deleted && rec.status === 'confirmed' && rec.matchedStopId) {
      const rawId = String(rec.matchedStopId).trim();
      const numId = rawId.replace(/^0+/, '');
      const stObj = stopById.get(rawId);
      confirmed[rawId] = path;
      if (numId) confirmed[numId] = path;
      const isBidir = rec.scope === 'bidirectional';
      const sameNameList = (isBidir && stObj?.normTc) ? (nameToStops.get(stObj.normTc) || []) : [];
      for (const peer of sameNameList) {
        if (!confirmed[peer.stopId]) confirmed[peer.stopId] = path;
        if (peer.numId && !confirmed[peer.numId]) confirmed[peer.numId] = path;
      }
      details[path] = {
        stopId: rawId,
        scope: isBidir ? 'bidirectional' : 'single',
        sharedStopIds: isBidir ? sameNameList.map(x => x.stopId) : [rawId],
        transcript: rec.transcript || '',
        heardTc: stObj?.tc || rec.heardTc || '',
        heardEn: stObj?.en || rec.heardEn || ''
      };
    }
  }
  return { version: 3, updatedAt: new Date().toISOString(), confirmed, details };
}

function downloadJson(obj, filename) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

async function publishMappingToGithub() {
  const payload = buildConfirmedMappingObject();
  const count = Object.keys(payload.details).length;
  if (count === 0) { toast('「已確認」目前沒有項目'); return; }
  const token = (localStorage.getItem('ctb_gh_token') || '').trim();
  if (!token) { downloadJson(payload, 'audio_mapping.json'); toast(`已匯出 ${count} 筆已確認對照`); return; }
  try {
    toast(`正在同步 ${count} 筆已確認對照...`);
    const apiUrl = `https://api.github.com/repos/${GH_OWNER}/${GH_WEB_REPO}/contents/data/audio_mapping.json`;
    const headers = { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' };
    const chk = await fetch(apiUrl, { headers });
    const sha = chk.ok ? (await chk.json()).sha : undefined;
    const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload, null, 2))));
    const put = await fetch(apiUrl, { method: 'PUT', headers, body: JSON.stringify({ message: `Sync ${count} confirmed mappings`, content: b64, sha }) });
    if (!put.ok) throw new Error((await put.json().catch(() => ({}))).message || '推送失敗');
    toast(`已成功同步 ${count} 筆已確認配對上雲端！`);
  } catch (e) { toast('雲端同步失敗：' + e.message); }
}

async function transcodeToMp3Blob(file) {
  if (file.name.toLowerCase().endsWith('.mp3') && file.size < 450 * 1024) return file;
  const arrayBuf = await file.arrayBuffer();
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  const ctx = new AudioCtx();
  const audioBuf = await ctx.decodeAudioData(arrayBuf);
  const targetSr = 24000;
  const offline = new OfflineAudioContext(1, Math.ceil(audioBuf.duration * targetSr), targetSr);
  const src = offline.createBufferSource();
  src.buffer = audioBuf;
  src.connect(offline.destination);
  src.start(0);
  const rendered = await offline.startRendering();
  const floatData = rendered.getChannelData(0);
  const samples = new Int16Array(floatData.length);
  for (let i = 0; i < floatData.length; i++) {
    const s = Math.max(-1, Math.min(1, floatData[i]));
    samples[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  const encoder = new lamejs.Mp3Encoder(1, targetSr, 128);
  const chunks = [];
  for (let i = 0; i < samples.length; i += 1152) {
    const buf = encoder.encodeBuffer(samples.subarray(i, i + 1152));
    if (buf.length > 0) chunks.push(buf);
  }
  const endBuf = encoder.flush();
  if (endBuf.length > 0) chunks.push(endBuf);
  await ctx.close();
  return new Blob(chunks, { type: 'audio/mp3' });
}

async function handleNewAudioFiles(fileList) {
  const token = (localStorage.getItem('ctb_gh_token') || '').trim();
  for (const file of Array.from(fileList || [])) {
    try {
      toast(`處理中：${file.name}...`);
      const mp3Blob = await transcodeToMp3Blob(file);
      const suggestedName = file.name.replace(/\.[^.]+$/, '') + '.mp3';
      const tempPath = `audio/stops/${suggestedName}`;
      getRecord(tempPath).status = 'unmatched';
      saveLocalDb();
      if (token) {
        const apiBase = `https://api.github.com/repos/${GH_OWNER}/${GH_AUDIO_REPO}/contents`;
        const headers = { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' };
        const chk = await fetch(`${apiBase}/${tempPath}`, { headers });
        const sha = chk.ok ? (await chk.json()).sha : undefined;
        const b64 = await new Promise((res, rej) => {
          const r = new FileReader();
          r.onload = () => res(String(r.result).split(',')[1]);
          r.onerror = rej;
          r.readAsDataURL(mp3Blob);
        });
        await fetch(`${apiBase}/${tempPath}`, { method: 'PUT', headers, body: JSON.stringify({ message: `Upload ${tempPath}`, content: b64, sha }) });
      }
      renderList();
    } catch (e) { toast(`上傳失敗：${e.message}`); }
  }
}

async function safeFetchJson(url) {
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 12000);
    const res = await fetch(url, { signal: controller.signal });
    clearTimeout(timer);
    if (!res.ok) return null;
    return await res.json();
  } catch (_) {
    return null;
  }
}

document.addEventListener('click', (e) => {
  const sModal = document.getElementById('settingsModal');
  if (e.target.closest('#btnSettings') && sModal) {
    e.preventDefault();
    const tEl = document.getElementById('ghTokenInput');
    if (tEl) tEl.value = localStorage.getItem('ctb_gh_token') || '';
    sModal.classList.remove('hidden');
  } else if (e.target.closest('#btnCloseSettings') && sModal) {
    sModal.classList.add('hidden');
  } else if (e.target.closest('#btnSaveKeys') && sModal) {
    const tEl = document.getElementById('ghTokenInput');
    if (tEl) localStorage.setItem('ctb_gh_token', tEl.value.trim());
    sModal.classList.add('hidden');
    toast('設定已儲存');
  } else if (e.target.closest('#btnClearKeys')) {
    localStorage.removeItem('ctb_gh_token');
    const tEl = document.getElementById('ghTokenInput');
    if (tEl) tEl.value = '';
    toast('已清除 Token');
  }
});

async function init() {
  try {
    const raw = localStorage.getItem(STORAGE_DB_KEY);
    if (raw) audioDb = JSON.parse(raw) || {};
  } catch (_) { audioDb = {}; }

  const [stopsData, manifestData, mapData] = await Promise.all([
    safeFetchJson(`./data/stops.json?v=${Date.now()}`),
    safeFetchJson(`${AUDIO_CDN_BASE}/audio_manifest.json?v=${Date.now()}`),
    safeFetchJson(`./data/audio_mapping.json?v=${Date.now()}`)
  ]);

  const allStops = Array.isArray(stopsData) ? stopsData : [];
  const stopMapTemp = new Map();
  for (const s of allStops) {
    const sid = String(s.stopId || '').trim();
    if (!sid) continue;
    const numId = sid.replace(/^0+/, '') || '0';
    const rno = String(s.routeId || '').replace(/^CTB-/i, '').toUpperCase();
    if (!stopMapTemp.has(sid)) {
      const tc = cleanJoint(s.nameTc || '');
      const en = cleanJoint(s.nameEn || '');
      const subTc = cleanJoint(s.roadTc || s.locationTc || s.subTc || '');
      stopMapTemp.set(sid, { stopId: sid, numId, tc, subTc, en, normTc: normText(tc), normEn: normText(en), routesSet: new Set() });
    }
    if (rno) stopMapTemp.get(sid).routesSet.add(rno);
  }

  uniqueStops = Array.from(stopMapTemp.values()).map(v => ({
    stopId: v.stopId, numId: v.numId, tc: v.tc, subTc: v.subTc, en: v.en,
    normTc: v.normTc, normEn: v.normEn, routes: Array.from(v.routesSet).sort()
  }));
  uniqueStops.forEach(st => stopById.set(st.stopId, st));

  audioManifest = Array.isArray(manifestData) ? manifestData.map(x => String(x).replace(/\\/g, '/')) : [];

  if (mapData && mapData.details) {
    for (const [path, info] of Object.entries(mapData.details)) {
      if (!audioDb[path] || (!audioDb[path].transcript && info.transcript)) {
        audioDb[path] = {
          status: info.status || (info.stopId ? 'confirmed' : 'unmatched'),
          transcript: info.transcript || '',
          heardTc: info.heardTc || '',
          heardEn: info.heardEn || '',
          type: 'stop',
          matchedStopId: info.stopId || '',
          matchScore: Number(info.matchScore) || (info.stopId ? 95 : 0),
          scope: info.scope || 'single',
          candidates: Array.isArray(info.candidates) ? info.candidates : [],
          deleted: false
        };
      }
    }
  }

  document.querySelectorAll('.cat-tab').forEach(btn => {
    btn.onclick = () => { currentTab = btn.dataset.cat; currentPage = 0; renderList(); };
  });
  const sInp = document.getElementById('searchInput');
  if (sInp) sInp.oninput = () => { currentPage = 0; renderList(); };
  const fSel = document.getElementById('folderFilterSel');
  if (fSel) fSel.onchange = () => { currentPage = 0; renderList(); };
  const pPrev = document.getElementById('btnPagePrev');
  if (pPrev) pPrev.onclick = () => { if (currentPage > 0) { currentPage--; renderList(); } };
  const pNext = document.getElementById('btnPageNext');
  if (pNext) pNext.onclick = () => { currentPage++; renderList(); };

  const btnClearAi = document.getElementById('btnClearAiDrafts');
  if (btnClearAi) {
    btnClearAi.onclick = () => {
      let cleared = 0;
      for (const rec of Object.values(audioDb)) {
        if (rec.status === 'ai_matched') {
          rec.status = 'unmatched';
          rec.matchedStopId = '';
          rec.matchScore = 0;
          rec.transcript = '';
          rec.heardTc = '';
          rec.heardEn = '';
          rec.candidates = [];
          cleared++;
        }
      }
      saveLocalDb();
      toast(`已清除 ${cleared} 筆未確認自動紀錄`);
      renderList();
    };
  }

  const btnRestoreDel = document.getElementById('btnRestoreDeleted');
  if (btnRestoreDel) {
    btnRestoreDel.onclick = () => {
      let restored = 0;
      for (const rec of Object.values(audioDb)) {
        if (rec.deleted) { rec.deleted = false; restored++; }
      }
      saveLocalDb();
      toast(restored > 0 ? `已復原 ${restored} 項已刪除紀錄` : '目前沒有已刪除項目');
      renderList();
    };
  }

  const btnExp = document.getElementById('btnExportJson');
  if (btnExp) btnExp.onclick = () => { downloadJson(buildConfirmedMappingObject(), 'audio_mapping.json'); toast('已匯出 audio_mapping.json'); };
  const btnPub = document.getElementById('btnPublishMapping');
  if (btnPub) btnPub.onclick = publishMappingToGithub;
  const pInp = document.getElementById('pickerSearchInput');
  if (pInp) pInp.oninput = renderPickerResults;
  const btnClosePick = document.getElementById('btnClosePicker');
  if (btnClosePick) btnClosePick.onclick = () => document.getElementById('stopPickerModal')?.classList.add('hidden');
  const upInp = document.getElementById('newAudioUploadInput');
  if (upInp) upInp.onchange = async e => { await handleNewAudioFiles(e.target.files); e.target.value = ''; };

  renderList();
}

init();
</script>
