<script>
const state = {
  routes: [],
  stopsByTrip: new Map(),
  announcements: [],
  locationCodes: [],
  currentTab: 'route',
  routeStage: 'route',       // route | pattern | start_stop | stops
  showRouteInput: false,
  routeQuery: '',
  routeListOffset: 0,
  activeLetterKey: null,
  selectedRouteId: null,
  selectedDestTc: null,
  stagePageOffset: 0,
  selectedTrip: null,
  tripStops: [],
  currentStopIdx: 0,
  stopProgressPct: 35,
  gpsEnabled: true,
  gpsWatchId: null,
  gpsDistanceM: null,
  gpsSpeedKmh: 0,
  isStopped3s: true,
  stopMode: 'auto',
  volume: 1.0,
  brightnessDim: 0.0,
  darkMode: false,
  trainingMode: false,
  incidentActive: false,
  incidentStage: 'select',   // select | active | finish
  incidentLabel: '',
  driverNo: '',              // 5位數員工編號 (手動登入時黃字顯示)
  driverManualLogin: false,
  isStopped3s: true,         // 停車達3秒安全鎖狀態 (真實GPS或手動模擬切換)
  stoppedSinceMs: Date.now() - 5000,
  gpsSpeedKmh: 0,
  broadcastQuery: '',
  broadcastPage: 0,
  showBroadcastSearch: false,
  dismissedPopup: false,
  messages: [
    { id: 'm1', title: '控制中心督導通告', time: '08:30', body: '各線車長請留意路面交通情況，保持安全車距。', unread: true }
  ],
  scheduledDuty: null,       // { routeNo, originCode, destCode, departTime, mode }
  lastAnnouncedKey: '',
  cleverScore: 100
};

const T9_KEYS = [
  { main: '1', sub: 'ABC', letters: ['A', 'B', 'C'] },
  { main: '2', sub: 'DEF', letters: ['D', 'E', 'F'] },
  { main: '3', sub: 'GHI', letters: ['G', 'H', 'I'] },
  { main: '4', sub: 'JKL', letters: ['J', 'K', 'L'] },
  { main: '5', sub: 'MNO', letters: ['M', 'N', 'O'] },
  { main: '6', sub: 'PQR', letters: ['P', 'Q', 'R'] },
  { main: '7', sub: 'STU', letters: ['S', 'T', 'U'] },
  { main: '8', sub: 'VWX', letters: ['V', 'W', 'X'] },
  { main: '9', sub: 'YZ',  letters: ['Y', 'Z'] },
  { main: '0', sub: '.',   letters: ['.'] }
];

function fmtRouteNo(rOrId) {
  if (rOrId && typeof rOrId === 'object') {
    const d = rOrId.displayTc || rOrId.externalRouteNo || rOrId.routeId || '';
    return String(d).replace(/^CTB-/i, '').trim();
  }
  return String(rOrId || '').replace(/^CTB-/i, '').trim();
}

function getStopFare(trip, stopObj) {
  if (!trip) return '';
  if (stopObj && stopObj.fare != null && stopObj.fare !== '') return Number(stopObj.fare).toFixed(1);
  const seq = stopObj ? Number(stopObj.seq || 1) : 1;
  const segs = Array.isArray(trip.fareSegments) ? trip.fareSegments : [];
  const hit = segs.find(seg => seq >= Number(seg.fromStopSeq || 1) && seq <= Number(seg.toStopSeq || 999));
  if (hit && hit.fare != null) return Number(hit.fare).toFixed(1);
  if (trip.fullFare != null) return Number(trip.fullFare).toFixed(1);
  return '';
}

function lookupLocName(code) {
  if (!code) return '';
  const c = code.toUpperCase().trim();
  const hit = state.locationCodes.find(x => x.code === c);
  return hit ? hit.nameTc : c;
}

const AUDIO_CDN_BASE = 'https://kenyip0244.github.io/CTB-LECIP-Audio';
let currentAudioPlayer = null;

function playAudioSequence(urls, fallbackZh, fallbackEn) {
  if (currentAudioPlayer) {
    currentAudioPlayer.pause();
    currentAudioPlayer = null;
  }
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();

  const validUrls = (urls || []).filter(Boolean).map(u => {
    const clean = String(u).replace(/^\/+/, '').replace(/\.wav$/i, '.mp3');
    return `${AUDIO_CDN_BASE}/${clean}`;
  });

  if (validUrls.length === 0) {
    speakTtsFallback(fallbackZh, fallbackEn);
    return;
  }

  let idx = 0;
  const playNext = () => {
    if (idx >= validUrls.length) return;
    const audio = new Audio(validUrls[idx]);
    audio.volume = state.volume;
    currentAudioPlayer = audio;
    audio.onended = () => { idx++; playNext(); };
    audio.onerror = () => {
      if (idx === 0) speakTtsFallback(fallbackZh, fallbackEn);
    };
    audio.play().catch(() => speakTtsFallback(fallbackZh, fallbackEn));
  };
  playNext();
}

function speakTtsFallback(zhText, enText) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  if (zhText) {
    const uZh = new SpeechSynthesisUtterance(zhText);
    uZh.lang = 'zh-HK';
    uZh.volume = state.volume;
    uZh.rate = 1.02;
    window.speechSynthesis.speak(uZh);
  }
  if (enText) {
    const uEn = new SpeechSynthesisUtterance(enText);
    uEn.lang = 'en-GB';
    uEn.volume = state.volume;
    uEn.rate = 0.98;
    window.speechSynthesis.speak(uEn);
  }
}

function speakAnnouncement(zhText, enText, audioFiles = []) {
  playAudioSequence(audioFiles, zhText, enText);
}

function calcDistanceMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = d => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function startGpsTracking() {
  if (!('geolocation' in navigator)) {
    showToast('此瀏覽器不支援 GPS 定位');
    return;
  }
  stopGpsTracking();
  state.gpsEnabled = true;
  state.gpsWatchId = navigator.geolocation.watchPosition(
    pos => {
      const { latitude, longitude, speed } = pos.coords;
      const kmh = typeof speed === 'number' && !Number.isNaN(speed) ? Math.round(speed * 3.6) : 0;
      state.gpsSpeedKmh = kmh;
      state.isStopped3s = kmh < 3;

      if (state.routeStage === 'stops' && state.tripStops.length > 0) {
        const nextIdx = Math.min(state.tripStops.length - 1, state.currentStopIdx + 1);
        const curSt = state.tripStops[state.currentStopIdx];
        const nextSt = state.tripStops[nextIdx];
        const nLat = Number(nextSt?.lat ?? nextSt?.latitude);
        const nLng = Number(nextSt?.lng ?? nextSt?.longitude);
        const cLat = Number(curSt?.lat ?? curSt?.latitude);
        const cLng = Number(curSt?.lng ?? curSt?.longitude);

        if (Number.isFinite(nLat) && Number.isFinite(nLng) && nextIdx !== state.currentStopIdx) {
          const dist = Math.round(calcDistanceMeters(latitude, longitude, nLat, nLng));
          state.gpsDistanceM = dist;

          // 根據與上一站及下一站距離計算動態進度條 (15% ~ 95%)
          let legTotal = 450;
          if (Number.isFinite(cLat) && Number.isFinite(cLng)) {
            legTotal = Math.max(80, Math.round(calcDistanceMeters(cLat, cLng, nLat, nLng)));
          }
          const ratio = Math.max(0, Math.min(1, 1 - dist / legTotal));
          state.stopProgressPct = Math.round(15 + ratio * 80);

          // 進入下一站 45 米範圍自動推進報站
          if (dist <= 45) {
            state.currentStopIdx = nextIdx;
            state.stopProgressPct = 20;
            state.gpsDistanceM = null;
            renderAll();
            triggerStopAnnouncement(state.currentStopIdx);
            return;
          }
        }
      }
      renderTopStatus();
      if (state.currentTab === 'route' && state.routeStage === 'stops') {
        const gpsBadge = document.getElementById('gpsLiveBadge');
        if (gpsBadge) {
          gpsBadge.textContent = state.gpsDistanceM != null
            ? `GPS 自動 · 距下站 ${state.gpsDistanceM}m`
            : 'GPS 定位中';
        }
        const barFill = document.getElementById('stopProgressFill');
        if (barFill) barFill.style.width = `${state.stopProgressPct}%`;
      }
    },
    err => {
      if (err.code === 1) showToast('請允許瀏覽器存取 GPS 位置權限');
    },
    { enableHighAccuracy: true, maximumAge: 1500, timeout: 10000 }
  );
}

function stopGpsTracking() {
  if (state.gpsWatchId != null && 'geolocation' in navigator) {
    navigator.geolocation.clearWatch(state.gpsWatchId);
    state.gpsWatchId = null;
  }
}

function toggleGpsMode() {
  state.gpsEnabled = !state.gpsEnabled;
  if (state.gpsEnabled) {

async function ensureRouteStopsLoaded(trip) {
  if (!trip) return [];
  const key = `${trip.routeId}|${trip.bound}|${trip.patternId || ''}`;
  const existing = state.stopsByTrip.get(key);
  if (Array.isArray(existing) && existing.length > 0) {
    return existing;
  }

  const vp = document.getElementById('mainViewport');
  if (vp) renderDiagnosticScreen(vp, `LOADING ROUTE ${fmtRouteNo(trip)} DATA...`);

  if (!Array.isArray(allStopsCache)) {
    const sRes = await fetch('./data/stops.json');
    const rawStops = await sRes.json();
    allStopsCache = Array.isArray(rawStops) ? rawStops : [];
    for (const s of allStopsCache) {
      const k = `${s.routeId}|${s.bound}|${s.patternId || ''}`;
      if (!state.stopsByTrip.has(k)) state.stopsByTrip.set(k, []);
      state.stopsByTrip.get(k).push(s);
    }
    for (const arr of state.stopsByTrip.values()) {
      arr.sort((a, b) => (a.seq ?? 0) - (b.seq ?? 0));
    }
  }

  return state.stopsByTrip.get(key) || [];
}

function applyPackData(routes, stops, anns) {

  for (const st of (Array.isArray(stops) ? stops : [])) {

  }

function calcDistanceM(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function startGpsWatcher() {
  if (!('geolocation' in navigator)) return;
  navigator.geolocation.watchPosition((pos) => {
    const { latitude, longitude, speed } = pos.coords;
    const kmh = speed != null && speed >= 0 ? Math.round(speed * 3.6) : 0;
    state.gpsSpeedKmh = kmh;
    if (kmh > 2) {
      state.isStopped3s = false;
      state.stoppedSinceMs = null;
      // 附件八：收到新訊息視窗及訊息畫面會於巴士再次行駛時轉回行車報站畫面
      if (state.currentTab === 'message') {
        state.currentTab = 'route';
      }
    } else {
      if (!state.stoppedSinceMs) state.stoppedSinceMs = Date.now();
      if (Date.now() - state.stoppedSinceMs >= 3000) state.isStopped3s = true;
    }
    renderTopStatus();

    if (state.stopMode === 'auto' && state.currentTab === 'route' && state.routeStage === 'stops' && state.tripStops.length > 0) {
      const target = state.tripStops[state.currentStopIdx];
      if (target && target.lat && target.lng) {
        const dist = calcDistanceM(latitude, longitude, target.lat, target.lng);
        const radius = target.geofenceM || 55;
        state.stopProgressPct = Math.max(10, Math.min(100, Math.round(100 - (dist / 450) * 100)));
        const annKey = `${target.routeId}|${target.bound}|${target.seq}`;
        if (dist <= radius && state.lastAnnouncedKey !== annKey) {
          state.lastAnnouncedKey = annKey;
          triggerStopAnnouncement(state.currentStopIdx);
          if (state.currentStopIdx + 1 < state.tripStops.length) {
            state.currentStopIdx++;
            state.stopProgressPct = 15;
            renderMain();
          }
        }
      }
    }
  }, () => {}, { enableHighAccuracy: true, maximumAge: 2000 });
}

function triggerStopAnnouncement(idx) {
  const st = state.tripStops[idx];
  if (!st) return;
  const zh = st.nameTc || st.nameZh || st.name || '';
  const en = st.nameEn || '';
  showToast(`報站：${zh}`);
  speakAnnouncement(`下一站，${zh}`, en ? `Next stop, ${en}` : '');
}

function getFilteredRouteList() {
  const routeMap = new Map();
  for (const r of state.routes) {
    const disp = fmtRouteNo(r);
    if (!routeMap.has(disp)) routeMap.set(disp, r);
  }
  const q = state.routeQuery.toUpperCase();
  const arr = [...routeMap.entries()].filter(([disp]) => !q || disp.toUpperCase().startsWith(q) || disp.toUpperCase().includes(q));
  arr.sort((a, b) => {
    const aStarts = q && a[0].toUpperCase().startsWith(q) ? 0 : 1;
    const bStarts = q && b[0].toUpperCase().startsWith(q) ? 0 : 1;
    if (aStarts !== bStarts) return aStarts - bStarts;
    return a[0].localeCompare(b[0], undefined, { numeric: true });
  });
  return arr;
}

        r.routeId === state.selectedRouteId &&
        (r.destTc || r.endStopNameTc || '總站') === state.selectedDestTc
      );
      const dispNo = fmtRouteNo(state.selectedRouteId);
      const pageRows = 5;
      const maxOff = Math.max(0, trips.length - pageRows);
      state.stagePageOffset = Math.min(state.stagePageOffset, maxOff);
      const visible = trips.slice(state.stagePageOffset, state.stagePageOffset + pageRows);

      vp.innerHTML = `
        <div class="${bgBanner} px-3 py-2 border-b border-zinc-500 flex items-center justify-between shrink-0">
          <div class="truncate pr-2">
            <div class="text-xs font-bold opacity-80">${dispNo} 往 ${state.selectedDestTc}</div>
            <div class="font-black text-lg">選擇行車路線</div>
          </div>
          <span class="text-xs font-extrabold opacity-70 shrink-0">${Math.floor(state.stagePageOffset / pageRows) + 1} / ${Math.max(1, Math.ceil(trips.length / pageRows))}</span>
        </div>
        <div class="flex-1 flex flex-col divide-y divide-zinc-400 overflow-hidden">
          ${Array.from({ length: pageRows }).map((_, slot) => {
            const t = visible[slot];
            if (!t) return `<div class="flex-1 ${rowBg} px-4 flex items-center justify-end"><span class="text-zinc-300 font-black text-2xl">›</span></div>`;
            const realIdx = state.stagePageOffset + slot;
            const pat = t.patternNameTc || (t.patternId ? `特別班次 (${t.patternId})` : '正常班次');
            const start = t.startStopNameTc ? `${t.startStopNameTc}開出` : '';
            const fare = t.fullFare != null ? `$${Number(t.fullFare).toFixed(1)}` : '';
            return `
              <button data-tidx="${realIdx}" class="pick-trip-btn flex-1 w-full text-left px-4 ${rowBg} active:bg-blue-100 flex items-center justify-between">
                <div class="truncate pr-2">
                  <div class="font-black text-lg truncate">${pat}</div>
                  <div class="text-xs font-bold opacity-75 truncate">${start} ${fare ? '· ' + fare : ''}</div>
                </div>
                <span class="text-zinc-500 font-black text-2xl shrink-0">›</span>
              </button>
            `;
          }).join('')}
        </div>
      `;
      document.querySelectorAll('.pick-trip-btn').forEach(b => {
        b.onclick = async () => {
          const t = trips[Number(b.dataset.tidx)];
          state.selectedTrip = t;
          const key = `${t.routeId}|${t.bound}|${t.patternId || ''}`;
          state.tripStops = state.stopsByTrip.get(key) || [];
          state.currentStopIdx = 0;
          state.stagePageOffset = 0;
          state.routeStage = 'start_stop';
          renderAll();
        };
      });

    } else if (state.routeStage === 'start_stop') {
      const t = state.selectedTrip;
      const dispNo = fmtRouteNo(t);
      const dest = t.destTc || t.endStopNameTc || '';
      const pageRows = 5;
      const maxOff = Math.max(0, state.tripStops.length - pageRows);
      state.stagePageOffset = Math.min(state.stagePageOffset, maxOff);
      const visible = state.tripStops.slice(state.stagePageOffset, state.stagePageOffset + pageRows);

      vp.innerHTML = `
        <div class="${bgBanner} px-3 py-1.5 border-b border-zinc-500 flex items-center justify-between shrink-0">
          <div class="truncate pr-2">
            <div class="text-xs font-bold opacity-80">${dispNo}-${dest}-${t.bound}</div>
            <div class="font-black text-lg">選擇開始站位</div>
          </div>
          <span class="text-xs font-extrabold opacity-70 shrink-0">${Math.floor(state.stagePageOffset / pageRows) + 1} / ${Math.max(1, Math.ceil(state.tripStops.length / pageRows))}</span>
        </div>
        <div class="flex-1 flex flex-col divide-y divide-zinc-400 overflow-hidden">
          ${Array.from({ length: pageRows }).map((_, slot) => {
            const s = visible[slot];
            if (!s) return `<div class="flex-1 ${rowBg} px-4 flex items-center justify-end"><span class="text-zinc-300 font-black text-2xl">›</span></div>`;
            const realIdx = state.stagePageOffset + slot;
            const name = s.nameTc || s.nameZh || s.name || `第 ${realIdx+1} 站`;
            return `
              <button data-sidx="${realIdx}" class="pick-start-btn flex-1 w-full text-left px-4 flex items-center justify-between ${realIdx === 0 ? 'bg-[#f4f728] text-black font-black' : rowBg}">
                <span class="text-lg font-bold truncate">${realIdx + 1}. ${name}</span>
                <span class="text-zinc-500 font-black text-2xl ml-2 shrink-0">›</span>
              </button>
            `;
          }).join('')}
        </div>
      `;
      document.querySelectorAll('.pick-start-btn').forEach(b => {
        b.onclick = async () => {
          state.currentStopIdx = Number(b.dataset.sidx);
          state.routeStage = 'stops';
          state.stopProgressPct = 20;
          state.gpsDistanceM = null;
          state.lastAnnouncedKey = '';
          if (state.gpsEnabled) startGpsTracking();
          renderAll();
          triggerStopAnnouncement(state.currentStopIdx);
        };
      });

    } else if (state.routeStage === 'stops') {
      const t = state.selectedTrip;
      const dispNo = fmtRouteNo(t);
      const originName = t.startStopNameTc || (state.tripStops[0]?.nameTc) || '';
      const cur = state.tripStops[state.currentStopIdx] || {};
      const curName = cur.nameTc || cur.nameZh || cur.name || '總站';
      const curFare = getStopFare(t, cur);
      const next3 = state.tripStops.slice(state.currentStopIdx + 1, state.currentStopIdx + 4);

      vp.innerHTML = `
        <div class="${bgBanner} px-3 py-2 text-center border-b border-zinc-500 shrink-0">
          <div class="font-black text-xl leading-tight truncate">${dispNo} 往 ${t.destTc || t.endStopNameTc || ''}</div>
          <div class="text-sm font-extrabold mt-0.5 truncate">${originName ? originName + '開出' : ''} ${curFare ? '· $' + curFare : ''}</div>
        </div>

        <button id="replayCurStop" class="w-full text-left ${rowBg} px-3.5 py-3 border-b border-zinc-500 flex flex-col justify-between shrink-0 active:bg-yellow-100" style="min-height: 112px;">
          <div class="flex items-baseline gap-2">
            <span class="font-black text-2xl">${state.currentStopIdx + 1}.</span>
            <span class="font-black text-2xl leading-snug truncate">${curName}</span>
          </div>
          <div class="w-full h-5 rounded-full bg-[#737373] overflow-hidden mt-3 flex items-center">
            <div class="h-full bg-[#1db91d] rounded-l-full transition-all duration-300" style="width: ${state.stopProgressPct}%;"></div>
          </div>
        </button>

        <div class="flex-1 flex flex-col divide-y divide-zinc-400 overflow-hidden">
          ${[0, 1, 2].map(offset => {
            const s = next3[offset];
            if (!s) {
              return `<div class="flex-1 ${rowBg} px-3.5 flex items-center justify-end"><span class="text-xs font-extrabold opacity-70">分鐘</span></div>`;
            }
            const realIdx = state.currentStopIdx + 1 + offset;
            const sName = s.nameTc || s.nameZh || s.name || '';
            const mins = offset + 1;
            return `
              <button data-jump="${realIdx}" class="jump-stop-btn flex-1 w-full text-left px-3.5 ${rowBg} flex items-center justify-between active:bg-blue-50">
                <div class="flex items-baseline gap-2.5 truncate pr-2">
                  <span class="font-black text-xl">${realIdx + 1}.</span>
                  <span class="font-bold text-xl truncate">${sName}</span>
                </div>
                <div class="flex flex-col items-center justify-center shrink-0 leading-none">
                  <span class="font-black text-xl">${mins}</span>
                  <span class="text-[11px] font-extrabold mt-0.5">分鐘</span>
                </div>
              </button>
            `;
          }).join('')}
        </div>
      `;

      document.getElementById('replayCurStop').onclick = () => {
        state.stopProgressPct = Math.min(100, state.stopProgressPct + 25);
        triggerStopAnnouncement(state.currentStopIdx);
        renderMain();
      };
      document.querySelectorAll('.jump-stop-btn').forEach(b => {
        b.onclick = async () => {
          state.currentStopIdx = Number(b.dataset.jump);
          state.stopProgressPct = 20;
          renderMain();
          triggerStopAnnouncement(state.currentStopIdx);
        };
      });
    }

  } else if (state.currentTab === 'broadcast') {
    const list = state.announcements.filter(a => {
      if (!state.broadcastQuery) return true;
      const q = state.broadcastQuery.toLowerCase();
      return String(a.code || '').toLowerCase().includes(q) || String(a.titleTc || a.ttsTc || '').toLowerCase().includes(q);
    });
    const pageSize = 5;
    const maxPage = Math.max(0, Math.ceil(list.length / pageSize) - 1);
    state.broadcastPage = Math.min(state.broadcastPage, maxPage);
    const pageItems = list.slice(state.broadcastPage * pageSize, state.broadcastPage * pageSize + pageSize);

    vp.innerHTML = `
      <div class="${bgBanner} px-3 py-2.5 border-b border-zinc-500 flex items-center justify-between shrink-0">
        <span class="font-black text-lg">播放特別訊息</span>
        <span class="text-xs font-extrabold opacity-75">${state.broadcastPage + 1} / ${maxPage + 1}</span>
      </div>
      ${state.showBroadcastSearch ? `
        <div class="p-1.5 bg-zinc-200 border-b border-zinc-400 shrink-0">
          <input id="annSearchInput" type="text" value="${state.broadcastQuery}" placeholder="輸入編號 (1-54) 或關鍵字..."
            class="w-full px-2.5 py-1.5 rounded border border-zinc-500 text-black font-bold text-sm" />
        </div>
      ` : ''}
      <div class="flex-1 flex flex-col divide-y divide-zinc-400 overflow-hidden">
        ${[0, 1, 2, 3, 4].map(slot => {
          const item = pageItems[slot];
          if (!item) return `<div class="flex-1 ${rowBg}"></div>`;
          const code = item.code != null ? item.code : (state.broadcastPage * pageSize + slot + 1);
          const title = item.titleTc || `特別訊息 ${code}`;
          return `
            <div class="flex-1 ${rowBg} flex items-stretch justify-between overflow-hidden">
              <div class="flex-1 px-3 flex items-center gap-2 truncate">
                <span class="font-black text-xl shrink-0">${code}.</span>
                <span class="font-bold text-xl truncate">${title}</span>
              </div>
              <button data-pidx="${slot}" class="play-ann-btn w-16 bg-[#00ff00] active:brightness-90 border-l border-zinc-400 flex items-center justify-center shrink-0">
                <svg class="w-8 h-8 text-black" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              </button>
            </div>
          `;
        }).join('')}
      </div>
    `;
    if (document.getElementById('annSearchInput')) {
      const inp = document.getElementById('annSearchInput');
      inp.focus();
      inp.addEventListener('input', e => {
        state.broadcastQuery = e.target.value;
        state.broadcastPage = 0;
        renderMain();
      });
    }
    document.querySelectorAll('.play-ann-btn').forEach(b => {
      b.onclick = async () => {
        const item = pageItems[Number(b.dataset.pidx)];
        if (!item) return;
        const zh = item.ttsTc || item.titleTc || '';
        const en = item.ttsEn || item.titleEn || '';
        showToast(`播放：${item.titleTc || zh}`);
        playAudioSequence([item.audioFile], zh, en);
      };
    });

  } else if (state.currentTab === 'message') {
    vp.innerHTML = `
      <div class="${bgBanner} px-3 py-2 font-black text-base border-b border-zinc-500 shrink-0">訊息收件匣</div>
      <div id="scrollList" class="flex-1 overflow-y-auto no-scrollbar p-2 space-y-2">
        ${state.messages.map(m => `
          <div data-mid="${m.id}" class="read-msg-card p-3 rounded border ${rowBg} cursor-pointer">
            <div class="flex justify-between items-center text-xs font-bold mb-1">
              <span class="text-[#0068FF]">${m.title}</span>
              <span class="opacity-60">${m.time}</span>
            </div>
            <div class="text-sm font-bold">${m.body}</div>
          </div>
        `).join('')}
      </div>
    `;
    document.querySelectorAll('.read-msg-card').forEach(c => {
      c.onclick = () => {
        const m = state.messages.find(x => x.id === c.dataset.mid);
        if (m) m.unread = false;
        renderTabs();
        showToast('已閱讀訊息');
      };
    });

  } else if (state.currentTab === 'incident') {
    // 對齊附件八：選擇事故類別 -> 啟動後選「繼續行程」或「完成過客 -> 完成處理」
    const items = ['交通意外', '車輛故障', '乘客事故', '道路阻塞 / 改道', '其他緊急事故'];
    vp.innerHTML = `
      <div class="bg-[#b91c1c] text-white px-3 py-2.5 text-center font-black text-lg border-b border-zinc-500 shrink-0">
        ${state.incidentActive ? `事故：${state.incidentLabel}` : '選擇事故類別'}
      </div>
      ${state.incidentStage === 'active' ? `
        <div class="p-3.5 flex-1 flex flex-col justify-between">
          <div class="p-3 rounded bg-red-950/90 text-white text-sm space-y-1.5">
            <div class="font-black text-base">${state.incidentLabel}</div>
            <div>車長致電控制中心報告事故，並依督導人員指示選擇程序：</div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <button id="incResumeBtn" class="py-3.5 rounded-lg bg-[#0068FF] text-white font-black text-sm">繼續行程</button>
            <button id="incTransferBtn" class="py-3.5 rounded-lg bg-[#dc2626] text-white font-black text-sm">完成過客</button>
          </div>
        </div>
      ` : state.incidentStage === 'finish' ? `
        <div class="p-3.5 flex-1 flex flex-col justify-between">
          <div class="p-3 rounded bg-zinc-900 text-white text-sm space-y-1.5">
            <div class="font-black text-base text-yellow-300">電子牌已轉為「暫停載客」</div>
            <div>在巴士離開事故現場時，請按下「完成處理」以記錄於電子站長紙。</div>
          </div>
          <button id="incFinishBtn" class="w-full py-3.5 rounded-lg bg-[#0068FF] text-white font-black text-base">完成處理</button>
        </div>
      ` : `
        <div id="scrollList" class="flex-1 overflow-y-auto no-scrollbar divide-y divide-zinc-400">
          ${items.map(label => `
            <button data-inc="${label}" class="pick-inc-btn w-full text-left px-4 py-3.5 ${rowBg} font-black text-lg active:bg-red-600 active:text-white">
              ${label}
            </button>
          `).join('')}
        </div>
      `}
    `;
    if (document.getElementById('incResumeBtn')) {
      document.getElementById('incResumeBtn').onclick = () => {
        state.incidentActive = false;
        state.incidentStage = 'select';
        state.incidentLabel = '';
        renderAll();
        showToast('已返回正常報站程序');
      };
    }
    if (document.getElementById('incTransferBtn')) {
      document.getElementById('incTransferBtn').onclick = () => {
        state.incidentStage = 'finish';
        renderMain();
        showToast('電子牌已轉為暫停載客');
      };
    }
    if (document.getElementById('incFinishBtn')) {
      document.getElementById('incFinishBtn').onclick = () => {
        state.incidentActive = false;
        state.incidentStage = 'select';
        state.incidentLabel = '';
        renderAll();
        showToast('事故處理完成，已記錄於電子站長紙');
      };
    }
    document.querySelectorAll('.pick-inc-btn').forEach(b => {
      b.onclick = async () => {
        if (!requireStopped3s()) return;
        state.incidentLabel = b.dataset.inc;
        state.incidentActive = true;
        state.incidentStage = 'active';
        renderAll();
        showToast(`已啟動事故模式：${state.incidentLabel}`);
      };
    });

  } else if (state.currentTab === 'settings') {
    vp.innerHTML = `
      <div class="px-3 py-2 text-center font-black text-lg shrink-0">選項</div>
      <div id="scrollList" class="flex-1 overflow-y-auto no-scrollbar px-2.5 pb-2">
        <div class="grid grid-cols-3 gap-2">
          <button id="tileTheme" class="h-16 rounded-lg bg-[#1d85d6] active:brightness-90 text-white p-1.5 flex flex-col items-center justify-center gap-1 text-center">
            <span class="text-base">🌓</span>
            <span class="text-[10px] font-bold leading-tight">${state.darkMode ? '切換日間模式' : '車長喜好設定'}</span>
          </button>
          <button id="tileDiag" class="h-16 rounded-lg bg-[#1877cb] active:brightness-90 text-white p-1.5 flex flex-col items-center justify-center gap-1 text-center">
            <span class="text-base">📈</span>
            <span class="text-[10px] font-bold leading-tight">診斷模式</span>
          </button>
          <button id="tileImport" class="h-16 rounded-lg bg-[#1159c4] active:brightness-90 text-white p-1.5 flex flex-col items-center justify-center gap-1 text-center">
            <span class="text-base">📦</span>
            <span class="text-[10px] font-bold leading-tight">匯入路線 ZIP</span>
          </button>
          <button id="tileTrain" class="h-16 rounded-lg bg-[#1d85d6] active:brightness-90 text-white p-1.5 flex flex-col items-center justify-center gap-1 text-center">
            <span class="text-base">🎓</span>
            <span class="text-[10px] font-bold leading-tight">訓練模式</span>
          </button>
          <button id="tileDriver" class="h-16 rounded-lg bg-[#1877cb] active:brightness-90 text-white p-1.5 flex flex-col items-center justify-center gap-1 text-center">
            <span class="text-base">🪪</span>
            <span class="text-[10px] font-bold leading-tight">輸入員工編號</span>
          </button>
          <button id="tileDuty" class="h-16 rounded-lg bg-[#1159c4] active:brightness-90 text-white p-1.5 flex flex-col items-center justify-center gap-1 text-center">
            <span class="text-base">🗓️</span>
            <span class="text-[10px] font-bold leading-tight">預定班次 / 字軌</span>
          </button>
          <button id="tileCall" class="h-16 rounded-lg bg-[#8e96a0] active:brightness-90 text-white p-1.5 flex flex-col items-center justify-center gap-1 text-center">
            <span class="text-base">🎧</span>
            <span class="text-[10px] font-bold leading-tight">Call control center</span>`n          </button>`n          <button id="tileClever" class="h-16 rounded-lg bg-[#1159c4] active:brightness-90 text-white p-1.5 flex flex-col items-center justify-center gap-1 text-center col-span-2">`n            <span class="text-sm font-black">🛡️ 智駕全城：${state.cleverScore} 分</span>`n            <span class="text-[10px] font-bold leading-tight">點擊模擬急煞／急轉事件測試</span>
          </button>
        </div>
      </div>
    `;
    document.getElementById('tileTheme').onclick = () => { state.darkMode = !state.darkMode; renderAll(); };
    document.getElementById('tileDiag').onclick = () => showToast(`路線 ${state.routes.length} 班次 · 地點代號 ${state.locationCodes.length} 個`);
    document.getElementById('tileImport').onclick = () => document.getElementById('zipInput').click();
    document.getElementById('tileTrain').onclick = openTrainingModal;
    document.getElementById('tileDriver').onclick = openDriverModal;
    document.getElementById('tileDuty').onclick = openDutyModal;
    document.getElementById('tileCall').onclick = () => showToast('正在接通控制中心...');
    document.getElementById('tileClever').onclick = () => {
      const ov = document.getElementById('modalOverlay');
      const card = document.getElementById('modalCard');
      const tier = state.cleverScore >= 85 ? '良好' : (state.cleverScore >= 65 ? '一般' : '需改善');
      card.innerHTML = `
        <div class="font-black text-base text-center">智駕全城 (Clever Driving)</div>
        <div class="text-center py-2 bg-slate-100 rounded-lg">
          <div class="text-3xl font-black text-[#0068FF]">${state.cleverScore} <span class="text-sm">分</span></div>
          <div class="text-xs font-bold mt-0.5">評級：${tier}</div>
        </div>
        <div class="grid grid-cols-2 gap-2 text-xs font-black">
          <button id="simBrake" class="py-2 rounded bg-amber-400 text-black">模擬急煞 (-5)</button>
          <button id="simTurn" class="py-2 rounded bg-amber-400 text-black">模擬急轉 (-4)</button>
          <button id="simReset" class="py-2 rounded bg-emerald-600 text-white">重設 100 分</button>
          <button id="simClose" class="py-2 rounded bg-zinc-200 text-black">關閉</button>
        </div>
      `;
      ov.classList.remove('hidden');
      document.getElementById('simBrake').onclick = () => {
        state.cleverScore = Math.max(0, state.cleverScore - 5);
        showToast('偵測急煞車 (-5分)');
        ov.classList.add('hidden');
        renderMain();
      };
      document.getElementById('simTurn').onclick = () => {
        state.cleverScore = Math.max(0, state.cleverScore - 4);
        showToast('偵測急轉彎 (-4分)');
        ov.classList.add('hidden');
        renderMain();
      };
      document.getElementById('simReset').onclick = () => {
        state.cleverScore = 100;
        showToast('已重設為 100 分');
        ov.classList.add('hidden');
        renderMain();
      };
      document.getElementById('simClose').onclick = () => ov.classList.add('hidden');
    };
  }
}

// 1. 電子車長名牌 (附件十：5位數員工編號，首個數字為0亦須輸入，黃字顯示，支援 X 清除及 ✓ 確認登出)
function openDriverModal() {
  const ov = document.getElementById('modalOverlay');
  const card = document.getElementById('modalCard');
  card.innerHTML = `
    <div class="font-black text-base text-center">輸入員工編號 (電子車長名牌)</div>
    <div class="text-xs text-zinc-600">請輸入 5 位數員工編號（首個數字為 0 亦須輸入）：</div>
    <input id="driverInput" type="text" maxlength="5" inputmode="numeric" value="${state.driverNo}" placeholder="例如 05432"
      class="w-full px-3 py-2 border-2 border-blue-600 rounded-lg font-mono font-black text-xl text-center tracking-widest" />
    <div class="grid grid-cols-3 gap-2 pt-1">
      <button id="drvClear" class="py-2 rounded-lg bg-red-600 text-white font-black text-sm">✕ 清除</button>
      <button id="drvCancel" class="py-2 rounded-lg bg-zinc-200 text-black font-bold text-sm">取消</button>
      <button id="drvOk" class="py-2 rounded-lg bg-[#0068FF] text-white font-black text-sm">✓ 確認</button>
    </div>
  `;
  ov.classList.remove('hidden');
  const inp = document.getElementById('driverInput');
  inp.focus();
  document.getElementById('drvClear').onclick = () => { inp.value = ''; inp.focus(); };
  document.getElementById('drvCancel').onclick = () => ov.classList.add('hidden');
  document.getElementById('drvOk').onclick = () => {
    const val = inp.value.trim();
    if (!val) {
      state.driverNo = '';
      state.driverManualLogin = false;
      ov.classList.add('hidden');
      renderAll();
      showToast('已登出員工編號');
      return;
    }
    if (!/^\d{5}$/.test(val)) {
      showToast('請輸入完整 5 位數字員工編號');
      return;
    }
    state.driverNo = val;
    state.driverManualLogin = true;
    ov.classList.add('hidden');
    renderAll();
    showToast(`車長 ${val} 已登入（黃字名牌）`);
  };
}

// 2. 路線訓練模式密碼驗證 (手冊 v1.2：密碼 9999)
function openTrainingModal() {
  if (state.trainingMode) {
    state.trainingMode = false;
    renderAll();
    showToast('已退出訓練模式');
    return;
  }
  const ov = document.getElementById('modalOverlay');
  const card = document.getElementById('modalCard');
  card.innerHTML = `
    <div class="font-black text-base text-center">啟動路線訓練模式</div>
    <div class="text-xs text-zinc-600">請輸入訓練模式密碼（9999），電子牌將自動顯示為「暫停載客」：</div>
    <input id="trainPwdInput" type="password" maxlength="4" inputmode="numeric" placeholder="****"
      class="w-full px-3 py-2 border-2 border-amber-500 rounded-lg font-mono font-black text-xl text-center tracking-widest" />
    <div class="grid grid-cols-2 gap-2 pt-1">
      <button id="trnCancel" class="py-2 rounded-lg bg-zinc-200 text-black font-bold text-sm">取消</button>
      <button id="trnOk" class="py-2 rounded-lg bg-amber-500 text-black font-black text-sm">確認啟動</button>
    </div>
  `;
  ov.classList.remove('hidden');
  const inp = document.getElementById('trainPwdInput');
  inp.focus();
  document.getElementById('trnCancel').onclick = () => ov.classList.add('hidden');
  document.getElementById('trnOk').onclick = () => {
    if (inp.value.trim() === '9999') {
      state.trainingMode = true;
      ov.classList.add('hidden');
      renderAll();
      showToast('已成功轉為訓練模式');
    } else {
      showToast('密碼錯誤（提示：9999）');
    }
  };
}

// 3. 預定班次 / 功課紙三字母地點代號模擬 (整合 location_codes.json + 附件九開出安排)
function openDutyModal() {
  const ov = document.getElementById('modalOverlay');
  const card = document.getElementById('modalCard');
  const d = state.scheduledDuty || { routeNo: '1', originCode: 'MAF', destCode: 'HVU', departTime: '12:30', mode: '總站開出' };
  card.innerHTML = `
    <div class="font-black text-base text-center">預定班次 / 字軌模擬 (附件三代號)</div>
    <div class="space-y-2 text-xs">
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="font-bold block mb-0.5">路線號碼</label>
          <input id="dutyRoute" type="text" value="${d.routeNo}" class="w-full px-2 py-1.5 border border-zinc-400 rounded font-black text-sm uppercase" />
        </div>
        <div>
          <label class="font-bold block mb-0.5">開出時間</label>
          <input id="dutyTime" type="text" value="${d.departTime}" class="w-full px-2 py-1.5 border border-zinc-400 rounded font-mono font-bold text-sm" />
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="font-bold block mb-0.5">起載代號 (如 MAF/GTC)</label>
          <input id="dutyOrig" type="text" maxlength="4" value="${d.originCode}" class="w-full px-2 py-1.5 border border-zinc-400 rounded font-mono font-black text-sm uppercase" />
          <div id="origPreview" class="text-[11px] text-blue-600 font-bold mt-0.5 truncate">${lookupLocName(d.originCode)}</div>
        </div>
        <div>
          <label class="font-bold block mb-0.5">目的地代號 (如 HVU/HZM)</label>
          <input id="dutyDest" type="text" maxlength="4" value="${d.destCode}" class="w-full px-2 py-1.5 border border-zinc-400 rounded font-mono font-black text-sm uppercase" />
          <div id="destPreview" class="text-[11px] text-blue-600 font-bold mt-0.5 truncate">${lookupLocName(d.destCode)}</div>
        </div>
      </div>
      <div>
        <label class="font-bold block mb-0.5">下班車安排 (附件九)</label>
        <select id="dutyMode" class="w-full px-2 py-1.5 border border-zinc-400 rounded font-bold text-sm">
          <option value="總站開出" ${d.mode==='總站開出'?'selected':''}>A. 總站開出</option>
          <option value="私中途載" ${d.mode==='私中途載'?'selected':''}>B. 私中途載</option>
          <option value="私對站" ${d.mode==='私對站'?'selected':''}>C. 私對站 (電子牌轉私牌)</option>
        </select>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-2 pt-1">
      <button id="dutyCancel" class="py-2 rounded-lg bg-zinc-200 text-black font-bold text-sm">關閉</button>
      <button id="dutyApply" class="py-2 rounded-lg bg-[#0068FF] text-white font-black text-sm">載入此字軌</button>
    </div>
  `;
  ov.classList.remove('hidden');
  document.getElementById('dutyOrig').addEventListener('input', e => {
    document.getElementById('origPreview').textContent = lookupLocName(e.target.value);
  });
  document.getElementById('dutyDest').addEventListener('input', e => {
    document.getElementById('destPreview').textContent = lookupLocName(e.target.value);
  });
  document.getElementById('dutyCancel').onclick = () => ov.classList.add('hidden');
  document.getElementById('dutyApply').onclick = () => {
    const rNo = document.getElementById('dutyRoute').value.trim().toUpperCase();
    const orig = document.getElementById('dutyOrig').value.trim().toUpperCase();
    const dest = document.getElementById('dutyDest').value.trim().toUpperCase();
    const tm = document.getElementById('dutyTime').value.trim();
    const md = document.getElementById('dutyMode').value;
    state.scheduledDuty = { routeNo: rNo, originCode: orig, destCode: dest, departTime: tm, mode: md };
    ov.classList.add('hidden');
    // 自動匹配路線庫
    const hit = state.routes.find(r => fmtRouteNo(r).toUpperCase() === rNo);
    if (hit) {
      state.selectedRouteId = hit.routeId;
      state.routeStage = 'pattern';
      state.currentTab = 'route';
    }
    renderAll();
    showToast(`${md}：${rNo} (${lookupLocName(orig)} → ${lookupLocName(dest)})`);
  };
}

      </button>
      <button id="bSearch" class="h-12 rounded-lg ${state.showBroadcastSearch ? 'bg-white text-[#0068FF]' : 'bg-[#0068FF] text-white'} active:brightness-90 flex items-center justify-center">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.8" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      </button>
    `;
    document.getElementById('bUp').onclick = () => { if (state.broadcastPage > 0) { state.broadcastPage--; renderMain(); } };
    document.getElementById('bDown').onclick = () => { state.broadcastPage++; renderMain(); };
    document.getElementById('bSearch').onclick = () => {
      state.showBroadcastSearch = !state.showBroadcastSearch;
      if (!state.showBroadcastSearch) { state.broadcastQuery = ''; state.broadcastPage = 0; }
      renderAll();
    };
    return;
  }

  if (state.currentTab === 'route' && state.routeStage === 'route') {
    const step = state.showRouteInput ? 3 : 5;
    bar.style.gridTemplateColumns = '0.85fr 1.3fr 1.3fr 0.85fr';
    bar.innerHTML = `
      <button id="rBot" class="h-12 rounded-lg bg-[#0068FF] active:brightness-90 flex items-center justify-center">
        <span class="w-9 h-9 rounded-full bg-white text-black font-black text-base flex items-center justify-center border-2 border-black">A</span>
      </button>
      <button id="rUp" class="h-12 rounded-lg bg-[#6b7280] active:brightness-90 text-white flex items-center justify-center">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M12 19V5m0 0l-6 6m6-6l6 6"/></svg>
      </button>
      <button id="rDown" class="h-12 rounded-lg bg-[#0068FF] active:brightness-90 text-white flex items-center justify-center">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M12 5v14m0 0l-6-6m6 6l6-6"/></svg>
      </button>
      <button id="rSearch" class="h-12 rounded-lg ${state.showRouteInput ? 'bg-white text-[#0068FF]' : 'bg-[#0068FF] text-white'} active:brightness-90 flex items-center justify-center">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.8" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      </button>
    `;
    document.getElementById('rBot').onclick = () => {
      state.routeQuery = '';
      state.routeListOffset = 0;
      state.activeLetterKey = null;
      showToast('已重設路線清單');
      renderMain();
    };
    document.getElementById('rUp').onclick = () => { state.routeListOffset = Math.max(0, state.routeListOffset - step); renderMain(); };
    document.getElementById('rDown').onclick = () => { state.routeListOffset += step; renderMain(); };
    document.getElementById('rSearch').onclick = () => {
      state.showRouteInput = !state.showRouteInput;
      state.activeLetterKey = null;
      renderAll();
    };
    return;
  }

  if (state.currentTab === 'route' && state.routeStage === 'stops') {
    bar.style.gridTemplateColumns = '0.85fr 1.3fr 1.3fr 0.85fr';
    bar.innerHTML = `
      <button id="sBack" class="h-12 rounded-lg bg-[#ef1a1a] active:brightness-90 text-white flex items-center justify-center">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="3.2" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
      </button>
      <button id="sUp" class="h-12 rounded-lg bg-[#6b7280] active:brightness-90 text-white flex items-center justify-center">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M12 19V5m0 0l-6 6m6-6l6 6"/></svg>
      </button>
      <button id="sDown" class="h-12 rounded-lg bg-[#0068FF] active:brightness-90 text-white flex items-center justify-center">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M12 5v14m0 0l-6-6m6 6l6-6"/></svg>
      </button>
      <button id="sMore" class="h-12 rounded-lg bg-[#0068FF] active:brightness-90 text-white flex items-center justify-center font-black text-2xl tracking-widest">
        •••
      </button>
    `;
    document.getElementById('sBack').onclick = () => { state.routeStage = 'start_stop'; renderAll(); };
    document.getElementById('sUp').onclick = () => {
      if (state.currentStopIdx > 0) {
        state.currentStopIdx--;
        state.stopProgressPct = 25;
        renderMain();
        triggerStopAnnouncement(state.currentStopIdx);
      }
    };
    document.getElementById('sDown').onclick = () => {
      if (state.currentStopIdx + 1 < state.tripStops.length) {
        state.currentStopIdx++;
        state.stopProgressPct = 25;
        renderMain();
        triggerStopAnnouncement(state.currentStopIdx);
      }
    };
    document.getElementById('sMore').onclick = () => {
      state.stopMode = state.stopMode === 'auto' ? 'manual' : 'auto';
      renderAll();
      showToast(state.stopMode === 'auto' ? '已切換至：自動報站' : '已切換至：手動報站');
    };
    return;
  }

  const isRouteSubStage = (state.currentTab === 'route' && ['direction', 'pattern', 'start_stop'].includes(state.routeStage));
  bar.style.gridTemplateColumns = '0.85fr 1.3fr 1.3fr 0.85fr';
  bar.innerHTML = `
    <button id="gBack" class="h-12 rounded-lg ${isRouteSubStage ? 'bg-[#ef1a1a]' : 'bg-[#2a313d]'} active:brightness-90 text-white flex items-center justify-center">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="3.2" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
    </button>
    <button id="gUp" class="h-12 rounded-lg bg-[#6b7280] active:brightness-90 text-white flex items-center justify-center">
      <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M12 19V5m0 0l-6 6m6-6l6 6"/></svg>
    </button>
    <button id="gDown" class="h-12 rounded-lg bg-[#0068FF] active:brightness-90 text-white flex items-center justify-center">
      <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M12 5v14m0 0l-6-6m6 6l6-6"/></svg>
    </button>
    <button id="gHome" class="h-12 rounded-lg bg-[#0068FF] active:brightness-90 text-white flex items-center justify-center font-black text-xs">
      路線
    </button>
  `;
  document.getElementById('gBack').onclick = () => {
    if (state.currentTab === 'route') {
      state.stagePageOffset = 0;
      if (state.routeStage === 'start_stop') state.routeStage = 'pattern';
      else if (state.routeStage === 'pattern') state.routeStage = 'direction';
      else if (state.routeStage === 'direction') state.routeStage = 'route';
      renderAll();
    } else {
      state.currentTab = 'route';
      renderAll();
    }
  };
  document.getElementById('gUp').onclick = () => {
    if (isRouteSubStage) {
      state.stagePageOffset = Math.max(0, state.stagePageOffset - 5);
      renderMain();
    } else {
      const sc = document.getElementById('scrollList');
      if (sc) sc.scrollBy({ top: -150, behavior: 'smooth' });
    }
  };
  document.getElementById('gDown').onclick = () => {
    if (isRouteSubStage) {
      state.stagePageOffset += 5;
      renderMain();
    } else {
      const sc = document.getElementById('scrollList');
      if (sc) sc.scrollBy({ top: 150, behavior: 'smooth' });
    }
  };
  document.getElementById('gHome').onclick = () => { state.currentTab = 'route'; renderAll(); };
}

function syncManualTabHeader() {
  const iconEl = document.getElementById('tabRouteIcon');
  const labelEl = document.getElementById('tabRouteLabel');
  if (!iconEl || !labelEl) return;
  if (state.routeStage === 'stops' && !state.gpsEnabled) {
    iconEl.innerHTML = `<span class="w-5 h-5 rounded-full bg-[#0068FF] text-white font-black text-[11px] flex items-center justify-center">M</span>`;
    labelEl.textContent = '手動';
  } else {
    iconEl.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18h4a3 3 0 0 0 3-3V9a3 3 0 0 1 3-3"/></svg>`;
    labelEl.textContent = state.routeStage === 'stops' ? 'GPS自動' : '路線';
  }
}

function renderAll() {
  syncManualTabHeader();
  renderTabs();
  renderMain();
  renderBottomBar();
}

// 頁籤切換 (訊息與事故受停車3秒安全鎖保護)
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => {
    const target = btn.dataset.tab;
    if ((target === 'message' || target === 'incident') && !requireStopped3s()) return;
    state.currentTab = target;
    renderAll();
  };
});

// 模擬停車 3 秒 / 行車中切換鈕
document.getElementById('simStopToggle').onclick = () => {
  state.isStopped3s = !state.isStopped3s;
  if (!state.isStopped3s && state.currentTab === 'message') {
    state.currentTab = 'route';
  }
  renderAll();
  showToast(state.isStopped3s ? '模擬狀態：已停車達 3 秒（解鎖訊息/事故）' : '模擬狀態：巴士行駛中（鎖定訊息/事故）');
};

document.getElementById('dismissMsgBtn').onclick = () => {
  state.dismissedPopup = true;
  renderTopStatus();
};
document.getElementById('readNowBtn').onclick = () => {
  if (!requireStopped3s()) return;
  state.currentTab = 'message';
  state.messages.forEach(m => m.unread = false);
  renderAll();
};

window.addEventListener('keydown', (e) => {
  if (document.getElementById('modalOverlay').classList.contains('hidden') === false) return;
  if (state.currentTab === 'route' && state.routeStage === 'route') {
    if (/^[0-9A-Za-z.]$/.test(e.key)) {
      state.showRouteInput = true;
      state.routeQuery += e.key.toUpperCase();
      state.routeListOffset = 0;
      state.activeLetterKey = null;
      renderAll();
    } else if (e.key === 'Backspace') {
      state.routeQuery = state.routeQuery.slice(0, -1);
      state.routeListOffset = 0;
      state.activeLetterKey = null;
      renderMain();
    } else if (e.key === 'Enter') {
      const filtered = getFilteredRouteList();
      if (filtered.length > 0) {
        state.selectedRouteId = filtered[0][1].routeId;
        state.routeStage = 'pattern';
        renderAll();
      }
    }
  }
});

document.getElementById('hwVolDown').onclick = () => {
  state.volume = Math.max(0, +(state.volume - 0.15).toFixed(2));
  showToast(`報站音量：${Math.round(state.volume * 100)}%`);
};
document.getElementById('hwVolUp').onclick = () => {
  state.volume = Math.min(1, +(state.volume + 0.15).toFixed(2));
  showToast(`報站音量：${Math.round(state.volume * 100)}%`);
};
document.getElementById('hwBrightDown').onclick = () => {
  state.brightnessDim = Math.min(0.65, +(state.brightnessDim + 0.12).toFixed(2));
  document.getElementById('brightnessMask').style.opacity = state.brightnessDim;
  showToast(`螢幕亮度：${Math.round((1 - state.brightnessDim) * 100)}%`);
};
document.getElementById('hwBrightUp').onclick = () => {
  state.brightnessDim = Math.max(0, +(state.brightnessDim - 0.12).toFixed(2));
  document.getElementById('brightnessMask').style.opacity = state.brightnessDim;
  showToast(`螢幕亮度：${Math.round((1 - state.brightnessDim) * 100)}%`);
};

document.getElementById('zipInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const zip = await JSZip.loadAsync(file);
    let rJson = null, sJson = null, aJson = null;
    for (const [name, entry] of Object.entries(zip.files)) {
      if (name.endsWith('routes.json')) rJson = JSON.parse(await entry.async('string'));
      if (name.endsWith('stops.json')) sJson = JSON.parse(await entry.async('string'));
      if (name.endsWith('announcements.json')) aJson = JSON.parse(await entry.async('string'));
    }
    if (rJson && sJson) {
      applyPackData(rJson, sJson, aJson || state.announcements);
      showToast(`已成功匯入 ${file.name} (${rJson.length} 班次)`);
    } else {
      showToast('ZIP 內找不到 routes.json 或 stops.json');
    }
  } catch (err) {
    showToast('匯入失敗：' + err.message);
  }
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(r => r.update());
  }).catch(() => {});
}
try {
  if (typeof loadAudioManifest === 'function') loadAudioManifest();
} catch (_) {}
initData();
startGpsWatcher();
</script>

<script>
(function initStartingScreen() {
  const scr = document.getElementById('lecipStartingScreen');
  const p1 = document.getElementById('startPhaseAndroid');
  const p2 = document.getElementById('startPhaseDiag');
  if (!scr || !p1 || !p2) return;
  let done = false;
  const closeScreen = () => {
    if (done) return;
    done = true;
    scr.style.opacity = '0';
    setTimeout(() => scr.remove(), 300);
  };
  scr.addEventListener('click', closeScreen);
  setTimeout(() => {
    if (done) return;
    p1.classList.add('hidden');
    p2.classList.remove('hidden');
  }, 1000);
  setTimeout(closeScreen, 2500);
})();
