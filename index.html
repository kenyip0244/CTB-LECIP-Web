<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>CTB LECIP 報站控制器</title>
  <link rel="manifest" href="./manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0c0e11; overflow: hidden; font-family: "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", sans-serif; }
    .faytech-shell {
      position: relative;
      height: 98dvh;
      max-height: 920px;
      aspect-ratio: 0.49;
      background-color: #16191e;
      background-image: linear-gradient(160deg, rgba(28,32,38,0.92), rgba(14,16,20,0.96)), url('./assets/lecip_faytech_controller.png');
      background-size: cover;
      background-position: center;
      border: 3px solid #2e343d;
      border-radius: 22px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.88), inset 0 1px 1px rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      padding: 24px 16px 12px 16px;
    }
    @media (max-width: 520px) {
      .faytech-shell {
        width: 100vw;
        height: 100dvh;
        max-height: none;
        aspect-ratio: auto;
        border-radius: 0;
        border: none;
        padding: 6px 6px 8px 6px;
      }
    }
    .lecip-screen {
      position: relative;
      flex: 1;
      width: 100%;
      border-radius: 6px;
      border: 2px solid #3c434e;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      color: #000000;
    }
    .lecip-screen.dark-mode { background: #14181f; color: #f1f5f9; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .tab-active-day { background: #d5daff; color: #000000; border-top-left-radius: 10px; border-top-right-radius: 10px; }
    .tab-active-dark { background: #263142; color: #ffffff; border-top-left-radius: 10px; border-top-right-radius: 10px; }
  </style>
</head>
<body class="flex items-center justify-center">
  <div class="faytech-shell">
    <!-- 頂部感應器開孔 -->
    <div class="w-full flex justify-center items-center pb-1.5 shrink-0">
      <div class="w-2.5 h-2.5 rounded-full bg-[#262a31] border border-[#3e444f]"></div>
    </div>

    <!-- 9:16 螢幕顯示區 -->
    <div id="lecipScreen" class="lecip-screen">
      <div id="brightnessMask" class="pointer-events-none absolute inset-0 bg-black z-50 transition-opacity duration-150" style="opacity: 0;"></div>

      <!-- 1. 頂部黑底狀態列 -->
      <div class="bg-black text-white px-2 py-1 flex items-center justify-between text-xs shrink-0">
        <div class="flex items-center gap-1.5">
          <span id="clockText" class="font-mono font-bold text-[14px] tracking-wider">00:00:00</span>
          <span id="driverBadge" class="bg-[#1e293b] text-[#93c5fd] px-1.5 py-0.5 rounded text-[10px] font-semibold">未登入</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span id="gpsStatusChip" class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-emerald-700 text-white">GPS 待命</span>
          <span id="speedChip" class="px-1.5 py-0.5 rounded text-[10px] font-mono bg-zinc-800 text-amber-300">0 km/h</span>
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8M3.6 15h16.8M12 3a14.5 14.5 0 010 18M12 3a14.5 14.5 0 000 18"/></svg>
        </div>
      </div>

      <!-- 2. 頂部 5 格實車頁籤列 -->
      <div id="tabStrip" class="bg-black px-0.5 pt-1 grid grid-cols-5 gap-0.5 shrink-0 text-white">
        <button data-tab="route" class="tab-btn py-1.5 flex flex-col items-center justify-center gap-0.5 text-[12px] font-extrabold">
          <div id="routeTabIconWrap" class="w-6 h-6 flex items-center justify-center"></div>
          <span id="modeLabel">路線</span>
        </button>
        <button data-tab="broadcast" class="tab-btn py-1.5 flex flex-col items-center justify-center gap-0.5 text-[12px] font-extrabold">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0014 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          <span>廣播</span>
        </button>
        <button data-tab="message" class="tab-btn relative py-1.5 flex flex-col items-center justify-center gap-0.5 text-[12px] font-extrabold">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
          <span>訊息</span>
          <span id="msgBadge" class="hidden absolute top-1 right-2 bg-[#0068FF] text-white text-[9px] px-1 rounded-full">1</span>
        </button>
        <button data-tab="incident" class="tab-btn py-1.5 flex flex-col items-center justify-center gap-0.5 text-[12px] font-extrabold">
          <svg class="w-6 h-6 text-[#e11d48]" fill="none" stroke="currentColor" stroke-width="2.6" viewBox="0 0 24 24"><path d="M12 3L2 20h20L12 3z"/></svg>
          <span>事故</span>
        </button>
        <button data-tab="settings" class="tab-btn py-1.5 flex flex-col items-center justify-center gap-0.5 text-[12px] font-extrabold">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.8" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          <span>設定</span>
        </button>
      </div>

      <div id="trainingBanner" class="hidden bg-yellow-400 text-black text-xs font-bold px-3 py-1 text-center shrink-0">訓練模式已啟動</div>
      <div id="incidentBanner" class="hidden bg-red-600 text-white text-xs font-bold px-3 py-1 text-center shrink-0">事故模式已啟動</div>

      <!-- 3. 中間主畫面區 -->
      <div id="mainViewport" class="flex-1 overflow-hidden flex flex-col">
        <div class="flex-1 flex flex-col items-center justify-center p-4 text-center">
          <div class="w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-3"></div>
          <div id="loadingText" class="font-bold text-sm">正在載入城巴路線庫 (856 班次)...</div>
        </div>
      </div>

      <!-- 4. 螢幕內部底部功能列 -->
      <div id="screenBottomBar" class="bg-black p-1 grid gap-1 shrink-0"></div>
    </div>

    <!-- 5. 螢幕外部：faytech 實體按鍵列與右側狀態 LED -->
    <div class="pt-2 px-1 flex flex-col gap-1.5 shrink-0 relative">
      <div class="flex justify-end items-center gap-1.5 pr-2">
        <span id="ledPower" class="w-2 h-1.5 rounded-sm bg-[#c6e635]"></span>
        <span id="ledGps" class="w-1.5 h-1.5 rounded-full bg-[#d9f94b] shadow-[0_0_6px_#d9f94b]"></span>
        <span id="ledStatus" class="w-2.5 h-2.5 rounded-full bg-[#9be62b] shadow-[0_0_8px_#9be62b]"></span>
      </div>
      <div class="flex items-center justify-between gap-2 text-zinc-200">
        <div class="flex items-center gap-1.5 flex-1">
          <svg class="w-5 h-5 shrink-0 text-zinc-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 010 7.07"/></svg>
          <div class="flex-1 h-10 rounded-md bg-[#1a1d22]/90 border border-[#3a414b] grid grid-cols-2 divide-x divide-[#3a414b] overflow-hidden">
            <button id="hwVolDown" class="flex items-center justify-center active:bg-zinc-700 text-lg font-bold">⊖</button>
            <button id="hwVolUp" class="flex items-center justify-center active:bg-zinc-700 text-lg font-bold">⊕</button>
          </div>
        </div>
        <div class="flex items-center gap-1.5 flex-1">
          <div class="flex-1 h-10 rounded-md bg-[#1a1d22]/90 border border-[#3a414b] grid grid-cols-2 divide-x divide-[#3a414b] overflow-hidden">
            <button id="hwBrightDown" class="flex items-center justify-center active:bg-zinc-700 text-lg font-bold">⊖</button>
            <button id="hwBrightUp" class="flex items-center justify-center active:bg-zinc-700 text-lg font-bold">⊕</button>
          </div>
          <svg class="w-5 h-5 shrink-0 text-zinc-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/></svg>
        </div>
      </div>
    </div>
  </div>

  <div id="toastBox" class="hidden fixed top-12 left-1/2 -translate-x-1/2 bg-black/90 text-white text-xs font-bold px-3.5 py-2 rounded-full border border-zinc-600 z-50 shadow-lg"></div>
  <input type="file" id="zipInput" accept=".zip" class="hidden" />

<script>
const state = {
  routes: [],
  stopsByTrip: new Map(),
  announcements: [],
  currentTab: 'route',
  routeStage: 'route',
  showRouteInput: false,   // 預設隱藏輸入框與鍵盤，撳放大鏡先打開
  routeQuery: '',
  routeListOffset: 0,
  activeLetterKey: null,   // 長撳數字鍵後展開的字母選擇列 ('1'..'0')
  selectedRouteId: null,
  selectedTrip: null,
  tripStops: [],
  currentStopIdx: 0,
  stopProgressPct: 35,
  stopMode: 'auto',
  volume: 1.0,
  brightnessDim: 0.0,
  darkMode: false,
  trainingMode: false,
  incidentActive: false,
  incidentLabel: '',
  driverNo: '',
  broadcastQuery: '',
  broadcastPage: 0,
  showBroadcastSearch: false,
  messages: [
    { id: 'm1', title: '控制中心通告', time: '08:30', body: '各線車長請留意路面交通情況，保持安全車距。', unread: true }
  ],
  gpsSpeedKmh: 0,
  lastAnnouncedKey: '',
  cleverScore: 100
};

// 對齊 LECIP_route_1lm_open.png / 2lm_open.png / 3lm_open.png 鍵盤與長撳字母表
const T9_KEYS = [
  { main: '1', sub: 'ABC', letters: ['A', 'B', 'C'] },
  { main: '2', sub: 'DEF', letters: ['D', 'E', 'F'] },
  { main: '3', sub: 'GHI', letters: ['G', 'H', 'I'] },
  { main: '4', sub: 'JKL', letters: ['J', 'K', 'L'] },
  { main: '5', sub: 'MNO', letters: ['M', 'N', 'O'] },
  { main: '6', sub: 'PQR', letters: ['P', 'Q', 'R'] },
  { main: '7', sub: 'STU', letters: ['S', 'T', 'U'] },
  { main: '8', sub: 'VWX', letters: ['V', 'W', 'X'] },
  { main: '9', sub: 'YZ',  letters: ['Y', 'Z'] },
  { main: '0', sub: '.',   letters: ['.'] }
];

function fmtRouteNo(rOrId) {
  if (rOrId && typeof rOrId === 'object') {
    const d = rOrId.displayTc || rOrId.externalRouteNo || rOrId.routeId || '';
    return String(d).replace(/^CTB-/i, '').trim();
  }
  return String(rOrId || '').replace(/^CTB-/i, '').trim();
}

function getStopFare(trip, stopObj) {
  if (!trip) return '';
  if (stopObj && stopObj.fare != null && stopObj.fare !== '') return Number(stopObj.fare).toFixed(1);
  const seq = stopObj ? Number(stopObj.seq || 1) : 1;
  const segs = Array.isArray(trip.fareSegments) ? trip.fareSegments : [];
  const hit = segs.find(seg => seq >= Number(seg.fromStopSeq || 1) && seq <= Number(seg.toStopSeq || 999));
  if (hit && hit.fare != null) return Number(hit.fare).toFixed(1);
  if (trip.fullFare != null) return Number(trip.fullFare).toFixed(1);
  return '';
}

function showToast(msg) {
  const el = document.getElementById('toastBox');
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.add('hidden'), 2000);
}

function speakAnnouncement(zhText, enText) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  if (zhText) {
    const uZh = new SpeechSynthesisUtterance(zhText);
    uZh.lang = 'zh-HK';
    uZh.volume = state.volume;
    uZh.rate = 1.02;
    window.speechSynthesis.speak(uZh);
  }
  if (enText) {
    const uEn = new SpeechSynthesisUtterance(enText);
    uEn.lang = 'en-GB';
    uEn.volume = state.volume;
    uEn.rate = 0.98;
    window.speechSynthesis.speak(uEn);
  }
}

setInterval(() => {
  const now = new Date();
  document.getElementById('clockText').textContent = now.toTimeString().slice(0, 8);
}, 500);

async function initData() {
  try {
    const [rRes, sRes, aRes] = await Promise.all([
      fetch('./data/routes.json'),
      fetch('./data/stops.json'),
      fetch('./data/announcements.json')
    ]);
    const routes = await rRes.json();
    const stops = await sRes.json();
    const anns = await aRes.json();
    applyPackData(routes, stops, anns);
  } catch (err) {
    document.getElementById('loadingText').textContent = '載入資料失敗：' + err.message;
  }
}

function applyPackData(routes, stops, anns) {
  state.routes = Array.isArray(routes) ? routes : [];
  state.announcements = Array.isArray(anns) ? anns : [];
  state.stopsByTrip.clear();
  for (const st of (Array.isArray(stops) ? stops : [])) {
    const key = `${st.routeId}|${st.bound}|${st.patternId || ''}`;
    if (!state.stopsByTrip.has(key)) state.stopsByTrip.set(key, []);
    state.stopsByTrip.get(key).push(st);
  }
  for (const list of state.stopsByTrip.values()) {
    list.sort((a, b) => (a.seq || 0) - (b.seq || 0));
  }
  renderAll();
}

function calcDistanceM(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function startGpsWatcher() {
  if (!('geolocation' in navigator)) return;
  navigator.geolocation.watchPosition((pos) => {
    const { latitude, longitude, speed } = pos.coords;
    const kmh = speed != null && speed >= 0 ? Math.round(speed * 3.6) : 0;
    state.gpsSpeedKmh = kmh;
    document.getElementById('speedChip').textContent = `${kmh} km/h`;
    document.getElementById('gpsStatusChip').textContent = 'GPS 正常';
    document.getElementById('gpsStatusChip').className = 'px-1.5 py-0.5 rounded text-[10px] font-bold bg-emerald-600 text-white';

    if (state.stopMode === 'auto' && state.currentTab === 'route' && state.routeStage === 'stops' && state.tripStops.length > 0) {
      const target = state.tripStops[state.currentStopIdx];
      if (target && target.lat && target.lng) {
        const dist = calcDistanceM(latitude, longitude, target.lat, target.lng);
        const radius = target.geofenceM || 55;
        state.stopProgressPct = Math.max(10, Math.min(100, Math.round(100 - (dist / 450) * 100)));
        const annKey = `${target.routeId}|${target.bound}|${target.seq}`;
        if (dist <= radius && state.lastAnnouncedKey !== annKey) {
          state.lastAnnouncedKey = annKey;
          triggerStopAnnouncement(state.currentStopIdx);
          if (state.currentStopIdx + 1 < state.tripStops.length) {
            state.currentStopIdx++;
            state.stopProgressPct = 15;
            renderMain();
          }
        }
      }
    }
  }, () => {
    document.getElementById('gpsStatusChip').textContent = '無 GPS 訊號';
    document.getElementById('gpsStatusChip').className = 'px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-700 text-white';
  }, { enableHighAccuracy: true, maximumAge: 2000 });
}

function triggerStopAnnouncement(idx) {
  const st = state.tripStops[idx];
  if (!st) return;
  const zh = st.nameTc || st.nameZh || st.name || '';
  const en = st.nameEn || '';
  showToast(`報站：${zh}`);
  speakAnnouncement(`下一站，${zh}`, en ? `Next stop, ${en}` : '');
}

function renderTabs() {
  const screen = document.getElementById('lecipScreen');
  screen.classList.toggle('dark-mode', state.darkMode);

  const inStops = (state.routeStage === 'stops');
  const iconWrap = document.getElementById('routeTabIconWrap');
  if (inStops) {
    iconWrap.innerHTML = `<span class="w-6 h-6 rounded-full bg-[#0068FF] text-white flex items-center justify-center text-[13px] font-black">${state.stopMode === 'auto' ? 'A' : 'M'}</span>`;
    document.getElementById('modeLabel').textContent = state.stopMode === 'auto' ? '自動' : '手動';
  } else {
    iconWrap.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M7.8 16.2L11 13h2l3.2-5.2"/></svg>`;
    document.getElementById('modeLabel').textContent = '路線';
  }

  document.getElementById('trainingBanner').classList.toggle('hidden', !state.trainingMode);
  document.getElementById('incidentBanner').classList.toggle('hidden', !state.incidentActive);
  document.getElementById('driverBadge').textContent = state.driverNo ? `車長 ${state.driverNo}` : '未登入';

  const unread = state.messages.filter(m => m.unread).length;
  const badge = document.getElementById('msgBadge');
  badge.textContent = unread;
  badge.classList.toggle('hidden', unread === 0);

  document.querySelectorAll('.tab-btn').forEach(btn => {
    const active = btn.dataset.tab === state.currentTab;
    btn.classList.remove('tab-active-day', 'tab-active-dark');
    if (active) btn.classList.add(state.darkMode ? 'tab-active-dark' : 'tab-active-day');
  });
}

function getFilteredRouteList() {
  const routeMap = new Map();
  for (const r of state.routes) {
    const disp = fmtRouteNo(r);
    if (!routeMap.has(disp)) routeMap.set(disp, r);
  }
  const q = state.routeQuery.toUpperCase();
  const arr = [...routeMap.entries()].filter(([disp]) => !q || disp.toUpperCase().startsWith(q) || disp.toUpperCase().includes(q));
  arr.sort((a, b) => {
    const aStarts = q && a[0].toUpperCase().startsWith(q) ? 0 : 1;
    const bStarts = q && b[0].toUpperCase().startsWith(q) ? 0 : 1;
    if (aStarts !== bStarts) return aStarts - bStarts;
    return a[0].localeCompare(b[0], undefined, { numeric: true });
  });
  return arr;
}

function renderMain() {
  const vp = document.getElementById('mainViewport');
  const bgBanner = state.darkMode ? 'bg-[#1e293b] text-white' : 'bg-[#d5daff] text-black';
  const rowBg = state.darkMode ? 'bg-[#1b222c] border-slate-700 text-slate-100' : 'bg-white border-zinc-400 text-black';

  if (state.currentTab === 'route') {
    if (state.routeStage === 'route') {
      const filtered = getFilteredRouteList();

      if (!state.showRouteInput) {
        // 未撳放大鏡：緊湊路線列表，只顯示路線號＋右箭咀（唔顯示去邊、卡片唔過大）
        const pageRows = 7;
        const maxOff = Math.max(0, filtered.length - pageRows);
        state.routeListOffset = Math.min(state.routeListOffset, maxOff);
        const visibleRows = filtered.slice(state.routeListOffset, state.routeListOffset + pageRows);

        vp.innerHTML = `
          <div class="${bgBanner} px-3 py-2 border-b border-zinc-500 flex items-center justify-between shrink-0">
            <span class="font-black text-base">選擇路線</span>
            <span class="text-xs font-extrabold opacity-75">${state.routeQuery ? '篩選：' + state.routeQuery : '全部路線'}</span>
          </div>
          <div class="flex-1 flex flex-col divide-y divide-zinc-400 overflow-hidden">
            ${Array.from({ length: pageRows }).map((_, slot) => {
              const item = visibleRows[slot];
              if (!item) {
                return `<div class="flex-1 ${rowBg} px-4 flex items-center justify-end"><span class="text-zinc-300 font-black text-xl">›</span></div>`;
              }
              const [disp, rObj] = item;
              return `
                <button data-rid="${rObj.routeId}" class="pick-route-row flex-1 ${rowBg} px-4 flex items-center justify-between active:bg-blue-100">
                  <span class="font-black text-2xl tracking-wide">${disp}</span>
                  <span class="text-zinc-500 font-black text-2xl">›</span>
                </button>
              `;
            }).join('')}
          </div>
        `;
        document.querySelectorAll('.pick-route-row').forEach(btn => {
          btn.onclick = () => {
            state.selectedRouteId = btn.dataset.rid;
            state.routeStage = 'pattern';
            renderMain();
          };
        });

      } else {
        // 已撳放大鏡：顯示「輸入路線」白底框＋退格鍵 + 緊湊3行候選列(只顯示路線號) + 5x2鍵盤(長撳展開字母列)
        const maxOffset = Math.max(0, filtered.length - 3);
        state.routeListOffset = Math.min(state.routeListOffset, maxOffset);
        const visible3 = filtered.slice(state.routeListOffset, state.routeListOffset + 3);
        const openKeyObj = T9_KEYS.find(k => k.main === state.activeLetterKey);

        vp.innerHTML = `
          <div class="${bgBanner} px-2.5 py-1.5 flex items-center gap-2 border-b border-zinc-500 shrink-0">
            <span class="font-black text-[16px] shrink-0">輸入路線</span>
            <div class="flex-1 h-10 bg-white border border-zinc-500 rounded-lg px-2.5 flex items-center">
              <span class="font-black text-2xl text-black tracking-wide">${state.routeQuery}</span>
            </div>
            <button id="t9Backspace" class="w-13 h-10 px-3 rounded-lg bg-[#0068FF] active:brightness-90 text-white flex items-center justify-center shrink-0">
              <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path d="M9 5h11a1 1 0 011 1v12a1 1 0 01-1 1H9l-6-7 6-7z"/><path d="M13 10l4 4m0-4l-4 4"/></svg>
            </button>
          </div>

          <!-- 緊湊 3 行候選列 (只顯示路線號碼，唔寫目的地) -->
          <div class="flex-1 flex flex-col divide-y divide-zinc-400 overflow-hidden">
            ${[0, 1].map(slot => {
              const item = visible3[slot];
              if (!item) {
                return `<div class="flex-1 ${rowBg} px-4 flex items-center justify-end"><span class="text-zinc-400 font-black text-2xl">›</span></div>`;
              }
              const [disp, rObj] = item;
              return `
                <button data-rid="${rObj.routeId}" class="pick-route-row flex-1 ${rowBg} px-4 flex items-center justify-between active:bg-blue-100">
                  <span class="font-black text-2xl tracking-wide">${disp}</span>
                  <span class="text-zinc-500 font-black text-2xl">›</span>
                </button>
              `;
            }).join('')}

            ${openKeyObj ? `
              <!-- 長撳數字鍵後展開的英文字母選擇列 (對齊 LECIP_route_1lm_open.png) -->
              <div class="flex-1 bg-white grid grid-cols-5 divide-x divide-zinc-400 border-t border-zinc-400">
                <button id="closeLetterRow" class="flex items-center justify-center text-zinc-400 font-black text-lg active:bg-zinc-100">✕</button>
                ${[0, 1, 2].map(li => {
                  const ch = openKeyObj.letters[li];
                  if (!ch) return `<div></div>`;
                  return `
                    <button data-ch="${ch}" class="pick-letter-btn flex items-center justify-center text-[#0068FF] font-black text-3xl active:bg-blue-100">
                      ${ch}
                    </button>
                  `;
                }).join('')}
                <button id="closeLetterNext" class="flex items-center justify-center text-zinc-500 font-black text-2xl active:bg-zinc-100">›</button>
              </div>
            ` : (() => {
              const item = visible3[2];
              if (!item) {
                return `<div class="flex-1 ${rowBg} px-4 flex items-center justify-end"><span class="text-zinc-400 font-black text-2xl">›</span></div>`;
              }
              const [disp, rObj] = item;
              return `
                <button data-rid="${rObj.routeId}" class="pick-route-row flex-1 ${rowBg} px-4 flex items-center justify-between active:bg-blue-100">
                  <span class="font-black text-2xl tracking-wide">${disp}</span>
                  <span class="text-zinc-500 font-black text-2xl">›</span>
                </button>
              `;
            })()}
          </div>

          <!-- 5x2 實車藍色數位鍵盤 (短撳數字、長撳展開字母) -->
          <div class="bg-[#0068FF] grid grid-cols-5 border-t border-zinc-600 shrink-0">
            ${T9_KEYS.map((k, idx) => {
              const isSelected = state.activeLetterKey === k.main;
              return `
                <button data-kidx="${idx}" class="t9-key-btn py-1.5 border-r border-b border-[#004ec2] ${isSelected ? 'bg-white text-[#0068FF]' : 'bg-[#0068FF] text-white active:bg-white active:text-[#0068FF]'} flex flex-col items-center justify-center leading-none">
                  <span class="text-[21px] font-black">${k.main}</span>
                  <span class="text-[10px] font-extrabold tracking-tight mt-0.5">${k.sub}</span>
                </button>
              `;
            }).join('')}
          </div>
        `;

        document.getElementById('t9Backspace').onclick = () => {
          if (state.routeQuery.length > 0) {
            state.routeQuery = state.routeQuery.slice(0, -1);
            state.routeListOffset = 0;
          }
          state.activeLetterKey = null;
          renderMain();
        };
        document.querySelectorAll('.pick-route-row').forEach(btn => {
          btn.onclick = () => {
            state.selectedRouteId = btn.dataset.rid;
            state.routeStage = 'pattern';
            state.activeLetterKey = null;
            renderAll();
          };
        });
        if (document.getElementById('closeLetterRow')) {
          document.getElementById('closeLetterRow').onclick = () => { state.activeLetterKey = null; renderMain(); };
        }
        if (document.getElementById('closeLetterNext')) {
          document.getElementById('closeLetterNext').onclick = () => { state.activeLetterKey = null; renderMain(); };
        }
        document.querySelectorAll('.pick-letter-btn').forEach(btn => {
          btn.onclick = () => {
            state.routeQuery += btn.dataset.ch;
            state.routeListOffset = 0;
            state.activeLetterKey = null;
            renderMain();
          };
        });

        // 綁定短撳數字 + 長撳 (350ms) 顯示英文字母選擇列
        document.querySelectorAll('.t9-key-btn').forEach(btn => {
          const kObj = T9_KEYS[Number(btn.dataset.kidx)];
          let pressTimer = null;
          let longPressed = false;

          const startPress = (e) => {
            e.preventDefault();
            longPressed = false;
            pressTimer = setTimeout(() => {
              longPressed = true;
              state.activeLetterKey = (state.activeLetterKey === kObj.main) ? null : kObj.main;
              renderMain();
            }, 350);
          };
          const endPress = (e) => {
            e.preventDefault();
            if (pressTimer) {
              clearTimeout(pressTimer);
              pressTimer = null;
            }
            if (!longPressed) {
              state.routeQuery += kObj.main;
              state.routeListOffset = 0;
              state.activeLetterKey = null;
              renderMain();
            }
          };
          const cancelPress = () => {
            if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
          };

          btn.addEventListener('pointerdown', startPress);
          btn.addEventListener('pointerup', endPress);
          btn.addEventListener('pointerleave', cancelPress);
          btn.addEventListener('pointercancel', cancelPress);
        });
      }

    } else if (state.routeStage === 'pattern') {
      const trips = state.routes.filter(r => r.routeId === state.selectedRouteId);
      const dispNo = fmtRouteNo(state.selectedRouteId);
      vp.innerHTML = `
        <div class="${bgBanner} px-3 py-2 font-black text-base border-b border-zinc-500 shrink-0">
          路線 ${dispNo} — 選擇方向／特別班次
        </div>
        <div id="scrollList" class="flex-1 overflow-y-auto no-scrollbar divide-y divide-zinc-400">
          ${trips.map((t, idx) => {
            const dest = t.destTc || t.endStopNameTc || '往總站';
            const start = t.startStopNameTc ? `${t.startStopNameTc} → ` : '';
            const pat = t.patternNameTc || (t.patternId ? `特別班次 (${t.patternId})` : '正常班次');
            const fare = t.fullFare != null ? `$${Number(t.fullFare).toFixed(1)}` : '';
            return `
              <button data-tidx="${idx}" class="pick-trip-btn w-full text-left px-3 py-2.5 ${rowBg} active:bg-blue-100 flex items-center justify-between">
                <div class="pr-2">
                  <div class="font-black text-base">往 ${dest}</div>
                  <div class="text-xs font-bold opacity-75 mt-0.5">${start}${dest}</div>
                  <div class="text-xs text-[#0068FF] font-extrabold mt-0.5">${pat} ${fare ? '· 全程 ' + fare : ''}</div>
                </div>
                <span class="text-zinc-500 font-black text-2xl shrink-0">›</span>
              </button>
            `;
          }).join('')}
        </div>
      `;
      document.querySelectorAll('.pick-trip-btn').forEach(b => {
        b.onclick = () => {
          const t = trips[Number(b.dataset.tidx)];
          state.selectedTrip = t;
          const key = `${t.routeId}|${t.bound}|${t.patternId || ''}`;
          state.tripStops = state.stopsByTrip.get(key) || [];
          state.currentStopIdx = 0;
          state.routeStage = 'start_stop';
          renderMain();
        };
      });

    } else if (state.routeStage === 'start_stop') {
      const t = state.selectedTrip;
      const dispNo = fmtRouteNo(t);
      const dest = t.destTc || t.endStopNameTc || '';
      vp.innerHTML = `
        <div class="${bgBanner} px-3 py-1.5 border-b border-zinc-500 shrink-0">
          <div class="text-xs font-bold opacity-80">${dispNo}-${dest}-${t.bound}</div>
          <div class="font-black text-base">選擇開始站位</div>
        </div>
        <div id="scrollList" class="flex-1 overflow-y-auto no-scrollbar divide-y divide-zinc-400">
          ${state.tripStops.map((s, idx) => {
            const name = s.nameTc || s.nameZh || s.name || `第 ${idx+1} 站`;
            return `
              <button data-sidx="${idx}" class="pick-start-btn w-full text-left px-3 py-2.5 flex items-center justify-between ${idx === 0 ? 'bg-[#f4f728] text-black font-black' : rowBg}">
                <span class="text-base font-bold truncate">${idx + 1}. ${name}</span>
                <span class="text-zinc-500 font-black text-xl ml-2">›</span>
              </button>
            `;
          }).join('')}
        </div>
      `;
      document.querySelectorAll('.pick-start-btn').forEach(b => {
        b.onclick = () => {
          state.currentStopIdx = Number(b.dataset.sidx);
          state.routeStage = 'stops';
          state.stopProgressPct = 35;
          state.lastAnnouncedKey = '';
          renderAll();
          triggerStopAnnouncement(state.currentStopIdx);
        };
      });

    } else if (state.routeStage === 'stops') {
      const t = state.selectedTrip;
      const dispNo = fmtRouteNo(t);
      const originName = t.startStopNameTc || (state.tripStops[0]?.nameTc) || '';
      const cur = state.tripStops[state.currentStopIdx] || {};
      const curName = cur.nameTc || cur.nameZh || cur.name || '總站';
      const curFare = getStopFare(t, cur);
      const next3 = state.tripStops.slice(state.currentStopIdx + 1, state.currentStopIdx + 4);

      vp.innerHTML = `
        <div class="${bgBanner} px-3 py-2 text-center border-b border-zinc-500 shrink-0">
          <div class="font-black text-xl leading-tight truncate">${dispNo} 往 ${t.destTc || t.endStopNameTc || ''}</div>
          <div class="text-sm font-extrabold mt-0.5 truncate">${originName ? originName + '開出' : ''} ${curFare ? '· $' + curFare : ''}</div>
        </div>

        <button id="replayCurStop" class="w-full text-left ${rowBg} px-3.5 py-3 border-b border-zinc-500 flex flex-col justify-between shrink-0 active:bg-yellow-100" style="min-height: 112px;">
          <div class="flex items-baseline gap-2">
            <span class="font-black text-2xl">${state.currentStopIdx + 1}.</span>
            <span class="font-black text-2xl leading-snug truncate">${curName}</span>
          </div>
          <div class="w-full h-5 rounded-full bg-[#737373] overflow-hidden mt-3 flex items-center">
            <div class="h-full bg-[#1db91d] rounded-l-full transition-all duration-300" style="width: ${state.stopProgressPct}%;"></div>
          </div>
        </button>

        <div class="flex-1 flex flex-col divide-y divide-zinc-400 overflow-hidden">
          ${[0, 1, 2].map(offset => {
            const s = next3[offset];
            if (!s) {
              return `
                <div class="flex-1 ${rowBg} px-3.5 flex items-center justify-end">
                  <span class="text-xs font-extrabold opacity-70">分鐘</span>
                </div>
              `;
            }
            const realIdx = state.currentStopIdx + 1 + offset;
            const sName = s.nameTc || s.nameZh || s.name || '';
            const mins = offset + 1;
            return `
              <button data-jump="${realIdx}" class="jump-stop-btn flex-1 w-full text-left px-3.5 ${rowBg} flex items-center justify-between active:bg-blue-50">
                <div class="flex items-baseline gap-2.5 truncate pr-2">
                  <span class="font-black text-xl">${realIdx + 1}.</span>
                  <span class="font-bold text-xl truncate">${sName}</span>
                </div>
                <div class="flex flex-col items-center justify-center shrink-0 leading-none">
                  <span class="font-black text-xl">${mins}</span>
                  <span class="text-[11px] font-extrabold mt-0.5">分鐘</span>
                </div>
              </button>
            `;
          }).join('')}
        </div>
      `;

      document.getElementById('replayCurStop').onclick = () => {
        state.stopProgressPct = Math.min(100, state.stopProgressPct + 25);
        triggerStopAnnouncement(state.currentStopIdx);
        renderMain();
      };
      document.querySelectorAll('.jump-stop-btn').forEach(b => {
        b.onclick = () => {
          state.currentStopIdx = Number(b.dataset.jump);
          state.stopProgressPct = 20;
          renderMain();
          triggerStopAnnouncement(state.currentStopIdx);
        };
      });
    }

  } else if (state.currentTab === 'broadcast') {
    const list = state.announcements.filter(a => {
      if (!state.broadcastQuery) return true;
      const q = state.broadcastQuery.toLowerCase();
      return String(a.code || '').toLowerCase().includes(q) || String(a.titleTc || a.ttsTc || '').toLowerCase().includes(q);
    });
    const pageSize = 5;
    const maxPage = Math.max(0, Math.ceil(list.length / pageSize) - 1);
    state.broadcastPage = Math.min(state.broadcastPage, maxPage);
    const pageItems = list.slice(state.broadcastPage * pageSize, state.broadcastPage * pageSize + pageSize);

    vp.innerHTML = `
      <div class="${bgBanner} px-3 py-2.5 border-b border-zinc-500 flex items-center justify-between shrink-0">
        <span class="font-black text-lg">播放特別訊息</span>
        <span class="text-xs font-extrabold opacity-75">${state.broadcastPage + 1} / ${maxPage + 1}</span>
      </div>
      ${state.showBroadcastSearch ? `
        <div class="p-1.5 bg-zinc-200 border-b border-zinc-400 shrink-0">
          <input id="annSearchInput" type="text" value="${state.broadcastQuery}" placeholder="輸入編號或關鍵字..."
            class="w-full px-2.5 py-1.5 rounded border border-zinc-500 text-black font-bold text-sm" />
        </div>
      ` : ''}
      <div class="flex-1 flex flex-col divide-y divide-zinc-400 overflow-hidden">
        ${[0, 1, 2, 3, 4].map(slot => {
          const item = pageItems[slot];
          if (!item) return `<div class="flex-1 ${rowBg}"></div>`;
          const code = item.code != null ? item.code : (state.broadcastPage * pageSize + slot + 1);
          const title = item.titleTc || `特別訊息 ${code}`;
          return `
            <div class="flex-1 ${rowBg} flex items-stretch justify-between overflow-hidden">
              <div class="flex-1 px-3 flex items-center gap-2 truncate">
                <span class="font-black text-xl shrink-0">${code}.</span>
                <span class="font-bold text-xl truncate">${title}</span>
              </div>
              <button data-pidx="${slot}" class="play-ann-btn w-16 bg-[#00ff00] active:brightness-90 border-l border-zinc-400 flex items-center justify-center shrink-0">
                <svg class="w-8 h-8 text-black" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              </button>
            </div>
          `;
        }).join('')}
      </div>
    `;
    if (document.getElementById('annSearchInput')) {
      const inp = document.getElementById('annSearchInput');
      inp.focus();
      inp.addEventListener('input', e => {
        state.broadcastQuery = e.target.value;
        state.broadcastPage = 0;
        renderMain();
      });
    }
    document.querySelectorAll('.play-ann-btn').forEach(b => {
      b.onclick = () => {
        const item = pageItems[Number(b.dataset.pidx)];
        if (!item) return;
        const zh = item.ttsTc || item.titleTc || '';
        const en = item.ttsEn || item.titleEn || '';
        showToast(`播放：${item.titleTc || zh}`);
        speakAnnouncement(zh, en);
      };
    });

  } else if (state.currentTab === 'message') {
    vp.innerHTML = `
      <div class="${bgBanner} px-3 py-2 font-black text-base border-b border-zinc-500 shrink-0">控制中心訊息</div>
      <div id="scrollList" class="flex-1 overflow-y-auto no-scrollbar p-2 space-y-2">
        ${state.messages.map(m => `
          <div data-mid="${m.id}" class="read-msg-card p-3 rounded border ${rowBg} cursor-pointer">
            <div class="flex justify-between items-center text-xs font-bold mb-1">
              <span class="text-[#0068FF]">${m.title}</span>
              <span class="opacity-60">${m.time}</span>
            </div>
            <div class="text-sm font-bold">${m.body}</div>
          </div>
        `).join('')}
      </div>
    `;
    document.querySelectorAll('.read-msg-card').forEach(c => {
      c.onclick = () => {
        const m = state.messages.find(x => x.id === c.dataset.mid);
        if (m) m.unread = false;
        renderTabs();
        showToast('已標記為已讀');
      };
    });

  } else if (state.currentTab === 'incident') {
    const items = ['交通意外', '車輛故障', '乘客不適', '道路阻塞 / 改道', '其他緊急事故'];
    vp.innerHTML = `
      <div class="bg-[#b91c1c] text-white px-3 py-2.5 text-center font-black text-lg border-b border-zinc-500 shrink-0">
        ${state.incidentActive ? `已啟動：${state.incidentLabel}` : '選擇事故項目'}
      </div>
      ${state.incidentActive ? `
        <div class="p-4 flex-1 flex flex-col justify-between">
          <div class="p-3 rounded bg-red-950/90 text-white text-sm space-y-2">
            <div class="font-bold text-base">${state.incidentLabel}</div>
            <div>車長請依照控制中心發出指示處理，並留意乘客安全。</div>
          </div>
          <button id="clearIncidentBtn" class="w-full py-3.5 rounded-lg bg-[#0068FF] text-white font-black text-base">完成處理並恢復正常</button>
        </div>
      ` : `
        <div id="scrollList" class="flex-1 overflow-y-auto no-scrollbar divide-y divide-zinc-400">
          ${items.map(label => `
            <button data-inc="${label}" class="pick-inc-btn w-full text-left px-4 py-4 ${rowBg} font-black text-xl active:bg-red-600 active:text-white">
              ${label}
            </button>
          `).join('')}
        </div>
      `}
    `;
    if (document.getElementById('clearIncidentBtn')) {
      document.getElementById('clearIncidentBtn').onclick = () => {
        state.incidentActive = false;
        state.incidentLabel = '';
        renderAll();
        showToast('已返回正常報站程序');
      };
    }
    document.querySelectorAll('.pick-inc-btn').forEach(b => {
      b.onclick = () => {
        state.incidentLabel = b.dataset.inc;
        state.incidentActive = true;
        renderAll();
        showToast(`事故通報：${state.incidentLabel}`);
      };
    });

  } else if (state.currentTab === 'settings') {
    vp.innerHTML = `
      <div class="px-3 py-2.5 text-center font-black text-lg shrink-0">選項</div>
      <div id="scrollList" class="flex-1 overflow-y-auto no-scrollbar px-2.5 pb-2">
        <div class="grid grid-cols-3 gap-2">
          <button id="tileTheme" class="h-16 rounded-lg bg-[#1d85d6] active:brightness-90 text-white p-1.5 flex flex-col items-center justify-center gap-1 text-center">
            <span class="text-base">🌓</span>
            <span class="text-[10px] font-bold leading-tight">${state.darkMode ? '切換日間模式' : '車長喜好設定'}</span>
          </button>
          <button id="tileDiag" class="h-16 rounded-lg bg-[#1877cb] active:brightness-90 text-white p-1.5 flex flex-col items-center justify-center gap-1 text-center">
            <span class="text-base">📈</span>
            <span class="text-[10px] font-bold leading-tight">診斷模式</span>
          </button>
          <button id="tileImport" class="h-16 rounded-lg bg-[#1159c4] active:brightness-90 text-white p-1.5 flex flex-col items-center justify-center gap-1 text-center">
            <span class="text-base">📦</span>
            <span class="text-[10px] font-bold leading-tight">匯入路線 ZIP</span>
          </button>
          <button id="tileTrain" class="h-16 rounded-lg bg-[#1d85d6] active:brightness-90 text-white p-1.5 flex flex-col items-center justify-center gap-1 text-center">
            <span class="text-base">🎓</span>
            <span class="text-[10px] font-bold leading-tight">訓練模式</span>
          </button>
          <button id="tileDriver" class="h-16 rounded-lg bg-[#1877cb] active:brightness-90 text-white p-1.5 flex flex-col items-center justify-center gap-1 text-center">
            <span class="text-base">🪪</span>
            <span class="text-[10px] font-bold leading-tight">輸入員工編號</span>
          </button>
          <button id="tileClever" class="h-16 rounded-lg bg-[#1159c4] active:brightness-90 text-white p-1.5 flex flex-col items-center justify-center gap-1 text-center">
            <span class="text-base">🛡️</span>
            <span class="text-[10px] font-bold leading-tight">智駕全城 (${state.cleverScore})</span>
          </button>
          <button id="tileCall" class="h-16 rounded-lg bg-[#8e96a0] active:brightness-90 text-white p-1.5 flex flex-col items-center justify-center gap-1 text-center">
            <span class="text-base">🎧</span>
            <span class="text-[10px] font-bold leading-tight">Call control center</span>
          </button>
        </div>
      </div>
    `;
    document.getElementById('tileTheme').onclick = () => { state.darkMode = !state.darkMode; renderAll(); };
    document.getElementById('tileDiag').onclick = () => showToast(`已載入 ${state.routes.length} 班次 / ${state.stopsByTrip.size} 路線表`);
    document.getElementById('tileImport').onclick = () => document.getElementById('zipInput').click();
    document.getElementById('tileTrain').onclick = () => { state.trainingMode = !state.trainingMode; renderAll(); };
    document.getElementById('tileDriver').onclick = () => {
      const no = prompt('請輸入車長員工編號：', state.driverNo || '54321');
      if (no !== null) { state.driverNo = no.trim(); renderAll(); }
    };
    document.getElementById('tileClever').onclick = () => showToast(`智駕全城評分：${state.cleverScore} 分 (良好)`);
    document.getElementById('tileCall').onclick = () => showToast('正在接通控制中心...');
  }
}

function renderBottomBar() {
  const bar = document.getElementById('screenBottomBar');

  if (state.currentTab === 'broadcast') {
    bar.style.gridTemplateColumns = '1.5fr 1.5fr 0.85fr';
    bar.innerHTML = `
      <button id="bUp" class="h-12 rounded-lg bg-[#0068FF] active:brightness-90 text-white flex items-center justify-center">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M12 19V5m0 0l-6 6m6-6l6 6"/></svg>
      </button>
      <button id="bDown" class="h-12 rounded-lg bg-[#0068FF] active:brightness-90 text-white flex items-center justify-center">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M12 5v14m0 0l-6-6m6 6l6-6"/></svg>
      </button>
      <button id="bSearch" class="h-12 rounded-lg ${state.showBroadcastSearch ? 'bg-white text-[#0068FF]' : 'bg-[#0068FF] text-white'} active:brightness-90 flex items-center justify-center">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.8" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      </button>
    `;
    document.getElementById('bUp').onclick = () => {
      if (state.broadcastPage > 0) { state.broadcastPage--; renderMain(); }
    };
    document.getElementById('bDown').onclick = () => {
      state.broadcastPage++;
      renderMain();
    };
    document.getElementById('bSearch').onclick = () => {
      state.showBroadcastSearch = !state.showBroadcastSearch;
      if (!state.showBroadcastSearch) { state.broadcastQuery = ''; state.broadcastPage = 0; }
      renderAll();
    };
    return;
  }

  if (state.currentTab === 'route' && state.routeStage === 'route') {
    const step = state.showRouteInput ? 3 : 7;
    bar.style.gridTemplateColumns = '0.85fr 1.3fr 1.3fr 0.85fr';
    bar.innerHTML = `
      <button id="rBot" class="h-12 rounded-lg bg-[#0068FF] active:brightness-90 flex items-center justify-center">
        <span class="w-9 h-9 rounded-full bg-white text-black font-black text-base flex items-center justify-center border-2 border-black">A</span>
      </button>
      <button id="rUp" class="h-12 rounded-lg bg-[#6b7280] active:brightness-90 text-white flex items-center justify-center">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M12 19V5m0 0l-6 6m6-6l6 6"/></svg>
      </button>
      <button id="rDown" class="h-12 rounded-lg bg-[#0068FF] active:brightness-90 text-white flex items-center justify-center">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M12 5v14m0 0l-6-6m6 6l6-6"/></svg>
      </button>
      <button id="rSearch" class="h-12 rounded-lg ${state.showRouteInput ? 'bg-white text-[#0068FF]' : 'bg-[#0068FF] text-white'} active:brightness-90 flex items-center justify-center">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.8" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      </button>
    `;
    document.getElementById('rBot').onclick = () => {
      state.routeQuery = '';
      state.routeListOffset = 0;
      state.activeLetterKey = null;
      showToast('已重設路線清單');
      renderMain();
    };
    document.getElementById('rUp').onclick = () => {
      state.routeListOffset = Math.max(0, state.routeListOffset - step);
      renderMain();
    };
    document.getElementById('rDown').onclick = () => {
      state.routeListOffset += step;
      renderMain();
    };
    // 撳放大鏡先打開/收起「輸入路線」輸入框＋T9鍵盤
    document.getElementById('rSearch').onclick = () => {
      state.showRouteInput = !state.showRouteInput;
      state.activeLetterKey = null;
      renderAll();
    };
    return;
  }

  if (state.currentTab === 'route' && state.routeStage === 'stops') {
    bar.style.gridTemplateColumns = '0.85fr 1.3fr 1.3fr 0.85fr';
    bar.innerHTML = `
      <button id="sBack" class="h-12 rounded-lg bg-[#ef1a1a] active:brightness-90 text-white flex items-center justify-center">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="3.2" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
      </button>
      <button id="sUp" class="h-12 rounded-lg bg-[#6b7280] active:brightness-90 text-white flex items-center justify-center">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M12 19V5m0 0l-6 6m6-6l6 6"/></svg>
      </button>
      <button id="sDown" class="h-12 rounded-lg bg-[#0068FF] active:brightness-90 text-white flex items-center justify-center">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M12 5v14m0 0l-6-6m6 6l6-6"/></svg>
      </button>
      <button id="sMore" class="h-12 rounded-lg bg-[#0068FF] active:brightness-90 text-white flex items-center justify-center font-black text-2xl tracking-widest">
        •••
      </button>
    `;
    document.getElementById('sBack').onclick = () => {
      state.routeStage = 'start_stop';
      renderAll();
    };
    document.getElementById('sUp').onclick = () => {
      if (state.currentStopIdx > 0) {
        state.currentStopIdx--;
        state.stopProgressPct = 25;
        renderMain();
        triggerStopAnnouncement(state.currentStopIdx);
      }
    };
    document.getElementById('sDown').onclick = () => {
      if (state.currentStopIdx + 1 < state.tripStops.length) {
        state.currentStopIdx++;
        state.stopProgressPct = 25;
        renderMain();
        triggerStopAnnouncement(state.currentStopIdx);
      }
    };
    document.getElementById('sMore').onclick = () => {
      state.stopMode = state.stopMode === 'auto' ? 'manual' : 'auto';
      renderAll();
      showToast(state.stopMode === 'auto' ? '已切換至：自動報站' : '已切換至：手動報站');
    };
    return;
  }

  bar.style.gridTemplateColumns = '0.85fr 1.3fr 1.3fr 0.85fr';
  bar.innerHTML = `
    <button id="gBack" class="h-12 rounded-lg bg-[#2a313d] active:bg-blue-700 text-white flex items-center justify-center">
      <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
    </button>
    <button id="gUp" class="h-12 rounded-lg bg-[#6b7280] active:brightness-90 text-white flex items-center justify-center">
      <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M12 19V5m0 0l-6 6m6-6l6 6"/></svg>
    </button>
    <button id="gDown" class="h-12 rounded-lg bg-[#0068FF] active:brightness-90 text-white flex items-center justify-center">
      <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M12 5v14m0 0l-6-6m6 6l6-6"/></svg>
    </button>
    <button id="gHome" class="h-12 rounded-lg bg-[#2a313d] active:bg-blue-700 text-white flex items-center justify-center font-bold text-xs">
      路線
    </button>
  `;
  document.getElementById('gBack').onclick = () => {
    if (state.currentTab === 'route') {
      if (state.routeStage === 'start_stop') state.routeStage = 'pattern';
      else if (state.routeStage === 'pattern') state.routeStage = 'route';
      renderAll();
    } else {
      state.currentTab = 'route';
      renderAll();
    }
  };
  document.getElementById('gUp').onclick = () => {
    const sc = document.getElementById('scrollList');
    if (sc) sc.scrollBy({ top: -150, behavior: 'smooth' });
  };
  document.getElementById('gDown').onclick = () => {
    const sc = document.getElementById('scrollList');
    if (sc) sc.scrollBy({ top: 150, behavior: 'smooth' });
  };
  document.getElementById('gHome').onclick = () => {
    state.currentTab = 'route';
    renderAll();
  };
}

function renderAll() {
  renderTabs();
  renderMain();
  renderBottomBar();
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => {
    state.currentTab = btn.dataset.tab;
    renderAll();
  };
});

// 支援電腦實體鍵盤直接輸入路線號碼與退格
window.addEventListener('keydown', (e) => {
  if (state.currentTab === 'route' && state.routeStage === 'route') {
    if (/^[0-9A-Za-z.]$/.test(e.key)) {
      state.showRouteInput = true;
      state.routeQuery += e.key.toUpperCase();
      state.routeListOffset = 0;
      state.activeLetterKey = null;
      renderAll();
    } else if (e.key === 'Backspace') {
      state.routeQuery = state.routeQuery.slice(0, -1);
      state.routeListOffset = 0;
      state.activeLetterKey = null;
      renderMain();
    } else if (e.key === 'Enter') {
      const filtered = getFilteredRouteList();
      if (filtered.length > 0) {
        state.selectedRouteId = filtered[0][1].routeId;
        state.routeStage = 'pattern';
        renderAll();
      }
    }
  }
});

// faytech 實體音量與亮度鍵
document.getElementById('hwVolDown').onclick = () => {
  state.volume = Math.max(0, +(state.volume - 0.15).toFixed(2));
  showToast(`報站音量：${Math.round(state.volume * 100)}%`);
};
document.getElementById('hwVolUp').onclick = () => {
  state.volume = Math.min(1, +(state.volume + 0.15).toFixed(2));
  showToast(`報站音量：${Math.round(state.volume * 100)}%`);
};
document.getElementById('hwBrightDown').onclick = () => {
  state.brightnessDim = Math.min(0.65, +(state.brightnessDim + 0.12).toFixed(2));
  document.getElementById('brightnessMask').style.opacity = state.brightnessDim;
  showToast(`螢幕亮度：${Math.round((1 - state.brightnessDim) * 100)}%`);
};
document.getElementById('hwBrightUp').onclick = () => {
  state.brightnessDim = Math.max(0, +(state.brightnessDim - 0.12).toFixed(2));
  document.getElementById('brightnessMask').style.opacity = state.brightnessDim;
  showToast(`螢幕亮度：${Math.round((1 - state.brightnessDim) * 100)}%`);
};

document.getElementById('zipInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const zip = await JSZip.loadAsync(file);
    let rJson = null, sJson = null, aJson = null;
    for (const [name, entry] of Object.entries(zip.files)) {
      if (name.endsWith('routes.json')) rJson = JSON.parse(await entry.async('string'));
      if (name.endsWith('stops.json')) sJson = JSON.parse(await entry.async('string'));
      if (name.endsWith('announcements.json')) aJson = JSON.parse(await entry.async('string'));
    }
    if (rJson && sJson) {
      applyPackData(rJson, sJson, aJson || state.announcements);
      showToast(`已成功匯入 ${file.name} (${rJson.length} 班次)`);
    } else {
      showToast('ZIP 內找不到 routes.json 或 stops.json');
    }
  } catch (err) {
    showToast('匯入失敗：' + err.message);
  }
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

initData();
startGpsWatcher();
</script>
</body>
</html>
