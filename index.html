<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="referrer" content="no-referrer" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#111318" />
  <title>CTB LECIP 報站控制器</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230068FF'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='900' font-size='30'%3EC%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0a0b0e;
      color: #f4f4f5;
      font-family: "Roboto", "Noto Sans TC", "Noto Sans CJK TC", "PingFang HK", "Microsoft JhengHei", sans-serif;
      overflow: hidden;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .lecip-bezel {
      background: linear-gradient(160deg, #23262c 0%, #15171b 55%, #101216 100%);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85), inset 0 1px 1px rgba(255, 255, 255, 0.12);
    }
    .hw-btn {
      background: linear-gradient(180deg, #252830 0%, #181a20 100%);
      border: 1px solid #353944;
    }
    .hw-btn:active {
      background: #101216;
      transform: scale(0.97);
    }
  </style>
<style id="lecip-ui-tweak">
/* 頂部分頁列與底部四掣列加高（以 ID 鎖定避免被 JS 覆寫） */
#topNavBar {
  min-height: 74px !important;
  height: 74px !important;
}
#topNavBar > .tab-btn {
  min-height: 74px !important;
  height: 74px !important;
  padding-top: 8px !important;
  padding-bottom: 8px !important;
}
#bottomBar {
  min-height: 74px !important;
  height: 74px !important;
  padding: 5px !important;
}
#bottomBar > button,
#bottomBar > div,
#bottomBar > a {
  min-height: 62px !important;
  height: 100% !important;
  border-radius: 10px !important;
}

/* 深色模式完全對齊實機附圖配色 */
#screenBox.lecip-night {
  background: #3e3d39 !important;
}
#screenBox.lecip-night #topHeader {
  background: #000000 !important;
  border-bottom-color: #000000 !important;
}
#screenBox.lecip-night #topNavBar {
  background: #000000 !important;
  border-bottom: none !important;
  padding-top: 2px !important;
}
#screenBox.lecip-night #topNavBar .tab-btn {
  background: #000000 !important;
  color: #ffffff !important;
  border-radius: 0 !important;
}
#screenBox.lecip-night #topNavBar .tab-btn[data-active="1"] {
  background: #d8ddff !important;
  color: #000000 !important;
  border-top-left-radius: 10px !important;
  border-top-right-radius: 10px !important;
}
#screenBox.lecip-night #topNavBar .tab-btn[data-active="1"] svg {
  color: #000000 !important;
}
#screenBox.lecip-night #topNavBar .tab-btn[data-tab="incident"] svg {
  color: #dc2626 !important;
}
#screenBox.lecip-night #bottomBar {
  background: #000000 !important;
  border-top-color: #000000 !important;
}
#screenBox.lecip-night #bottomBar button[disabled],
#screenBox.lecip-night #bottomBar .bg-zinc-600,
#screenBox.lecip-night #bottomBar .bg-zinc-700 {
  background-color: #7d7d7d !important;
  color: #ffffff !important;
}
#screenBox.lecip-night #bottomBar .bg-\[\#0068FF\],
#screenBox.lecip-night #bottomBar .bg-\[\#0074f0\] {
  background-color: #0072ff !important;
  color: #ffffff !important;
}
</style>
<!-- === LEAFLET TRAINING MAP HEAD START === -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style id="lecip-training-map-css">
    #trainingLeafletMap { width: 100%; height: 100%; background: #d8dfe8; z-index: 1; }
    #screenBox.lecip-night #trainingLeafletMap { background: #1c222d; }
    #screenBox.lecip-night #trainingLeafletMap .leaflet-tile-pane {
      filter: brightness(0.84) contrast(1.06) saturate(0.92);
    }
    #trainingLeafletMap .leaflet-control-attribution,
    #trainingLeafletMap .leaflet-control-zoom { display: none !important; }
    .lecip-gps-arrow-wrap { background: transparent !important; border: 0 !important; }
  </style>
<!-- === LEAFLET TRAINING MAP HEAD END === -->
<!-- === LECIP FONTS START === -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style id="lecip-font-override">
    html, body, button, input, select, textarea {
      font-family: "Roboto", "Noto Sans TC", "Noto Sans CJK TC", "PingFang HK", "Microsoft JhengHei", sans-serif !important;
    }
    .font-mono {
      font-family: "Roboto", "Noto Sans TC", "Noto Sans CJK TC", sans-serif !important;
      font-variant-numeric: tabular-nums;
    }
  </style>
<!-- === LECIP FONTS END === -->
<!-- === LECIP TAB CORNERS CSS START === -->
  <style id="lecip-tab-round-css">
    .lecip-nav-tab {
      position: relative !important;
      overflow: visible !important;
      border-top-left-radius: 15px !important;
      border-top-right-radius: 15px !important;
    }
    .lecip-nav-tab.lecip-tab-active {
      z-index: 5;
    }
    .lecip-nav-tab.lecip-tab-active:not(.lecip-tab-first)::before {
      content: "";
      position: absolute;
      bottom: 0;
      left: -10px;
      width: 10px;
      height: 10px;
      pointer-events: none;
      background: radial-gradient(circle at 0 0, transparent 10px, var(--lecip-tab-bg, #D8DAFF) 10.5px);
    }
    .lecip-nav-tab.lecip-tab-active:not(.lecip-tab-last)::after {
      content: "";
      position: absolute;
      bottom: 0;
      right: -10px;
      width: 10px;
      height: 10px;
      pointer-events: none;
      background: radial-gradient(circle at 100% 0, transparent 10px, var(--lecip-tab-bg, #D8DAFF) 10.5px);
    }
  </style>
<!-- === LECIP TAB CORNERS CSS END === -->
</head>
<body class="h-full w-full flex items-center justify-center sm:p-3">

  <!-- LECIP 實體終端機外框 -->
  <div id="deviceFrame" class="lecip-bezel relative w-full h-full sm:w-[410px] sm:h-[820px] sm:max-h-[96vh] sm:rounded-[26px] sm:border sm:border-zinc-700/80 flex flex-col p-2.5 sm:p-4 select-none">

    <!-- 頂部機身感應器／鏡頭孔 -->
    <div class="hidden sm:flex items-center justify-center gap-3 pb-2.5">
      <span class="w-2 h-2 rounded-full bg-zinc-700/80"></span>
      <span class="w-3 h-3 rounded-full bg-zinc-900 border border-zinc-700"></span>
    </div>

    <!-- 螢幕主顯示區 -->
    <div id="screenBox" class="relative flex-1 flex flex-col overflow-hidden rounded-lg bg-[#12151c] border border-zinc-800 shadow-inner transition-[filter] duration-150">

      <!-- 機身內嵌開機序列：Android -> LIT TRANSIT / Citybus 診斷畫面 -->
      <div id="lecipBootOverlay" class="absolute inset-0 z-40 bg-black text-white flex flex-col transition-opacity duration-300 cursor-pointer">
        <div id="bootPhaseAndroid" class="flex-1 flex flex-col items-center justify-center px-6">
          <img src="./assets/android_boot.gif" alt="android"
               onerror="this.style.display='none';document.getElementById('bootAndroidFallback').classList.remove('hidden');"
               class="max-h-[55%] w-auto object-contain" />
          <div id="bootAndroidFallback" class="hidden text-5xl font-semibold tracking-tight text-white">android</div>
        </div>
        <div id="bootPhaseDiag" class="hidden flex-1 flex flex-col justify-between bg-[#2b2b2b] p-5 font-sans">
          <div>
            <div class="flex items-center gap-3 mb-5">
              <div class="w-9 h-9 rounded-full bg-[#3b82f6] flex items-center justify-center font-black text-xs text-white shrink-0">LIT</div>
              <span class="text-xl font-light tracking-widest text-zinc-400">TRANSIT</span>
            </div>
            <div class="text-xs text-zinc-200 leading-relaxed space-y-0.5 mb-8">
              <div>App version: 23.06.25</div>
              <div>Kernel version: 22.03.01</div>
              <div>Config version: ctb_prod_v10</div>
            </div>
            <div id="bootDiagStatus" class="text-center text-base font-extrabold tracking-wider text-white mb-6">
              INITIALIZING...
            </div>
            <div class="text-[11px] text-zinc-200 leading-relaxed space-y-0.5">
              <div>DeviceID: 358709052246844</div>
              <div>Boot info: SDCARD|PRIMARY BOOT</div>
            </div>
          </div>
          <div class="flex items-center justify-end gap-2 pt-4">
            <div class="w-7 h-7 rounded-full border-2 border-white flex items-center justify-center font-black text-xs">C</div>
            <div class="leading-tight text-left">
              <div class="text-xs font-bold text-white">Citybus</div>
              <div class="text-[11px] font-bold text-zinc-200">城巴</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 頂部狀態列（事故啟動時轉紅頂；手動登入員工編號轉黃字；訓練模式顯示黃底標誌） -->
      <header id="topHeader" class="bg-black text-white px-3 py-2 border-b border-zinc-800 shrink-0 transition-colors">
        <div class="flex items-start justify-between gap-2">
          <!-- 左側：時間與車長名牌 -->
          <div class="min-w-0 pt-0.5">
            <div class="flex items-center gap-1.5">
              <div id="topClock" class="text-[19px] font-black font-mono tracking-wide leading-none">00:00:00</div>
              <span id="trainingTopBadge" class="hidden px-1.5 py-0.5 rounded bg-yellow-400 text-black text-[10px] font-black leading-none shrink-0">訓練模式</span>
              <span id="incidentTopBadge" class="hidden px-1.5 py-0.5 rounded bg-white text-red-700 text-[10px] font-black leading-none shrink-0">事故中</span>
            </div>
            <button id="btnDriverBadge" class="mt-1 text-[13px] font-extrabold text-zinc-100 hover:text-amber-300 truncate block text-left leading-tight">
              KEN YIP 0001
            </button>
          </div>

          <!-- 右側：上排設備圖示 + 下排智駕全城狀態條 -->
          <div class="flex flex-col items-end gap-1.5 shrink-0">
            <div class="flex items-center gap-1.5">
              <!-- 八達通 ∞ 圖示 -->
              <button id="btnOctopus" title="八達通連動狀態（點擊切換）" class="h-[20px] px-2.5 rounded-[4px] bg-[#9ca3af] text-[#111827] flex items-center justify-center active:scale-95">
                <svg class="w-6 h-3.5" viewBox="0 0 34 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M10 12.2c-2.9 0-5-1.9-5-4.2S7.1 3.8 10 3.8c3.6 0 6.2 8.4 13.8 8.4 2.9 0 5-1.9 5-4.2s-2.1-4.2-5-4.2c-3.6 0-6.2 8.4-13.8 8.4z" transform="rotate(-10 17 8)"/>
                </svg>
              </button>
              <!-- 電牌 [123] 圖示（點擊模擬停車／行駛以測試安全鎖） -->
              <button id="btnDisplayBox" title="電子路線牌狀態／點擊模擬停車或行駛" class="h-[20px] px-2 rounded-[4px] bg-[#9ca3af] text-[#111827] flex items-center justify-center active:scale-95">
                <svg class="w-9 h-3.5" viewBox="0 0 42 16" fill="none">
                  <rect x="1.2" y="1.2" width="39.6" height="13.6" rx="1.8" stroke="currentColor" stroke-width="1.6"/>
                  <text id="displayBoxText" x="21" y="11.4" text-anchor="middle" fill="currentColor" font-size="9" font-weight="900" font-family="monospace">123</text>
                </svg>
              </button>
              <!-- 地球／語言切換 -->
              <button id="btnGlobe" title="切換繁體／英文" class="w-5 h-5 text-zinc-300 hover:text-white flex items-center justify-center active:scale-95">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <circle cx="12" cy="12" r="9"/>
                  <ellipse cx="12" cy="12" rx="4.2" ry="9"/>
                  <path d="M3.5 9h17M3.5 15h17"/>
                </svg>
              </button>
            </div>

            <!-- 智駕全城狀態條（純臉部圖形＋好/留意/需改善，不顯示分數） -->
            <button id="btnCleverDriveBar" class="w-[154px] h-[22px] rounded-[5px] bg-[#64e800] text-[#111] px-3 flex items-center justify-center gap-4 text-[13px] font-black leading-none active:scale-95 shadow-sm">
              <span id="cdBarIcon" class="flex items-center justify-center"></span>
              <span id="cdBarLabel">好</span>
            </button>
          </div>
        </div>
      </header>


      <!-- 五大功能分頁列 -->
      <nav id="topNavBar" class="grid grid-cols-5 bg-[#151a24] text-zinc-300 border-b border-zinc-800 shrink-0">
        <button id="tabRouteBtn" data-tab="route" class="tab-btn flex flex-col items-center justify-center py-1.5 gap-0.5 transition-colors">
          <span id="tabRouteIcon" class="h-5 flex items-center justify-center"></span>
          <span id="tabRouteLabel" class="text-[11px] font-bold">路線</span>
        </button>
        <button data-tab="announce" class="tab-btn flex flex-col items-center justify-center py-1.5 gap-0.5 transition-colors">
          <svg class="w-5 h-5" viewBox="0 0 26 26" fill="none"><path d="M2.5 9.5H7.2L13.6 4.2V21.8L7.2 16.5H2.5V9.5Z" fill="currentColor"/><path d="M16.8 9.2A5.2 5.2 0 0 1 16.8 16.8" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/><path d="M20.2 5.9A9.6 9.6 0 0 1 20.2 20.1" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg>
          <span class="text-[11px] font-bold">廣播</span>
        </button>
        <button data-tab="message" class="tab-btn relative flex flex-col items-center justify-center py-1.5 gap-0.5 transition-colors">
          <div class="relative">
            <svg class="w-5 h-5" viewBox="0 0 28 22" fill="none"><path d="M3.4 1H24.6L15.4 10.4Q14 11.8 12.6 10.4Z" fill="currentColor"/><path d="M1 2.9L11.3 13.2Q14 15.8 16.7 13.2L27 2.9V20.2Q27 21 26.2 21H1.8Q1 21 1 20.2Z" fill="currentColor"/></svg>
            <span id="msgUnreadBadge" class="hidden absolute -top-1.5 -right-2.5 min-w-[16px] h-4 px-1 rounded-full bg-red-600 text-white text-[10px] font-black flex items-center justify-center">0</span>
          </div>
          <span class="text-[11px] font-bold">訊息</span>
        </button>
        <button data-tab="incident" class="tab-btn flex flex-col items-center justify-center py-1.5 gap-0.5 transition-colors">
          <svg class="w-5 h-5" viewBox="0 0 28 24" fill="none"><polygon points="14,2.2 26,22 2,22" stroke="#dc2626" stroke-width="2.2" stroke-linejoin="miter"/><polygon points="14,8.6 20.6,19.2 7.4,19.2" stroke="#dc2626" stroke-width="1.8" stroke-linejoin="miter"/></svg>
          <span class="text-[11px] font-bold">事故</span>
        </button>
        <button data-tab="settings" class="tab-btn flex flex-col items-center justify-center py-1.5 gap-0.5 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          <span class="text-[11px] font-bold">設定</span>
        </button>
      </nav>

      <!-- 主內容視窗 -->
      <main id="mainViewport" class="flex-1 flex flex-col overflow-hidden"></main>

      <!-- 底部四鍵控制列 -->
      <footer id="bottomBar" class="grid grid-cols-4 gap-1.5 p-1.5 bg-[#0d1118] border-t border-zinc-800 shrink-0"></footer>

      <!-- 路線搜尋英數鍵盤覆蓋層 -->
      <div id="keypadModal" class="hidden absolute inset-0 z-30 bg-[#12161f]/95 text-white flex flex-col p-3">
        <div class="flex items-center justify-between mb-2">
          <span class="text-sm font-black">搜尋路線編號</span>
          <button id="btnCloseKeypad" class="px-2.5 py-1 rounded bg-zinc-700 text-xs font-bold">關閉</button>
        </div>
        <div class="flex items-center gap-2 mb-2.5">
          <div id="keypadDisplay" class="flex-1 h-11 rounded-lg bg-black border border-zinc-600 px-3 flex items-center text-2xl font-black tracking-widest text-amber-300"></div>
          <button id="btnKeypadBack" class="h-11 px-3 rounded-lg bg-zinc-700 font-black text-sm active:scale-95">⌫</button>
          <button id="btnKeypadClear" class="h-11 px-3 rounded-lg bg-red-700 font-black text-sm active:scale-95">清除</button>
        </div>
        <div id="keypadGrid" class="grid grid-cols-5 gap-1.5 flex-1 content-start overflow-y-auto no-scrollbar"></div>
        <button id="btnKeypadConfirm" class="mt-2 h-11 rounded-lg bg-[#0068FF] font-black text-base active:brightness-90">套用搜尋</button>
      </div>

      <!-- 通用數字鍵盤覆蓋層（輸入 5 位數員工編號／訓練模式密碼 9999／特別廣播編號 3 秒自動播） -->
      <div id="numModal" class="hidden absolute inset-0 z-35 bg-[#12161f]/95 text-white flex flex-col p-3.5">
        <div class="flex items-center justify-between mb-1.5">
          <div>
            <div id="numModalTitle" class="text-base font-black">輸入編號</div>
            <div id="numModalSub" class="text-[11px] text-zinc-400 font-semibold"></div>
          </div>
          <button id="btnCloseNumModal" class="px-2.5 py-1 rounded bg-zinc-700 text-xs font-bold">取消</button>
        </div>
        <div id="numModalDisplay" class="h-12 rounded-lg bg-black border border-zinc-600 px-3 flex items-center justify-center text-3xl font-black font-mono tracking-[0.25em] text-yellow-300 mb-1.5"></div>
        <div id="numModalHint" class="min-h-[28px] text-center text-xs font-bold text-amber-300 mb-2 flex items-center justify-center"></div>
        <div id="numModalGrid" class="grid grid-cols-3 gap-2 flex-1 content-start"></div>
      </div>

      <!-- 智駕全城 (Clever Driving) 實時狀態與模擬彈窗 -->
      <div id="cleverDriveModal" class="hidden absolute inset-0 z-30 bg-black/80 flex items-center justify-center p-3">
        <div class="w-full max-h-full overflow-y-auto no-scrollbar rounded-xl bg-[#161b26] border border-zinc-700 text-white p-3.5 space-y-3 shadow-2xl">
          <div class="flex items-center justify-between border-b border-zinc-700 pb-2">
            <div>
              <div class="text-sm font-black tracking-wide text-[#64e800]">智駕全城 Clever Driving</div>
              <div class="text-[11px] text-zinc-400 font-semibold">實時安全駕駛監測</div>
            </div>
            <button id="btnCloseCD" class="px-2.5 py-1 rounded bg-zinc-700 text-xs font-bold">關閉</button>
          </div>
          <div id="cdModalBody" class="space-y-3"></div>
        </div>
      </div>

      <!-- 更多選項覆蓋層（•••） -->
      <div id="moreModal" class="hidden absolute inset-0 z-30 bg-black/75 flex items-end p-3">
        <div class="w-full rounded-xl bg-[#1a1f2b] border border-zinc-700 p-3 text-white space-y-2">
          <div class="flex items-center justify-between pb-1 border-b border-zinc-700">
            <span class="text-sm font-black">快捷操作</span>
            <button id="btnCloseMore" class="px-2 py-0.5 rounded bg-zinc-700 text-xs font-bold">關閉</button>
          </div>
          <button id="moreReplayAudio" class="w-full py-2.5 rounded-lg bg-emerald-600 font-black text-sm">重播當前站報站</button>
          <button id="morePrevStop" class="w-full py-2.5 rounded-lg bg-zinc-600 font-black text-sm">返回上一站</button>
          <button id="moreToggleGps" class="w-full py-2.5 rounded-lg bg-[#0068FF] font-black text-sm">切換 手動模式 / GPS 自動</button>
          <button id="moreToggleTheme" class="w-full py-2.5 rounded-lg bg-amber-600 font-black text-sm">車長喜好設定（日夜模式／DCP 測試）</button>
          <button id="moreOpenCD" class="w-full py-2.5 rounded-lg bg-teal-600 font-black text-sm">查看 智駕全城 狀態</button>
          <button id="morePickStart" class="w-full py-2.5 rounded-lg bg-zinc-700 font-black text-sm">重新選擇開始站位</button>
          <button id="moreBackRoutes" class="w-full py-2.5 rounded-lg bg-red-700 font-black text-sm">結束班次返回選擇路線</button>
        </div>
      </div>

      <!-- 智駕全城下方紅／黃警告卡片（實機位置：螢幕底部） -->
      <div id="cdBottomWarning" class="hidden absolute inset-x-0 bottom-0 z-[55] p-1.5 cursor-pointer select-none"></div>

      <!-- Toast -->
      <div id="toastBox" class="hidden absolute bottom-16 left-1/2 -translate-x-1/2 z-50 px-3.5 py-2 rounded-lg bg-black/90 border border-zinc-600 text-white text-xs font-bold whitespace-nowrap shadow-lg pointer-events-none"></div>
    </div>

// ============ 資料欄位相容解析工具 ============
function cleanJointName(raw) {
  const s = String(raw || '').trim();
  if (!s || !s.includes('/')) return s;
  const parts = s.split(/\s*\/\s*/).map(p => p.trim()).filter(Boolean);
  if (parts.length !== 2) return s;
  const [p1, p2] = parts;
  if (/^(G|UG|LG|M|B\d?|\d+)$/i.test(p1) && /^F$/i.test(p2)) return s;
  if (p1.length <= 1 || p2.length <= 1) return s;
  const norm = x => x.toLowerCase().replace(/[\s\-\(\)（）]/g, '');
  if (norm(p1) === norm(p2)) return p2;
  if (/\/\s+/.test(s) || (p1 === p1.toUpperCase() && p2 !== p2.toUpperCase())) return p2;
  return s;
}

function normStopName(raw) {
  return cleanJointName(raw).replace(/[\s,，\.。\-－·・]/g, '').toLowerCase();
}
function normBaseName(raw) {
  return cleanJointName(raw).replace(/[\(（][^\)）]*[\)）]/g, '').replace(/[\s,，\.。\-－·・]/g, '').toLowerCase();
}
function getRouteNo(r) {
  return String(r?.routeNo || r?.route || r?.lineNo || String(r?.routeId || '').replace(/^CTB-/i, '') || '').trim().toUpperCase();
}
function getBound(r) {
  return String(r?.bound || r?.dir || r?.direction || 'O').trim().toUpperCase();
}
function getOrigTc(r) {
  return cleanJointName(r?.origTc || r?.originTc || r?.fromTc || r?.orig_tc || r?.startTc || r?.orig || r?.origin || '');
}
function getDestTc(r) {
  return cleanJointName(r?.destTc || r?.destinationTc || r?.toTc || r?.dest_tc || r?.endTc || r?.dest || r?.destination || '');
}
function getOrigEn(r) {
  return cleanJointName(r?.origEn || r?.originEn || r?.fromEn || r?.orig_en || r?.startEn || '');
}
function getDestEn(r) {
  return cleanJointName(r?.destEn || r?.destinationEn || r?.toEn || r?.dest_en || r?.endEn || '');
}
function getDestGroupKey(r) {
  return getDestTc(r) || getDestEn(r) || getBound(r);
}
function getRealTripRemark(r) {
  const raw = state.lang === 'en'
    ? cleanJointName(r?.descEn || r?.remarksEn || r?.patternDescEn || r?.serviceTypeNameEn || r?.viaEn || r?.remarkEn || '')
    : cleanJointName(r?.descTc || r?.remarksTc || r?.patternDescTc || r?.serviceTypeNameTc || r?.viaTc || r?.remarkTc || r?.remark || '');
  if (!raw) return '';
  const dest = state.lang === 'en' ? getDestEn(r) : getDestTc(r);
  if (dest && normStopName(raw) === normStopName(dest)) return '';
  if (/^往\s*.+（班次\s*\d+）$/.test(raw)) return '';
  return raw;
}
function getTripFareNum(r) {
  const f = r?.fare ?? r?.fullFare ?? r?.price;
  if (f == null || f === '') return null;
  const n = Number(String(f).replace(/^\$/, ''));
  return Number.isFinite(n) && n > 0 ? n : null;
}
function fmtFare(n) {
  if (n == null || !Number.isFinite(Number(n))) return '';
  return `$${Number(n).toFixed(1)}`;
}
function getStopNameTc(s) {
  return cleanJointName(s?.nameTc || s?.stopNameTc || s?.name_tc || s?.tc || s?.name || '未命名車站');
}
function getStopNameEn(s) {
  return cleanJointName(s?.nameEn || s?.stopNameEn || s?.name_en || s?.en || '');
}
function getStopSub(s) {
  if (state.lang === 'en') return '';
  const loc = cleanJointName(s?.roadTc || s?.locationTc || s?.subTc || '');
  if (!loc) return '';
  if (normStopName(loc) === normStopName(getStopNameTc(s))) return '';
  return loc;
}
function getStopLat(s) {
  return Number(s?.lat ?? s?.latitude ?? s?.y);
}
function getStopLng(s) {
  return Number(s?.lng ?? s?.lon ?? s?.longitude ?? s?.x);
}

function computeTripSections(stops, trip) {
  const baseFare = getTripFareNum(trip);
  let curSec = 1;
  let curFare = baseFare;
  return (stops || []).map((st, idx) => {
    const rawStopFare = st?.sectionFare ?? st?.fare ?? st?.price;
    const stopFareNum = (rawStopFare != null && rawStopFare !== '' && Number.isFinite(Number(String(rawStopFare).replace(/^\$/, ''))))
      ? Number(String(rawStopFare).replace(/^\$/, ''))
      : null;
    const explicitSec = st?.section ?? st?.fareStage;

    let isSectionChange = false;
    if (idx === 0) {
      curFare = stopFareNum ?? baseFare;
      curSec = explicitSec ? Number(explicitSec) || 1 : 1;
      isSectionChange = false;
    } else if (stopFareNum != null && (curFare == null || Math.abs(stopFareNum - curFare) >= 0.05)) {
      curFare = stopFareNum;
      curSec = explicitSec ? Number(explicitSec) || (curSec + 1) : (curSec + 1);
      isSectionChange = true;
    } else if (explicitSec && Number(explicitSec) > curSec) {
      curSec = Number(explicitSec);
      isSectionChange = curFare != null;
    }

    return {
      sectionNo: curSec,
      activeFare: curFare,
      badgeFare: isSectionChange ? curFare : null
    };
  });
}

function getEffectiveStopAudio(st) {
  if (!st) return '';
  if (st.stopId) {
    const rawId = String(st.stopId).trim();
    const numId = rawId.replace(/^0+/, '');
    if (state.confirmedAudioMap[rawId]) return state.confirmedAudioMap[rawId];
    if (numId && state.confirmedAudioMap[numId]) return state.confirmedAudioMap[numId];
  }
  const tc = getStopNameTc(st);
  const n1 = normStopName(tc);
  if (n1 && state.confirmedAudioByName[n1]) return state.confirmedAudioByName[n1];
  const n2 = normBaseName(tc);
  if (n2 && n2.length >= 2 && state.confirmedAudioByName[n2]) return state.confirmedAudioByName[n2];
  if (st.stopAudioFile) return st.stopAudioFile;
  return '';
}

function compareRouteNo(a, b) {
  const parse = s => {
    const m = s.match(/^([A-Z]*)(\d+)([A-Z]*)$/);
    if (!m) return { hasPrefix: 2, prefix: s, num: 99999, suffix: '' };
    return { hasPrefix: m[1] ? 1 : 0, prefix: m[1], num: parseInt(m[2], 10), suffix: m[3] };
  };
  const pa = parse(a);
  const pb = parse(b);
  if (pa.hasPrefix !== pb.hasPrefix) return pa.hasPrefix - pb.hasPrefix;
  if (pa.prefix !== pb.prefix) return pa.prefix.localeCompare(pb.prefix);
  if (pa.num !== pb.num) return pa.num - pb.num;
  return pa.suffix.localeCompare(pb.suffix);
}

// ============ 音效合成器（DCP 測試音 / 轉分段 Do-Do 提示音 / 智駕警示） ============
function playSynthChime(notes) {
  return new Promise(resolve => {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) { resolve(); return; }
      const ctx = new AudioCtx();
      let t = ctx.currentTime + 0.02;
      for (const [freq, dur, gap] of notes) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.001, t);
        gain.gain.exponentialRampToValueAtTime(Math.max(0.02, 0.18 * state.volume), t + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + dur + 0.02);
        t += dur + (gap || 0.04);
      }
      const totalMs = Math.max(120, Math.round((t - ctx.currentTime) * 1000) + 40);
      setTimeout(() => {
        ctx.close().catch(() => {});
        resolve();
      }, totalMs);
    } catch (_) {
      resolve();
    }
  });
}

function playSectionFareChime() {
  // 八達通轉分段「Do-Do」雙音提示
  return playSynthChime([[880, 0.14, 0.07], [1175, 0.22, 0.04]]);
}

function playShortAssetAudio(path, fallbackNotes) {
  return new Promise(resolve => {
    try {
      const fx = new Audio(path);
      fx.volume = state.volume;
      let done = false;
      const finish = () => { if (!done) { done = true; resolve(); } };
      fx.onended = finish;
      fx.onerror = () => {
        if (done) return;
        done = true;
        playSynthChime(fallbackNotes).then(resolve);
      };
      fx.play().catch(() => {
        if (done) return;
        done = true;
        playSynthChime(fallbackNotes).then(resolve);
      });
    } catch (_) {
      playSynthChime(fallbackNotes).then(resolve);
    }
  });
}

// ============ 音檔播放與 Google TTS 序列引擎 ============
let _audioStopNonce = 0;
function stopAllAudio() {
  if (typeof stopBootLecipTestAudio === 'function') stopBootLecipTestAudio();
  _audioStopNonce++;
  audioPlaySeqId++;

    currentAudio = null;
  }
  if ('speechSynthesis' in window) {
    try { window.speechSynthesis.cancel(); } catch (_) {}
  }
}

function buildAudioUrl(relPath) {
  const clean = String(relPath || '').replace(/\\/g, '/').replace(/^\/+/, '').replace(/\.wav$/i, '.mp3');
  if (!clean) return '';
  if (/^(https?:\/\/|\.\/)/i.test(clean)) return clean;
  const encoded = clean.split('/').filter(Boolean).map(seg => encodeURIComponent(seg)).join('/');
  return `${AUDIO_CDN_BASE}/${encoded}`;
}

function resolveManifestPath(rawPath) {
  if (!rawPath) return '';
  if (/^(https?:\/\/|\.\/)/i.test(String(rawPath))) return String(rawPath);
  const clean = String(rawPath).replace(/\\/g, '/').replace(/^\/+/, '').replace(/\.wav$/i, '.mp3');
  if (state.audioManifest.includes(clean)) return clean;
  const stem = clean.split('/').pop().replace(/\.[^.]+$/, '').toLowerCase();
  const candidates = [stem];
  if (/^\d+$/.test(stem)) candidates.push(stem.padStart(2, '0'), stem.replace(/^0+/, ''));
  for (const c of candidates) {
    if (c && state.audioStemMap.has(c)) return state.audioStemMap.get(c);
  }
  const noSuffix = stem.replace(/_[ab]$/i, '');
  if (noSuffix && state.audioStemMap.has(noSuffix + '_a')) return state.audioStemMap.get(noSuffix + '_a');
  if (noSuffix && state.audioStemMap.has(noSuffix + '_b')) return state.audioStemMap.get(noSuffix + '_b');
  return clean;
}

function buildGoogleTtsUrl(text, tl) {
  const q = String(text || '').trim().slice(0, 180);
  if (!q) return '';
  return `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=${encodeURIComponent(tl)}&q=${encodeURIComponent(q)}`;
}

function playUrlListAsync(urls, seqToken) {
  return new Promise(resolve => {
    if (!urls || urls.length === 0 || seqToken !== audioPlaySeqId) {
      resolve(false);
      return;
    }
    let playedAny = false;
    let idx = 0;
    const next = () => {
      if (seqToken !== audioPlaySeqId || idx >= urls.length) {
        resolve(playedAny);
        return;
      }
      const url = urls[idx++];
      const audio = new Audio(url);
      audio.volume = state.volume;
      currentAudio = audio;
      let settled = false;
      const advance = () => {
        if (settled) return;
        settled = true;
        next();
      };
      audio.onended = advance;
      audio.onerror = advance;
      audio.play().then(() => { playedAny = true; }).catch(advance);
    };
    next();
  });
}

function speakWebSpeechAsync(tcText, enText, scText, seqToken) {
  return new Promise(resolve => {
    if (!('speechSynthesis' in window) || seqToken !== audioPlaySeqId) {
      resolve();
      return;
    }
    try {
      window.speechSynthesis.cancel();
      const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
      const pickGoogleVoice = (langPrefix) =>
        voices.find(v => /google/i.test(v.name) && v.lang.toLowerCase().startsWith(langPrefix)) ||
        voices.find(v => v.lang.toLowerCase().startsWith(langPrefix)) ||
        null;

      const items = [];
      if (tcText) items.push({ text: tcText, lang: 'zh-HK', voice: pickGoogleVoice('zh-hk') || pickGoogleVoice('yue') });
      if (enText) items.push({ text: enText, lang: 'en-GB', voice: pickGoogleVoice('en-gb') || pickGoogleVoice('en') });
      if (scText) items.push({ text: scText, lang: 'zh-CN', voice: pickGoogleVoice('zh-cn') });
      if (items.length === 0) { resolve(); return; }

      let idx = 0;
      const speakNext = () => {
        if (seqToken !== audioPlaySeqId || idx >= items.length) { resolve(); return; }
        const it = items[idx++];
        const u = new SpeechSynthesisUtterance(it.text);
        u.lang = it.lang;
        if (it.voice) u.voice = it.voice;
        u.volume = state.volume;
        u.onend = speakNext;
        u.onerror = speakNext;
        window.speechSynthesis.speak(u);
      };
      speakNext();
    } catch (_) {
      resolve();
    }
  });
}

async function playSingleSegment(relPaths, fallbackTc, fallbackEn, fallbackSc, seqToken) {
  if (seqToken !== audioPlaySeqId) return;
  const urls = Array.from(new Set(
    (relPaths || [])
      .filter(Boolean)
      .map(p => buildAudioUrl(resolveManifestPath(p)))
      .filter(Boolean)
  ));
  if (urls.length > 0) {
    const ok = await playUrlListAsync(urls, seqToken);
    if (ok || seqToken !== audioPlaySeqId) return;
  }
  const ttsUrls = [
    fallbackTc ? buildGoogleTtsUrl(fallbackTc, 'yue') : '',
    fallbackEn ? buildGoogleTtsUrl(fallbackEn, 'en') : '',
    fallbackSc ? buildGoogleTtsUrl(fallbackSc, 'zh-CN') : ''
  ].filter(Boolean);
  const ttsOk = await playUrlListAsync(ttsUrls, seqToken);
  if (!ttsOk && seqToken === audioPlaySeqId) {
    await speakWebSpeechAsync(fallbackTc, fallbackEn, fallbackSc, seqToken);
  }
}

let _activeAnnCount = 0;
async function playAnnouncementSegments(segments) {
  _activeAnnCount++;
  try {
    return await _playAnnouncementSegmentsCore(segments);
  } finally {
    _activeAnnCount = Math.max(0, _activeAnnCount - 1);
  }
}
async function _playAnnouncementSegmentsCore(segments) {
  stopAllAudio();
  const seqToken = audioPlaySeqId;
  for (const seg of (segments || [])) {
    if (seqToken !== audioPlaySeqId) break;
    if (seg.chime === 'section') {
      await playSectionFareChime();
      continue;
    }
    if (seg.chime === 'dcp') {
      await playSynthChime([[659, 0.14, 0.04], [880, 0.16, 0.04], [1046, 0.24, 0.04]]);
      continue;
    }
    await playSingleSegment(seg.files, seg.tc, seg.en, seg.sc, seqToken);
  }
  return seqToken === audioPlaySeqId;
}

function getWelcomeAudioFile() {
  const firstStop = state.tripStops[0];
  if (firstStop && firstStop.stopAudioFile) {
    const stem = String(firstStop.stopAudioFile).split('/').pop().replace(/\.[^.]+$/, '').toLowerCase();
    if (stem && !/^\d+_[a-z]$/i.test(stem)) return firstStop.stopAudioFile;
  }
  const routeNo = String(state.selectedRouteNo || '').toLowerCase();
  if (routeNo && state.audioStemMap.size > 0) {
    const prefix = routeNo + '_';
    const matches = [];
    for (const [stem, path] of state.audioStemMap.entries()) {
      if (stem.startsWith(prefix) && !/^\d+_[a-z]$/i.test(stem)) matches.push(path);
    }
    if (matches.length === 1) return matches[0];
  }
  return '';
}

function getWelcomeAudioFiles() {
  const rno = String(state.selectedRouteNo || '').trim().toUpperCase();
  const isFlyer = /^(A|NA)\d+/.test(rno);
  const all = state.audioManifest || [];

  // 排除所有已在 Studio 標記為「指定單一方向班次」的專屬歡迎詞
  const tripOnlyPaths = new Set(
    (state.studioWelcomeRules || [])
      .filter(w => w && w.audioPath && w.scope !== 'default')
      .map(w => String(w.audioPath).trim().toLowerCase())
  );

  // 只比對檔名本身（不比對資料夾路徑 audio/welcome/），避免誤抽 A10_LLS.mp3
  const getStem = (p) => String(p || '').split('/').pop().replace(/\.[^.]+$/, '').toLowerCase();
  const findExactStem = (stems) => {
    for (const target of stems) {
      const hit = all.find(p => {
        if (!p || tripOnlyPaths.has(String(p).trim().toLowerCase())) return false;
        return getStem(p) === target;
      });
      if (hit) return hit;
    }
    return '';
  };

  if (isFlyer) {
    const flyerHit = findExactStem(['welcome_cityflyer', 'welcome_flyer', 'cityflyer_welcome']);
    if (flyerHit) return [flyerHit];
  }

  const stdHit = findExactStem(['welcome_citybus', 'welcome_ctb', 'ctb_welcome', 'welcome']);
  if (stdHit) return [stdHit];

  if (state.audioStemMap && state.audioStemMap.has('welcome')) {
    const p = state.audioStemMap.get('welcome');
    if (p && !tripOnlyPaths.has(String(p).trim().toLowerCase())) return [p];
  }
  return [];
}

function getStudioCurrentTripCandidates() {
  const names = new Set();
  const trip = state.selectedTrip || {};
  const rno = String(state.selectedRouteNo || trip.externalRouteNo || trip.routeId || trip.route || '').replace(/^CTB-/i, '').trim().toUpperCase();
  const bnd = String(trip.bound || trip.dir || 'O').trim().toUpperCase();
  const stype = String(trip.serviceType || trip.service_type || '1').trim();
  const tKey = trip.tripKey || `${rno}|${bnd}|${stype}`;

  const customMap = state.studioTripNames || {};
  const cRec = trip._studioTripRec || customMap[tKey];
  if (cRec?.name) names.add(String(cRec.name).trim());
  if (cRec?.defaultName) names.add(String(cRec.defaultName).trim());

  [trip.tripName, trip.trip_name, trip.name, trip.label, trip.title].forEach(v => {
    if (v && String(v).trim()) names.add(String(v).trim());
  });

  const cleanDest = (rawStr) => {
    const s = String(rawStr || '').trim();
    if (!s || !s.includes('/')) return s;
    const parts = s.split(/\s*\/\s*/).map(p => p.trim()).filter(Boolean);
    if (parts.length !== 2) return s;
    if (/^(G|UG|LG|M|B\d?|\d+)$/i.test(parts[0]) && /^F$/i.test(parts[1])) return s;
    if (/\/\s+/.test(s) || (parts[0] === parts[0].toUpperCase() && parts[1] !== parts[1].toUpperCase())) return parts[1];
    return s;
  };

  let destTc = cleanDest(trip.destTc || trip.dest_tc || trip.endStopNameTc || '');
  const stopArr = Array.isArray(state.tripStops) ? state.tripStops : (Array.isArray(state.currentStops) ? state.currentStops : (Array.isArray(state.stops) ? state.stops : []));
  if (!destTc && stopArr.length > 0) {
    const lastSt = stopArr[stopArr.length - 1];
    destTc = cleanDest(typeof getStopNameTc === 'function' ? getStopNameTc(lastSt) : (lastSt?.nameTc || ''));
  }
  if (rno && destTc) {
    names.add(`${rno}-${destTc}-${stype}`);
    if (state.selectedTripSeq) names.add(`${rno}-${destTc}-${state.selectedTripSeq}`);
  }
  if (rno) names.add(`${rno}-${bnd === 'I' ? '回程' : '去程'}-${stype}`);
  return { rno, tripNames: names };
}

function resolveStudioStopAudio(st) {
  const rules = state.studioRules;
  if (!Array.isArray(rules) || !rules.length || !st) return null;
  const rawId = String(st.stopId ?? st.stop ?? st.id ?? '').trim();
  if (!rawId) return null;
  const numId = rawId.replace(/^0+/, '') || '0';
  const { rno, tripNames } = getStudioCurrentTripCandidates();

  let bestPath = null;
  let bestScore = 0;
  let bestTs = -1;

  for (const rule of rules) {
    if (!rule || !rule.audioPath || !Array.isArray(rule.stopIds)) continue;
    const stopHit = rule.stopIds.some(id => {
      const s = String(id).trim();
      return s === rawId || (s.replace(/^0+/, '') || '0') === numId;
    });
    if (!stopHit) continue;

    const rSpecific = rule.routeMode === 'specific';
    const tSpecific = rule.tripMode === 'specific';

    if (rSpecific) {
      const routes = Array.isArray(rule.routes) ? rule.routes.map(x => String(x).trim().toUpperCase()).filter(Boolean) : [];
      if (!rno || !routes.length || !routes.includes(rno)) continue;
    }
    if (tSpecific) {
      const tList = Array.isArray(rule.tripNames) ? rule.tripNames.map(x => String(x).trim()).filter(Boolean) : [];
      if (!tList.length || !tList.some(tn => tripNames.has(tn))) continue;
    }

    // 嚴格優先權：指定班次(4) + 只限指定路線(2) + 所有途經路線(1)；同級則取最新更新
    const score = (tSpecific ? 4 : 0) + (rSpecific ? 2 : 0) + 1;
    const ts = Date.parse(rule.updatedAt || '') || 0;
    if (score > bestScore || (score === bestScore && ts >= bestTs)) {
      bestScore = score;
      bestTs = ts;
      bestPath = rule.audioPath;
    }
  }
  return bestPath;
}

function resolveStudioWelcomeFiles() {
  const wRules = state.studioWelcomeRules;
  const { tripNames } = getStudioCurrentTripCandidates();

  if (Array.isArray(wRules) && wRules.length) {
    for (const w of wRules) {
      if (w?.audioPath && w.scope !== 'default' && Array.isArray(w.tripNames)) {
        if (w.tripNames.some(tn => tripNames.has(String(tn).trim()))) return [w.audioPath];
      }
    }
  }
  if (state.studioDefaultWelcome) return [state.studioDefaultWelcome];
  if (Array.isArray(wRules)) {
    const def = wRules.find(w => w?.audioPath && w.scope === 'default');
    if (def) return [def.audioPath];
  }
  return null;
}

function buildWelcomeSegment() {

function buildStopSegment(st) {

function getTerminusAudioFile() {
  const candidates = [
    'Terminus.mp3',
    'terminus.mp3',
    'audio/Terminus.mp3',
    'audio/terminus.mp3',
    'audio/announcements/Terminus.wav',
    'audio/announcements/terminus.wav'
  ];
  for (const c of candidates) {
    if (state.audioManifest.includes(c)) return c;
    const lowerHit = state.audioManifest.find(p => String(p).toLowerCase() === c.toLowerCase());
    if (lowerHit) return lowerHit;
  }
  if (state.audioStemMap.has('terminus')) {
    return state.audioStemMap.get('terminus');
  }
  return 'Terminus.mp3';
}

function buildTerminusSegment(st) {
  const tcName = getStopNameTc(st);
  const enName = getStopNameEn(st);
  return {
    files: [getTerminusAudioFile()],
    tc: `本班車已到達總站 ${tcName}，多謝乘搭城巴。`,
    en: enName ? `This bus has arrived at the terminus, ${enName}. Thank you for riding Citybus.` : 'This bus has arrived at the terminus. Thank you for riding Citybus.',
    sc: `本班车已到达总站 ${tcName}，感谢乘坐城巴。`
  };
}

function getAfterStopSpecialSegments(st) {
  const list = state.studioSpecialBroadcasts;
  if (!Array.isArray(list) || !list.length || !st) return [];
  const rawId = String(st.stopId ?? st.stop ?? st.id ?? '').trim();
  if (!rawId) return [];
  const numId = rawId.replace(/^0+/, '') || '0';
  const { rno, tripNames } = getStudioCurrentTripCandidates();

  const out = [];
  for (const item of list) {
    if (!item || (item.kind || 'after_stop') !== 'after_stop' || !item.audioPath) continue;
    if (!Array.isArray(item.stopIds) || !item.stopIds.length) continue;
    const stopHit = item.stopIds.some(id => {
      const s = String(id).trim();
      return s === rawId || (s.replace(/^0+/, '') || '0') === numId;
    });
    if (!stopHit) continue;

    const rMode = item.routeMode || 'all';
    const rList = Array.isArray(item.routes) ? item.routes.map(x => String(x).trim().toUpperCase()).filter(Boolean) : [];
    if (rMode === 'specific' && (!rno || !rList.includes(rno))) continue;
    if (rMode === 'exclude' && rno && rList.includes(rno)) continue;

    if (item.tripMode === 'specific') {
      const tList = Array.isArray(item.tripNames) ? item.tripNames.map(x => String(x).trim()).filter(Boolean) : [];
      if (!tList.length || !tList.some(tn => tripNames.has(tn))) continue;
    }
    out.push({ files: [item.audioPath], tc: '', en: '', sc: '' });
  }
  return out;
}

function playSpecialBroadcastSafely(audioPath, toastText = '') {
  if (!audioPath) return;
  const tryPlay = (attempt = 0) => {
    if (state.incidentState && state.incidentState.stage !== 'idle') return;
    if (state.routeStage !== 'stops') return;
    if (_activeAnnCount > 0) {
      if (attempt < 15) setTimeout(() => tryPlay(attempt + 1), 1500);
      return;
    }
    if (toastText) showToast(toastText);
    playAnnouncementSegments([{ files: [audioPath], tc: '', en: '', sc: '' }]);
  };
  tryPlay(0);
}

function checkLocationSpecialBroadcasts(lat, lng) {
  if (state.routeStage !== 'stops') return;
  if (state.incidentState && state.incidentState.stage !== 'idle') return;
  const list = state.studioSpecialBroadcasts;
  if (!Array.isArray(list) || !list.length) return;
  if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;

  const rno = String(state.selectedRouteNo || '').trim().toUpperCase();
  if (!state._locTrigMap || typeof state._locTrigMap !== 'object') state._locTrigMap = {};

  for (const item of list) {
    if (!item || item.kind !== 'location' || !item.audioPath) continue;
    const la = Number(item.lat);
    const ln = Number(item.lng);
    if (!Number.isFinite(la) || !Number.isFinite(ln)) continue;

    const exList = Array.isArray(item.excludeRoutes) ? item.excludeRoutes.map(x => String(x).trim().toUpperCase()).filter(Boolean) : [];
    if (rno && exList.includes(rno)) continue;

    const radius = Number(item.radiusM) > 0 ? Number(item.radiusM) : 80;
    const dist = calcDistanceMeters(lat, lng, la, ln);
    const key = item.audioPath;

    if (dist <= radius) {
      if (!state._locTrigMap[key]) {
        state._locTrigMap[key] = true;
        const label = item.locationName || item.audioPath.split('/').pop();
        playSpecialBroadcastSafely(item.audioPath, `地點特別廣播：${label}`);
      }
    } else if (dist > radius + 120) {
      state._locTrigMap[key] = false;
    }
  }
}

function startRandomBroadcastTicker() {
  if (state._randomBroadcastTimer) return;
  const INTERVAL_MS = 5 * 60 * 1000; // 每隔 5 分鐘自動抽播一次
  state._randomBroadcastTimer = setInterval(() => {
    if (state.routeStage !== 'stops') {
      state.lastRandomBroadcastAt = 0;
      return;
    }
    if (state.incidentState && state.incidentState.stage !== 'idle') return;
    const list = state.studioSpecialBroadcasts;
    if (!Array.isArray(list) || !list.length) return;

    const now = Date.now();
    if (!state.lastRandomBroadcastAt) {
      state.lastRandomBroadcastAt = now;
      return;
    }
    if (now - state.lastRandomBroadcastAt < INTERVAL_MS) return;
    if (_activeAnnCount > 0) return; // 正播放車站報站，待下個 15 秒檢查補播

    const rno = String(state.selectedRouteNo || '').trim().toUpperCase();
    const pool = list.filter(item => {
      if (!item || item.kind !== 'random_all' || !item.audioPath) return false;
      const exList = Array.isArray(item.excludeRoutes) ? item.excludeRoutes.map(x => String(x).trim().toUpperCase()).filter(Boolean) : [];
      if (rno && exList.includes(rno)) return false;
      return true;
    });
    if (!pool.length) return;

    const candidates = pool.length > 1
      ? pool.filter(x => x.audioPath !== state.lastRandomBroadcastPath)
      : pool;
    const pick = candidates[Math.floor(Math.random() * candidates.length)] || pool[0];
    if (!pick) return;

    state.lastRandomBroadcastAt = now;
    state.lastRandomBroadcastPath = pick.audioPath;
    const fn = pick.note || pick.audioPath.split('/').pop();
    showToast(`全線自動廣播：${fn}`);
    playAnnouncementSegments([{ files: [pick.audioPath], tc: '', en: '', sc: '' }]);
  }, 15000);
}

function triggerStopAnnouncement(idx, force = false) {
  if (state.incidentState.stage !== 'idle') return;
  const st = state.tripStops[idx];
  if (!st) return;
  const modeTag = state.gpsEnabled ? 'auto' : 'manual';
  const key = `${state.selectedTrip?.routeId || ''}|${state.selectedTrip?.bound || ''}|${modeTag}|${idx}`;
  if (!force && state.lastAnnouncedKey === key) return;
  state.lastAnnouncedKey = key;

  const isTerminus = idx === state.tripStops.length - 1;
  const sections = computeTripSections(state.tripStops, state.selectedTrip);
  const secInfo = sections[idx] || {};
  const segments = [];

  if (idx > 0 && secInfo.badgeFare != null && state.octopusMode === 0) {
    segments.push({ files: ['./assets/check_fare.mp3'], tc: '請檢查八達通收費', en: '', sc: '' });
  }

  if (isTerminus) {
    segments.push(buildTerminusSegment(st), ...getAfterStopSpecialSegments(st));
    const playPromise = playAnnouncementSegments(segments);
    const snapNonce = _audioStopNonce;
    const snapRouteNo = state.selectedRouteNo;
    const snapTrip = state.selectedTrip;
    const snapIdx = idx;
    Promise.resolve(playPromise).then(() => {
      if (_audioStopNonce !== snapNonce) return;
      if (state.currentTab !== 'route' || state.routeStage !== 'stops') return;
      if (state.incidentState.stage !== 'idle') return;
      if (state.selectedRouteNo !== snapRouteNo || state.selectedTrip !== snapTrip || state.currentStopIdx !== snapIdx) return;
      autoJumpToReturnStartStop();
    });
    return;
  }

  if (state.gpsEnabled) {
    if (idx === 0) {
      stopAllAudio();
      return;
    }
    if (idx === 1) {
      segments.push(buildWelcomeSegment(), buildStopSegment(st), ...getAfterStopSpecialSegments(st));
      playAnnouncementSegments(segments);
      return;
    }
    segments.push(buildStopSegment(st), ...getAfterStopSpecialSegments(st));
    playAnnouncementSegments(segments);
    return;
  }

  if (idx === 0) {
    playAnnouncementSegments([buildWelcomeSegment(), ...getAfterStopSpecialSegments(st)]);
    return;
  }
  segments.push(buildStopSegment(st), ...getAfterStopSpecialSegments(st));
  playAnnouncementSegments(segments);
}

function findReturnTripForCurrent() {
  const curTrip = state.selectedTrip;
  const rno = state.selectedRouteNo || getRouteNo(curTrip);
  if (!rno || !curTrip) return null;

  const curBound = getBound(curTrip);
  const curDestKey = getDestGroupKey(curTrip);
  const curOrigTc = getOrigTc(curTrip);
  const sameRoute = (state.routes || []).filter(r => getRouteNo(r) === rno);
  if (sameRoute.length < 2) return null;

  let cands = sameRoute.filter(r => getBound(r) !== curBound && getDestGroupKey(r) !== curDestKey);
  if (!cands.length) cands = sameRoute.filter(r => getDestGroupKey(r) !== curDestKey);
  if (!cands.length) cands = sameRoute.filter(r => getBound(r) !== curBound);
  if (!cands.length) return null;

  cands.sort((a, b) => {
    const aMatchOrig = curOrigTc && getDestTc(a) === curOrigTc ? 0 : 1;
    const bMatchOrig = curOrigTc && getDestTc(b) === curOrigTc ? 0 : 1;
    if (aMatchOrig !== bMatchOrig) return aMatchOrig - bMatchOrig;
    const aSvc = String(a?.serviceType || a?.service_type || '1') === '1' ? 0 : 1;
    const bSvc = String(b?.serviceType || b?.service_type || '1') === '1' ? 0 : 1;
    return aSvc - bSvc;
  });
  return cands[0];
}

async function autoJumpToReturnStartStop() {
  const returnTrip = findReturnTripForCurrent();
  if (!returnTrip) {
    showToast('已抵達總站（此路線無回程班次）');
    return;
  }
  if (typeof stopGpsTracking === 'function') stopGpsTracking();

  const rno = getRouteNo(returnTrip) || state.selectedRouteNo;
  const bound = getBound(returnTrip);
  state.selectedRouteNo = rno;
  state.selectedBound = getDestGroupKey(returnTrip);
  state.selectedTrip = returnTrip;
  state.selectedTripSeq = 1;
  state.pageOffset = 0;
  state.stopsPage = 0;
  state.currentStopIdx = 0;
  state.lastAnnouncedKey = '';
  state.tripStops = [];

  try {
    const loaded = await ensureStopsLoaded(returnTrip);
    if (Array.isArray(loaded) && loaded.length) {
      state.tripStops = loaded;
    }
  } catch (_) {}

  if (!state.tripStops.length) {
    const tId = returnTrip.tripId || returnTrip.id || returnTrip.routeId || '';
    const byTrip = tId ? state.stopsByTrip?.get(tId) : null;
    const byRB = state.stopsByRouteBound?.get(`${rno}|${bound}`) || state.stopsByRouteBound?.get(`${rno}_${bound}`);
    if (Array.isArray(byTrip) && byTrip.length) state.tripStops = byTrip;
    else if (Array.isArray(byRB) && byRB.length) state.tripStops = byRB;
  }

  state.routeStage = 'start_stop';
  renderAll();
  const destLabel = state.lang === 'en'
    ? (getDestEn(returnTrip) || getDestTc(returnTrip))
    : (getDestTc(returnTrip) || getDestEn(returnTrip));
  showToast(`已抵達總站，自動轉入回程（往 ${destLabel || '回程'}）`);
}

  }
  if (score >= 65) {
    return `<svg class="${sizeClass} shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9.5"/><circle cx="9" cy="10" r="1.25" fill="currentColor" stroke="none"/><circle cx="15" cy="10" r="1.25" fill="currentColor" stroke="none"/><line x1="8.2" y1="15.2" x2="15.8" y2="15.2" stroke-linecap="round"/></svg>`;
  }
  return `<svg class="${sizeClass} shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9.5"/><circle cx="9" cy="10" r="1.25" fill="currentColor" stroke="none"/><circle cx="15" cy="10" r="1.25" fill="currentColor" stroke="none"/><path d="M8 16.6c1-1.9 2.4-2.8 4-2.8s3 .9 4 2.8" stroke-linecap="round"/></svg>`;
}

  return { label: '需改善', en: 'Need Improvement', bg: 'bg-[#ef4444]', text: 'text-white' };

function triggerCleverDriveEvent(kind, severity = 'yellow') {
  const cd = state.cleverDrive;
  const normKind = kind === 'turn' ? 'steer' : kind;

  // 超速：只出提示與聲效，完全唔扣分
  if (normKind === 'overspeed') {
    cd.overspeed++;
    cd.lastEvent = '超速警示 (>70 km/h · 不扣分)';
    cd.warningType = 'overspeed';
    cd.warningLevel = 'speed';
    cd.warningText = cd.lastEvent;
    playGreenroadSound('speed');
    renderTopStatus();
    renderCleverDriveModalContent();
    clearTimeout(window._cdBannerTimer);
    window._cdBannerTimer = setTimeout(() => {
      cd.warningType = '';
      cd.warningLevel = '';
      cd.warningText = '';
      renderCleverDriveBottomWarning();
    }, 3500);
    return;
  }

  const level = severity === 'red' ? 'red' : 'yellow';
  const deduct = level === 'red' ? 5 : 3;
  const levelLabel = level === 'red' ? '紅色警告' : '黃色警告';
  const typeNames = {
    accel: '急加速',
    brake: '急煞車',
    steer: '急轉彎',
    slope: '車身傾側'
  };

  if (normKind === 'accel') cd.harshAccel++;
  else if (normKind === 'brake') cd.harshBrake++;
  else if (normKind === 'steer') cd.sharpTurn++;
  else if (normKind === 'slope') cd.slope++;

  cd.score = Math.max(0, cd.score - deduct);
  cd.lastEvent = `${levelLabel}：${typeNames[normKind] || normKind} (-${deduct}分)`;
  cd.warningType = normKind;
  cd.warningLevel = level;
  cd.warningText = cd.lastEvent;

  playGreenroadSound(level);
  renderTopStatus();
  renderCleverDriveModalContent();

  clearTimeout(window._cdBannerTimer);
  window._cdBannerTimer = setTimeout(() => {
    cd.warningType = '';
    cd.warningLevel = '';
    cd.warningText = '';
    renderCleverDriveBottomWarning();
  }, 3600);
}

// ============ GPS 自動追蹤引擎（離開 A 站後即跳至 B 站並播 B 站） ============
function calcDistanceMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = d => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function stopGpsTracking() {
  if (state.gpsWatchId != null && 'geolocation' in navigator) {
    navigator.geolocation.clearWatch(state.gpsWatchId);
    state.gpsWatchId = null;
  }
}

function startGpsTracking() {
  if (!('geolocation' in navigator)) {
    showToast('此瀏覽器不支援 GPS 定位');
    state.gpsEnabled = false;
    renderAll();
    return;
  }
  stopGpsTracking();
  state.gpsEnabled = true;

  const ARRIVE_RADIUS_M = 45;
  const LEAVE_RADIUS_M = 55;
  const OFFSET_PASS_DELTA = 45;

  state.gpsWatchId = navigator.geolocation.watchPosition(
    pos => {
      const nowMs = Date.now();
      const { latitude, longitude, speed, heading } = pos.coords;
      let effHeading = Number.isFinite(state.gpsHeading) ? state.gpsHeading : 0;
      if (typeof heading === 'number' && Number.isFinite(heading) && heading >= 0 && (speed == null || speed > 0.6)) {
        effHeading = heading;
      } else if (state.lastGpsPos && Number.isFinite(state.lastGpsPos.lat) && Number.isFinite(state.lastGpsPos.lng)) {
        const movedM = calcDistanceMeters(state.lastGpsPos.lat, state.lastGpsPos.lng, latitude, longitude);
        if (movedM >= 3) {
          const toRad = d => d * Math.PI / 180;
          const y = Math.sin(toRad(longitude - state.lastGpsPos.lng)) * Math.cos(toRad(latitude));
          const x = Math.cos(toRad(state.lastGpsPos.lat)) * Math.sin(toRad(latitude)) -
                    Math.sin(toRad(state.lastGpsPos.lat)) * Math.cos(toRad(latitude)) * Math.cos(toRad(longitude - state.lastGpsPos.lng));
          effHeading = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }
      }
      state.gpsHeading = effHeading;
      state.lastGpsPos = { lat: latitude, lng: longitude };
      state.gpsLat = latitude;
      state.gpsLng = longitude;
      const kmh = typeof speed === 'number' && !Number.isNaN(speed) ? Math.round(speed * 3.6) : 0;

      if (state.lastGpsTimeMs > 0) {
        const dtSec = Math.max(0.5, (nowMs - state.lastGpsTimeMs) / 1000);
        const deltaKmh = kmh - state.lastGpsSpeedKmh;
        if (dtSec <= 4 && deltaKmh <= -22) triggerCleverDriveEvent('brake', 'red');
        else if (dtSec <= 4 && deltaKmh <= -14) triggerCleverDriveEvent('brake', 'yellow');
        else if (dtSec <= 4 && deltaKmh >= 22) triggerCleverDriveEvent('accel', 'red');
        else if (dtSec <= 4 && deltaKmh >= 14) triggerCleverDriveEvent('accel', 'yellow');
      }
      if (kmh > 70 && state.lastGpsSpeedKmh <= 70) triggerCleverDriveEvent('overspeed', 'speed');

      state.lastGpsSpeedKmh = kmh;
      state.lastGpsTimeMs = nowMs;
      setVehicleStoppedState(kmh < 3, kmh, false);

      if (state.incidentState.stage !== 'idle') return; // 事故模式下暫停自動報站
      checkLocationSpecialBroadcasts(latitude, longitude);

      if (state.routeStage === 'stops' && state.tripStops.length > 0) {
        const curIdx = state.currentStopIdx;
        const hasNext = curIdx < state.tripStops.length - 1;
        const curSt = state.tripStops[curIdx];
        const prevSt = curIdx > 0 ? state.tripStops[curIdx - 1] : null;
        const nextSt = hasNext ? state.tripStops[curIdx + 1] : null;

        const cLat = getStopLat(curSt);
        const cLng = getStopLng(curSt);

        if (Number.isFinite(cLat) && Number.isFinite(cLng)) {
          const distCur = Math.round(calcDistanceMeters(latitude, longitude, cLat, cLng));
          state.gpsDistanceM = distCur;
          if (distCur < state.gpsMinDistToCur) state.gpsMinDistToCur = distCur;

          if (distCur <= ARRIVE_RADIUS_M) state.gpsArrivedCur = true;

          if (state.gpsArrivedCur) {
            state.stopProgressPct = 100;
          } else if (prevSt) {
            const pLat = getStopLat(prevSt);
            const pLng = getStopLng(prevSt);
            let leg = 450;
            if (Number.isFinite(pLat) && Number.isFinite(pLng)) {
              leg = Math.max(80, Math.round(calcDistanceMeters(pLat, pLng, cLat, cLng)));
            }
            const ratio = Math.max(0, Math.min(1, 1 - distCur / leg));
            state.stopProgressPct = Math.round(15 + ratio * 80);
          } else {
            state.stopProgressPct = 15;
          }

          if (hasNext && nextSt) {
            const nLat = getStopLat(nextSt);
            const nLng = getStopLng(nextSt);
            const hasNextCoord = Number.isFinite(nLat) && Number.isFinite(nLng);
            const distNext = hasNextCoord ? Math.round(calcDistanceMeters(latitude, longitude, nLat, nLng)) : Infinity;
            const legToNext = hasNextCoord ? Math.max(80, Math.round(calcDistanceMeters(cLat, cLng, nLat, nLng))) : 450;

            const standardLeave = state.gpsArrivedCur && distCur >= LEAVE_RADIUS_M;
            const offsetLeave = !state.gpsArrivedCur &&
                                state.gpsMinDistToCur <= 120 &&
                                distCur >= state.gpsMinDistToCur + OFFSET_PASS_DELTA &&
                                distCur >= 65 &&
                                (!hasNextCoord || distNext < legToNext);
            const alreadyAtNext = hasNextCoord && distNext <= ARRIVE_RADIUS_M && distCur > ARRIVE_RADIUS_M;

            if (standardLeave || offsetLeave || alreadyAtNext) {
              state.currentStopIdx = curIdx + 1;
              state.stopsPage = 0;
              state.etaMap = {};
              state.gpsArrivedCur = alreadyAtNext;
              state.gpsMinDistToCur = alreadyAtNext ? distNext : Infinity;
              state.gpsDistanceM = hasNextCoord ? distNext : null;
              state.stopProgressPct = alreadyAtNext ? 100 : 15;
              renderAll();
              triggerStopAnnouncement(state.currentStopIdx);
              return;
            }
          }
        }
      }

      if (typeof updateTrainingMapGps === 'function') updateTrainingMapGps(latitude, longitude, effHeading);
      if (typeof syncStopArrivalSkin === 'function') {
        syncStopArrivalSkin();
      } else {
        const distEl = document.getElementById('etaCurDist');
  const arrowEl = document.getElementById('etaCurArrow');
        if (distEl && state.gpsEnabled && state.gpsDistanceM != null) {
          distEl.textContent = formatDistanceLabel(state.gpsDistanceM);
        }
        const bar = document.getElementById('stopProgressFill');
        if (bar) bar.style.width = `${state.stopProgressPct}%`;
      }
      if (state.routeStage === 'stops') refreshRouteEtas(false);
    },
    err => {
      if (err.code === 1) {
        showToast('請允許瀏覽器存取 GPS 權限，已切回手動模式');
        state.gpsEnabled = false;

function findStudioTripRecordForWeb(trip) {
  if (!trip) return null;
  if (trip._studioTripRec) return trip._studioTripRec;
  const map = state.studioTripNames;
  if (!map || typeof map !== 'object') return null;
  const rno = getRouteNo(trip);
  const bnd = getBound(trip);
  const patId = String(trip?.patternId ?? '').trim();
  const svc = String(trip?.serviceType || trip?.service_type || '1').trim();
  const tryKeys = [
    trip.tripKey,
    patId ? `${rno}|${bnd}|${patId}` : '',
    !patId ? `${rno}|${bnd}|${svc}` : '',
    !patId ? `${rno}_${bnd}_${svc}` : ''
  ].filter(Boolean);
  for (const k of tryKeys) {
    if (map[k] && typeof map[k] === 'object') return map[k];
  }
  return Object.values(map).find(v => {
    if (!v || v.isManual) return false;
    if (String(v.routeId || '').trim().toUpperCase() !== rno) return false;
    if (String(v.bound || '').trim().toUpperCase() !== bnd) return false;
    const vPat = String(v.patternId ?? '').trim();
    if (patId || vPat) return vPat === patId;
    return String(v.serviceType || '1').trim() === svc;
  }) || null;
}

async function ensureStopsLoaded(trip) {
  if (!state.stopsLoaded) {
    const vp = document.getElementById('mainViewport');
    if (vp) renderInFrameDiagnostic(vp, `LOADING ROUTE ${getRouteNo(trip)} DATA...`);
    const res = await fetch('./data/stops.json');
    if (!res.ok) throw new Error('無法載入站點資料庫');
    const rawStops = await res.json();
    const arr = Array.isArray(rawStops) ? rawStops : [];

    state.audioByStopName.clear();
    state.audioByBaseName.clear();
    state.apiStopById = new Map();

    for (const s of arr) {
      const sid = String(s.stopId || '').trim();
      const nid = sid.replace(/^0+/, '');
      if (sid && !state.apiStopById.has(sid)) state.apiStopById.set(sid, s);
      if (nid && !state.apiStopById.has(nid)) state.apiStopById.set(nid, s);

      const k1 = `${s.routeId || ''}|${String(s.bound || '').toUpperCase()}|${s.patternId || ''}`;
      if (!state.stopsByTrip.has(k1)) state.stopsByTrip.set(k1, []);
      state.stopsByTrip.get(k1).push(s);

      const k2 = `${s.routeId || ''}|${String(s.bound || '').toUpperCase()}`;
      if (!state.stopsByRouteBound.has(k2)) state.stopsByRouteBound.set(k2, []);
      state.stopsByRouteBound.get(k2).push(s);

      if (s.stopAudioFile) {
        const tc = getStopNameTc(s);
        const en = normStopName(tc);
        const bn = normBaseName(tc);
        if (en && !state.audioByStopName.has(en)) state.audioByStopName.set(en, s.stopAudioFile);
        if (bn && bn.length >= 2 && !state.audioByBaseName.has(bn)) state.audioByBaseName.set(bn, s.stopAudioFile);
      }
    }
    for (const list of state.stopsByTrip.values()) list.sort((a, b) => (a.seq ?? 0) - (b.seq ?? 0));

    state.stopsLoaded = true;
  }

  // 若 Studio 有自訂／修改此班次嘅車站與分段收費，直接由 API 車站庫組裝
  const sRec = findStudioTripRecordForWeb(trip);
  if (sRec && Array.isArray(sRec.customStops)) {
    const rIdFull = trip.routeId || `CTB-${getRouteNo(trip)}`;
    const bnd = getBound(trip);
    const pat = trip.patternId || sRec.tripKey || '';
    return sRec.customStops.map((item, idx) => {
      const sid = String(item.stopId || '').trim();
      const nid = sid.replace(/^0+/, '');
      const base = state.apiStopById?.get(sid) || state.apiStopById?.get(nid) || item.apiStopMeta || {};
      return {
        ...base,
        routeId: rIdFull,
        bound: bnd,
        patternId: pat,
        seq: idx + 1,
        stopId: sid,
        nameTc: base.nameTc || item.apiStopMeta?.nameTc || sid,
        subNameTc: base.subNameTc || base.subTc || item.apiStopMeta?.subTc || '',
        nameEn: base.nameEn || item.apiStopMeta?.nameEn || '',
        nameSc: base.nameSc || item.apiStopMeta?.nameSc || '',
        lat: base.lat ?? item.apiStopMeta?.lat ?? null,
        lng: base.lng ?? item.apiStopMeta?.lng ?? null,
        sectionFare: (item.sectionFare != null && item.sectionFare !== '') ? Number(item.sectionFare) : null,
        section: (item.section != null && item.section !== '') ? Number(item.section) : null
      };
    });
  }

  const keyExact = `${trip.routeId || ''}|${getBound(trip)}|${trip.patternId || ''}`;
  let stops = state.stopsByTrip.get(keyExact);
  if (!stops || stops.length === 0) {
    const keyFallback = `${trip.routeId || ''}|${getBound(trip)}`;
    const allForBound = state.stopsByRouteBound.get(keyFallback) || [];
    if (allForBound.length > 0) {
      const firstPat = allForBound[0].patternId || '';
      stops = allForBound.filter(x => (x.patternId || '') === firstPat).sort((a, b) => (a.seq ?? 0) - (b.seq ?? 0));
    }
  }
  return stops || [];
}

function clearAnnAutoPlayTimers() {
  if (annAutoPlayTimer) { clearTimeout(annAutoPlayTimer); annAutoPlayTimer = null; }
  if (annCountdownInterval) { clearInterval(annCountdownInterval); annCountdownInterval = null; }
}

function closeNumModal() {
  clearAnnAutoPlayTimers();
  document.getElementById('numModal').classList.add('hidden');
}

function openNumericModal(opts) {
  clearAnnAutoPlayTimers();
  const modal = document.getElementById('numModal');
  const titleEl = document.getElementById('numModalTitle');
  const subEl = document.getElementById('numModalSub');
  const dispEl = document.getElementById('numModalDisplay');
  const hintEl = document.getElementById('numModalHint');
  const gridEl = document.getElementById('numModalGrid');

  let value = opts.initialValue || '';
  titleEl.textContent = opts.title || '輸入數字';
  subEl.textContent = opts.subtitle || '';

  const updateView = () => {
    dispEl.textContent = opts.mask ? '●'.repeat(value.length) : value;
    if (opts.onChange) opts.onChange(value, hintEl, closeNumModal);
  };

  const keys = ['1','2','3','4','5','6','7','8','9','X','0','✓'];
  gridEl.innerHTML = keys.map(k => {
    let cls = 'bg-zinc-800 border-zinc-600 text-white active:bg-[#007AFF]';
    if (k === 'X') cls = 'bg-red-700 border-red-500 text-white active:brightness-90';
    if (k === '✓') cls = 'bg-emerald-600 border-emerald-500 text-white active:brightness-90';
    return `<button data-nk="${k}" class="num-key h-14 rounded-xl border font-black text-2xl ${cls}">${k}</button>`;
  }).join('');

  gridEl.querySelectorAll('.num-key').forEach(btn => {
    btn.onclick = () => {
      const k = btn.dataset.nk;
      if (k === 'X') {
        value = '';
        updateView();
      } else if (k === '✓') {
        clearAnnAutoPlayTimers();
        if (opts.onConfirm) opts.onConfirm(value, hintEl, closeNumModal);
      } else if (value.length < (opts.maxLen || 5)) {
        value += k;
        updateView();
      }
    };
  });

  document.getElementById('btnCloseNumModal').onclick = closeNumModal;
  hintEl.textContent = opts.initialHint || '';
  updateView();
  modal.classList.remove('hidden');
}

// 3) 特別廣播數字鍵盤（輸入編號後 3 秒自動播放，播完跳回路線）
function openAnnounceKeypadModal() {
  openNumericModal({
    title: '輸入特別訊息編號',
    subtitle: '輸入編號後系統將於 3 秒後自動播放，播畢自動返回路線畫面',
    maxLen: 3,
    initialHint: '請輸入特別訊息編號（例如 1、33）',
    onChange: (val, hintEl, close) => {
      clearAnnAutoPlayTimers();
      if (!val) {
        hintEl.textContent = '請輸入特別訊息編號';
        return;
      }
      const numVal = String(Number(val));
      const item = state.announcements.find(a => String(a.code) === val || String(Number(a.code)) === numVal);
      if (!item) {
        hintEl.textContent = `找不到編號 #${val} 的特別訊息`;
        return;
      }
      const title = state.lang === 'en' ? (item.titleEn || item.titleTc) : (item.titleTc || item.titleEn);
      let remain = 3;
      hintEl.textContent = `#${item.code} ${title}（${remain} 秒後自動播放）`;
      annCountdownInterval = setInterval(() => {
        remain--;
        if (remain > 0) hintEl.textContent = `#${item.code} ${title}（${remain} 秒後自動播放）`;
      }, 1000);
      annAutoPlayTimer = setTimeout(() => {
        close();
        playSpecialAnnouncementByItem(item);
      }, 3000);
    },
    onConfirm: (val, hintEl, close) => {
      if (!val) { close(); return; }
      const numVal = String(Number(val));
      const item = state.announcements.find(a => String(a.code) === val || String(Number(a.code)) === numVal);
      if (!item) {
        hintEl.textContent = `找不到編號 #${val} 的特別訊息`;
        playAlertBeep(false);
        return;
      }
      close();
      playSpecialAnnouncementByItem(item);
    }
  });
}

    renderAnnounceView(vp, bar);
  } else if (state.currentTab === 'message') {
    renderMessageView(vp, bar);
  } else if (state.currentTab === 'incident') {
    renderIncidentView(vp, bar);
  } else {
    renderSettingsView(vp, bar);
  }
}

const LECIP_KEYPAD_SPEC = [
  { digit: '1', letters: ['A', 'B', 'C'] },
  { digit: '2', letters: ['D', 'E', 'F'] },
  { digit: '3', letters: ['G', 'H', 'I'] },
  { digit: '4', letters: ['J', 'K', 'L'] },
  { digit: '5', letters: ['M', 'N', 'O'] },
  { digit: '6', letters: ['P', 'Q', 'R'] },
  { digit: '7', letters: ['S', 'T', 'U'] },
  { digit: '8', letters: ['V', 'W', 'X'] },
  { digit: '9', letters: ['Y', 'Z'] },
  { digit: '0', letters: ['.'] }
];

function renderLecipInlineKeypadHtml(activeDigit = null) {
  return `
    <div class="grid grid-cols-5 bg-[#0057d8] gap-[1px] border-t border-[#0044aa] shrink-0 select-none">
      ${LECIP_KEYPAD_SPEC.map(k => {
        const isHeld = activeDigit === k.digit;
        const sub = k.letters.join('');
        return `
          <button data-kdigit="${k.digit}"
                  class="lecip-kb-key h-[52px] flex flex-col items-center justify-center leading-none transition-colors ${isHeld ? 'bg-[#3b3a36] text-[#0070ff]' : 'bg-[#0074f0] active:bg-[#0058bd] text-white'}">
            <span class="text-[24px] font-black leading-none">${k.digit}</span>
            <span class="text-[11px] font-black tracking-wider mt-0.5">${sub}</span>
          </button>
        `;
      }).join('')}
    </div>
  `;
}

function bindLecipInlineKeypad(container, onDigit, onLongPressDigit) {
  container.querySelectorAll('.lecip-kb-key').forEach(btn => {
    const digit = btn.dataset.kdigit;
    let holdTimer = null;
    let heldFired = false;

    const startHold = e => {
      if (e.type === 'mousedown' && e.button !== 0) return;
      heldFired = false;
      clearTimeout(holdTimer);
      if (onLongPressDigit) {
        holdTimer = setTimeout(() => {
          heldFired = true;
          onLongPressDigit(digit);
        }, 380);
      }
    };
    const cancelHold = () => {
      clearTimeout(holdTimer);
    };

    btn.addEventListener('mousedown', startHold);
    btn.addEventListener('touchstart', startHold, { passive: true });
    btn.addEventListener('mouseup', cancelHold);
    btn.addEventListener('mouseleave', cancelHold);
    btn.addEventListener('touchend', cancelHold);
    btn.addEventListener('touchcancel', cancelHold);

    btn.addEventListener('contextmenu', e => {
      if (!onLongPressDigit) return;
      e.preventDefault();
      clearTimeout(holdTimer);
      onLongPressDigit(digit);
    });

    btn.addEventListener('click', () => {
      if (heldFired) {
        heldFired = false;
        return;
      }
      onDigit(digit);
    });
  });
}

    if (!state.routeKbOpen) {
      state.routeKbOpen = true;
      state.routeLetterKey = null;

  // 退格掣（短按刪一字，長按全部清除）
  const bsBtn = document.getElementById('btnRouteBackspace');
  let bsTimer = null;
  let bsHeld = false;
  const startBs = () => {
    bsHeld = false;
    clearTimeout(bsTimer);
    bsTimer = setTimeout(() => {
      bsHeld = true;
      state.searchQuery = '';
      state.routeLetterKey = null;
      state.pageOffset = 0;
      renderMain();
    }, 450);
  };
  const stopBs = () => clearTimeout(bsTimer);
  bsBtn.addEventListener('mousedown', startBs);
  bsBtn.addEventListener('touchstart', startBs, { passive: true });
  bsBtn.addEventListener('mouseup', stopBs);
  bsBtn.addEventListener('mouseleave', stopBs);
  bsBtn.addEventListener('touchend', stopBs);
  bsBtn.onclick = () => {
    if (bsHeld) { bsHeld = false; return; }
    if (state.routeLetterKey) {
      state.routeLetterKey = null;
      renderMain();
      return;
    }
    if (state.searchQuery.length > 0) {
      state.searchQuery = state.searchQuery.slice(0, -1);
      state.pageOffset = 0;
      renderMain();

  };

  const resetBtn = document.getElementById('btnResetSearch');
  if (resetBtn) resetBtn.onclick = () => { state.searchQuery = ''; state.routeLetterKey = null; state.pageOffset = 0; renderMain(); };

  // 綁定展開字母列

function getStudioTripLabel(t, globalIdx) {
  const recFromObj = t?._studioTripRec || findStudioTripRecordForWeb(t);
  const rno = getRouteNo(t);
  const bound = getBound(t);
  const patId = String(t?.patternId ?? '').trim();
  const seqStr = String((globalIdx ?? 0) + 1);
  const svcStr = String(t?.serviceType || t?.service_type || seqStr).trim();
  const destTc = getDestTc(t);
  const destEn = getDestEn(t);
  const baseTcSeq = `${rno}-${destTc || '班次'}-${seqStr}`;
  const baseTcSvc = `${rno}-${destTc || '班次'}-${svcStr}`;

  let rec = recFromObj;
  const map = state.studioTripNames;
  if (!rec && map && typeof map === 'object') {
    const tryKeys = [
      t?.tripKey,
      patId ? `${rno}|${bndKey(bound)}|${patId}` : '',
      !patId ? `${rno}|${bound}|${svcStr}` : '',
      !patId ? `${rno}|${bound}|${seqStr}` : ''
    ].filter(Boolean);
    for (const k of tryKeys) {
      if (map[k] && typeof map[k] === 'object') { rec = map[k]; break; }
    }
    if (!rec) {
      const vals = Object.values(map);
      rec = vals.find(v => v && (v.defaultName === baseTcSeq || v.name === baseTcSeq || (!patId && (v.defaultName === baseTcSvc || v.name === baseTcSvc))));
    }
  }

  if (rec) {
    if (rec.labelCleared) return '';
    if (typeof rec.tripLabel === 'string' && rec.tripLabel.trim()) return rec.tripLabel.trim();
    if (rec.tripType === 'normal') return '正常路線';
    if (rec.tripType === 'express') return '特快班次';
    if (rec.tripType === 'special_via') return rec.viaText ? `特別班次經${rec.viaText}` : '特別班次';
    if (rec.name && rec.defaultName && rec.name !== rec.defaultName) {
      const pfx = `${rno}-${destTc || destEn || ''}-`;
      return rec.name.startsWith(pfx) ? rec.name.slice(pfx.length).trim() : rec.name.trim();
    }
  }
  return '';
}
function bndKey(b) { return String(b || 'O').trim().toUpperCase(); }

function stripAfterComma(str) {
  const s = String(str || '').trim();
  if (!s) return '';
  return s.split(/[,，]/)[0].trim();
}

function getLecipStopDisplayName(st) {
  if (!st) return '';
  const rawName = state.lang === 'en'
    ? (getStopNameEn(st) || getStopNameTc(st))
    : getStopNameTc(st);
  return stripAfterComma(rawName);
}
