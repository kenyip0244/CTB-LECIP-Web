<script>
const AUDIO_CDN_BASE = 'https://kenyip0244.github.io/CTB-LECIP-Audio';
const PAGE_SIZE = 5;

function detectInitialTheme() {
  try {
    const saved = localStorage.getItem('ctb_lecip_theme');
    if (saved === 'day' || saved === 'night') return saved;
  } catch (_) {}
  const hr = new Date().getHours();
  return (hr >= 6 && hr < 19) ? 'day' : 'night';
}

const state = {
  lang: 'tc',
  theme: detectInitialTheme(), // 'day' | 'night'
  driverId: '0001 KEN YIP',
  octopusMode: 0,
  isStopped3s: true,
  gpsEnabled: false,
  gpsWatchId: null,
  gpsSpeedKmh: 0,
  lastGpsSpeedKmh: 0,
  lastGpsTimeMs: 0,
  gpsDistanceM: null,
  stopProgressPct: 25,
  volume: 1.0,
  brightness: 1.0,

  // 智駕全城 (Clever Driving) 狀態
  cleverDrive: {
    score: 100,
    harshAccel: 0,
    harshBrake: 0,
    sharpTurn: 0,
    overspeed: 0,
    lastEvent: '駕駛表現優良',
    warningText: '',
    warningLevel: '' // '' | 'warn' | 'danger'
  },

  currentTab: 'route',
  routeStage: 'route',
  pageOffset: 0,
  announcePage: 0,
  searchQuery: '',

  routes: [],
  uniqueRouteNos: [],
  announcements: [],
  stopsLoaded: false,
  stopsByTrip: new Map(),
  stopsByRouteBound: new Map(),
  audioByStopName: new Map(),
  audioByBaseName: new Map(),
  audioManifest: [],
  audioStemMap: new Map(),

  selectedRouteNo: '',
  selectedBound: '',
  selectedTrip: null,
  selectedTripSeq: 1,
  tripStops: [],
  currentStopIdx: 0,
  lastAnnouncedKey: '',

  dismissedPopup: false,
  messages: [
    {
      id: 1,
      time: '20:10',
      sender: '車務控制中心',
      title: '系統已就緒',
      body: '城巴報站、HKOWS 同站名語音及智駕全城系統已連線。',
      unread: true
    },
    {
      id: 2,
      time: '19:45',
      sender: '港島區車務部',
      title: '安全駕駛提示',
      body: '駛經繁忙路段及轉車站時，請保持安全車距並留意智駕提示。',
      unread: true
    }
  ],
  incidents: []
};

let currentAudio = null;
let audioPlaySeqId = 0;

function isNight() {
  return state.theme === 'night';
}

function esc(v) {
  return String(v ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function showToast(msg) {
  const el = document.getElementById('toastBox');
  if (!el) return;
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.add('hidden'), 2200);
}

// ============ 資料欄位相容解析工具 ============
function cleanJointName(raw) {
  const s = String(raw || '').trim();
  if (!s || !s.includes('/')) return s;
  const parts = s.split(/\s*\/\s*/).map(p => p.trim()).filter(Boolean);
  if (parts.length !== 2) return s;
  const [p1, p2] = parts;
  if (/^(G|UG|LG|M|B\d?|\d+)$/i.test(p1) && /^F$/i.test(p2)) return s;
  if (p1.length <= 1 || p2.length <= 1) return s;
  const norm = x => x.toLowerCase().replace(/[\s\-\(\)（）]/g, '');
  if (norm(p1) === norm(p2)) return p2;
  if (/\/\s+/.test(s) || (p1 === p1.toUpperCase() && p2 !== p2.toUpperCase())) return p2;
  return s;
}

function normStopName(raw) {
  return cleanJointName(raw).replace(/[\s,，\.。\-－·・]/g, '').toLowerCase();
}
function normBaseName(raw) {
  return cleanJointName(raw).replace(/[\(（][^\)）]*[\)）]/g, '').replace(/[\s,，\.。\-－·・]/g, '').toLowerCase();
}

function getRouteNo(r) {
  return String(r?.routeNo || r?.route || r?.lineNo || String(r?.routeId || '').replace(/^CTB-/i, '') || '').trim().toUpperCase();
}
function getBound(r) {
  return String(r?.bound || r?.dir || r?.direction || 'O').trim().toUpperCase();
}
function getOrigTc(r) {
  return cleanJointName(r?.origTc || r?.originTc || r?.fromTc || r?.orig_tc || r?.startTc || r?.orig || r?.origin || '');
}
function getDestTc(r) {
  return cleanJointName(r?.destTc || r?.destinationTc || r?.toTc || r?.dest_tc || r?.endTc || r?.dest || r?.destination || '');
}
function getOrigEn(r) {
  return cleanJointName(r?.origEn || r?.originEn || r?.fromEn || r?.orig_en || r?.startEn || '');
}
function getDestEn(r) {
  return cleanJointName(r?.destEn || r?.destinationEn || r?.toEn || r?.dest_en || r?.endEn || '');
}
function getDestGroupKey(r) {
  return getDestTc(r) || getDestEn(r) || getBound(r);
}
// 只回傳真正有意義嘅班次備註；唔再重複輸出「往 XXX（班次 1）」
function getRealTripRemark(r) {
  const raw = state.lang === 'en'
    ? cleanJointName(r?.descEn || r?.remarksEn || r?.patternDescEn || r?.serviceTypeNameEn || r?.viaEn || r?.remarkEn || '')
    : cleanJointName(r?.descTc || r?.remarksTc || r?.patternDescTc || r?.serviceTypeNameTc || r?.viaTc || r?.remarkTc || r?.remark || '');
  if (!raw) return '';
  const dest = state.lang === 'en' ? getDestEn(r) : getDestTc(r);
  if (dest && normStopName(raw) === normStopName(dest)) return '';
  if (/^往\s*.+（班次\s*\d+）$/.test(raw)) return '';
  return raw;
}
function getTripFareNum(r) {
  const f = r?.fare ?? r?.fullFare ?? r?.price;
  if (f == null || f === '') return null;
  const n = Number(String(f).replace(/^\$/, ''));
  return Number.isFinite(n) && n > 0 ? n : null;
}
function fmtFare(n) {
  if (n == null || !Number.isFinite(Number(n))) return '';
  return `$${Number(n).toFixed(1)}`;
}
function getStopNameTc(s) {
  return cleanJointName(s?.nameTc || s?.stopNameTc || s?.name_tc || s?.tc || s?.name || '未命名車站');
}
function getStopNameEn(s) {
  return cleanJointName(s?.nameEn || s?.stopNameEn || s?.name_en || s?.en || '');
}
// 中文模式下絕不顯示車站英文名！
function getStopSub(s) {
  if (state.lang === 'en') return '';
  const loc = cleanJointName(s?.roadTc || s?.locationTc || s?.subTc || '');
  if (!loc) return '';
  if (normStopName(loc) === normStopName(getStopNameTc(s))) return '';
  return loc;
}
function getStopLat(s) {
  return Number(s?.lat ?? s?.latitude ?? s?.y);
}
function getStopLng(s) {
  return Number(s?.lng ?? s?.lon ?? s?.longitude ?? s?.x);
}

// 計算每一站嘅分段編號與分段車費（綠色價錢標誌只顯示在有分段收費起點/變動嘅指定車站）
function computeTripSections(stops, trip) {
  const baseFare = getTripFareNum(trip);
  let curSec = 1;
  let curFare = baseFare;
  return (stops || []).map((st, idx) => {
    const rawStopFare = st?.sectionFare ?? st?.fare ?? st?.price;
    const stopFareNum = (rawStopFare != null && rawStopFare !== '' && Number.isFinite(Number(String(rawStopFare).replace(/^\$/, ''))))
      ? Number(String(rawStopFare).replace(/^\$/, ''))
      : null;
    const explicitSec = st?.section ?? st?.fareStage;

    let isSectionChange = false;
    if (idx === 0) {
      curFare = stopFareNum ?? baseFare;
      curSec = explicitSec ? Number(explicitSec) || 1 : 1;
      isSectionChange = curFare != null;
    } else if (stopFareNum != null && (curFare == null || Math.abs(stopFareNum - curFare) >= 0.05)) {
      curFare = stopFareNum;
      curSec = explicitSec ? Number(explicitSec) || (curSec + 1) : (curSec + 1);
      isSectionChange = true;
    } else if (explicitSec && Number(explicitSec) > curSec) {
      curSec = Number(explicitSec);
      isSectionChange = curFare != null;
    }

    return {
      sectionNo: curSec,
      activeFare: curFare,
      badgeFare: isSectionChange ? curFare : null
    };
  });
}

// 跨路線按站名尋找 HKOWS 音檔
function getEffectiveStopAudio(st) {
  if (!st) return '';
  if (st.stopAudioFile) return st.stopAudioFile;
  const tc = getStopNameTc(st);
  const en = normStopName(tc);
  if (en && state.audioByStopName.has(en)) return state.audioByStopName.get(en);
  const bn = normBaseName(tc);
  if (bn && bn.length >= 2 && state.audioByBaseName.has(bn)) return state.audioByBaseName.get(bn);
  if (st.stopId) {
    const guess = `${String(st.stopId).replace(/^0+/, '')}_a`.toLowerCase();
    if (state.audioStemMap.has(guess)) return state.audioStemMap.get(guess);
  }
  return '';
}

function compareRouteNo(a, b) {
  const parse = s => {
    const m = s.match(/^([A-Z]*)(\d+)([A-Z]*)$/);
    if (!m) return { hasPrefix: 2, prefix: s, num: 99999, suffix: '' };
    return { hasPrefix: m[1] ? 1 : 0, prefix: m[1], num: parseInt(m[2], 10), suffix: m[3] };
  };
  const pa = parse(a);
  const pb = parse(b);
  if (pa.hasPrefix !== pb.hasPrefix) return pa.hasPrefix - pb.hasPrefix;
  if (pa.prefix !== pb.prefix) return pa.prefix.localeCompare(pb.prefix);
  if (pa.num !== pb.num) return pa.num - pb.num;
  return pa.suffix.localeCompare(pb.suffix);
}

// ============ 音檔播放與 Google TTS 引擎 ============
function stopAllAudio() {
  audioPlaySeqId++;
  if (currentAudio) {
    try { currentAudio.pause(); } catch (_) {}
    currentAudio = null;
  }
  if ('speechSynthesis' in window) {
    try { window.speechSynthesis.cancel(); } catch (_) {}
  }
}

function buildAudioUrl(relPath) {
  const clean = String(relPath || '').replace(/\\/g, '/').replace(/^\/+/, '').replace(/\.wav$/i, '.mp3');
  if (!clean) return '';
  if (/^https?:\/\//i.test(clean)) return clean;
  const encoded = clean.split('/').filter(Boolean).map(seg => encodeURIComponent(seg)).join('/');
  return `${AUDIO_CDN_BASE}/${encoded}`;
}

function resolveManifestPath(rawPath) {
  if (!rawPath) return '';
  const clean = String(rawPath).replace(/\\/g, '/').replace(/^\/+/, '').replace(/\.wav$/i, '.mp3');
  if (state.audioManifest.includes(clean)) return clean;
  const stem = clean.split('/').pop().replace(/\.[^.]+$/, '').toLowerCase();
  const candidates = [stem];
  if (/^\d+$/.test(stem)) candidates.push(stem.padStart(2, '0'), stem.replace(/^0+/, ''));
  for (const c of candidates) {
    if (c && state.audioStemMap.has(c)) return state.audioStemMap.get(c);
  }
  const noSuffix = stem.replace(/_[ab]$/i, '');
  if (noSuffix && state.audioStemMap.has(noSuffix + '_a')) return state.audioStemMap.get(noSuffix + '_a');
  if (noSuffix && state.audioStemMap.has(noSuffix + '_b')) return state.audioStemMap.get(noSuffix + '_b');
  return clean;
}

function buildGoogleTtsUrl(text, tl) {
  const q = String(text || '').trim().slice(0, 180);
  if (!q) return '';
  return `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=${encodeURIComponent(tl)}&q=${encodeURIComponent(q)}`;
}

function playUrlListAsync(urls, seqToken) {
  return new Promise(resolve => {
    if (!urls || urls.length === 0 || seqToken !== audioPlaySeqId) {
      resolve(false);
      return;
    }
    let playedAny = false;
    let idx = 0;
    const next = () => {
      if (seqToken !== audioPlaySeqId || idx >= urls.length) {
        resolve(playedAny);
        return;
      }
      const url = urls[idx++];
      const audio = new Audio(url);
      audio.volume = state.volume;
      currentAudio = audio;
      let settled = false;
      const advance = () => {
        if (settled) return;
        settled = true;
        next();
      };
      audio.onended = advance;
      audio.onerror = advance;
      audio.play().then(() => { playedAny = true; }).catch(advance);
    };
    next();
  });
}

function speakWebSpeechAsync(tcText, enText, scText, seqToken) {
  return new Promise(resolve => {
    if (!('speechSynthesis' in window) || seqToken !== audioPlaySeqId) {
      resolve();
      return;
    }
    try {
      window.speechSynthesis.cancel();
      const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
      const pickGoogleVoice = (langPrefix) =>
        voices.find(v => /google/i.test(v.name) && v.lang.toLowerCase().startsWith(langPrefix)) ||
        voices.find(v => v.lang.toLowerCase().startsWith(langPrefix)) ||
        null;

      const items = [];
      if (tcText) items.push({ text: tcText, lang: 'zh-HK', voice: pickGoogleVoice('zh-hk') || pickGoogleVoice('yue') });
      if (enText) items.push({ text: enText, lang: 'en-GB', voice: pickGoogleVoice('en-gb') || pickGoogleVoice('en') });
      if (scText) items.push({ text: scText, lang: 'zh-CN', voice: pickGoogleVoice('zh-cn') });
      if (items.length === 0) { resolve(); return; }

      let idx = 0;
      const speakNext = () => {
        if (seqToken !== audioPlaySeqId || idx >= items.length) { resolve(); return; }
        const it = items[idx++];
        const u = new SpeechSynthesisUtterance(it.text);
        u.lang = it.lang;
        if (it.voice) u.voice = it.voice;
        u.volume = state.volume;
        u.onend = speakNext;
        u.onerror = speakNext;
        window.speechSynthesis.speak(u);
      };
      speakNext();
    } catch (_) {
      resolve();
    }
  });
}

async function playSingleSegment(relPaths, fallbackTc, fallbackEn, fallbackSc, seqToken) {
  if (seqToken !== audioPlaySeqId) return;
  const urls = Array.from(new Set(
    (relPaths || [])
      .filter(Boolean)
      .map(p => buildAudioUrl(resolveManifestPath(p)))
      .filter(Boolean)
  ));
  if (urls.length > 0) {
    const ok = await playUrlListAsync(urls, seqToken);
    if (ok || seqToken !== audioPlaySeqId) return;
  }
  const ttsUrls = [
    fallbackTc ? buildGoogleTtsUrl(fallbackTc, 'yue') : '',
    fallbackEn ? buildGoogleTtsUrl(fallbackEn, 'en') : '',
    fallbackSc ? buildGoogleTtsUrl(fallbackSc, 'zh-CN') : ''
  ].filter(Boolean);
  const ttsOk = await playUrlListAsync(ttsUrls, seqToken);
  if (!ttsOk && seqToken === audioPlaySeqId) {
    await speakWebSpeechAsync(fallbackTc, fallbackEn, fallbackSc, seqToken);
  }
}

async function playAnnouncementSegments(segments) {
  stopAllAudio();
  const seqToken = audioPlaySeqId;
  for (const seg of (segments || [])) {
    if (seqToken !== audioPlaySeqId) break;
    await playSingleSegment(seg.files, seg.tc, seg.en, seg.sc, seqToken);
  }
}

function playAudioSequence(relPaths, fallbackTc, fallbackEn, fallbackSc = '') {
  playAnnouncementSegments([{ files: relPaths, tc: fallbackTc, en: fallbackEn, sc: fallbackSc }]);
}

function getWelcomeAudioFile() {
  const firstStop = state.tripStops[0];
  if (firstStop && firstStop.stopAudioFile) {
    const stem = String(firstStop.stopAudioFile).split('/').pop().replace(/\.[^.]+$/, '').toLowerCase();
    // 只有非純數字站點編號（例如 102_mef、9_sho_1、15_pea）才屬於 HOF 歡迎詞音檔
    if (stem && !/^\d+_[a-z]$/i.test(stem)) {
      return firstStop.stopAudioFile;
    }
  }
  const routeNo = String(state.selectedRouteNo || '').toLowerCase();
  if (routeNo && state.audioStemMap.size > 0) {
    const prefix = routeNo + '_';
    const matches = [];
    for (const [stem, path] of state.audioStemMap.entries()) {
      if (stem.startsWith(prefix) && !/^\d+_[a-z]$/i.test(stem)) {
        matches.push(path);
      }
    }
    if (matches.length === 1) return matches[0];
  }
  return '';
}

function buildWelcomeSegment() {
  const trip = state.selectedTrip || {};
  const routeNo = state.selectedRouteNo || getRouteNo(trip);
  const destTc = getDestTc(trip) || state.selectedBound || '終點站';
  const destEn = getDestEn(trip) || destTc;
  const wFile = getWelcomeAudioFile();
  return {
    files: wFile ? [wFile] : [],
    tc: `歡迎乘搭城巴 ${routeNo} 號線，前往 ${destTc}，祝旅途愉快。`,
    en: `Welcome aboard Citybus route ${routeNo} towards ${destEn}. Thank you and enjoy the journey.`,
    sc: `欢迎乘坐城巴第 ${routeNo} 路，前往 ${destTc}，祝您旅途愉快。`
  };
}

function buildStopSegment(st) {
  const files = [];
  const mainAudio = getEffectiveStopAudio(st);
  if (mainAudio) files.push(mainAudio);
  if (st.approachAudioFile) files.push(st.approachAudioFile);
  const tcName = getStopNameTc(st);
  const enName = getStopNameEn(st);
  return {
    files,
    tc: `下一站，${tcName}`,
    en: enName ? `Next stop, ${enName}` : '',
    sc: `下一站，${tcName}`
  };
}

function triggerStopAnnouncement(idx, force = false) {
  const st = state.tripStops[idx];
  if (!st) return;
  const modeTag = state.gpsEnabled ? 'auto' : 'manual';
  const key = `${state.selectedTrip?.routeId || ''}|${state.selectedTrip?.bound || ''}|${modeTag}|${idx}`;
  if (!force && state.lastAnnouncedKey === key) return;
  state.lastAnnouncedKey = key;

  // 自動模式：第 1 站冇聲；第 2 站先播歡迎詞再播第 2 個站名
  if (state.gpsEnabled) {
    if (idx === 0) {
      stopAllAudio();
      return;
    }
    if (idx === 1) {
      playAnnouncementSegments([buildWelcomeSegment(), buildStopSegment(st)]);
      return;
    }
    playAnnouncementSegments([buildStopSegment(st)]);
    return;
  }

  // 手動模式：第 1 站播歡迎詞；第 2 站起播站名
  if (idx === 0) {
    playAnnouncementSegments([buildWelcomeSegment()]);
    return;
  }
  playAnnouncementSegments([buildStopSegment(st)]);
}

// ============ 智駕全城 (Clever Driving) 引擎 ============
function playAlertBeep(isDanger = false) {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = isDanger ? 960 : 720;
    gain.gain.value = 0.14 * state.volume;
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    setTimeout(() => {
      osc.stop();
      ctx.close().catch(() => {});
    }, isDanger ? 260 : 160);
  } catch (_) {}
}

function getCleverDriveGrade(score) {
  if (score >= 85) return { face: '☺', label: '好', en: 'Good', bg: 'bg-emerald-500', text: 'text-black', ring: 'border-emerald-400' };
  if (score >= 65) return { face: '😐', label: '留意', en: 'Attention', bg: 'bg-amber-400', text: 'text-black', ring: 'border-amber-400' };
  return { face: '☹', label: '需改善', en: 'Need Improvement', bg: 'bg-red-600', text: 'text-white', ring: 'border-red-500' };
}

function triggerCleverDriveEvent(kind) {
  const cd = state.cleverDrive;
  let msg = '';
  let deduct = 4;
  let danger = false;

  if (kind === 'accel') {
    cd.harshAccel++;
    msg = '⚠ 智駕警示：偵測到急加速，請平穩起步';
    deduct = 3;
  } else if (kind === 'brake') {
    cd.harshBrake++;
    msg = '⚠ 智駕警示：偵測到急煞車，請保持安全車距';
    deduct = 5;
    danger = true;
  } else if (kind === 'turn') {
    cd.sharpTurn++;
    msg = '⚠ 智駕警示：偵測到急轉彎，請減速慢駛';
    deduct = 4;
  } else if (kind === 'overspeed') {
    cd.overspeed++;
    msg = '🚨 智駕警示：車速超過 70 km/h，請立即減速';
    deduct = 6;
    danger = true;
  }

  cd.score = Math.max(0, cd.score - deduct);
  cd.lastEvent = msg;
  cd.warningText = msg;
  cd.warningLevel = danger ? 'danger' : 'warn';
  playAlertBeep(danger);
  renderTopStatus();
  renderCleverDriveModalContent();

  clearTimeout(window._cdBannerTimer);
  window._cdBannerTimer = setTimeout(() => {
    cd.warningText = '';
    cd.warningLevel = '';
    renderTopStatus();
  }, 4500);
}

// ============ GPS 自動追蹤引擎（聯動智駕全城車速與加減速偵測） ============
function calcDistanceMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = d => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function stopGpsTracking() {
  if (state.gpsWatchId != null && 'geolocation' in navigator) {
    navigator.geolocation.clearWatch(state.gpsWatchId);
    state.gpsWatchId = null;
  }
}

function startGpsTracking() {
  if (!('geolocation' in navigator)) {
    showToast('此瀏覽器不支援 GPS 定位');
    state.gpsEnabled = false;
    renderAll();
    return;
  }
  stopGpsTracking();
  state.gpsEnabled = true;
  state.gpsWatchId = navigator.geolocation.watchPosition(
    pos => {
      const nowMs = Date.now();
      const { latitude, longitude, speed } = pos.coords;
      const kmh = typeof speed === 'number' && !Number.isNaN(speed) ? Math.round(speed * 3.6) : 0;

      // 智駕全城實時速度與急加減速評估
      if (state.lastGpsTimeMs > 0) {
        const dtSec = Math.max(0.5, (nowMs - state.lastGpsTimeMs) / 1000);
        const deltaKmh = kmh - state.lastGpsSpeedKmh;
        if (dtSec <= 4 && deltaKmh <= -18) triggerCleverDriveEvent('brake');
        else if (dtSec <= 4 && deltaKmh >= 18) triggerCleverDriveEvent('accel');
      }
      if (kmh > 70 && state.lastGpsSpeedKmh <= 70) triggerCleverDriveEvent('overspeed');

      state.lastGpsSpeedKmh = kmh;
      state.lastGpsTimeMs = nowMs;
      state.gpsSpeedKmh = kmh;
      state.isStopped3s = kmh < 3;

      if (state.routeStage === 'stops' && state.tripStops.length > 0) {
        const nextIdx = Math.min(state.tripStops.length - 1, state.currentStopIdx + 1);
        const curSt = state.tripStops[state.currentStopIdx];
        const nextSt = state.tripStops[nextIdx];
        const nLat = getStopLat(nextSt);
        const nLng = getStopLng(nextSt);
        const cLat = getStopLat(curSt);
        const cLng = getStopLng(curSt);

        if (Number.isFinite(nLat) && Number.isFinite(nLng) && nextIdx !== state.currentStopIdx) {
          const dist = Math.round(calcDistanceMeters(latitude, longitude, nLat, nLng));
          state.gpsDistanceM = dist;
          let leg = 450;
          if (Number.isFinite(cLat) && Number.isFinite(cLng)) {
            leg = Math.max(80, Math.round(calcDistanceMeters(cLat, cLng, nLat, nLng)));
          }
          const ratio = Math.max(0, Math.min(1, 1 - dist / leg));
          state.stopProgressPct = Math.round(15 + ratio * 80);

          if (dist <= 45) {
            state.currentStopIdx = nextIdx;
            state.stopProgressPct = 20;
            state.gpsDistanceM = null;
            renderAll();
            triggerStopAnnouncement(state.currentStopIdx);
            return;
          }
        }
      }
      renderTopStatus();
      const gpsLabel = document.getElementById('gpsLiveText');

        stopGpsTracking();
        renderAll();

    { enableHighAccuracy: true, maximumAge: 1500, timeout: 10000 }
  );
}

// 按需載入 stops.json 並建立跨路線同站名音檔索引
async function ensureStopsLoaded(trip) {
  if (!state.stopsLoaded) {
    const vp = document.getElementById('mainViewport');
    if (vp) renderInFrameDiagnostic(vp, `LOADING ROUTE ${getRouteNo(trip)} DATA...`);
    const res = await fetch('./data/stops.json');
    if (!res.ok) throw new Error('無法載入站點資料庫');
    const rawStops = await res.json();
    const arr = Array.isArray(rawStops) ? rawStops : [];

    state.audioByStopName.clear();
    state.audioByBaseName.clear();

    for (const s of arr) {
      const k1 = `${s.routeId || ''}|${String(s.bound || '').toUpperCase()}|${s.patternId || ''}`;
      if (!state.stopsByTrip.has(k1)) state.stopsByTrip.set(k1, []);
      state.stopsByTrip.get(k1).push(s);

      const k2 = `${s.routeId || ''}|${String(s.bound || '').toUpperCase()}`;
      if (!state.stopsByRouteBound.has(k2)) state.stopsByRouteBound.set(k2, []);
      state.stopsByRouteBound.get(k2).push(s);

      if (s.stopAudioFile) {
        const tc = getStopNameTc(s);
        const en = normStopName(tc);
        const bn = normBaseName(tc);
        if (en && !state.audioByStopName.has(en)) state.audioByStopName.set(en, s.stopAudioFile);
        if (bn && bn.length >= 2 && !state.audioByBaseName.has(bn)) state.audioByBaseName.set(bn, s.stopAudioFile);
      }
    }
    for (const list of state.stopsByTrip.values()) list.sort((a, b) => (a.seq ?? 0) - (b.seq ?? 0));
    state.stopsLoaded = true;
  }

  const keyExact = `${trip.routeId || ''}|${getBound(trip)}|${trip.patternId || ''}`;
  let stops = state.stopsByTrip.get(keyExact);
  if (!stops || stops.length === 0) {
    const keyFallback = `${trip.routeId || ''}|${getBound(trip)}`;
    const allForBound = state.stopsByRouteBound.get(keyFallback) || [];
    if (allForBound.length > 0) {
      const firstPat = allForBound[0].patternId || '';
      stops = allForBound.filter(x => (x.patternId || '') === firstPat).sort((a, b) => (a.seq ?? 0) - (b.seq ?? 0));
    }
  }
  return stops || [];
}

// ============ 各主畫面渲染 ============
function renderMain() {
  const vp = document.getElementById('mainViewport');
  const bar = document.getElementById('bottomBar');
  if (!vp || !bar) return;
  bar.className = themeClasses().botBar;

  if (state.currentTab === 'route') {
    if (state.routeStage === 'route') renderRouteList(vp, bar);
    else if (state.routeStage === 'bound') renderBoundList(vp, bar);
    else if (state.routeStage === 'trip') renderTripList(vp, bar);
    else if (state.routeStage === 'start_stop') renderStartStopList(vp, bar);
    else renderStopsView(vp, bar);
  } else if (state.currentTab === 'announce') {
    renderAnnounceView(vp, bar);
  } else if (state.currentTab === 'message') {
    renderMessageView(vp, bar);
  } else if (state.currentTab === 'incident') {
    renderIncidentView(vp, bar);
  } else {
    renderSettingsView(vp, bar);
  }
}

  });
  document.getElementById('botBack').onclick = () => { state.routeStage = 'bound'; state.pageOffset = 0; renderAll(); };
  document.getElementById('botHome').onclick = () => { state.routeStage = 'route'; state.pageOffset = 0; renderAll(); };
  document.getElementById('botPrev').onclick = () => { if (canPrev) { state.pageOffset--; renderAll(); } };
  document.getElementById('botNext').onclick = () => { if (canNext) { state.pageOffset++; renderAll(); } };
}

function renderStartStopList(vp, bar) {
  const th = themeClasses();
  vp.className = th.vp;
  const sections = computeTripSections(state.tripStops, state.selectedTrip);
  const totalPages = Math.max(1, Math.ceil(state.tripStops.length / PAGE_SIZE));
  if (state.pageOffset >= totalPages) state.pageOffset = totalPages - 1;
  const slice = state.tripStops.slice(state.pageOffset * PAGE_SIZE, (state.pageOffset + 1) * PAGE_SIZE);

  vp.innerHTML = `
    <div class="flex items-center justify-between px-3 py-2 ${th.subBar} shrink-0">
      <span class="font-black text-sm">${esc(state.selectedRouteNo)} · 選擇開始站位</span>
      <span class="text-xs font-bold ${th.muted}">${state.pageOffset + 1} / ${totalPages} (共 ${state.tripStops.length} 站)</span>
    </div>
    <div class="flex-1 flex flex-col divide-y ${th.divider} overflow-y-auto no-scrollbar">
      ${slice.length === 0 ? `
        <div class="flex-1 flex items-center justify-center ${th.muted} text-sm font-bold">此班次暫無站點資料</div>
      ` : slice.map((st, idx) => {
        const sIdx = state.pageOffset * PAGE_SIZE + idx;
        const hasAudio = !!getEffectiveStopAudio(st);
        const sub = getStopSub(st);
        const secInfo = sections[sIdx] || {};
        return `
          <button data-sidx="${sIdx}" class="pick-start-btn flex-1 px-4 py-2.5 flex items-center justify-between ${th.row} text-left">
            <div class="min-w-0 pr-2">
              <div class="text-lg font-black truncate">${sIdx + 1}. ${esc(state.lang === 'en' ? (getStopNameEn(st) || getStopNameTc(st)) : getStopNameTc(st))}</div>
              ${sub ? `<div class="text-xs font-bold ${th.muted} truncate">${esc(sub)}</div>` : ''}
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              ${secInfo.badgeFare != null ? `<span class="px-1.5 py-0.5 rounded bg-emerald-600 text-white text-[11px] font-black">${esc(fmtFare(secInfo.badgeFare))}</span>` : ''}
              ${hasAudio ? `<span class="px-1.5 py-0.5 rounded ${th.dark ? 'bg-zinc-800 text-emerald-400 border border-zinc-600' : 'bg-emerald-100 text-emerald-700'} text-[10px] font-black">MP3</span>` : ''}
              <span class="${th.muted} text-xl font-bold">›</span>
            </div>
          </button>
        `;
      }).join('')}
      ${slice.length > 0 && slice.length < PAGE_SIZE ? Array(PAGE_SIZE - slice.length).fill(`<div class="flex-1 ${th.emptyRow}"></div>`).join('') : ''}
    </div>
  `;

  const canPrev = state.pageOffset > 0;
  const canNext = state.pageOffset < totalPages - 1;
  bar.innerHTML = `
    <button id="botBack" class="h-11 rounded-lg bg-[#d92b1c] text-white font-black text-xl flex items-center justify-center active:brightness-90">‹</button>
    <button id="botPrev" class="h-11 rounded-lg ${canPrev ? 'bg-[#0068FF] text-white' : 'bg-zinc-600 text-zinc-300'} font-black text-xl flex items-center justify-center">↑</button>
    <button id="botNext" class="h-11 rounded-lg ${canNext ? 'bg-[#0068FF] text-white' : 'bg-zinc-600 text-zinc-300'} font-black text-xl flex items-center justify-center">↓</button>
    <button id="botQuickStart" class="h-11 rounded-lg bg-emerald-600 text-white font-black text-xs flex items-center justify-center">第1站開出</button>
  `;

  const enterStops = startIdx => {
    state.currentStopIdx = startIdx;
    state.stopProgressPct = 20;
    state.gpsDistanceM = null;
    state.lastAnnouncedKey = '';
    state.routeStage = 'stops';
    if (state.gpsEnabled) startGpsTracking();
    renderAll();
    triggerStopAnnouncement(state.currentStopIdx, true);
  };

  vp.querySelectorAll('.pick-start-btn').forEach(btn => {
    btn.onclick = () => enterStops(Number(btn.dataset.sidx));
  });
  document.getElementById('botBack').onclick = () => { state.routeStage = 'trip'; state.pageOffset = 0; renderAll(); };
  document.getElementById('botPrev').onclick = () => { if (canPrev) { state.pageOffset--; renderAll(); } };
  document.getElementById('botNext').onclick = () => { if (canNext) { state.pageOffset++; renderAll(); } };
  document.getElementById('botQuickStart').onclick = () => { if (state.tripStops.length > 0) enterStops(0); };
}

// ============ 報站主畫面（支援日間／夜間模式、分段車費位置、隱藏英文站名） ============
function renderStopsView(vp, bar) {
  const th = themeClasses();
  vp.className = th.vp;
  const cur = state.tripStops[state.currentStopIdx];
  if (!cur) {
    vp.innerHTML = `<div class="flex-1 flex items-center justify-center ${th.muted} font-bold">無站點資料</div>`;
    return;
  }

  const sections = computeTripSections(state.tripStops, state.selectedTrip);
  const curSec = sections[state.currentStopIdx] || { sectionNo: 1, activeFare: null, badgeFare: null };
  const trip = state.selectedTrip || {};
  const dest = state.lang === 'en' ? (getDestEn(trip) || getDestTc(trip)) : (getDestTc(trip) || getDestEn(trip));
  const remark = getRealTripRemark(trip);
  const upcoming = state.tripStops.slice(state.currentStopIdx + 1, state.currentStopIdx + 6);
  const curName = state.lang === 'en' ? (getStopNameEn(cur) || getStopNameTc(cur)) : getStopNameTc(cur);
  const curSub = getStopSub(cur);
  const hasAudio = !!getEffectiveStopAudio(cur);

  const curPanelCls = th.dark ? 'bg-[#12161f] border-b border-zinc-700/80' : 'bg-white border-b border-zinc-300';
  const secBoxCls = th.dark ? 'border-zinc-500/80 bg-[#141923] text-white' : 'border-zinc-400 bg-white text-zinc-900';
  const gpsBtnCls = th.dark ? 'bg-zinc-800 border-zinc-600 text-zinc-200' : 'bg-zinc-100 border-zinc-300 text-zinc-800';

  vp.innerHTML = `
    <!-- 路線與分段標頭 -->
    <div class="px-3.5 py-2.5 ${th.subBar} flex items-center justify-between gap-2 shrink-0">
      <div class="min-w-0">
        <div class="text-xl font-black tracking-tight truncate">${esc(state.selectedRouteNo)}-${esc(dest || '終點')}-${esc(state.selectedTripSeq || 1)}</div>
        ${remark ? `<div class="text-xs font-bold ${th.muted} truncate mt-0.5">${esc(remark)}</div>` : ''}
      </div>
      <div class="min-w-[68px] px-2 py-1 rounded border ${secBoxCls} text-center shrink-0">
        <div class="text-[10px] font-bold ${th.muted} leading-none">分段 ${esc(curSec.sectionNo)}</div>
        ${curSec.activeFare != null
          ? `<div class="mt-0.5 px-1.5 py-0.5 rounded bg-emerald-600 text-white text-xs font-black leading-none">${esc(fmtFare(curSec.activeFare))}</div>`
          : `<div class="text-xl font-black leading-tight mt-0.5">${esc(curSec.sectionNo)}</div>`
        }
      </div>
    </div>

    <!-- 當前車站卡片 + 手動模式大掣 / GPS 進度條 -->
    <div class="px-3.5 py-3 ${curPanelCls} shrink-0">
      <button id="btnReplayCurrent" class="w-full text-left active:opacity-80">
        <div class="flex items-start justify-between gap-2">
          <div class="text-2xl font-black leading-snug">${state.currentStopIdx + 1}. ${esc(curName)}</div>
          <div class="flex items-center gap-1 shrink-0 mt-1">
            ${curSec.badgeFare != null ? `<span class="px-1.5 py-0.5 rounded bg-emerald-600 text-white text-[11px] font-black">${esc(fmtFare(curSec.badgeFare))}</span>` : ''}
            <span class="px-1.5 py-0.5 rounded ${th.dark ? 'bg-zinc-800 border border-zinc-600 text-emerald-400' : 'bg-zinc-100 border border-zinc-300 text-emerald-700'} text-[10px] font-black">
              ${state.gpsEnabled && state.currentStopIdx === 0 ? '自動靜音' : (!state.gpsEnabled && state.currentStopIdx === 0 ? (getWelcomeAudioFile() ? 'HKOWS 歡迎詞' : 'G-TTS 歡迎詞') : (state.gpsEnabled && state.currentStopIdx === 1 ? '歡迎詞+站名' : (hasAudio ? 'HKOWS' : 'G-TTS')))}
            </span>
          </div>
        </div>
        ${curSub ? `<div class="text-xs font-bold ${th.muted} mt-0.5 truncate">${esc(curSub)}</div>` : ''}
      </button>

      <div class="flex items-center justify-between mt-3 mb-2">
        <span id="gpsLiveText" class="text-xs font-black ${state.gpsEnabled ? 'text-emerald-500' : th.muted}">
          ${state.gpsEnabled ? (state.gpsDistanceM != null ? `GPS 自動 · 距下站 ${state.gpsDistanceM}m` : 'GPS 自動報站中') : '手動模式'}
        </span>
        <button id="btnToggleGpsInline" class="px-2.5 py-1 rounded border ${gpsBtnCls} text-[11px] font-black active:scale-95">
          切換${state.gpsEnabled ? '手動 (M)' : 'GPS 自動'}
        </button>
      </div>

      ${!state.gpsEnabled ? `
        <div class="grid grid-cols-2 gap-3 mt-1">
          <button id="btnManualStop" class="h-14 rounded-xl bg-[#d92b1c] active:brightness-90 text-white font-black text-lg shadow">
            停止
          </button>
          <button id="btnManualNext" class="h-14 rounded-xl bg-[#0068FF] active:brightness-90 text-white font-black text-lg shadow">
            下一站
          </button>
        </div>
      ` : `
        <div class="mt-1 space-y-2">
          <div class="w-full h-4 ${th.dark ? 'bg-zinc-800 border-zinc-600' : 'bg-zinc-200 border-zinc-400'} rounded overflow-hidden border">
            <div id="stopProgressFill" class="h-full bg-[#0068FF] transition-all duration-300" style="width:${state.stopProgressPct}%"></div>
          </div>
          <div class="flex justify-between text-[11px] font-bold ${th.muted}">
            <span>自動偵測埋站 (≤45m)</span>
            <span>第 ${state.currentStopIdx + 1} / ${state.tripStops.length} 站</span>
          </div>
        </div>
      `}
    </div>

    <!-- 後續站位列表（指定車站分段位顯示綠色價錢標誌） -->
    <div class="flex-1 overflow-y-auto no-scrollbar divide-y ${th.divider}">
      ${upcoming.length === 0 ? `
        <div class="px-4 py-6 text-center text-sm font-bold text-amber-500">已到達本班次終點站</div>
      ` : upcoming.map((st, offset) => {
        const targetIdx = state.currentStopIdx + 1 + offset;
        const nm = state.lang === 'en' ? (getStopNameEn(st) || getStopNameTc(st)) : getStopNameTc(st);
        const sInfo = sections[targetIdx] || {};
        return `
          <button data-jump="${targetIdx}" class="jump-stop-btn w-full px-4 py-3.5 text-left ${th.row} flex items-center justify-between gap-2">
            <span class="text-lg font-extrabold truncate">${targetIdx + 1}. ${esc(nm)}</span>
            <div class="flex items-center gap-1.5 shrink-0">
              ${sInfo.badgeFare != null ? `<span class="px-1.5 py-0.5 rounded bg-emerald-600 text-white text-[11px] font-black">${esc(fmtFare(sInfo.badgeFare))}</span>` : ''}
              ${st.approachAudioFile ? '<span class="px-1.5 py-0.5 rounded bg-blue-600/20 text-[#0068FF] text-[10px] font-bold">+提示</span>' : ''}
            </div>
          </button>
        `;
      }).join('')}
    </div>
  `;

  const canPrev = state.currentStopIdx > 0;
  const canNext = state.currentStopIdx < state.tripStops.length - 1;
  bar.innerHTML = `
    <button id="botBack" class="h-11 rounded-lg bg-[#d92b1c] text-white font-black text-xl flex items-center justify-center active:brightness-90">‹</button>
    <button id="botPrev" class="h-11 rounded-lg ${canPrev ? 'bg-[#0068FF] text-white' : 'bg-zinc-600 text-zinc-300'} font-black text-xl flex items-center justify-center active:brightness-90">↑</button>
    <button id="botNext" class="h-11 rounded-lg ${canNext ? 'bg-[#0068FF] text-white' : 'bg-zinc-600 text-zinc-300'} font-black text-xl flex items-center justify-center active:brightness-90">↓</button>
    <button id="botMore" class="h-11 rounded-lg bg-[#0068FF] text-white font-black text-lg flex items-center justify-center active:brightness-90">•••</button>
  `;

  const advanceStop = () => {
    if (state.currentStopIdx < state.tripStops.length - 1) {
      state.currentStopIdx++;
      state.stopProgressPct = 20;
      state.gpsDistanceM = null;
      renderAll();
      triggerStopAnnouncement(state.currentStopIdx, true);
    } else {
      showToast('已到達終點站');
    }
  };
  const prevStop = () => {
    if (state.currentStopIdx > 0) {
      state.currentStopIdx--;
      state.stopProgressPct = 20;
      state.gpsDistanceM = null;
      renderAll();
      triggerStopAnnouncement(state.currentStopIdx, true);
    }
  };

  document.getElementById('btnReplayCurrent').onclick = () => {
    if (state.gpsEnabled && state.currentStopIdx === 0) {
      stopAllAudio();
      showToast('自動模式第 1 站不播報，將於第 2 站播歡迎詞及站名');
      return;
    }
    triggerStopAnnouncement(state.currentStopIdx, true);
    showToast(state.currentStopIdx === 0 ? '重播歡迎詞' : '重播報站');
  };
  document.getElementById('btnToggleGpsInline').onclick = () => toggleGpsMode();

  const btnStop = document.getElementById('btnManualStop');
  if (btnStop) {
    btnStop.onclick = () => {
      stopAllAudio();
      stopGpsTracking();
      state.routeStage = 'start_stop';
      renderAll();
      showToast('已停止報站');
    };
  }
  const btnNext = document.getElementById('btnManualNext');
  if (btnNext) btnNext.onclick = advanceStop;

  vp.querySelectorAll('.jump-stop-btn').forEach(btn => {
    btn.onclick = () => {
      state.currentStopIdx = Number(btn.dataset.jump);
      state.stopProgressPct = 20;
      state.gpsDistanceM = null;
      renderAll();
      triggerStopAnnouncement(state.currentStopIdx, true);
    };
  });

  document.getElementById('botBack').onclick = () => {
    stopAllAudio();
    stopGpsTracking();
    state.routeStage = 'start_stop';
    renderAll();
  };
  document.getElementById('botPrev').onclick = prevStop;
  document.getElementById('botNext').onclick = advanceStop;
  document.getElementById('botMore').onclick = () => document.getElementById('moreModal').classList.remove('hidden');
}

// ============ 特別廣播分頁 ============
function renderAnnounceView(vp, bar) {
  const th = themeClasses();
  vp.className = th.vp;
  const totalPages = Math.max(1, Math.ceil(state.announcements.length / PAGE_SIZE));
  if (state.announcePage >= totalPages) state.announcePage = totalPages - 1;
  const slice = state.announcements.slice(state.announcePage * PAGE_SIZE, (state.announcePage + 1) * PAGE_SIZE);

  vp.innerHTML = `
    <div class="flex items-center justify-between px-3 py-2 ${th.subBar} shrink-0">
      <span class="font-black text-sm">特別車廂廣播</span>
      <span class="text-xs font-bold ${th.muted}">${state.announcePage + 1} / ${totalPages}</span>
    </div>
    <div class="flex-1 flex flex-col divide-y ${th.divider}">
      ${slice.map(item => {
        const code = item.code ?? '';
        const title = state.lang === 'en' ? (item.titleEn || item.titleTc) : (item.titleTc || item.titleEn);
        return `
          <button data-acode="${esc(code)}" class="play-ann-btn flex-1 px-4 py-2 flex items-center justify-between ${th.row} text-left">
            <div class="min-w-0 pr-2">
              <div class="text-sm font-black truncate">${esc(code)}. ${esc(title)}</div>
              <div class="text-[11px] font-semibold ${th.muted} truncate mt-0.5">${esc(item.ttsTc || item.ttsEn || '')}</div>
            </div>
            <span class="w-9 h-9 rounded-full bg-emerald-600 text-white font-black text-sm flex items-center justify-center shrink-0">▶</span>
          </button>
        `;
      }).join('')}
      ${slice.length < PAGE_SIZE ? Array(PAGE_SIZE - slice.length).fill(`<div class="flex-1 ${th.emptyRow}"></div>`).join('') : ''}
    </div>
  `;

  const canPrev = state.announcePage > 0;
  const canNext = state.announcePage < totalPages - 1;
  bar.innerHTML = `
    <button id="botAnnStop" class="h-11 rounded-lg bg-[#d92b1c] text-white font-black text-xs flex items-center justify-center">停止播放</button>
    <button id="botPrev" class="h-11 rounded-lg ${canPrev ? 'bg-[#0068FF] text-white' : 'bg-zinc-600 text-zinc-300'} font-black text-xl flex items-center justify-center">↑</button>
    <button id="botNext" class="h-11 rounded-lg ${canNext ? 'bg-[#0068FF] text-white' : 'bg-zinc-600 text-zinc-300'} font-black text-xl flex items-center justify-center">↓</button>
    <button id="botBackRoute" class="h-11 rounded-lg bg-[#0068FF] text-white font-black text-xs flex items-center justify-center">返回路線</button>
  `;

  vp.querySelectorAll('.play-ann-btn').forEach(btn => {
    btn.onclick = () => {
      const code = btn.dataset.acode;
      const item = state.announcements.find(a => String(a.code) === String(code));
      if (!item) return;
      const candidate = item.audioFile || `audio/announcements/${code}.mp3`;
      playAudioSequence([candidate], item.ttsTc || item.titleTc, item.ttsEn || item.titleEn, item.ttsSc || '');
      showToast(`播放廣播 #${code}`);
    };
  });
  document.getElementById('botAnnStop').onclick = () => { stopAllAudio(); showToast('已停止廣播'); };
  document.getElementById('botPrev').onclick = () => { if (canPrev) { state.announcePage--; renderAll(); } };
  document.getElementById('botNext').onclick = () => { if (canNext) { state.announcePage++; renderAll(); } };
  document.getElementById('botBackRoute').onclick = () => { state.currentTab = 'route'; renderAll(); };
}

// ============ 訊息分頁 ============
function renderMessageView(vp, bar) {

      <span class="text-xs font-bold ${th.muted}">共 ${state.messages.length} 則</span>

            <span class="text-xs font-black text-[#0068FF]">${esc(m.sender)}</span>

      `).join('')}

    <button id="botReadAll" class="col-span-2 h-11 rounded-lg bg-emerald-600 text-white font-black text-sm">全部標為已讀</button>
    <button id="botBackRoute" class="col-span-2 h-11 rounded-lg bg-[#0068FF] text-white font-black text-sm">返回路線</button>
  `;
  vp.querySelectorAll('.msg-row').forEach(el => {

// ============ 事故回報分頁 ============
function renderIncidentView(vp, bar) {
  const th = themeClasses();
  vp.className = th.vp;
  const types = ['交通擠塞', '機件故障', '交通意外', '乘客不適', '臨時改道', '道路封閉'];
  vp.innerHTML = `
    <div class="px-3 py-2 ${th.subBar} font-black text-sm shrink-0">事故回報</div>
    <div class="p-3 grid grid-cols-2 gap-2 shrink-0">
      ${types.map(t => `
        <button data-itype="${esc(t)}" class="inc-btn py-3 rounded-lg bg-red-600 active:brightness-90 text-white font-black text-sm shadow-sm">${esc(t)}</button>
      `).join('')}
    </div>
    <div class="px-3 py-1.5 ${th.subBar} text-xs font-black shrink-0">已提交記錄 (${state.incidents.length})</div>
    <div class="flex-1 overflow-y-auto no-scrollbar divide-y ${th.divider} px-3">
      ${state.incidents.length === 0 ? `<div class="py-6 text-center text-xs ${th.muted} font-bold">暫無事故記錄</div>` : state.incidents.map(inc => `
        <div class="py-2 flex items-center justify-between text-xs">
          <span class="font-black text-red-500">${esc(inc.type)}</span>
          <span class="font-mono ${th.muted}">${esc(inc.time)}</span>
        </div>
      `).join('')}
    </div>
  `;
  bar.innerHTML = `
    <button id="botClearInc" class="col-span-2 h-11 rounded-lg bg-zinc-700 text-white font-black text-sm">清除記錄</button>
    <button id="botBackRoute" class="col-span-2 h-11 rounded-lg bg-[#0068FF] text-white font-black text-sm">返回路線</button>
  `;
  vp.querySelectorAll('.inc-btn').forEach(btn => {
    btn.onclick = () => {
      const t = new Date().toTimeString().slice(0, 8);
      state.incidents.unshift({ type: btn.dataset.itype, time: t });
      showToast(`已回報：${btn.dataset.itype}`);
      renderAll();
    };
  });
  document.getElementById('botClearInc').onclick = () => { state.incidents = []; renderAll(); };
  document.getElementById('botBackRoute').onclick = () => { state.currentTab = 'route'; renderAll(); };
}

// ============ 系統設定分頁 ============
function renderSettingsView(vp, bar) {
  const th = themeClasses();
  vp.className = th.vp;
  vp.innerHTML = `
    <div class="px-3 py-2 ${th.subBar} font-black text-sm shrink-0">系統設定與診斷</div>
    <div class="flex-1 overflow-y-auto no-scrollbar p-3 space-y-2.5 text-sm">
      <div class="p-3 rounded-lg border ${th.card} space-y-1 text-xs">
        <div class="font-black">裝置與資料庫狀態</div>
        <div>路線總班次：<b>${state.routes.length}</b>（不重複路線：<b>${state.uniqueRouteNos.length}</b>）</div>
        <div>站點庫狀態：<b>${state.stopsLoaded ? '已載入' : '未下載（點入班次時按需載入）'}</b></div>
        <div>HKOWS 音檔索引：<b>${state.audioManifest.length}</b> 個 MP3</div>
        <div>備用語音引擎：<b>Google TTS（粵／英／普）</b></div>
        <div>顯示主題：<b>${isNight() ? '夜間模式' : '日間模式'}</b> ｜ 智駕評分：<b>${state.cleverDrive.score} 分</b></div>
      </div>

      <button id="setToggleTheme" class="w-full py-2.5 rounded-lg bg-amber-600 text-white font-black">
        顯示模式：${isNight() ? '🌙 夜間模式' : '☀ 日間模式'}（點擊切換）
      </button>
      <button id="setOpenCD" class="w-full py-2.5 rounded-lg bg-emerald-600 text-white font-black">
        打開「智駕全城 Clever Driving」面板
      </button>
      <button id="setToggleGps" class="w-full py-2.5 rounded-lg bg-[#0068FF] text-white font-black">
        報站模式：${state.gpsEnabled ? 'GPS 自動報站' : '手動模式 (M)'}（點擊切換）
      </button>
      <button id="setReplayBoot" class="w-full py-2.5 rounded-lg bg-zinc-700 text-white font-black">
        重新播放開機與診斷畫面
      </button>
      <button id="setClearCache" class="w-full py-2.5 rounded-lg bg-red-600 text-white font-black">
        清除離線快取並重新載入
      </button>
    </div>
  `;
  bar.innerHTML = `
    <button id="botBackRoute" class="col-span-4 h-11 rounded-lg bg-[#0068FF] text-white font-black text-sm">返回路線</button>
  `;
  document.getElementById('setToggleTheme').onclick = () => toggleTheme();
  document.getElementById('setOpenCD').onclick = () => openCleverDriveModal();
  document.getElementById('setToggleGps').onclick = () => toggleGpsMode();
  document.getElementById('setReplayBoot').onclick = () => runBootSequence(true);
  document.getElementById('setClearCache').onclick = async () => {
    try {
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }
    } catch (_) {}
    location.reload();
  };
  document.getElementById('botBackRoute').onclick = () => { state.currentTab = 'route'; renderAll(); };
}

function renderAll() {
  renderTopStatus();
  renderTabs();
  renderMain();
}

// ============ 路線搜尋鍵盤 ============
function openKeypad() {
  const modal = document.getElementById('keypadModal');
  const display = document.getElementById('keypadDisplay');
  const grid = document.getElementById('keypadGrid');
  if (!modal || !display || !grid) return;

  let draft = state.searchQuery;
  display.textContent = draft;

  const keys = ['1','2','3','4','5','6','7','8','9','0','A','B','C','E','H','M','N','P','R','S','X','Y','Z','K','W'];
  grid.innerHTML = keys.map(k => `
    <button data-k="${k}" class="kp-key h-11 rounded-lg bg-zinc-800 border border-zinc-600 text-white font-black text-lg active:bg-[#0068FF]">${k}</button>
  `).join('');

  grid.querySelectorAll('.kp-key').forEach(b => {
    b.onclick = () => {
      if (draft.length < 6) {
        draft += b.dataset.k;
        display.textContent = draft;
      }
    };
  });
  document.getElementById('btnKeypadBack').onclick = () => { draft = draft.slice(0, -1); display.textContent = draft; };
  document.getElementById('btnKeypadClear').onclick = () => { draft = ''; display.textContent = ''; };
  document.getElementById('btnKeypadConfirm').onclick = () => {
    state.searchQuery = draft;
    state.pageOffset = 0;
    modal.classList.add('hidden');
    renderAll();
  };
  document.getElementById('btnCloseKeypad').onclick = () => modal.classList.add('hidden');
  modal.classList.remove('hidden');
}

// ============ 機身內嵌開機序列 + 輕量路線名載入 ============
async function fetchInitialLightData() {
  const [rRes, aRes] = await Promise.all([
    fetch('./data/routes.json'),
    fetch('./data/announcements.json')
  ]);
  const routes = await rRes.json();
  const anns = await aRes.json();
  state.routes = Array.isArray(routes) ? routes : [];
  state.announcements = Array.isArray(anns) ? anns : [];
  const set = new Set(state.routes.map(getRouteNo).filter(Boolean));
  state.uniqueRouteNos = Array.from(set).sort(compareRouteNo);

  fetch(`${AUDIO_CDN_BASE}/audio_manifest.json?v=40`)
    .then(r => (r.ok ? r.json() : []))
    .then(list => {
      if (!Array.isArray(list)) return;
      state.audioManifest = list.map(x => String(x).replace(/\\/g, '/'));
      state.audioStemMap.clear();
      for (const p of state.audioManifest) {
        const stem = p.split('/').pop().replace(/\.[^.]+$/, '').toLowerCase();
        if (stem && !state.audioStemMap.has(stem)) state.audioStemMap.set(stem, p);
      }
    })
    .catch(() => {});
}

function runBootSequence(isReplay = false) {
  const overlay = document.getElementById('lecipBootOverlay');
  const pAndroid = document.getElementById('bootPhaseAndroid');
  const pDiag = document.getElementById('bootPhaseDiag');
  const diagStatus = document.getElementById('bootDiagStatus');
  if (!overlay || !pAndroid || !pDiag) return;

  overlay.classList.remove('hidden');
  overlay.style.opacity = '1';
  pAndroid.classList.remove('hidden');
  pDiag.classList.add('hidden');
  if (diagStatus) diagStatus.textContent = 'INITIALIZING...';

  let closed = false;
  let dataDone = isReplay;

  const tryClose = () => {
    if (closed || !dataDone) return;
    closed = true;
    renderAll();
    overlay.style.opacity = '0';
    setTimeout(() => overlay.classList.add('hidden'), 300);
  };

  overlay.onclick = () => { if (dataDone) tryClose(); };

  setTimeout(() => {
    if (closed) return;
    pAndroid.classList.add('hidden');
    pDiag.classList.remove('hidden');
  }, 1100);

  if (isReplay) {
    setTimeout(tryClose, 2600);
    return;
  }

  let minTimePassed = false;
  setTimeout(() => {
    minTimePassed = true;
    tryClose();
  }, 2400);

  fetchInitialLightData()
    .then(() => {
      dataDone = true;
      if (diagStatus) diagStatus.textContent = `READY (${state.uniqueRouteNos.length} ROUTES)`;
      if (minTimePassed) tryClose();
    })
    .catch(err => {
      dataDone = true;
      if (diagStatus) diagStatus.textContent = 'LOAD ERROR: ' + err.message;
    });
}

// ============ 全域事件綁定 ============
function bindGlobalEvents() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => {
      const target = btn.dataset.tab;
      if (target === 'route' && state.currentTab === 'route' && state.routeStage === 'stops') {
        toggleGpsMode();
        return;
      }
      state.currentTab = target;
      renderAll();
    };
  });

  document.getElementById('btnOctopus').onclick = () => {
    state.octopusMode = (state.octopusMode + 1) % 3;
    renderTopStatus();
  };
  document.getElementById('btnThemeToggle').onclick = () => toggleTheme();
  document.getElementById('btnLangToggle').onclick = () => {
    state.lang = state.lang === 'tc' ? 'en' : 'tc';
    renderAll();
  };
  document.getElementById('btnCleverDriveBar').onclick = () => openCleverDriveModal();
  document.getElementById('btnCloseCD').onclick = () => document.getElementById('cleverDriveModal').classList.add('hidden');

  document.getElementById('btnStopState').onclick = () => {
    state.isStopped3s = !state.isStopped3s;
    state.gpsSpeedKmh = state.isStopped3s ? 0 : 32;
    renderTopStatus();
  };

  document.getElementById('btnDriverBadge').onclick = () => {
    const nextId = prompt('輸入車長編號／名稱：', state.driverId);
    if (nextId && nextId.trim()) {
      state.driverId = nextId.trim();
      renderTopStatus();
    }
  };

  document.getElementById('newMsgPopup').onclick = e => {
    if (e.target.id === 'btnDismissPopup') {
      state.dismissedPopup = true;
      renderTopStatus();
      return;
    }
    state.currentTab = 'message';
    renderAll();
  };

  const closeMore = () => document.getElementById('moreModal').classList.add('hidden');
  document.getElementById('btnCloseMore').onclick = closeMore;
  document.getElementById('moreReplayAudio').onclick = () => { closeMore(); triggerStopAnnouncement(state.currentStopIdx, true); };
  document.getElementById('moreToggleGps').onclick = () => { closeMore(); toggleGpsMode(); };
  document.getElementById('moreToggleTheme').onclick = () => { closeMore(); toggleTheme(); };
  document.getElementById('moreOpenCD').onclick = () => { closeMore(); openCleverDriveModal(); };
  document.getElementById('morePickStart').onclick = () => {
    closeMore();
    stopAllAudio();
    state.routeStage = 'start_stop';
    renderAll();
  };
  document.getElementById('moreBackRoutes').onclick = () => {
    closeMore();
    stopAllAudio();
    stopGpsTracking();
    state.routeStage = 'route';
    state.pageOffset = 0;
    renderAll();
  };

  document.getElementById('hwVolDown').onclick = () => {
    state.volume = Math.max(0.1, Math.round((state.volume - 0.1) * 10) / 10);
    if (currentAudio) currentAudio.volume = state.volume;
    showToast(`音量：${Math.round(state.volume * 100)}%`);
  };
  document.getElementById('hwVolUp').onclick = () => {
    state.volume = Math.min(1.0, Math.round((state.volume + 0.1) * 10) / 10);
    if (currentAudio) currentAudio.volume = state.volume;
    showToast(`音量：${Math.round(state.volume * 100)}%`);
  };
  const applyBrightness = () => {
    const sb = document.getElementById('screenBox');
    if (sb) sb.style.filter = `brightness(${state.brightness})`;
    showToast(`螢幕亮度：${Math.round(state.brightness * 100)}%`);
  };
  document.getElementById('hwBriDown').onclick = () => {
    state.brightness = Math.max(0.4, Math.round((state.brightness - 0.1) * 10) / 10);
    applyBrightness();
  };
  document.getElementById('hwBriUp').onclick = () => {
    state.brightness = Math.min(1.2, Math.round((state.brightness + 0.1) * 10) / 10);
    applyBrightness();
  };
}

// ============ 啟動應用 ============
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(reg => reg.update()).catch(() => {});
}
bindGlobalEvents();
renderTopStatus();
setInterval(renderTopStatus, 1000);
runBootSequence(false);
</script>
