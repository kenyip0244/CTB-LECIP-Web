<script>
const AUDIO_CDN_BASE = 'https://kenyip0244.github.io/CTB-LECIP-Audio';
const PAGE_SIZE = 5;

const state = {
  lang: 'tc',
  driverId: '0001 KEN YIP',
  octopusMode: 0, // 0: 正常, 1: 暫停收費, 2: 未連
  isStopped3s: true,
  gpsEnabled: false, // 預設手動模式（電腦即刻有停止/下一站大掣，手機可一鍵切換 GPS 自動）
  gpsWatchId: null,
  gpsSpeedKmh: 0,
  gpsDistanceM: null,
  stopProgressPct: 25,
  volume: 1.0,
  brightness: 1.0,

  currentTab: 'route', // route | announce | message | incident | settings
  routeStage: 'route', // route | bound | trip | start_stop | stops
  pageOffset: 0,
  announcePage: 0,
  searchQuery: '',

  routes: [],
  uniqueRouteNos: [],
  announcements: [],
  stopsLoaded: false,
  stopsByTrip: new Map(),
  stopsByRouteBound: new Map(),
  audioManifest: [],
  audioStemMap: new Map(),

  selectedRouteNo: '',
  selectedBound: '',
  selectedTrip: null,
  tripStops: [],
  currentStopIdx: 0,
  lastAnnouncedKey: '',

  dismissedPopup: false,
  messages: [
    {
      id: 1,
      time: '20:10',
      sender: '車務控制中心',
      title: '系統已就緒',
      body: '城巴報站資料庫與 HKOWS 語音索引已連線，可於報站介面切換手動或 GPS 自動模式。',
      unread: true
    },
    {
      id: 2,
      time: '19:45',
      sender: '港島區車務部',
      title: '安全駕駛提示',
      body: '駛經繁忙路段及轉車站時，請提醒乘客緊握扶手及留意落車提示。',
      unread: true
    }
  ],
  incidents: []
};

let currentAudio = null;
let audioPlaySeqId = 0;

function esc(v) {
  return String(v ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function showToast(msg) {
  const el = document.getElementById('toastBox');
  if (!el) return;
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.add('hidden'), 2200);
}

// ============ 資料欄位相容解析工具 ============
function getRouteNo(r) {
  return String(r?.routeNo || r?.route || r?.lineNo || String(r?.routeId || '').replace(/^CTB-/i, '') || '').trim().toUpperCase();
}
function getBound(r) {
  return String(r?.bound || r?.dir || r?.direction || 'O').trim().toUpperCase();
}
function getOrigTc(r) {
  return String(r?.origTc || r?.originTc || r?.fromTc || r?.orig_tc || '').trim();
}
function getDestTc(r) {
  return String(r?.destTc || r?.destinationTc || r?.toTc || r?.dest_tc || '').trim();
}
function getOrigEn(r) {
  return String(r?.origEn || r?.originEn || r?.fromEn || r?.orig_en || '').trim();
}
function getDestEn(r) {
  return String(r?.destEn || r?.destinationEn || r?.toEn || r?.dest_en || '').trim();
}
function getTripDesc(r) {
  if (state.lang === 'en') {
    return String(r?.descEn || r?.remarksEn || r?.patternDescEn || r?.serviceTypeNameEn || r?.viaEn || '').trim();
  }
  return String(r?.descTc || r?.remarksTc || r?.patternDescTc || r?.serviceTypeNameTc || r?.viaTc || '').trim();
}
function getTripFare(r) {
  const f = r?.fare ?? r?.fullFare ?? r?.price;
  if (f == null || f === '') return '';
  const n = Number(f);
  return Number.isFinite(n) ? `$${n.toFixed(1)}` : String(f);
}
function getStopNameTc(s) {
  return String(s?.nameTc || s?.stopNameTc || s?.name_tc || s?.tc || s?.name || '未命名車站').trim();
}
function getStopNameEn(s) {
  return String(s?.nameEn || s?.stopNameEn || s?.name_en || s?.en || '').trim();
}
function getStopSub(s) {
  if (state.lang === 'en') return getStopNameTc(s);
  return String(s?.roadTc || s?.locationTc || s?.subTc || getStopNameEn(s) || '').trim();
}
function getStopLat(s) {
  return Number(s?.lat ?? s?.latitude ?? s?.y);
}
function getStopLng(s) {
  return Number(s?.lng ?? s?.lon ?? s?.longitude ?? s?.x);
}

function compareRouteNo(a, b) {
  const parse = s => {
    const m = s.match(/^([A-Z]*)(\d+)([A-Z]*)$/);
    if (!m) return { hasPrefix: 2, prefix: s, num: 99999, suffix: '' };
    return {
      hasPrefix: m[1] ? 1 : 0,
      prefix: m[1],
      num: parseInt(m[2], 10),
      suffix: m[3]
    };
  };
  const pa = parse(a);
  const pb = parse(b);
  if (pa.hasPrefix !== pb.hasPrefix) return pa.hasPrefix - pb.hasPrefix;
  if (pa.prefix !== pb.prefix) return pa.prefix.localeCompare(pb.prefix);
  if (pa.num !== pb.num) return pa.num - pb.num;
  return pa.suffix.localeCompare(pb.suffix);
}

// ============ 音檔播放與 TTS 引擎 ============
function stopAllAudio() {
  audioPlaySeqId++;
  if (currentAudio) {
    try { currentAudio.pause(); } catch (_) {}
    currentAudio = null;
  }
  if ('speechSynthesis' in window) {
    try { window.speechSynthesis.cancel(); } catch (_) {}
  }
}

function buildAudioUrl(relPath) {
  const clean = String(relPath || '').replace(/\\/g, '/').replace(/^\/+/, '').replace(/\.wav$/i, '.mp3');
  if (!clean) return '';
  if (/^https?:\/\//i.test(clean)) return clean;
  const encoded = clean.split('/').filter(Boolean).map(seg => encodeURIComponent(seg)).join('/');
  return `${AUDIO_CDN_BASE}/${encoded}`;
}

function resolveManifestPath(rawPath) {
  if (!rawPath) return '';
  const clean = String(rawPath).replace(/\\/g, '/').replace(/^\/+/, '').replace(/\.wav$/i, '.mp3');
  if (state.audioManifest.includes(clean)) return clean;
  const stem = clean.split('/').pop().replace(/\.[^.]+$/, '').toLowerCase();
  const candidates = [stem];
  if (/^\d+$/.test(stem)) {
    candidates.push(stem.padStart(2, '0'), stem.replace(/^0+/, ''));
  }
  for (const c of candidates) {
    if (c && state.audioStemMap.has(c)) return state.audioStemMap.get(c);
  }
  const noSuffix = stem.replace(/_[ab]$/i, '');
  if (noSuffix && state.audioStemMap.has(noSuffix + '_a')) return state.audioStemMap.get(noSuffix + '_a');
  if (noSuffix && state.audioStemMap.has(noSuffix + '_b')) return state.audioStemMap.get(noSuffix + '_b');
  return clean;
}

function speakTtsFallback(tcText, enText) {
  if (!('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    const queue = [];
    if (tcText) {
      const u1 = new SpeechSynthesisUtterance(tcText);
      u1.lang = 'zh-HK';
      u1.volume = state.volume;
      queue.push(u1);
    }
    if (enText) {
      const u2 = new SpeechSynthesisUtterance(enText);
      u2.lang = 'en-GB';
      u2.volume = state.volume;
      queue.push(u2);
    }
    queue.forEach(u => window.speechSynthesis.speak(u));
  } catch (_) {}
}

function playAudioSequence(relPaths, fallbackTc, fallbackEn) {
  stopAllAudio();
  const seqToken = audioPlaySeqId;
  const urls = (relPaths || [])
    .filter(Boolean)
    .map(p => buildAudioUrl(resolveManifestPath(p)))
    .filter(Boolean);

  if (urls.length === 0) {
    speakTtsFallback(fallbackTc, fallbackEn);
    return;
  }

  let playedAny = false;
  let idx = 0;

  const next = () => {
    if (seqToken !== audioPlaySeqId) return;
    if (idx >= urls.length) {
      if (!playedAny) speakTtsFallback(fallbackTc, fallbackEn);
      return;
    }
    const url = urls[idx++];
    const audio = new Audio(url);
    audio.volume = state.volume;
    currentAudio = audio;
    audio.onended = () => next();
    audio.onerror = () => next();
    audio.play().then(() => {
      playedAny = true;
    }).catch(() => {
      next();
    });
  };
  next();
}

function triggerStopAnnouncement(idx, force = false) {
  const st = state.tripStops[idx];
  if (!st) return;
  const key = `${state.selectedTrip?.routeId || ''}|${state.selectedTrip?.bound || ''}|${idx}`;
  if (!force && state.lastAnnouncedKey === key) return;
  state.lastAnnouncedKey = key;

  const files = [];
  if (st.stopAudioFile) files.push(st.stopAudioFile);
  else if (st.stopId) {
    const guess = `${String(st.stopId).replace(/^0+/, '')}_a`;
    if (state.audioStemMap.has(guess)) files.push(state.audioStemMap.get(guess));
  }
  if (st.approachAudioFile) files.push(st.approachAudioFile);

  const tc = `下一站，${getStopNameTc(st)}`;
  const en = getStopNameEn(st) ? `Next stop, ${getStopNameEn(st)}` : '';
  playAudioSequence(files, tc, en);
}

// ============ GPS 自動追蹤引擎 ============
function calcDistanceMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = d => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function stopGpsTracking() {
  if (state.gpsWatchId != null && 'geolocation' in navigator) {
    navigator.geolocation.clearWatch(state.gpsWatchId);
    state.gpsWatchId = null;
  }
}

function startGpsTracking() {
  if (!('geolocation' in navigator)) {
    showToast('此瀏覽器不支援 GPS 定位');
    state.gpsEnabled = false;
    renderAll();
    return;
  }
  stopGpsTracking();
  state.gpsEnabled = true;
  state.gpsWatchId = navigator.geolocation.watchPosition(
    pos => {
      const { latitude, longitude, speed } = pos.coords;
      const kmh = typeof speed === 'number' && !Number.isNaN(speed) ? Math.round(speed * 3.6) : 0;
      state.gpsSpeedKmh = kmh;
      state.isStopped3s = kmh < 3;

      if (state.routeStage === 'stops' && state.tripStops.length > 0) {
        const nextIdx = Math.min(state.tripStops.length - 1, state.currentStopIdx + 1);
        const curSt = state.tripStops[state.currentStopIdx];
        const nextSt = state.tripStops[nextIdx];
        const nLat = getStopLat(nextSt);
        const nLng = getStopLng(nextSt);
        const cLat = getStopLat(curSt);
        const cLng = getStopLng(curSt);

        if (Number.isFinite(nLat) && Number.isFinite(nLng) && nextIdx !== state.currentStopIdx) {
          const dist = Math.round(calcDistanceMeters(latitude, longitude, nLat, nLng));
          state.gpsDistanceM = dist;
          let leg = 450;
          if (Number.isFinite(cLat) && Number.isFinite(cLng)) {
            leg = Math.max(80, Math.round(calcDistanceMeters(cLat, cLng, nLat, nLng)));
          }
          const ratio = Math.max(0, Math.min(1, 1 - dist / leg));
          state.stopProgressPct = Math.round(15 + ratio * 80);

          if (dist <= 45) {
            state.currentStopIdx = nextIdx;
            state.stopProgressPct = 20;
            state.gpsDistanceM = null;
            renderAll();
            triggerStopAnnouncement(state.currentStopIdx);
            return;
          }
        }
      }
      renderTopStatus();
      const gpsLabel = document.getElementById('gpsLiveText');
      if (gpsLabel && state.gpsEnabled) {
        gpsLabel.textContent = state.gpsDistanceM != null ? `GPS 自動 · 距下站 ${state.gpsDistanceM}m` : 'GPS 定位中...';
      }
      const bar = document.getElementById('stopProgressFill');
      if (bar) bar.style.width = `${state.stopProgressPct}%`;
    },
    err => {
      if (err.code === 1) {
        showToast('請允許瀏覽器存取 GPS 權限，已切回手動模式');
        state.gpsEnabled = false;
        stopGpsTracking();
        renderAll();
      }
    },
    { enableHighAccuracy: true, maximumAge: 1500, timeout: 10000 }
  );
}

function toggleGpsMode() {
  if (state.gpsEnabled) {
    state.gpsEnabled = false;
    stopGpsTracking();
    state.gpsDistanceM = null;
    showToast('已切換為手動模式 (M)');
  } else {
    state.gpsEnabled = true;
    startGpsTracking();
    showToast('已開啟 GPS 自動報站');
  }
  renderAll();
}

// 按需載入 stops.json（點入路線班次先下載）
async function ensureStopsLoaded(trip) {
  if (!state.stopsLoaded) {
    const vp = document.getElementById('mainViewport');
    if (vp) renderInFrameDiagnostic(vp, `LOADING ROUTE ${getRouteNo(trip)} DATA...`);
    const res = await fetch('./data/stops.json');
    if (!res.ok) throw new Error('無法載入站點資料庫');
    const rawStops = await res.json();
    const arr = Array.isArray(rawStops) ? rawStops : [];
    for (const s of arr) {
      const k1 = `${s.routeId || ''}|${String(s.bound || '').toUpperCase()}|${s.patternId || ''}`;
      if (!state.stopsByTrip.has(k1)) state.stopsByTrip.set(k1, []);
      state.stopsByTrip.get(k1).push(s);

      const k2 = `${s.routeId || ''}|${String(s.bound || '').toUpperCase()}`;
      if (!state.stopsByRouteBound.has(k2)) state.stopsByRouteBound.set(k2, []);
      state.stopsByRouteBound.get(k2).push(s);
    }
    for (const list of state.stopsByTrip.values()) list.sort((a, b) => (a.seq ?? 0) - (b.seq ?? 0));
    state.stopsLoaded = true;
  }

  const keyExact = `${trip.routeId || ''}|${getBound(trip)}|${trip.patternId || ''}`;
  let stops = state.stopsByTrip.get(keyExact);
  if (!stops || stops.length === 0) {
    const keyFallback = `${trip.routeId || ''}|${getBound(trip)}`;
    const allForBound = state.stopsByRouteBound.get(keyFallback) || [];
    // 若同一方向有多個 pattern，取第一個 pattern 避免重複站
    if (allForBound.length > 0) {
      const firstPat = allForBound[0].patternId || '';
      stops = allForBound.filter(x => (x.patternId || '') === firstPat).sort((a, b) => (a.seq ?? 0) - (b.seq ?? 0));
    }
  }
  return stops || [];
}

    <button id="botHome" class="h-11 rounded-lg bg-[#0068FF] text-white font-black text-xs flex items-center justify-center">路線表</button>
  `;

  vp.querySelectorAll('.pick-trip-btn').forEach(btn => {
    btn.onclick = async () => {
      const t = trips[Number(btn.dataset.tidx)];
      if (!t) return;
      state.selectedTrip = t;
      try {
        state.tripStops = await ensureStopsLoaded(t);
        state.currentStopIdx = 0;
        state.pageOffset = 0;
        state.routeStage = 'start_stop';
        renderAll();
      } catch (err) {
        showToast('載入站點資料失敗：' + err.message);
        renderAll();
      }
    };
  });
  document.getElementById('botBack').onclick = () => { state.routeStage = 'bound'; state.pageOffset = 0; renderAll(); };
  document.getElementById('botHome').onclick = () => { state.routeStage = 'route'; state.pageOffset = 0; renderAll(); };
  document.getElementById('botPrev').onclick = () => { if (canPrev) { state.pageOffset--; renderAll(); } };
  document.getElementById('botNext').onclick = () => { if (canNext) { state.pageOffset++; renderAll(); } };
}

function renderStartStopList(vp, bar) {
  vp.className = 'flex-1 flex flex-col overflow-hidden bg-white text-black';
  const totalPages = Math.max(1, Math.ceil(state.tripStops.length / PAGE_SIZE));
  if (state.pageOffset >= totalPages) state.pageOffset = totalPages - 1;
  const slice = state.tripStops.slice(state.pageOffset * PAGE_SIZE, (state.pageOffset + 1) * PAGE_SIZE);

  vp.innerHTML = `
    <div class="flex items-center justify-between px-3 py-2 bg-zinc-100 border-b border-zinc-300 shrink-0">
      <span class="font-black text-sm">${esc(state.selectedRouteNo)} · 選擇開始站位</span>
      <span class="text-xs font-bold text-zinc-500">${state.pageOffset + 1} / ${totalPages} (共 ${state.tripStops.length} 站)</span>
    </div>
    <div class="flex-1 flex flex-col divide-y divide-zinc-300 overflow-y-auto no-scrollbar">
      ${slice.length === 0 ? `
        <div class="flex-1 flex items-center justify-center text-zinc-500 text-sm font-bold">此班次暫無站點資料</div>
      ` : slice.map((st, idx) => {
        const sIdx = state.pageOffset * PAGE_SIZE + idx;
        const hasAudio = !!(st.stopAudioFile || st.approachAudioFile);
        return `
          <button data-sidx="${sIdx}" class="pick-start-btn flex-1 px-4 py-2.5 flex items-center justify-between bg-white active:bg-blue-50 text-left">
            <div class="min-w-0 pr-2">
              <div class="text-lg font-black text-zinc-900 truncate">${sIdx + 1}. ${esc(state.lang === 'en' ? (getStopNameEn(st) || getStopNameTc(st)) : getStopNameTc(st))}</div>
              <div class="text-xs font-bold text-zinc-500 truncate">${esc(getStopSub(st))}</div>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              ${hasAudio ? '<span class="px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700 text-[10px] font-black">MP3</span>' : ''}
              <span class="text-zinc-400 text-xl font-bold">›</span>
            </div>
          </button>
        `;
      }).join('')}
      ${slice.length > 0 && slice.length < PAGE_SIZE ? Array(PAGE_SIZE - slice.length).fill('<div class="flex-1 bg-zinc-50"></div>').join('') : ''}
    </div>
  `;

  const canPrev = state.pageOffset > 0;
  const canNext = state.pageOffset < totalPages - 1;
  bar.innerHTML = `
    <button id="botBack" class="h-11 rounded-lg bg-[#d92b1c] text-white font-black text-xl flex items-center justify-center active:brightness-90">‹</button>
    <button id="botPrev" class="h-11 rounded-lg ${canPrev ? 'bg-[#0068FF] text-white' : 'bg-zinc-600 text-zinc-300'} font-black text-xl flex items-center justify-center">↑</button>
    <button id="botNext" class="h-11 rounded-lg ${canNext ? 'bg-[#0068FF] text-white' : 'bg-zinc-600 text-zinc-300'} font-black text-xl flex items-center justify-center">↓</button>
    <button id="botQuickStart" class="h-11 rounded-lg bg-emerald-600 text-white font-black text-xs flex items-center justify-center">第1站開出</button>
  `;

  const enterStops = startIdx => {
    state.currentStopIdx = startIdx;
    state.stopProgressPct = 20;
    state.gpsDistanceM = null;
    state.lastAnnouncedKey = '';
    state.routeStage = 'stops';
    if (state.gpsEnabled) startGpsTracking();
    renderAll();
    triggerStopAnnouncement(state.currentStopIdx, true);
  };

  vp.querySelectorAll('.pick-start-btn').forEach(btn => {
    btn.onclick = () => enterStops(Number(btn.dataset.sidx));
  });
  document.getElementById('botBack').onclick = () => { state.routeStage = 'trip'; state.pageOffset = 0; renderAll(); };
  document.getElementById('botPrev').onclick = () => { if (canPrev) { state.pageOffset--; renderAll(); } };
  document.getElementById('botNext').onclick = () => { if (canNext) { state.pageOffset++; renderAll(); } };
  document.getElementById('botQuickStart').onclick = () => { if (state.tripStops.length > 0) enterStops(0); };
}

// ============ 報站主畫面（深色實車風格：手動模式大掣 / GPS 自動模式） ============
function renderStopsView(vp, bar) {
  vp.className = 'flex-1 flex flex-col overflow-hidden bg-[#141923] text-white';
  const cur = state.tripStops[state.currentStopIdx];
  if (!cur) {
    vp.innerHTML = '<div class="flex-1 flex items-center justify-center text-zinc-400 font-bold">無站點資料</div>';
    return;
  }

  const trip = state.selectedTrip || {};
  const dest = state.lang === 'en' ? (getDestEn(trip) || getDestTc(trip)) : (getDestTc(trip) || getDestEn(trip));
  const desc = getTripDesc(trip) || `${getOrigTc(trip)} → ${getDestTc(trip)}`;
  const sectionLabel = cur.section || cur.fareStage || '1';
  const upcoming = state.tripStops.slice(state.currentStopIdx + 1, state.currentStopIdx + 6);
  const curName = state.lang === 'en' ? (getStopNameEn(cur) || getStopNameTc(cur)) : getStopNameTc(cur);

  vp.innerHTML = `
    <!-- 路線與分段標頭 -->
    <div class="px-3.5 py-2.5 bg-[#1b2230] border-b border-zinc-700/80 flex items-center justify-between gap-2 shrink-0">
      <div class="min-w-0">
        <div class="text-xl font-black tracking-tight text-white truncate">${esc(state.selectedRouteNo)}-${esc(dest || '終點')}-${esc(state.selectedBound)}</div>
        <div class="text-xs font-bold text-zinc-300 truncate mt-0.5">${esc(desc)}</div>
      </div>
      <div class="w-16 py-1 rounded border border-zinc-500/80 bg-[#141923] text-center shrink-0">
        <div class="text-[10px] font-bold text-zinc-400 leading-none">分段</div>
        <div class="text-xl font-black text-white leading-tight mt-0.5">${esc(sectionLabel)}</div>
      </div>
    </div>

    <!-- 當前車站卡片 + 手動模式大掣 / GPS 進度條 -->
    <div class="px-3.5 py-3 bg-[#12161f] border-b border-zinc-700/80 shrink-0">
      <button id="btnReplayCurrent" class="w-full text-left active:opacity-80">
        <div class="flex items-start justify-between gap-2">
          <div class="text-2xl font-black text-white leading-snug">${state.currentStopIdx + 1}. ${esc(curName)}</div>
          <span class="px-1.5 py-0.5 rounded bg-zinc-800 border border-zinc-600 text-[10px] font-black text-emerald-400 shrink-0 mt-1">
            ${cur.stopAudioFile ? 'HKOWS' : 'TTS'}
          </span>
        </div>
        <div class="text-xs font-bold text-zinc-400 mt-0.5 truncate">${esc(getStopSub(cur))}</div>
      </button>

      <div class="flex items-center justify-between mt-3 mb-2">
        <span id="gpsLiveText" class="text-xs font-black ${state.gpsEnabled ? 'text-emerald-400' : 'text-zinc-300'}">
          ${state.gpsEnabled ? (state.gpsDistanceM != null ? `GPS 自動 · 距下站 ${state.gpsDistanceM}m` : 'GPS 自動報站中') : '手動模式'}
        </span>
        <button id="btnToggleGpsInline" class="px-2.5 py-1 rounded bg-zinc-800 border border-zinc-600 text-[11px] font-black text-zinc-200 active:scale-95">
          切換${state.gpsEnabled ? '手動 (M)' : 'GPS 自動'}
        </button>
      </div>

      ${!state.gpsEnabled ? `
        <div class="grid grid-cols-2 gap-3 mt-1">
          <button id="btnManualStop" class="h-14 rounded-xl bg-[#d92b1c] active:brightness-90 text-white font-black text-lg shadow">
            停止
          </button>
          <button id="btnManualNext" class="h-14 rounded-xl bg-[#0068FF] active:brightness-90 text-white font-black text-lg shadow">
            下一站
          </button>
        </div>
      ` : `
        <div class="mt-1 space-y-2">
          <div class="w-full h-4 bg-zinc-800 rounded overflow-hidden border border-zinc-600">
            <div id="stopProgressFill" class="h-full bg-[#0068FF] transition-all duration-300" style="width:${state.stopProgressPct}%"></div>
          </div>
          <div class="flex justify-between text-[11px] font-bold text-zinc-400">
            <span>自動偵測埋站 (≤45m)</span>
            <span>第 ${state.currentStopIdx + 1} / ${state.tripStops.length} 站</span>
          </div>
        </div>
      `}
    </div>

    <!-- 後續站位列表 -->
    <div class="flex-1 overflow-y-auto no-scrollbar divide-y divide-zinc-800 bg-[#141923]">
      ${upcoming.length === 0 ? `
        <div class="px-4 py-6 text-center text-sm font-bold text-amber-400">已到達本班次終點站</div>
      ` : upcoming.map((st, offset) => {
        const targetIdx = state.currentStopIdx + 1 + offset;
        const nm = state.lang === 'en' ? (getStopNameEn(st) || getStopNameTc(st)) : getStopNameTc(st);
        return `
          <button data-jump="${targetIdx}" class="jump-stop-btn w-full px-4 py-3.5 text-left active:bg-zinc-800/80 flex items-center justify-between gap-2">
            <span class="text-lg font-extrabold text-zinc-100 truncate">${targetIdx + 1}. ${esc(nm)}</span>
            ${st.approachAudioFile ? '<span class="px-1.5 py-0.5 rounded bg-blue-900/60 text-blue-300 text-[10px] font-bold shrink-0">+提示</span>' : ''}
          </button>
        `;
      }).join('')}
    </div>
  `;

  const canPrev = state.currentStopIdx > 0;
  const canNext = state.currentStopIdx < state.tripStops.length - 1;
  bar.innerHTML = `
    <button id="botBack" class="h-11 rounded-lg bg-[#d92b1c] text-white font-black text-xl flex items-center justify-center active:brightness-90">‹</button>
    <button id="botPrev" class="h-11 rounded-lg ${canPrev ? 'bg-[#0068FF] text-white' : 'bg-zinc-600 text-zinc-300'} font-black text-xl flex items-center justify-center active:brightness-90">↑</button>
    <button id="botNext" class="h-11 rounded-lg ${canNext ? 'bg-[#0068FF] text-white' : 'bg-zinc-600 text-zinc-300'} font-black text-xl flex items-center justify-center active:brightness-90">↓</button>
    <button id="botMore" class="h-11 rounded-lg bg-[#0068FF] text-white font-black text-lg flex items-center justify-center active:brightness-90">•••</button>
  `;

  const advanceStop = () => {
    if (state.currentStopIdx < state.tripStops.length - 1) {
      state.currentStopIdx++;
      state.stopProgressPct = 20;
      state.gpsDistanceM = null;
      renderAll();
      triggerStopAnnouncement(state.currentStopIdx, true);
    } else {
      showToast('已到達終點站');
    }
  };
  const prevStop = () => {
    if (state.currentStopIdx > 0) {
      state.currentStopIdx--;
      state.stopProgressPct = 20;
      state.gpsDistanceM = null;
      renderAll();
      triggerStopAnnouncement(state.currentStopIdx, true);
    }
  };

  document.getElementById('btnReplayCurrent').onclick = () => {
    triggerStopAnnouncement(state.currentStopIdx, true);
    showToast('重播報站');
  };
  document.getElementById('btnToggleGpsInline').onclick = () => toggleGpsMode();

  const btnStop = document.getElementById('btnManualStop');
  if (btnStop) {
    btnStop.onclick = () => {
      stopAllAudio();
      stopGpsTracking();
      state.routeStage = 'start_stop';
      renderAll();
      showToast('已停止報站');
    };
  }
  const btnNext = document.getElementById('btnManualNext');
  if (btnNext) btnNext.onclick = advanceStop;

  vp.querySelectorAll('.jump-stop-btn').forEach(btn => {
    btn.onclick = () => {
      state.currentStopIdx = Number(btn.dataset.jump);
      state.stopProgressPct = 20;
      state.gpsDistanceM = null;
      renderAll();
      triggerStopAnnouncement(state.currentStopIdx, true);
    };
  });

  document.getElementById('botBack').onclick = () => {
    stopAllAudio();
    stopGpsTracking();
    state.routeStage = 'start_stop';
    renderAll();
  };
  document.getElementById('botPrev').onclick = prevStop;
  document.getElementById('botNext').onclick = advanceStop;
  document.getElementById('botMore').onclick = () => document.getElementById('moreModal').classList.remove('hidden');
}

// ============ 特別廣播分頁 ============
function renderAnnounceView(vp, bar) {
  vp.className = 'flex-1 flex flex-col overflow-hidden bg-white text-black';
  const totalPages = Math.max(1, Math.ceil(state.announcements.length / PAGE_SIZE));
  if (state.announcePage >= totalPages) state.announcePage = totalPages - 1;
  const slice = state.announcements.slice(state.announcePage * PAGE_SIZE, (state.announcePage + 1) * PAGE_SIZE);

  vp.innerHTML = `
    <div class="flex items-center justify-between px-3 py-2 bg-zinc-100 border-b border-zinc-300 shrink-0">
      <span class="font-black text-sm">特別車廂廣播</span>
      <span class="text-xs font-bold text-zinc-500">${state.announcePage + 1} / ${totalPages}</span>
    </div>
    <div class="flex-1 flex flex-col divide-y divide-zinc-300">
      ${slice.map(item => {
        const code = item.code ?? '';
        const title = state.lang === 'en' ? (item.titleEn || item.titleTc) : (item.titleTc || item.titleEn);
        return `
          <button data-acode="${esc(code)}" class="play-ann-btn flex-1 px-4 py-2 flex items-center justify-between bg-white active:bg-emerald-50 text-left">
            <div class="min-w-0 pr-2">
              <div class="text-sm font-black text-zinc-900 truncate">${esc(code)}. ${esc(title)}</div>
              <div class="text-[11px] font-semibold text-zinc-500 truncate mt-0.5">${esc(item.ttsTc || item.ttsEn || '')}</div>
            </div>
            <span class="w-9 h-9 rounded-full bg-emerald-600 text-white font-black text-sm flex items-center justify-center shrink-0">▶</span>
          </button>
        `;
      }).join('')}
      ${slice.length < PAGE_SIZE ? Array(PAGE_SIZE - slice.length).fill('<div class="flex-1 bg-zinc-50"></div>').join('') : ''}
    </div>
  `;

  const canPrev = state.announcePage > 0;
  const canNext = state.announcePage < totalPages - 1;
  bar.innerHTML = `
    <button id="botAnnStop" class="h-11 rounded-lg bg-[#d92b1c] text-white font-black text-xs flex items-center justify-center">停止播放</button>
    <button id="botPrev" class="h-11 rounded-lg ${canPrev ? 'bg-[#0068FF] text-white' : 'bg-zinc-600 text-zinc-300'} font-black text-xl flex items-center justify-center">↑</button>
    <button id="botNext" class="h-11 rounded-lg ${canNext ? 'bg-[#0068FF] text-white' : 'bg-zinc-600 text-zinc-300'} font-black text-xl flex items-center justify-center">↓</button>
    <button id="botBackRoute" class="h-11 rounded-lg bg-[#0068FF] text-white font-black text-xs flex items-center justify-center">返回路線</button>
  `;

  vp.querySelectorAll('.play-ann-btn').forEach(btn => {
    btn.onclick = () => {
      const code = btn.dataset.acode;
      const item = state.announcements.find(a => String(a.code) === String(code));
      if (!item) return;
      const candidate = item.audioFile || `audio/announcements/${code}.mp3`;
      playAudioSequence([candidate], item.ttsTc || item.titleTc, item.ttsEn || item.titleEn);
      showToast(`播放廣播 #${code}`);
    };
  });
  document.getElementById('botAnnStop').onclick = () => { stopAllAudio(); showToast('已停止廣播'); };
  document.getElementById('botPrev').onclick = () => { if (canPrev) { state.announcePage--; renderAll(); } };
  document.getElementById('botNext').onclick = () => { if (canNext) { state.announcePage++; renderAll(); } };
  document.getElementById('botBackRoute').onclick = () => { state.currentTab = 'route'; renderAll(); };
}

// ============ 訊息分頁 ============

            <span class="text-[11px] font-mono text-zinc-500">${esc(m.time)} ${m.unread ? '● 未讀' : ''}</span>

    <button id="botReadAll" class="col-span-2 h-11 rounded-lg bg-emerald-600 text-white font-black text-sm">全部標為已讀</button>

  `;

// ============ 事故回報分頁 ============

        <div class="py-2 flex items-center justify-between text-xs">

      `).join('')}

    <button id="botClearInc" class="col-span-2 h-11 rounded-lg bg-zinc-700 text-white font-black text-sm">清除記錄</button>
    <button id="botBackRoute" class="col-span-2 h-11 rounded-lg bg-[#0068FF] text-white font-black text-sm">返回路線</button>
  `;
  vp.querySelectorAll('.inc-btn').forEach(btn => {

  `;
  bar.innerHTML = `
    <button id="botBackRoute" class="col-span-4 h-11 rounded-lg bg-[#0068FF] text-white font-black text-sm">返回路線</button>
  `;
  document.getElementById('setToggleGps').onclick = () => toggleGpsMode();
  document.getElementById('setReplayBoot').onclick = () => runBootSequence(true);
  document.getElementById('setClearCache').onclick = async () => {
    try {
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }
    } catch (_) {}
    location.reload();
  };
  document.getElementById('botBackRoute').onclick = () => { state.currentTab = 'route'; renderAll(); };
}

function renderAll() {
  renderTopStatus();
  renderTabs();
  renderMain();
}

// ============ 路線搜尋鍵盤 ============
function openKeypad() {
  const modal = document.getElementById('keypadModal');
  const display = document.getElementById('keypadDisplay');
  const grid = document.getElementById('keypadGrid');
  if (!modal || !display || !grid) return;

  let draft = state.searchQuery;
  display.textContent = draft;

  const keys = ['1','2','3','4','5','6','7','8','9','0','A','B','C','E','H','M','N','P','R','S','X','Y','Z','K','W'];
  grid.innerHTML = keys.map(k => `
    <button data-k="${k}" class="kp-key h-11 rounded-lg bg-zinc-800 border border-zinc-600 text-white font-black text-lg active:bg-[#0068FF]">${k}</button>
  `).join('');

  grid.querySelectorAll('.kp-key').forEach(b => {
    b.onclick = () => {
      if (draft.length < 6) {
        draft += b.dataset.k;
        display.textContent = draft;
      }
    };
  });
  document.getElementById('btnKeypadBack').onclick = () => {
    draft = draft.slice(0, -1);
    display.textContent = draft;
  };
  document.getElementById('btnKeypadClear').onclick = () => {
    draft = '';
    display.textContent = '';
  };
  document.getElementById('btnKeypadConfirm').onclick = () => {
    state.searchQuery = draft;
    state.pageOffset = 0;
    modal.classList.add('hidden');
    renderAll();
  };
  document.getElementById('btnCloseKeypad').onclick = () => modal.classList.add('hidden');
  modal.classList.remove('hidden');
}

// ============ 機身內嵌開機序列 + 輕量路線名載入 ============
let routesReadyPromise = null;

async function fetchInitialLightData() {
  const [rRes, aRes] = await Promise.all([
    fetch('./data/routes.json'),
    fetch('./data/announcements.json')
  ]);
  const routes = await rRes.json();
  const anns = await aRes.json();
  state.routes = Array.isArray(routes) ? routes : [];
  state.announcements = Array.isArray(anns) ? anns : [];
  const set = new Set(state.routes.map(getRouteNo).filter(Boolean));
  state.uniqueRouteNos = Array.from(set).sort(compareRouteNo);

  // 背景載入 HKOWS 音檔索引，不阻塞進入選擇路線畫面
  fetch(`${AUDIO_CDN_BASE}/audio_manifest.json?v=37`)
    .then(r => (r.ok ? r.json() : []))
    .then(list => {
      if (!Array.isArray(list)) return;
      state.audioManifest = list.map(x => String(x).replace(/\\/g, '/'));
      state.audioStemMap.clear();
      for (const p of state.audioManifest) {
        const stem = String(p).split('/').pop().replace(/\.[^.]+$/, '').toLowerCase();
        if (stem && !state.audioStemMap.has(stem)) state.audioStemMap.set(stem, p);
      }
    })
    .catch(() => {});
}

function runBootSequence(isReplay = false) {
  const overlay = document.getElementById('lecipBootOverlay');
  const pAndroid = document.getElementById('bootPhaseAndroid');
  const pDiag = document.getElementById('bootPhaseDiag');
  const diagStatus = document.getElementById('bootDiagStatus');
  if (!overlay || !pAndroid || !pDiag) return;

  overlay.classList.remove('hidden');
  overlay.style.opacity = '1';
  pAndroid.classList.remove('hidden');
  pDiag.classList.add('hidden');
  if (diagStatus) diagStatus.textContent = 'INITIALIZING...';

  let closed = false;
  let dataDone = isReplay;

  const tryClose = () => {
    if (closed || !dataDone) return;
    closed = true;
    renderAll();
    overlay.style.opacity = '0';
    setTimeout(() => overlay.classList.add('hidden'), 300);
  };

  overlay.onclick = () => {
    if (dataDone) tryClose();
  };

  // 階段一：Android（1.1秒） -> 階段二：診斷模式
  setTimeout(() => {
    if (closed) return;
    pAndroid.classList.add('hidden');
    pDiag.classList.remove('hidden');
  }, 1100);

  if (isReplay) {
    setTimeout(tryClose, 2600);
    return;
  }

  let minTimePassed = false;
  setTimeout(() => {
    minTimePassed = true;
    tryClose();
  }, 2400);

  routesReadyPromise = fetchInitialLightData()
    .then(() => {
      dataDone = true;
      if (diagStatus) diagStatus.textContent = `READY (${state.uniqueRouteNos.length} ROUTES)`;
      if (minTimePassed) tryClose();
    })
    .catch(err => {
      dataDone = true;
      if (diagStatus) diagStatus.textContent = 'LOAD ERROR: ' + err.message;
    });
}

// ============ 全域事件綁定 ============
function bindGlobalEvents() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => {
      const target = btn.dataset.tab;
      if (target === 'route' && state.currentTab === 'route' && state.routeStage === 'stops') {
        toggleGpsMode();
        return;
      }
      state.currentTab = target;
      renderAll();
    };
  });

  document.getElementById('btnOctopus').onclick = () => {
    state.octopusMode = (state.octopusMode + 1) % 3;
    renderTopStatus();
  };

  document.getElementById('btnStopState').onclick = () => {
    state.isStopped3s = !state.isStopped3s;
    state.gpsSpeedKmh = state.isStopped3s ? 0 : 32;
    renderTopStatus();
  };

  document.getElementById('btnLangToggle').onclick = () => {
    state.lang = state.lang === 'tc' ? 'en' : 'tc';
    renderAll();
  };

  document.getElementById('btnDriverBadge').onclick = () => {
    const nextId = prompt('輸入車長編號／名稱：', state.driverId);
    if (nextId && nextId.trim()) {
      state.driverId = nextId.trim();
      renderTopStatus();
    }
  };

  document.getElementById('newMsgPopup').onclick = e => {
    if (e.target.id === 'btnDismissPopup') {
      state.dismissedPopup = true;
      renderTopStatus();
      return;
    }
    state.currentTab = 'message';
    renderAll();
  };

  // 更多選項彈窗按鈕
  const closeMore = () => document.getElementById('moreModal').classList.add('hidden');
  document.getElementById('btnCloseMore').onclick = closeMore;
  document.getElementById('moreReplayAudio').onclick = () => {
    closeMore();
    triggerStopAnnouncement(state.currentStopIdx, true);
  };
  document.getElementById('moreToggleGps').onclick = () => {
    closeMore();
    toggleGpsMode();
  };
  document.getElementById('morePickStart').onclick = () => {
    closeMore();
    stopAllAudio();
    state.routeStage = 'start_stop';
    renderAll();
  };
  document.getElementById('moreBackRoutes').onclick = () => {
    closeMore();
    stopAllAudio();
    stopGpsTracking();
    state.routeStage = 'route';
    state.pageOffset = 0;
    renderAll();
  };

  // 機身實體音量／亮度按鍵
  document.getElementById('hwVolDown').onclick = () => {
    state.volume = Math.max(0.1, Math.round((state.volume - 0.1) * 10) / 10);
    if (currentAudio) currentAudio.volume = state.volume;
    showToast(`音量：${Math.round(state.volume * 100)}%`);
  };
  document.getElementById('hwVolUp').onclick = () => {
    state.volume = Math.min(1.0, Math.round((state.volume + 0.1) * 10) / 10);
    if (currentAudio) currentAudio.volume = state.volume;
    showToast(`音量：${Math.round(state.volume * 100)}%`);
  };
  const applyBrightness = () => {
    const sb = document.getElementById('screenBox');
    if (sb) sb.style.filter = `brightness(${state.brightness})`;
    showToast(`螢幕亮度：${Math.round(state.brightness * 100)}%`);
  };
  document.getElementById('hwBriDown').onclick = () => {
    state.brightness = Math.max(0.4, Math.round((state.brightness - 0.1) * 10) / 10);
    applyBrightness();
  };
  document.getElementById('hwBriUp').onclick = () => {
    state.brightness = Math.min(1.2, Math.round((state.brightness + 0.1) * 10) / 10);
    applyBrightness();
  };
}

// ============ 啟動應用 ============
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(reg => reg.update()).catch(() => {});
}
bindGlobalEvents();
renderTopStatus();
setInterval(renderTopStatus, 1000);
runBootSequence(false);
</script>
