  });
}

function themeClasses() {
  const dark = isNight();
  return {
    dark,
    vp: dark ? 'flex-1 flex flex-col overflow-hidden bg-[#141923] text-white' : 'flex-1 flex flex-col overflow-hidden bg-white text-zinc-900',
    subBar: dark ? 'bg-[#1b2230] border-b border-zinc-700 text-zinc-100' : 'bg-zinc-100 border-b border-zinc-300 text-zinc-900',
    divider: dark ? 'divide-zinc-800' : 'divide-zinc-300',
    row: dark ? 'bg-[#141923] active:bg-zinc-800 text-white' : 'bg-white active:bg-blue-50 text-zinc-900',
    emptyRow: dark ? 'bg-[#10141c]' : 'bg-zinc-50',
    muted: dark ? 'text-zinc-400' : 'text-zinc-500',
    card: dark ? 'bg-[#1b2230] border-zinc-700 text-zinc-100' : 'bg-zinc-50 border-zinc-200 text-zinc-800',
    botBar: dark ? 'grid grid-cols-4 gap-1.5 p-1.5 bg-[#0d1118] border-t border-zinc-800 shrink-0' : 'grid grid-cols-4 gap-1.5 p-1.5 bg-zinc-200 border-t border-zinc-300 shrink-0'
  };
}

// ============ 通用數字鍵盤（員工編號／訓練模式 9999／特別廣播 3 秒自動播） ============
function clearAnnAutoPlayTimers() {
  if (annAutoPlayTimer) { clearTimeout(annAutoPlayTimer); annAutoPlayTimer = null; }
  if (annCountdownInterval) { clearInterval(annCountdownInterval); annCountdownInterval = null; }
}

function closeNumModal() {
  clearAnnAutoPlayTimers();
  document.getElementById('numModal').classList.add('hidden');
}

function openNumericModal(opts) {
  clearAnnAutoPlayTimers();
  const modal = document.getElementById('numModal');
  const titleEl = document.getElementById('numModalTitle');
  const subEl = document.getElementById('numModalSub');
  const dispEl = document.getElementById('numModalDisplay');
  const hintEl = document.getElementById('numModalHint');
  const gridEl = document.getElementById('numModalGrid');

  let value = opts.initialValue || '';
  titleEl.textContent = opts.title || '輸入數字';
  subEl.textContent = opts.subtitle || '';

  const updateView = () => {
    dispEl.textContent = opts.mask ? '●'.repeat(value.length) : value;
    if (opts.onChange) opts.onChange(value, hintEl, closeNumModal);
  };

  const keys = ['1','2','3','4','5','6','7','8','9','X','0','✓'];
  gridEl.innerHTML = keys.map(k => {
    let cls = 'bg-zinc-800 border-zinc-600 text-white active:bg-[#007AFF]';
    if (k === 'X') cls = 'bg-red-700 border-red-500 text-white active:brightness-90';
    if (k === '✓') cls = 'bg-emerald-600 border-emerald-500 text-white active:brightness-90';
    return `<button data-nk="${k}" class="num-key h-14 rounded-xl border font-black text-2xl ${cls}">${k}</button>`;
  }).join('');

  gridEl.querySelectorAll('.num-key').forEach(btn => {
    btn.onclick = () => {
      const k = btn.dataset.nk;
      if (k === 'X') {
        value = '';
        updateView();
      } else if (k === '✓') {
        clearAnnAutoPlayTimers();
        if (opts.onConfirm) opts.onConfirm(value, hintEl, closeNumModal);
      } else if (value.length < (opts.maxLen || 5)) {
        value += k;
        updateView();
      }
    };
  });

  document.getElementById('btnCloseNumModal').onclick = closeNumModal;
  hintEl.textContent = opts.initialHint || '';
  updateView();
  modal.classList.remove('hidden');
}

// 1) 手動輸入 5 位數員工編號（黃字顯示；按 X 清除再按 ✓ 登出手動登入）
function openStaffIdModal() {
  const existingDigits = state.isManualDriver ? (state.driverId.match(/\d{5}/)?.[0] || '') : '';
  openNumericModal({
    title: '輸入員工編號',
    subtitle: '輸入 5 位數員工編號（首個數字為 0 亦需輸入）；按 X 再按 ✓ 登出',
    maxLen: 5,
    initialValue: existingDigits,
    initialHint: state.isManualDriver ? '目前為手動登入（黃字顯示）' : '手動登入後車長名牌將以黃色顯示',
    onChange: (val, hintEl) => {
      if (val.length === 0) hintEl.textContent = '空白按 ✓ 可登出手動員工編號';
      else if (val.length < 5) hintEl.textContent = `尚欠 ${5 - val.length} 位數字`;
      else hintEl.textContent = `準備登入員工編號 ${val}（按 ✓ 確認）`;
    },
    onConfirm: (val, hintEl, close) => {
      if (val === '') {
        state.isManualDriver = false;
        state.driverId = state.defaultDriverLabel;
        close();
        renderTopStatus();
        showToast('已登出手動員工編號，回復八達通車長資料');
        return;
      }
      if (!/^\d{5}$/.test(val)) {
        hintEl.textContent = '請輸入完整 5 位數員工編號（含開頭 0）';
        playAlertBeep(false);
        return;
      }
      state.isManualDriver = true;
      state.driverId = `車長 ${val}`;
      close();
      renderTopStatus();
      showToast(`手動登入成功：${val}（名牌已轉黃色）`);
    }
  });
}

// 2) 路線訓練模式（密碼 9999）
function handleTrainingModeToggle() {
  if (state.trainingMode) {
    if (confirm('確定要退出「訓練模式」並恢復正常營運嗎？')) {
      state.trainingMode = false;
      renderAll();
      showToast('已退出路線訓練模式');
    }
    return;
  }
  openNumericModal({
    title: '路線訓練模式',
    subtitle: '僅供路線訓練時使用，請輸入 4 位數密碼（9999）',
    maxLen: 4,
    mask: true,
    initialHint: '請輸入密碼：9999',
    onChange: (val, hintEl) => {
      hintEl.textContent = val.length === 4 ? '按 ✓ 確認進入訓練模式' : '請輸入 4 位數密碼';
    },
    onConfirm: (val, hintEl, close) => {
      if (val === '9999') {
        state.trainingMode = true;
        close();
        state.settingsPage = 'menu';
        renderAll();
        showToast('已啟動「訓練模式」，電子路線牌已轉為暫停載客');
      } else {
        hintEl.textContent = '密碼錯誤，請輸入 9999';
        playAlertBeep(true);
      }
    }
  });
}

// 3) 特別廣播數字鍵盤（輸入編號後 3 秒自動播放，播完跳回路線）
function openAnnounceKeypadModal() {
  openNumericModal({
    title: '輸入特別訊息編號',
    subtitle: '輸入編號後系統將於 3 秒後自動播放，播畢自動返回路線畫面',
    maxLen: 3,
    initialHint: '請輸入特別訊息編號（例如 1、33）',
    onChange: (val, hintEl, close) => {
      clearAnnAutoPlayTimers();
      if (!val) {
        hintEl.textContent = '請輸入特別訊息編號';
        return;
      }
      const numVal = String(Number(val));
      const item = state.announcements.find(a => String(a.code) === val || String(Number(a.code)) === numVal);
      if (!item) {
        hintEl.textContent = `找不到編號 #${val} 的特別訊息`;
        return;
      }
      const title = state.lang === 'en' ? (item.titleEn || item.titleTc) : (item.titleTc || item.titleEn);
      let remain = 3;
      hintEl.textContent = `#${item.code} ${title}（${remain} 秒後自動播放）`;
      annCountdownInterval = setInterval(() => {
        remain--;
        if (remain > 0) hintEl.textContent = `#${item.code} ${title}（${remain} 秒後自動播放）`;
      }, 1000);
      annAutoPlayTimer = setTimeout(() => {
        close();
        playSpecialAnnouncementByItem(item);
      }, 3000);
    },
    onConfirm: (val, hintEl, close) => {
      if (!val) { close(); return; }
      const numVal = String(Number(val));
      const item = state.announcements.find(a => String(a.code) === val || String(Number(a.code)) === numVal);
      if (!item) {
        hintEl.textContent = `找不到編號 #${val} 的特別訊息`;
        playAlertBeep(false);
        return;
      }
      close();
      playSpecialAnnouncementByItem(item);
    }
  });
}

// ============ 各主畫面渲染 ============
function renderMain() {
  const vp = document.getElementById('mainViewport');
  const bar = document.getElementById('bottomBar');
  if (!vp || !bar) return;
  bar.className = themeClasses().botBar;

  if (state.currentTab === 'route') {
    if (state.routeStage === 'route') renderRouteList(vp, bar);
    else if (state.routeStage === 'bound') renderBoundList(vp, bar);
    else if (state.routeStage === 'trip') renderTripList(vp, bar);
    else if (state.routeStage === 'start_stop') renderStartStopList(vp, bar);
    else renderStopsView(vp, bar);
  } else if (state.currentTab === 'announce') {
    renderAnnounceView(vp, bar);
  } else if (state.currentTab === 'message') {
    renderMessageView(vp, bar);
  } else if (state.currentTab === 'incident') {
    renderIncidentView(vp, bar);
  } else {
    renderSettingsView(vp, bar);
  }
}

function renderRouteList(vp, bar) {
  const th = themeClasses();
  vp.className = th.vp;
  const filtered = state.searchQuery
    ? state.uniqueRouteNos.filter(no => no.includes(state.searchQuery))
    : state.uniqueRouteNos;
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if (state.pageOffset >= totalPages) state.pageOffset = totalPages - 1;
  if (state.pageOffset < 0) state.pageOffset = 0;

  const slice = filtered.slice(state.pageOffset * PAGE_SIZE, (state.pageOffset + 1) * PAGE_SIZE);

  vp.innerHTML = `
    <div class="flex items-center justify-between px-3 py-2 ${th.subBar} shrink-0">
      <div class="flex items-center gap-2">
        <span class="font-black text-sm">${state.lang === 'en' ? 'Select Route' : '選擇路線'}</span>
        ${state.searchQuery ? `<span class="px-2 py-0.5 rounded bg-blue-600/20 text-[#0068FF] text-xs font-black">篩選: ${esc(state.searchQuery)}</span>` : ''}
      </div>
      <span class="text-xs font-bold ${th.muted}">${state.pageOffset + 1} / ${totalPages}</span>
    </div>
    <div class="flex-1 flex flex-col divide-y ${th.divider}">
      ${slice.length === 0 ? `
        <div class="flex-1 flex flex-col items-center justify-center ${th.muted} text-sm font-bold gap-2">
          <div>找不到符合「${esc(state.searchQuery)}」的路線</div>
          <button id="btnResetSearch" class="px-3 py-1.5 rounded bg-[#0068FF] text-white text-xs font-black">清除搜尋</button>
        </div>
      ` : slice.map(no => `
        <button data-route="${esc(no)}" class="pick-route-btn flex-1 px-4 flex items-center justify-between ${th.row} text-left">
          <span class="text-2xl font-black tracking-tight">${esc(no)}</span>
          <span class="${th.muted} text-xl font-bold">›</span>
        </button>
      `).join('')}
      ${slice.length > 0 && slice.length < PAGE_SIZE ? Array(PAGE_SIZE - slice.length).fill(`<div class="flex-1 ${th.emptyRow}"></div>`).join('') : ''}
    </div>
  `;

  const canPrev = state.pageOffset > 0;
  const canNext = state.pageOffset < totalPages - 1;
  bar.innerHTML = `
    <button id="botKeyA" class="h-11 rounded-lg bg-[#0068FF] text-white font-black text-base flex items-center justify-center active:brightness-90">
      <span class="w-7 h-7 rounded-full bg-white text-black font-black text-sm flex items-center justify-center">A</span>
    </button>
    <button id="botPrev" class="h-11 rounded-lg ${canPrev ? 'bg-[#0068FF] text-white' : 'bg-zinc-600 text-zinc-300'} font-black text-xl flex items-center justify-center active:brightness-90">↑</button>
    <button id="botNext" class="h-11 rounded-lg ${canNext ? 'bg-[#0068FF] text-white' : 'bg-zinc-600 text-zinc-300'} font-black text-xl flex items-center justify-center active:brightness-90">↓</button>
    <button id="botSearch" class="h-11 rounded-lg bg-[#0068FF] text-white font-black text-lg flex items-center justify-center active:brightness-90">🔍</button>
  `;

  vp.querySelectorAll('.pick-route-btn').forEach(btn => {
    btn.onclick = () => {
      state.selectedRouteNo = btn.dataset.route;
      state.routeStage = 'bound';
      state.pageOffset = 0;
      renderAll();
    };
  });
  const resetBtn = document.getElementById('btnResetSearch');
  if (resetBtn) resetBtn.onclick = () => { state.searchQuery = ''; state.pageOffset = 0; renderAll(); };

  document.getElementById('botKeyA').onclick = () => openKeypad();
  document.getElementById('botSearch').onclick = () => openKeypad();
  document.getElementById('botPrev').onclick = () => { if (canPrev) { state.pageOffset--; renderAll(); } };
  document.getElementById('botNext').onclick = () => { if (canNext) { state.pageOffset++; renderAll(); } };
}

function renderBoundList(vp, bar) {
  const th = themeClasses();
  vp.className = th.vp;
  const matches = state.routes.filter(r => getRouteNo(r) === state.selectedRouteNo);
  const byDest = new Map();
  for (const r of matches) {
    const dKey = getDestGroupKey(r);
    if (!byDest.has(dKey)) byDest.set(dKey, []);
    byDest.get(dKey).push(r);
  }
  const groups = Array.from(byDest.entries());

  vp.innerHTML = `
    <div class="flex items-center justify-between px-3 py-2 ${th.subBar} shrink-0">
      <span class="font-black text-sm">路線 ${esc(state.selectedRouteNo)} · 選擇目的地</span>
      <span class="text-xs font-bold ${th.muted}">${groups.length} 個方向</span>
    </div>
    <div class="flex-1 flex flex-col divide-y ${th.divider} overflow-y-auto no-scrollbar">
      ${groups.map(([dKey, list]) => {
        const rep = list[0];
        const dest = state.lang === 'en' ? (getDestEn(rep) || getDestTc(rep) || dKey) : (getDestTc(rep) || getDestEn(rep) || dKey);
        const orig = state.lang === 'en' ? (getOrigEn(rep) || getOrigTc(rep)) : (getOrigTc(rep) || getOrigEn(rep));
        return `
          <button data-destkey="${esc(dKey)}" class="pick-bound-btn px-4 py-4 flex items-center justify-between ${th.row} text-left">
            <div class="min-w-0 pr-2">
              <div class="text-xs font-black text-[#0068FF] mb-0.5">${list.length} 個班次</div>
              <div class="text-xl font-black truncate">往 ${esc(dest)}</div>
              ${orig ? `<div class="text-xs font-bold ${th.muted} truncate mt-0.5">由 ${esc(orig)} 開出</div>` : ''}
            </div>
            <span class="${th.muted} text-xl font-bold">›</span>
          </button>
        `;
      }).join('')}
    </div>
  `;

  bar.innerHTML = `
    <button id="botBack" class="h-11 rounded-lg bg-[#d92b1c] text-white font-black text-xl flex items-center justify-center active:brightness-90">‹</button>
    <button class="h-11 rounded-lg bg-zinc-600 text-zinc-300 font-black text-xl flex items-center justify-center">↑</button>
    <button class="h-11 rounded-lg bg-zinc-600 text-zinc-300 font-black text-xl flex items-center justify-center">↓</button>
    <button id="botHome" class="h-11 rounded-lg bg-[#0068FF] text-white font-black text-xs flex items-center justify-center active:brightness-90">路線表</button>
  `;

  vp.querySelectorAll('.pick-bound-btn').forEach(btn => {
    btn.onclick = () => {
      state.selectedBound = btn.dataset.destkey;
      state.routeStage = 'trip';
      state.pageOffset = 0;
      renderAll();
    };
  });
  document.getElementById('botBack').onclick = () => { state.routeStage = 'route'; state.pageOffset = 0; renderAll(); };
  document.getElementById('botHome').onclick = () => { state.routeStage = 'route'; state.pageOffset = 0; renderAll(); };
}

function renderTripList(vp, bar) {
  const th = themeClasses();
  vp.className = th.vp;
  const trips = state.routes.filter(r => getRouteNo(r) === state.selectedRouteNo && getDestGroupKey(r) === state.selectedBound);
  const totalPages = Math.max(1, Math.ceil(trips.length / PAGE_SIZE));
  if (state.pageOffset >= totalPages) state.pageOffset = totalPages - 1;
  const slice = trips.slice(state.pageOffset * PAGE_SIZE, (state.pageOffset + 1) * PAGE_SIZE);

  vp.innerHTML = `
    <div class="flex items-center justify-between px-3 py-2 ${th.subBar} shrink-0">
      <span class="font-black text-sm truncate pr-2">${esc(state.selectedRouteNo)} 往 ${esc(state.selectedBound)} · 選擇行車路線</span>
      <span class="text-xs font-bold ${th.muted} shrink-0">${state.pageOffset + 1} / ${totalPages}</span>
    </div>
    <div class="flex-1 flex flex-col divide-y ${th.divider} overflow-y-auto no-scrollbar">
      ${slice.map((t, idx) => {
        const globalIdx = state.pageOffset * PAGE_SIZE + idx;
        const dest = state.lang === 'en' ? (getDestEn(t) || getDestTc(t)) : (getDestTc(t) || getDestEn(t));
        const remark = getRealTripRemark(t);
        return `
          <button data-tidx="${globalIdx}" class="pick-trip-btn flex-1 px-4 py-3 flex items-center justify-between ${th.row} text-left">
            <div class="min-w-0 pr-2">
              <div class="text-lg font-black truncate">${esc(state.selectedRouteNo)}-${esc(dest || '班次')}-${globalIdx + 1}</div>
              ${remark ? `<div class="text-xs font-bold ${th.muted} truncate mt-0.5">${esc(remark)}</div>` : ''}
            </div>
            <span class="${th.muted} text-xl font-bold">›</span>
          </button>
        `;
      }).join('')}
      ${slice.length < PAGE_SIZE ? Array(PAGE_SIZE - slice.length).fill(`<div class="flex-1 ${th.emptyRow}"></div>`).join('') : ''}
    </div>
  `;

  const canPrev = state.pageOffset > 0;
  const canNext = state.pageOffset < totalPages - 1;
  bar.innerHTML = `
    <button id="botBack" class="h-11 rounded-lg bg-[#d92b1c] text-white font-black text-xl flex items-center justify-center active:brightness-90">‹</button>
    <button id="botPrev" class="h-11 rounded-lg ${canPrev ? 'bg-[#0068FF] text-white' : 'bg-zinc-600 text-zinc-300'} font-black text-xl flex items-center justify-center">↑</button>
    <button id="botNext" class="h-11 rounded-lg ${canNext ? 'bg-[#0068FF] text-white' : 'bg-zinc-600 text-zinc-300'} font-black text-xl flex items-center justify-center">↓</button>
    <button id="botHome" class="h-11 rounded-lg bg-[#0068FF] text-white font-black text-xs flex items-center justify-center">路線表</button>
  `;

  vp.querySelectorAll('.pick-trip-btn').forEach(btn => {
    btn.onclick = async () => {
      const tidx = Number(btn.dataset.tidx);
      const t = trips[tidx];
      if (!t) return;
      state.selectedTrip = t;
      state.selectedTripSeq = tidx + 1;
      try {
        state.tripStops = await ensureStopsLoaded(t);
        state.currentStopIdx = 0;
        state.pageOffset = 0;
        state.routeStage = 'start_stop';
        renderAll();
      } catch (err) {
        showToast('載入站點資料失敗：' + err.message);
        renderAll();
      }
    };
  });
  document.getElementById('botBack').onclick = () => { state.routeStage = 'bound'; state.pageOffset = 0; renderAll(); };
  document.getElementById('botHome').onclick = () => { state.routeStage = 'route'; state.pageOffset = 0; renderAll(); };
  document.getElementById('botPrev').onclick = () => { if (canPrev) { state.pageOffset--; renderAll(); } };
  document.getElementById('botNext').onclick = () => { if (canNext) { state.pageOffset++; renderAll(); } };
}

function renderStartStopList(vp, bar) {
  const th = themeClasses();
  vp.className = th.vp;
  const sections = computeTripSections(state.tripStops, state.selectedTrip);
  const totalPages = Math.max(1, Math.ceil(state.tripStops.length / PAGE_SIZE));
  if (state.pageOffset >= totalPages) state.pageOffset = totalPages - 1;
  const slice = state.tripStops.slice(state.pageOffset * PAGE_SIZE, (state.pageOffset + 1) * PAGE_SIZE);

  vp.innerHTML = `
    <div class="flex items-center justify-between px-3 py-2 ${th.subBar} shrink-0">
      <span class="font-black text-sm">${esc(state.selectedRouteNo)} · 選擇開始站位</span>
      <span class="text-xs font-bold ${th.muted}">${state.pageOffset + 1} / ${totalPages} (共 ${state.tripStops.length} 站)</span>
    </div>
    <div class="flex-1 flex flex-col divide-y ${th.divider} overflow-y-auto no-scrollbar">
      ${slice.length === 0 ? `
        <div class="flex-1 flex items-center justify-center ${th.muted} text-sm font-bold">此班次暫無站點資料</div>
      ` : slice.map((st, idx) => {
        const sIdx = state.pageOffset * PAGE_SIZE + idx;
        const hasAudio = !!getEffectiveStopAudio(st);
        const sub = getStopSub(st);
        const secInfo = sections[sIdx] || {};
        return `
          <button data-sidx="${sIdx}" class="pick-start-btn flex-1 px-4 py-2.5 flex items-center justify-between ${th.row} text-left">
            <div class="min-w-0 pr-2">
              <div class="text-lg font-black truncate">${sIdx + 1}. ${esc(state.lang === 'en' ? (getStopNameEn(st) || getStopNameTc(st)) : getStopNameTc(st))}</div>
              ${sub ? `<div class="text-xs font-bold ${th.muted} truncate">${esc(sub)}</div>` : ''}
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              ${secInfo.badgeFare != null ? `<span class="px-1.5 py-0.5 rounded bg-emerald-600 text-white text-[11px] font-black">${esc(fmtFare(secInfo.badgeFare))}</span>` : ''}
              ${hasAudio ? `<span class="px-1.5 py-0.5 rounded ${th.dark ? 'bg-zinc-800 text-emerald-400 border border-zinc-600' : 'bg-emerald-100 text-emerald-700'} text-[10px] font-black">MP3</span>` : ''}
              <span class="${th.muted} text-xl font-bold">›</span>
            </div>
          </button>
        `;
      }).join('')}
      ${slice.length > 0 && slice.length < PAGE_SIZE ? Array(PAGE_SIZE - slice.length).fill(`<div class="flex-1 ${th.emptyRow}"></div>`).join('') : ''}
    </div>
  `;

  const canPrev = state.pageOffset > 0;
  const canNext = state.pageOffset < totalPages - 1;
  bar.innerHTML = `
    <button id="botBack" class="h-11 rounded-lg bg-[#d92b1c] text-white font-black text-xl flex items-center justify-center active:brightness-90">‹</button>
    <button id="botPrev" class="h-11 rounded-lg ${canPrev ? 'bg-[#0068FF] text-white' : 'bg-zinc-600 text-zinc-300'} font-black text-xl flex items-center justify-center">↑</button>
    <button id="botNext" class="h-11 rounded-lg ${canNext ? 'bg-[#0068FF] text-white' : 'bg-zinc-600 text-zinc-300'} font-black text-xl flex items-center justify-center">↓</button>
    <button id="botQuickStart" class="h-11 rounded-lg bg-emerald-600 text-white font-black text-xs flex items-center justify-center">第1站開出</button>
  `;

  const enterStops = startIdx => {
    state.currentStopIdx = startIdx;
    state.stopProgressPct = 20;
    state.gpsDistanceM = null;
    state.gpsArrivedCur = false;
    state.gpsMinDistToCur = Infinity;
    state.lastAnnouncedKey = '';
    state.routeStage = 'stops';
    if (state.gpsEnabled) startGpsTracking();
    renderAll();
    triggerStopAnnouncement(state.currentStopIdx, true);
  };

  vp.querySelectorAll('.pick-start-btn').forEach(btn => {
    btn.onclick = () => enterStops(Number(btn.dataset.sidx));
  });
  document.getElementById('botBack').onclick = () => { state.routeStage = 'trip'; state.pageOffset = 0; renderAll(); };
  document.getElementById('botPrev').onclick = () => { if (canPrev) { state.pageOffset--; renderAll(); } };
  document.getElementById('botNext').onclick = () => { if (canNext) { state.pageOffset++; renderAll(); } };
  document.getElementById('botQuickStart').onclick = () => { if (state.tripStops.length > 0) enterStops(0); };
}

// ============ 報站主畫面 ============
function renderStopsView(vp, bar) {
  const th = themeClasses();
  vp.className = th.vp;
  const cur = state.tripStops[state.currentStopIdx];
  if (!cur) {
    vp.innerHTML = `<div class="flex-1 flex items-center justify-center ${th.muted} font-bold">無站點資料</div>`;
    return;
  }

  const sections = computeTripSections(state.tripStops, state.selectedTrip);
  const curSec = sections[state.currentStopIdx] || { sectionNo: 1, activeFare: null, badgeFare: null };
  const trip = state.selectedTrip || {};
  const dest = state.lang === 'en' ? (getDestEn(trip) || getDestTc(trip)) : (getDestTc(trip) || getDestEn(trip));
  const remark = getRealTripRemark(trip);
  const upcoming = state.tripStops.slice(state.currentStopIdx + 1, state.currentStopIdx + 6);
  const curName = state.lang === 'en' ? (getStopNameEn(cur) || getStopNameTc(cur)) : getStopNameTc(cur);
  const curSub = getStopSub(cur);
  const hasAudio = !!getEffectiveStopAudio(cur);

  const curPanelCls = th.dark ? 'bg-[#12161f] border-b border-zinc-700/80' : 'bg-white border-b border-zinc-300';
  const secBoxCls = th.dark ? 'border-zinc-500/80 bg-[#141923] text-white' : 'border-zinc-400 bg-white text-zinc-900';
  const gpsBtnCls = th.dark ? 'bg-zinc-800 border-zinc-600 text-zinc-200' : 'bg-zinc-100 border-zinc-300 text-zinc-800';
  const modeStatusBadge = state.gpsEnabled && state.currentStopIdx === 0
    ? '自動靜音'
    : (!state.gpsEnabled && state.currentStopIdx === 0
      ? (getWelcomeAudioFile() ? 'HKOWS 歡迎詞' : 'G-TTS 歡迎詞')
      : (state.gpsEnabled && state.currentStopIdx === 1
        ? '歡迎詞+站名'
        : (hasAudio ? 'HKOWS' : 'G-TTS')));

  vp.innerHTML = `
    <div class="px-3.5 py-2.5 ${th.subBar} flex items-center justify-between gap-2 shrink-0">
      <div class="min-w-0">
        <div class="text-xl font-black tracking-tight truncate">${esc(state.selectedRouteNo)}-${esc(dest || '終點')}-${esc(state.selectedTripSeq || 1)}</div>
        ${remark ? `<div class="text-xs font-bold ${th.muted} truncate mt-0.5">${esc(remark)}</div>` : ''}
      </div>
      <div class="min-w-[68px] px-2 py-1 rounded border ${secBoxCls} text-center shrink-0">
        <div class="text-[10px] font-bold ${th.muted} leading-none">分段 ${esc(curSec.sectionNo)}</div>
        ${curSec.activeFare != null
          ? `<div class="mt-0.5 px-1.5 py-0.5 rounded bg-emerald-600 text-white text-xs font-black leading-none">${esc(fmtFare(curSec.activeFare))}</div>`
          : `<div class="text-xl font-black leading-tight mt-0.5">${esc(curSec.sectionNo)}</div>`
        }
      </div>
    </div>

    <div class="px-3.5 py-3 ${curPanelCls} shrink-0">
      <button id="btnReplayCurrent" class="w-full text-left active:opacity-80">
        <div class="flex items-start justify-between gap-2">
          <div class="text-2xl font-black leading-snug">${state.currentStopIdx + 1}. ${esc(curName)}</div>
          <div class="flex items-center gap-1 shrink-0 mt-1">
            ${curSec.badgeFare != null ? `<span class="px-1.5 py-0.5 rounded bg-emerald-600 text-white text-[11px] font-black">${esc(fmtFare(curSec.badgeFare))}</span>` : ''}
            <span class="px-1.5 py-0.5 rounded ${th.dark ? 'bg-zinc-800 border border-zinc-600 text-emerald-400' : 'bg-zinc-100 border border-zinc-300 text-emerald-700'} text-[10px] font-black">
              ${modeStatusBadge}
            </span>
          </div>
        </div>
        ${curSub ? `<div class="text-xs font-bold ${th.muted} mt-0.5 truncate">${esc(curSub)}</div>` : ''}
      </button>

      <div class="flex items-center justify-between mt-3 mb-2">
        <span id="gpsLiveText" class="text-xs font-black ${state.gpsEnabled ? 'text-emerald-500' : th.muted}">
          ${state.gpsEnabled
            ? (state.gpsArrivedCur
              ? (state.currentStopIdx >= state.tripStops.length - 1 ? 'GPS 自動 · 已到達終點站' : 'GPS 自動 · 已到站（離站後播下站）')
              : (state.gpsDistanceM != null ? `GPS 自動 · 距本站 ${state.gpsDistanceM}m` : 'GPS 自動報站中'))
            : '手動模式'}
        </span>
        <button id="btnToggleGpsInline" class="px-2.5 py-1 rounded border ${gpsBtnCls} text-[11px] font-black active:scale-95">
          切換${state.gpsEnabled ? '手動 (M)' : 'GPS 自動'}
        </button>
      </div>

      ${!state.gpsEnabled ? `
        <div class="grid grid-cols-2 gap-3 mt-1">
          <button id="btnManualStop" class="h-14 rounded-xl bg-[#d92b1c] active:brightness-90 text-white font-black text-lg shadow">
            停止
          </button>
          <button id="btnManualNext" class="h-14 rounded-xl bg-[#0068FF] active:brightness-90 text-white font-black text-lg shadow">
            下一站
          </button>
        </div>
      ` : `
        <div class="mt-1 space-y-2">
          <div class="w-full h-4 ${th.dark ? 'bg-zinc-800 border-zinc-600' : 'bg-zinc-200 border-zinc-400'} rounded overflow-hidden border">
            <div id="stopProgressFill" class="h-full bg-[#0068FF] transition-all duration-300" style="width:${state.stopProgressPct}%"></div>
          </div>
          <div class="flex justify-between text-[11px] font-bold ${th.muted}">
            <span>離開本站後 (&gt;55m) 自動播下站</span>
            <span>第 ${state.currentStopIdx + 1} / ${state.tripStops.length} 站</span>
          </div>
        </div>
      `}
    </div>

    <div class="flex-1 overflow-y-auto no-scrollbar divide-y ${th.divider}">
      ${upcoming.length === 0 ? `
        <div class="px-4 py-6 text-center text-sm font-bold text-amber-500">已到達本班次終點站</div>
      ` : upcoming.map((st, offset) => {
        const targetIdx = state.currentStopIdx + 1 + offset;
        const nm = state.lang === 'en' ? (getStopNameEn(st) || getStopNameTc(st)) : getStopNameTc(st);
        const sInfo = sections[targetIdx] || {};
        return `
          <button data-jump="${targetIdx}" class="jump-stop-btn w-full px-4 py-3.5 text-left ${th.row} flex items-center justify-between gap-2">
            <span class="text-lg font-extrabold truncate">${targetIdx + 1}. ${esc(nm)}</span>
            <div class="flex items-center gap-1.5 shrink-0">
              ${sInfo.badgeFare != null ? `<span class="px-1.5 py-0.5 rounded bg-emerald-600 text-white text-[11px] font-black">${esc(fmtFare(sInfo.badgeFare))}</span>` : ''}
              ${st.approachAudioFile ? '<span class="px-1.5 py-0.5 rounded bg-blue-600/20 text-[#0068FF] text-[10px] font-bold">+提示</span>' : ''}
            </div>
          </button>
        `;
      }).join('')}
    </div>
  `;

  const canPrev = state.currentStopIdx > 0;
  const canNext = state.currentStopIdx < state.tripStops.length - 1;
  bar.innerHTML = `
    <button id="botBack" class="h-11 rounded-lg bg-[#d92b1c] text-white font-black text-xl flex items-center justify-center active:brightness-90">‹</button>
    <button id="botPrev" class="h-11 rounded-lg ${canPrev ? 'bg-[#0068FF] text-white' : 'bg-zinc-600 text-zinc-300'} font-black text-xl flex items-center justify-center active:brightness-90">↑</button>
    <button id="botNext" class="h-11 rounded-lg ${canNext ? 'bg-[#0068FF] text-white' : 'bg-zinc-600 text-zinc-300'} font-black text-xl flex items-center justify-center active:brightness-90">↓</button>
    <button id="botMore" class="h-11 rounded-lg bg-[#0068FF] text-white font-black text-lg flex items-center justify-center active:brightness-90">•••</button>
  `;

  const advanceStop = () => {
    if (state.currentStopIdx < state.tripStops.length - 1) {
      state.currentStopIdx++;
      state.stopProgressPct = 20;
      state.gpsDistanceM = null;
      state.gpsArrivedCur = false;
      state.gpsMinDistToCur = Infinity;
      renderAll();
      triggerStopAnnouncement(state.currentStopIdx, true);
    } else {
      showToast('已到達終點站');
    }
  };
  const prevStop = () => {
    if (state.currentStopIdx > 0) {
      state.currentStopIdx--;
      state.stopProgressPct = 20;
      state.gpsDistanceM = null;
      state.gpsArrivedCur = false;
      state.gpsMinDistToCur = Infinity;
      renderAll();
      triggerStopAnnouncement(state.currentStopIdx, true);
    }
  };

  document.getElementById('btnReplayCurrent').onclick = () => {
    if (state.gpsEnabled && state.currentStopIdx === 0) {
      stopAllAudio();
      showToast('自動模式第 1 站不播報，離站往第 2 站時播歡迎詞及站名');
      return;
    }
    triggerStopAnnouncement(state.currentStopIdx, true);
    showToast(state.currentStopIdx === 0 ? '重播歡迎詞' : '重播報站');
  };
  document.getElementById('btnToggleGpsInline').onclick = () => toggleGpsMode();

  const btnStop = document.getElementById('btnManualStop');
  if (btnStop) {
    btnStop.onclick = () => {
      stopAllAudio();
      stopGpsTracking();
      state.routeStage = 'start_stop';
      renderAll();
      showToast('已停止報站');
    };
  }
  const btnNext = document.getElementById('btnManualNext');
  if (btnNext) btnNext.onclick = advanceStop;

  vp.querySelectorAll('.jump-stop-btn').forEach(btn => {
    btn.onclick = () => {
      state.currentStopIdx = Number(btn.dataset.jump);
      state.stopProgressPct = 20;
      state.gpsDistanceM = null;
      state.gpsArrivedCur = false;
      state.gpsMinDistToCur = Infinity;
      renderAll();
      triggerStopAnnouncement(state.currentStopIdx, true);
    };
  });

  document.getElementById('botBack').onclick = () => {
    stopAllAudio();
    stopGpsTracking();
    state.routeStage = 'start_stop';
    renderAll();
  };
  document.getElementById('botPrev').onclick = prevStop;
  document.getElementById('botNext').onclick = advanceStop;
  document.getElementById('botMore').onclick = () => document.getElementById('moreModal').classList.remove('hidden');
}

// ============ 特別廣播分頁（支援數字鍵盤 3 秒自動播＋播畢跳回路線） ============
function renderAnnounceView(vp, bar) {
  const th = themeClasses();
  vp.className = th.vp;
  const totalPages = Math.max(1, Math.ceil(state.announcements.length / PAGE_SIZE));
  if (state.announcePage >= totalPages) state.announcePage = totalPages - 1;
  const slice = state.announcements.slice(state.announcePage * PAGE_SIZE, (state.announcePage + 1) * PAGE_SIZE);

  vp.innerHTML = `
    <div class="flex items-center justify-between px-3 py-2 ${th.subBar} shrink-0">
      <span class="font-black text-sm">特別訊息（播畢自動返回路線）</span>
      <span class="text-xs font-bold ${th.muted}">${state.announcePage + 1} / ${totalPages}</span>
    </div>
    <div class="flex-1 flex flex-col divide-y ${th.divider}">
      ${slice.map(item => {
        const code = String(item.code ?? '');
        const title = state.lang === 'en' ? (item.titleEn || item.titleTc) : (item.titleTc || item.titleEn);
        const isPlaying = state.playingAnnCode === code;
        return `
          <button data-acode="${esc(code)}" class="play-ann-btn flex-1 px-4 py-2 flex items-center justify-between ${th.row} text-left">
            <div class="min-w-0 pr-2">
              <div class="text-sm font-black truncate">${esc(code)}. ${esc(title)}</div>
              <div class="text-[11px] font-semibold ${th.muted} truncate mt-0.5">${esc(item.ttsTc || item.ttsEn || '')}</div>
            </div>
            <span class="w-9 h-9 rounded-full ${isPlaying ? 'bg-red-600' : 'bg-emerald-600'} text-white font-black text-sm flex items-center justify-center shrink-0">
              ${isPlaying ? '■' : '▶'}
            </span>
          </button>
        `;
      }).join('')}
      ${slice.length < PAGE_SIZE ? Array(PAGE_SIZE - slice.length).fill(`<div class="flex-1 ${th.emptyRow}"></div>`).join('') : ''}
    </div>
  `;

  const canPrev = state.announcePage > 0;
  const canNext = state.announcePage < totalPages - 1;
  bar.innerHTML = `
    <button id="botAnnStop" class="h-11 rounded-lg bg-[#d92b1c] text-white font-black text-xs flex items-center justify-center active:brightness-90">停止</button>
    <button id="botPrev" class="h-11 rounded-lg ${canPrev ? 'bg-[#0068FF] text-white' : 'bg-zinc-600 text-zinc-300'} font-black text-xl flex items-center justify-center">↑</button>
    <button id="botNext" class="h-11 rounded-lg ${canNext ? 'bg-[#0068FF] text-white' : 'bg-zinc-600 text-zinc-300'} font-black text-xl flex items-center justify-center">↓</button>
    <button id="botAnnKeypad" class="h-11 rounded-lg bg-[#0068FF] text-white font-black text-xs flex items-center justify-center gap-1 active:brightness-90">
      <span>🔢</span><span>鍵盤</span>
    </button>
  `;

  vp.querySelectorAll('.play-ann-btn').forEach(btn => {
    btn.onclick = () => {
      const code = btn.dataset.acode;
      if (state.playingAnnCode === code) {
        stopAllAudio();
        renderMain();
        showToast('已中止播放特別訊息');
        return;
      }
      const item = state.announcements.find(a => String(a.code) === code);
      if (item) playSpecialAnnouncementByItem(item);
    };
  });
  document.getElementById('botAnnStop').onclick = () => { stopAllAudio(); renderMain(); showToast('已停止廣播'); };
  document.getElementById('botPrev').onclick = () => { if (canPrev) { state.announcePage--; renderAll(); } };
  document.getElementById('botNext').onclick = () => { if (canNext) { state.announcePage++; renderAll(); } };
  document.getElementById('botAnnKeypad').onclick = () => openAnnounceKeypadModal();
}

// ============ 訊息收件匣（停車 ≥3s 安全鎖＋聲音訊息綠色播放掣＋行車自動彈回） ============
function playVoiceMessage(m) {
  if (!m) return;
  m.unread = false;
  renderTopStatus();
  if (state.currentTab === 'message') renderMain();
  showToast(`播放聲音訊息：${m.title}`);
  playAnnouncementSegments([
    { files: m.voiceFile ? [m.voiceFile] : [], tc: m.body, en: '', sc: '' }
  ]);
}

function renderMessageView(vp, bar) {
  const th = themeClasses();
  vp.className = th.vp;

  vp.innerHTML = `
    <div class="flex items-center justify-between px-3 py-2 ${th.subBar} shrink-0">
      <span class="font-black text-sm">訊息收件匣</span>
      <span class="text-xs font-bold ${th.muted}">共 ${state.messages.length} 則（行車將自動返回）</span>
    </div>
    <div class="flex-1 overflow-y-auto no-scrollbar divide-y ${th.divider}">
      ${state.messages.map(m => `
        <div data-mid="${m.id}" class="msg-row p-3.5 ${m.unread ? (th.dark ? 'bg-amber-950/35' : 'bg-amber-50') : ''} cursor-pointer">
          <div class="flex items-start justify-between gap-2 mb-1">
            <div class="min-w-0">
              <div class="flex items-center gap-1.5">
                <span class="text-xs font-black text-[#0068FF]">${esc(m.sender)}</span>
                <span class="text-[11px] font-mono ${th.muted}">${esc(m.time)}</span>
                ${m.unread ? '<span class="px-1.5 py-0.2 rounded bg-red-600 text-white text-[10px] font-black">未讀</span>' : ''}
              </div>
              <div class="text-sm font-black mt-0.5">${esc(m.title)}</div>
            </div>
            ${m.isVoice ? `
              <button data-vplay="${m.id}" title="重聽聲音訊息" class="voice-play-btn w-9 h-9 rounded-lg bg-[#22c55e] active:brightness-90 text-white font-black text-base flex items-center justify-center shrink-0 shadow">
                ▶
              </button>
            ` : ''}
          </div>
          <div class="text-xs font-medium ${th.muted} mt-1 leading-relaxed">${esc(m.body)}</div>
        </div>
      `).join('')}
    </div>
  `;
  bar.innerHTML = `
    <button id="botReadAll" class="col-span-2 h-11 rounded-lg bg-emerald-600 text-white font-black text-sm">全部標為已讀</button>
    <button id="botBackRoute" class="col-span-2 h-11 rounded-lg bg-[#0068FF] text-white font-black text-sm">返回路線</button>
  `;

  vp.querySelectorAll('.voice-play-btn').forEach(btn => {
    btn.onclick = e => {
      e.stopPropagation();
      const m = state.messages.find(x => x.id === Number(btn.dataset.vplay));
      if (m) playVoiceMessage(m);
    };
  });
  vp.querySelectorAll('.msg-row').forEach(el => {
    el.onclick = () => {
      const m = state.messages.find(x => x.id === Number(el.dataset.mid));
      if (m) m.unread = false;
      renderAll();
    };
  });
  document.getElementById('botReadAll').onclick = () => {
    state.messages.forEach(m => { m.unread = false; });
    renderAll();
  };
  document.getElementById('botBackRoute').onclick = () => { state.currentTab = 'route'; renderAll(); };
}

// ============ 三段式紅頂「事故」功能（停車 ≥3s 安全鎖 -> 完成過客／繼續行程 -> 完成處理） ============
function renderIncidentView(vp, bar) {
  const th = themeClasses();
  vp.className = th.vp;
  const inc = state.incidentState;

  // 階段二：事故進行中（紅頂、暫停自動報站、電子牌暫停載客）
  if (inc.stage === 'active') {
    vp.innerHTML = `
      <div class="px-3 py-2 bg-red-700 text-white font-black text-sm flex items-center justify-between shrink-0">
        <span>⚠ 事故模式進行中</span>
        <span class="font-mono text-xs">${esc(inc.startTime)}</span>
      </div>
      <div class="flex-1 flex flex-col justify-between p-4">
        <div class="space-y-3">
          <div class="p-3.5 rounded-xl bg-red-600/15 border-2 border-red-600">
            <div class="text-xs font-black text-red-500">已啟動事故類別</div>
            <div class="text-2xl font-black mt-0.5">${esc(inc.type)}</div>
            <div class="text-xs font-bold ${th.muted} mt-2 space-y-1">
              <div>• 已回報位置並中止預計抵站時間</div>
              <div>• 自動報站已暫停，電子牌轉為「暫停載客」</div>
              <div>• 請按程序致電控制中心，依督導人員指示操作</div>
            </div>
          </div>

          <div class="grid grid-cols-1 gap-3 pt-1">
            <button id="btnIncTransfer" class="h-14 rounded-xl bg-amber-500 active:brightness-90 text-black font-black text-lg shadow">

            </button>
            <button id="btnIncResume" class="h-14 rounded-xl bg-emerald-600 active:brightness-90 text-white font-black text-lg shadow">
              繼續行程
            </button>
          </div>
        </div>
        <div class="text-[11px] font-bold ${th.muted} text-center">如遇緊急情況，請先報警及安頓乘客</div>
      </div>
    `;
    bar.innerHTML = `
      <button id="botIncReplay" class="col-span-4 h-11 rounded-lg bg-red-700 text-white font-black text-sm">重播事故車廂廣播</button>
    `;
    document.getElementById('btnIncTransfer').onclick = () => {
      state.incidentState.stage = 'transferred';
      renderAll();
      showToast('已完成過客，電子牌維持「暫停載客」');
    };
    document.getElementById('btnIncResume').onclick = () => {
      state.incidentState = { stage: 'idle', type: '', startTime: '' };
      state.currentTab = 'route';
      renderAll();
      showToast('已結束事故模式，繼續餘下行程');
    };
    document.getElementById('botIncReplay').onclick = () => {
      playAnnouncementSegments([{
        files: [],
        tc: '各位乘客請注意，因發生突發事故，本班車暫時停止行駛，不便之處，敬請見諒。',
        en: 'Attention passengers, due to an incident, this bus service is temporarily suspended. We apologize for the inconvenience.',
        sc: '各位乘客请注意，因发生突发事故，本班车暂时停止行驶。'
      }]);
    };
    return;
  }

  // 階段三：已完成過客，待巴士離開現場按「完成處理」
  if (inc.stage === 'transferred') {
    vp.innerHTML = `
      <div class="px-3 py-2 bg-red-700 text-white font-black text-sm flex items-center justify-between shrink-0">
        <span>⚠ 事故模式 · 已完成過客</span>
        <span class="font-mono text-xs">${esc(inc.startTime)}</span>
      </div>
      <div class="flex-1 flex flex-col justify-center p-4 space-y-4">
        <div class="p-4 rounded-xl border-2 border-amber-500 bg-amber-500/10 space-y-2 text-center">
          <div class="text-lg font-black">${esc(inc.type)}（已過客）</div>
          <div class="text-xs font-bold ${th.muted} leading-relaxed">
            電子路線牌已轉為「暫停載客」。<br/>
            當巴士準備離開現場時，請按下「完成處理」，系統將中途中止車程並自動記錄於電子站長紙。
          </div>
        </div>
        <button id="btnIncFinish" class="h-16 rounded-xl bg-red-600 active:brightness-90 text-white font-black text-xl shadow-lg">
          完成處理
        </button>
      </div>
    `;
    bar.innerHTML = `
      <button id="botIncBackStep2" class="col-span-4 h-11 rounded-lg bg-zinc-700 text-white font-black text-sm">返回上一步</button>
    `;
    document.getElementById('btnIncFinish').onclick = () => {
      state.incidents.unshift({
        type: inc.type,
        time: inc.startTime,
        endTime: new Date().toTimeString().slice(0, 8),
        route: state.selectedRouteNo || '未入線'
      });
      state.incidentState = { stage: 'idle', type: '', startTime: '' };
      stopAllAudio();
      stopGpsTracking();
      state.routeStage = 'route';
      state.currentTab = 'route';
      renderAll();
      showToast('已完成事故處理並記錄於電子站長紙');
    };
    document.getElementById('botIncBackStep2').onclick = () => {
      state.incidentState.stage = 'active';
      renderAll();
    };
    return;
  }

  // 階段一：停車 ≥3 秒安全鎖檢查 + 選擇事故類別
  if (!state.isStopped3s) {
    vp.innerHTML = `
      <div class="px-3 py-2 ${th.subBar} font-black text-sm shrink-0">事故功能</div>
      <div class="flex-1 flex flex-col items-center justify-center p-6 text-center space-y-3">
        <div class="w-14 h-14 rounded-full bg-red-600/20 text-red-500 flex items-center justify-center text-3xl font-black">!</div>
        <div class="text-base font-black">行車期間停用「事故」功能</div>
        <div class="text-xs font-bold ${th.muted} leading-relaxed">
          為保障駕駛安全，必須於安全位置停下達 3 秒或以上才可使用事故功能。<br/>
          （電腦測試可點右上角 [123] 切換回停車狀態）
        </div>
      </div>
    `;
    bar.innerHTML = `
      <button id="botBackRoute" class="col-span-4 h-11 rounded-lg bg-[#0068FF] text-white font-black text-sm">返回路線</button>
    `;
    document.getElementById('botBackRoute').onclick = () => { state.currentTab = 'route'; renderAll(); };
    return;
  }

  const types = ['車輛故障', '交通意外', '乘客不適', '交通擠塞', '臨時改道', '道路封閉'];
  vp.innerHTML = `
    <div class="px-3 py-2 ${th.subBar} font-black text-sm shrink-0">選擇事故類別（停車 ≥3s 可用）</div>
    <div class="p-3 grid grid-cols-2 gap-2 shrink-0">
      ${types.map(t => `
        <button data-itype="${esc(t)}" class="inc-btn py-3.5 rounded-lg bg-red-600 active:brightness-90 text-white font-black text-sm shadow-sm">${esc(t)}</button>
      `).join('')}
    </div>
    <div class="px-3 py-1.5 ${th.subBar} text-xs font-black shrink-0">電子站長紙事故記錄 (${state.incidents.length})</div>
    <div class="flex-1 overflow-y-auto no-scrollbar divide-y ${th.divider} px-3">
      ${state.incidents.length === 0 ? `<div class="py-6 text-center text-xs ${th.muted} font-bold">暫無已中止車程事故記錄</div>` : state.incidents.map(rec => `
        <div class="py-2 flex items-center justify-between text-xs">
          <span class="font-black text-red-500">${esc(rec.route)} · ${esc(rec.type)}</span>
          <span class="font-mono ${th.muted}">${esc(rec.time)}-${esc(rec.endTime || '')}</span>
        </div>
      `).join('')}
    </div>
  `;
  bar.innerHTML = `
    <button id="botClearInc" class="col-span-2 h-11 rounded-lg bg-zinc-700 text-white font-black text-sm">清除記錄</button>
    <button id="botBackRoute" class="col-span-2 h-11 rounded-lg bg-[#0068FF] text-white font-black text-sm">返回路線</button>
  `;
  vp.querySelectorAll('.inc-btn').forEach(btn => {
    btn.onclick = () => {
      const t = new Date().toTimeString().slice(0, 8);
      state.incidentState = { stage: 'active', type: btn.dataset.itype, startTime: t };
      stopAllAudio();
      playAlertBeep(true);
      renderAll();
      playAnnouncementSegments([{
        files: [],
        tc: '各位乘客請注意，因發生突發事故，本班車暫時停止行駛，請遵從車長指示。',
        en: 'Attention passengers, due to an incident, this bus service is temporarily suspended.',
        sc: ''
      }]);
    };
  });
  document.getElementById('botClearInc').onclick = () => { state.incidents = []; renderAll(); };
  document.getElementById('botBackRoute').onclick = () => { state.currentTab = 'route'; renderAll(); };
}

        <button id="maintResetCD" class="w-full py-2.5 rounded-lg bg-emerald-600 text-white font-black text-sm">重設智駕全城狀態</button>

      </div>
    `;
    bar.innerHTML = `
      <button id="botSetBack" class="h-11 rounded-lg bg-[#007AFF] text-white font-black text-2xl flex items-center justify-center">‹</button>

      { route: 'DEAD', type: '', from: '赤柱村', to: '海洋公園車廠', bus: '用車 9147', time: '20:27', duty: '073016' }
    ];

  document.getElementById('optTrain').onclick = () => handleTrainingModeToggle();

function renderAll() {
  renderTopStatus();
  renderTabs();
  renderMain();
}

// ============ 路線搜尋鍵盤 ============
function openKeypad() {
  const modal = document.getElementById('keypadModal');
  const display = document.getElementById('keypadDisplay');
  const grid = document.getElementById('keypadGrid');
  if (!modal || !display || !grid) return;

  let draft = state.searchQuery;
  display.textContent = draft;

  const keys = ['1','2','3','4','5','6','7','8','9','0','A','B','C','E','H','M','N','P','R','S','X','Y','Z','K','W'];
  grid.innerHTML = keys.map(k => `
    <button data-k="${k}" class="kp-key h-11 rounded-lg bg-zinc-800 border border-zinc-600 text-white font-black text-lg active:bg-[#0068FF]">${k}</button>
  `).join('');

  grid.querySelectorAll('.kp-key').forEach(b => {
    b.onclick = () => {
      if (draft.length < 6) {
        draft += b.dataset.k;
        display.textContent = draft;
      }
    };
  });
  document.getElementById('btnKeypadBack').onclick = () => { draft = draft.slice(0, -1); display.textContent = draft; };
  document.getElementById('btnKeypadClear').onclick = () => { draft = ''; display.textContent = ''; };
  document.getElementById('btnKeypadConfirm').onclick = () => {
    state.searchQuery = draft;
    state.pageOffset = 0;
    modal.classList.add('hidden');
    renderAll();
  };
  document.getElementById('btnCloseKeypad').onclick = () => modal.classList.add('hidden');
  modal.classList.remove('hidden');
}

// ============ 機身內嵌開機序列 + 輕量路線名載入 ============
async function fetchInitialLightData() {
  const [rRes, aRes] = await Promise.all([
    fetch('./data/routes.json'),
    fetch('./data/announcements.json')
  ]);
  const routes = await rRes.json();
  const anns = await aRes.json();
  state.routes = Array.isArray(routes) ? routes : [];
  state.announcements = Array.isArray(anns) ? anns : [];
  const set = new Set(state.routes.map(getRouteNo).filter(Boolean));
  state.uniqueRouteNos = Array.from(set).sort(compareRouteNo);

  fetch(`${AUDIO_CDN_BASE}/audio_manifest.json?v=44`)
    .then(r => (r.ok ? r.json() : []))
    .then(list => {
      if (!Array.isArray(list)) return;
      state.audioManifest = list.map(x => String(x).replace(/\\/g, '/'));
      state.audioStemMap.clear();
      for (const p of state.audioManifest) {
        const stem = p.split('/').pop().replace(/\.[^.]+$/, '').toLowerCase();
        if (stem && !state.audioStemMap.has(stem)) state.audioStemMap.set(stem, p);
      }
    })
    .catch(() => {});
}

function runBootSequence(isReplay = false) {
  const overlay = document.getElementById('lecipBootOverlay');
  const pAndroid = document.getElementById('bootPhaseAndroid');
  const pDiag = document.getElementById('bootPhaseDiag');
  const diagStatus = document.getElementById('bootDiagStatus');
  if (!overlay || !pAndroid || !pDiag) return;

  overlay.classList.remove('hidden');
  overlay.style.opacity = '1';
  pAndroid.classList.remove('hidden');
  pDiag.classList.add('hidden');
  if (diagStatus) diagStatus.textContent = 'INITIALIZING...';

  let closed = false;
  let dataDone = isReplay;

  const tryClose = () => {
    if (closed || !dataDone) return;
    closed = true;
    renderAll();
    overlay.style.opacity = '0';
    setTimeout(() => overlay.classList.add('hidden'), 300);
  };

  overlay.onclick = () => { if (dataDone) tryClose(); };

  setTimeout(() => {
    if (closed) return;
    pAndroid.classList.add('hidden');
    pDiag.classList.remove('hidden');
  }, 1100);

  if (isReplay) {
    setTimeout(tryClose, 2600);
    return;
  }

  let minTimePassed = false;
  setTimeout(() => {
    minTimePassed = true;
    tryClose();
  }, 2400);

  fetchInitialLightData()
    .then(() => {
      dataDone = true;
      if (diagStatus) diagStatus.textContent = `READY (${state.uniqueRouteNos.length} ROUTES)`;
      if (minTimePassed) tryClose();
    })
    .catch(err => {
      dataDone = true;
      if (diagStatus) diagStatus.textContent = 'LOAD ERROR: ' + err.message;
    });
}

// ============ 全域事件綁定 ============
function bindGlobalEvents() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => {
      const target = btn.dataset.tab;
      if (target === 'message' && !state.isStopped3s) {
        playAlertBeep(false);
        showToast('行車中禁止閱讀文字訊息（須停車 ≥3 秒）');
        return;
      }
      if (target === 'route' && state.currentTab === 'route' && state.routeStage === 'stops') {
        toggleGpsMode();
        return;
      }
      if (target === 'settings') state.settingsPage = 'menu';
      state.currentTab = target;
      renderAll();
    };
  });

  document.getElementById('btnOctopus').onclick = () => {
    state.octopusMode = (state.octopusMode + 1) % 3;
    const labels = ['八達通已完成連動', '八達通未完成連動／暫停收費', '八達通連動失效'];
    showToast(labels[state.octopusMode]);
    renderTopStatus();
  };

  document.getElementById('btnDisplayBox').onclick = () => {
    const nextStopped = !state.isStopped3s;
    setVehicleStoppedState(nextStopped, 32, false);
    if (nextStopped || state.currentTab !== 'route') {
      showToast(nextStopped ? '車輛狀態：已停 ≥3s' : '車輛狀態：行駛中 (32 km/h)');
    }
  };

  document.getElementById('btnGlobe').onclick = () => {
    state.lang = state.lang === 'tc' ? 'en' : 'tc';
    showToast(state.lang === 'tc' ? '語言：繁體中文' : 'Language: English');
    renderAll();
  };

  document.getElementById('btnCleverDriveBar').onclick = () => openCleverDriveModal();
  document.getElementById('btnCloseCD').onclick = () => document.getElementById('cleverDriveModal').classList.add('hidden');
  document.getElementById('btnDriverBadge').onclick = () => openStaffIdModal();

  document.getElementById('newMsgPopup').onclick = e => {
    if (e.target.id === 'btnDismissPopup') {
      state.dismissedPopup = true;
      renderTopStatus();
      return;
    }
    if (!state.isStopped3s) {
      showToast('須停車達 3 秒或以上方可閱讀訊息');
      return;
    }
    state.currentTab = 'message';
    renderAll();
  };

  const closeMore = () => document.getElementById('moreModal').classList.add('hidden');
  document.getElementById('btnCloseMore').onclick = closeMore;
  document.getElementById('moreReplayAudio').onclick = () => { closeMore(); triggerStopAnnouncement(state.currentStopIdx, true); };
  document.getElementById('moreToggleGps').onclick = () => { closeMore(); toggleGpsMode(); };
  document.getElementById('moreToggleTheme').onclick = () => {
    closeMore();
    state.currentTab = 'settings';
    state.settingsPage = 'prefs';
    renderAll();
  };
  document.getElementById('moreOpenCD').onclick = () => { closeMore(); openCleverDriveModal(); };
  document.getElementById('morePickStart').onclick = () => {
    closeMore();
    stopAllAudio();
    state.routeStage = 'start_stop';
    renderAll();
  };
  document.getElementById('moreBackRoutes').onclick = () => {
    closeMore();
    stopAllAudio();
    stopGpsTracking();
    state.routeStage = 'route';
    state.pageOffset = 0;
    renderAll();
  };

  document.getElementById('hwVolDown').onclick = () => {
    state.volume = Math.max(0.1, Math.round((state.volume - 0.1) * 10) / 10);
    if (currentAudio) currentAudio.volume = state.volume;
    showToast(`音量：${Math.round(state.volume * 100)}%`);
  };
  document.getElementById('hwVolUp').onclick = () => {
    state.volume = Math.min(1.0, Math.round((state.volume + 0.1) * 10) / 10);
    if (currentAudio) currentAudio.volume = state.volume;
    showToast(`音量：${Math.round(state.volume * 100)}%`);
  };
  const applyBrightness = () => {
    const sb = document.getElementById('screenBox');
    if (sb) sb.style.filter = `brightness(${state.brightness})`;
    showToast(`螢幕亮度：${Math.round(state.brightness * 100)}%`);
  };
  document.getElementById('hwBriDown').onclick = () => {
    state.brightness = Math.max(0.4, Math.round((state.brightness - 0.1) * 10) / 10);
    applyBrightness();
  };
  document.getElementById('hwBriUp').onclick = () => {
    state.brightness = Math.min(1.2, Math.round((state.brightness + 0.1) * 10) / 10);
    applyBrightness();
  };
}

// ============ 啟動應用 ============
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(reg => reg.update()).catch(() => {});
}
bindGlobalEvents();
renderTopStatus();
setInterval(renderTopStatus, 1000);
runBootSequence(false);
</script>
