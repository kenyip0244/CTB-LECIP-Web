<script>
const AUDIO_CDN_BASE = 'https://kenyip0244.github.io/CTB-LECIP-Audio';
const PAGE_SIZE = 5;

function detectInitialTheme() {
  try {
    const saved = localStorage.getItem('ctb_lecip_theme');
    if (saved === 'day' || saved === 'night') return saved;
  } catch (_) {}
  const hr = new Date().getHours();
  return (hr >= 6 && hr < 19) ? 'day' : 'night';
}

function loadSavedDriverProfile() {
  try {
    const raw = localStorage.getItem('ctb_lecip_driver_profile');
    if (raw) {
      const obj = JSON.parse(raw);
      const name = String(obj?.name || '').trim();
      const staffNo = String(obj?.staffNo || '').trim();
      if (name || staffNo) return { name, staffNo };
    }
  } catch (_) {}
  return { name: 'KEN YIP', staffNo: '0001' };
}

function formatDriverLabel(name, staffNo) {
  return [String(name || '').trim(), String(staffNo || '').trim()].filter(Boolean).join(' ') || 'KEN YIP 0001';
}

function saveDriverProfile(name, staffNo) {
  const cleanName = String(name || '').trim();
  const cleanNo = String(staffNo || '').trim();
  const label = formatDriverLabel(cleanName, cleanNo);
  state.driverName = cleanName;
  state.driverStaffNo = cleanNo;
  state.defaultDriverLabel = label;
  state.driverId = label;
  state.isManualDriver = false;
  try {
    localStorage.setItem('ctb_lecip_driver_profile', JSON.stringify({ name: cleanName, staffNo: cleanNo }));
  } catch (_) {}
  renderTopStatus();
  return label;
}

const _initDriver = loadSavedDriverProfile();
const _initDriverLabel = formatDriverLabel(_initDriver.name, _initDriver.staffNo);

const state = {
  lang: 'tc',
  theme: detectInitialTheme(), // 'day' | 'night'
  driverName: _initDriver.name,
  driverStaffNo: _initDriver.staffNo,
  defaultDriverLabel: _initDriverLabel,
  driverId: _initDriverLabel,
  isManualDriver: false, // 手動輸入 5 位數員工編號時為 true（頂欄黃字顯示）
  trainingMode: false,   // 路線訓練模式（密碼 9999，頂欄黃標＋電子牌暫停載客）
  displayFault: false,   // 電子牌連接失靈模擬（頂部 [123] 轉紅）
  octopusMode: 0,        // 0: 完成連動, 1: 暫停收費/未完成連動, 2: 連動失效
  isStopped3s: true,
  gpsEnabled: false,
  gpsWatchId: null,
  gpsSpeedKmh: 0,
  lastGpsSpeedKmh: 0,
  lastGpsTimeMs: 0,
  gpsLat: null,
  gpsLng: null,
  gpsDistanceM: null,
  etaMap: {},
  etaLastFetchKey: '',
  etaLastFetchMs: 0,
  etaLastLat: null,
  etaLastLng: null,
  gpsArrivedCur: false,
  gpsMinDistToCur: Infinity,
  stopProgressPct: 25,
  volume: 1.0,
  brightness: 1.0,

  // 智駕全城內部計分（只控制綠「好」／黃「留意」／紅「需改善」，介面不顯示分數）
  cleverDrive: {
    score: 100,
    harshAccel: 0,

// ============ 資料欄位相容解析工具 ============
function cleanJointName(raw) {
  const s = String(raw || '').trim();
  if (!s || !s.includes('/')) return s;
  const parts = s.split(/\s*\/\s*/).map(p => p.trim()).filter(Boolean);
  if (parts.length !== 2) return s;
  const [p1, p2] = parts;
  if (/^(G|UG|LG|M|B\d?|\d+)$/i.test(p1) && /^F$/i.test(p2)) return s;
  if (p1.length <= 1 || p2.length <= 1) return s;
  const norm = x => x.toLowerCase().replace(/[\s\-\(\)（）]/g, '');
  if (norm(p1) === norm(p2)) return p2;
  if (/\/\s+/.test(s) || (p1 === p1.toUpperCase() && p2 !== p2.toUpperCase())) return p2;
  return s;
}

function normStopName(raw) {
  return cleanJointName(raw).replace(/[\s,，\.。\-－·・]/g, '').toLowerCase();
}
function normBaseName(raw) {
  return cleanJointName(raw).replace(/[\(（][^\)）]*[\)）]/g, '').replace(/[\s,，\.。\-－·・]/g, '').toLowerCase();
}
function getRouteNo(r) {
  return String(r?.routeNo || r?.route || r?.lineNo || String(r?.routeId || '').replace(/^CTB-/i, '') || '').trim().toUpperCase();
}
function getBound(r) {
  return String(r?.bound || r?.dir || r?.direction || 'O').trim().toUpperCase();
}
function getOrigTc(r) {
  return cleanJointName(r?.origTc || r?.originTc || r?.fromTc || r?.orig_tc || r?.startTc || r?.orig || r?.origin || '');
}
function getDestTc(r) {
  return cleanJointName(r?.destTc || r?.destinationTc || r?.toTc || r?.dest_tc || r?.endTc || r?.dest || r?.destination || '');
}
function getOrigEn(r) {
  return cleanJointName(r?.origEn || r?.originEn || r?.fromEn || r?.orig_en || r?.startEn || '');
}
function getDestEn(r) {
  return cleanJointName(r?.destEn || r?.destinationEn || r?.toEn || r?.dest_en || r?.endEn || '');
}
function getDestGroupKey(r) {
  return getDestTc(r) || getDestEn(r) || getBound(r);
}
function getRealTripRemark(r) {
  const raw = state.lang === 'en'
    ? cleanJointName(r?.descEn || r?.remarksEn || r?.patternDescEn || r?.serviceTypeNameEn || r?.viaEn || r?.remarkEn || '')
    : cleanJointName(r?.descTc || r?.remarksTc || r?.patternDescTc || r?.serviceTypeNameTc || r?.viaTc || r?.remarkTc || r?.remark || '');
  if (!raw) return '';
  const dest = state.lang === 'en' ? getDestEn(r) : getDestTc(r);
  if (dest && normStopName(raw) === normStopName(dest)) return '';
  if (/^往\s*.+（班次\s*\d+）$/.test(raw)) return '';
  return raw;
}
function getTripFareNum(r) {
  const f = r?.fare ?? r?.fullFare ?? r?.price;
  if (f == null || f === '') return null;
  const n = Number(String(f).replace(/^\$/, ''));
  return Number.isFinite(n) && n > 0 ? n : null;
}
function fmtFare(n) {
  if (n == null || !Number.isFinite(Number(n))) return '';
  return `$${Number(n).toFixed(1)}`;
}
function getStopNameTc(s) {
  return cleanJointName(s?.nameTc || s?.stopNameTc || s?.name_tc || s?.tc || s?.name || '未命名車站');
}
function getStopNameEn(s) {
  return cleanJointName(s?.nameEn || s?.stopNameEn || s?.name_en || s?.en || '');
}
function getStopSub(s) {
  if (state.lang === 'en') return '';
  const loc = cleanJointName(s?.roadTc || s?.locationTc || s?.subTc || '');
  if (!loc) return '';
  if (normStopName(loc) === normStopName(getStopNameTc(s))) return '';
  return loc;
}
function getStopLat(s) {
  return Number(s?.lat ?? s?.latitude ?? s?.y);
}
function getStopLng(s) {
  return Number(s?.lng ?? s?.lon ?? s?.longitude ?? s?.x);
}

function computeTripSections(stops, trip) {
  const baseFare = getTripFareNum(trip);
  let curSec = 1;
  let curFare = baseFare;
  return (stops || []).map((st, idx) => {
    const rawStopFare = st?.sectionFare ?? st?.fare ?? st?.price;
    const stopFareNum = (rawStopFare != null && rawStopFare !== '' && Number.isFinite(Number(String(rawStopFare).replace(/^\$/, ''))))
      ? Number(String(rawStopFare).replace(/^\$/, ''))
      : null;
    const explicitSec = st?.section ?? st?.fareStage;

    let isSectionChange = false;
    if (idx === 0) {
      curFare = stopFareNum ?? baseFare;
      curSec = explicitSec ? Number(explicitSec) || 1 : 1;
      isSectionChange = false;
    } else if (stopFareNum != null && (curFare == null || Math.abs(stopFareNum - curFare) >= 0.05)) {
      curFare = stopFareNum;
      curSec = explicitSec ? Number(explicitSec) || (curSec + 1) : (curSec + 1);
      isSectionChange = true;
    } else if (explicitSec && Number(explicitSec) > curSec) {
      curSec = Number(explicitSec);
      isSectionChange = curFare != null;
    }

    return {
      sectionNo: curSec,
      activeFare: curFare,
      badgeFare: isSectionChange ? curFare : null
    };
  });
}

function getEffectiveStopAudio(st) {
  if (!st) return '';
  if (st.stopId) {
    const rawId = String(st.stopId).trim();
    const numId = rawId.replace(/^0+/, '');
    if (state.confirmedAudioMap[rawId]) return state.confirmedAudioMap[rawId];
    if (numId && state.confirmedAudioMap[numId]) return state.confirmedAudioMap[numId];
  }
  const tc = getStopNameTc(st);
  const n1 = normStopName(tc);
  if (n1 && state.confirmedAudioByName[n1]) return state.confirmedAudioByName[n1];
  const n2 = normBaseName(tc);
  if (n2 && n2.length >= 2 && state.confirmedAudioByName[n2]) return state.confirmedAudioByName[n2];
  if (st.stopAudioFile) return st.stopAudioFile;
  return '';
}

function compareRouteNo(a, b) {
  const parse = s => {
    const m = s.match(/^([A-Z]*)(\d+)([A-Z]*)$/);
    if (!m) return { hasPrefix: 2, prefix: s, num: 99999, suffix: '' };
    return { hasPrefix: m[1] ? 1 : 0, prefix: m[1], num: parseInt(m[2], 10), suffix: m[3] };
  };
  const pa = parse(a);
  const pb = parse(b);
  if (pa.hasPrefix !== pb.hasPrefix) return pa.hasPrefix - pb.hasPrefix;
  if (pa.prefix !== pb.prefix) return pa.prefix.localeCompare(pb.prefix);
  if (pa.num !== pb.num) return pa.num - pb.num;
  return pa.suffix.localeCompare(pb.suffix);
}

// ============ 音效合成器（DCP 測試音 / 轉分段 Do-Do 提示音 / 智駕警示） ============
function playSynthChime(notes) {
  return new Promise(resolve => {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) { resolve(); return; }
      const ctx = new AudioCtx();
      let t = ctx.currentTime + 0.02;
      for (const [freq, dur, gap] of notes) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.001, t);
        gain.gain.exponentialRampToValueAtTime(Math.max(0.02, 0.18 * state.volume), t + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + dur + 0.02);
        t += dur + (gap || 0.04);
      }
      const totalMs = Math.max(120, Math.round((t - ctx.currentTime) * 1000) + 40);
      setTimeout(() => {
        ctx.close().catch(() => {});
        resolve();
      }, totalMs);
    } catch (_) {
      resolve();
    }
  });
}

function playSectionFareChime() {
  // 八達通轉分段「Do-Do」雙音提示
  return playSynthChime([[880, 0.14, 0.07], [1175, 0.22, 0.04]]);
}

function playShortAssetAudio(path, fallbackNotes) {
  return new Promise(resolve => {
    try {
      const fx = new Audio(path);
      fx.volume = state.volume;
      let done = false;
      const finish = () => { if (!done) { done = true; resolve(); } };
      fx.onended = finish;
      fx.onerror = () => {
        if (done) return;
        done = true;
        playSynthChime(fallbackNotes).then(resolve);
      };
      fx.play().catch(() => {
        if (done) return;
        done = true;
        playSynthChime(fallbackNotes).then(resolve);
      });
    } catch (_) {
      playSynthChime(fallbackNotes).then(resolve);
    }
  });
}

// ============ 音檔播放與 Google TTS 序列引擎 ============
function stopAllAudio() {
  audioPlaySeqId++;
  state.playingAnnCode = '';
  if (currentAudio) {
    try { currentAudio.pause(); } catch (_) {}
    currentAudio = null;
  }
  if ('speechSynthesis' in window) {
    try { window.speechSynthesis.cancel(); } catch (_) {}
  }
}

function buildAudioUrl(relPath) {
  const clean = String(relPath || '').replace(/\\/g, '/').replace(/^\/+/, '').replace(/\.wav$/i, '.mp3');
  if (!clean) return '';
  if (/^(https?:\/\/|\.\/)/i.test(clean)) return clean;
  const encoded = clean.split('/').filter(Boolean).map(seg => encodeURIComponent(seg)).join('/');
  return `${AUDIO_CDN_BASE}/${encoded}`;
}

function resolveManifestPath(rawPath) {
  if (!rawPath) return '';
  if (/^(https?:\/\/|\.\/)/i.test(String(rawPath))) return String(rawPath);
  const clean = String(rawPath).replace(/\\/g, '/').replace(/^\/+/, '').replace(/\.wav$/i, '.mp3');
  if (state.audioManifest.includes(clean)) return clean;
  const stem = clean.split('/').pop().replace(/\.[^.]+$/, '').toLowerCase();
  const candidates = [stem];
  if (/^\d+$/.test(stem)) candidates.push(stem.padStart(2, '0'), stem.replace(/^0+/, ''));
  for (const c of candidates) {
    if (c && state.audioStemMap.has(c)) return state.audioStemMap.get(c);
  }
  const noSuffix = stem.replace(/_[ab]$/i, '');
  if (noSuffix && state.audioStemMap.has(noSuffix + '_a')) return state.audioStemMap.get(noSuffix + '_a');
  if (noSuffix && state.audioStemMap.has(noSuffix + '_b')) return state.audioStemMap.get(noSuffix + '_b');
  return clean;
}

function buildGoogleTtsUrl(text, tl) {
  const q = String(text || '').trim().slice(0, 180);
  if (!q) return '';
  return `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=${encodeURIComponent(tl)}&q=${encodeURIComponent(q)}`;
}

function playUrlListAsync(urls, seqToken) {
  return new Promise(resolve => {
    if (!urls || urls.length === 0 || seqToken !== audioPlaySeqId) {
      resolve(false);
      return;
    }
    let playedAny = false;
    let idx = 0;
    const next = () => {
      if (seqToken !== audioPlaySeqId || idx >= urls.length) {
        resolve(playedAny);
        return;
      }
      const url = urls[idx++];
      const audio = new Audio(url);
      audio.volume = state.volume;
      currentAudio = audio;
      let settled = false;
      const advance = () => {
        if (settled) return;
        settled = true;
        next();
      };
      audio.onended = advance;
      audio.onerror = advance;
      audio.play().then(() => { playedAny = true; }).catch(advance);
    };
    next();
  });
}

function speakWebSpeechAsync(tcText, enText, scText, seqToken) {
  return new Promise(resolve => {
    if (!('speechSynthesis' in window) || seqToken !== audioPlaySeqId) {
      resolve();
      return;
    }
    try {
      window.speechSynthesis.cancel();
      const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
      const pickGoogleVoice = (langPrefix) =>
        voices.find(v => /google/i.test(v.name) && v.lang.toLowerCase().startsWith(langPrefix)) ||
        voices.find(v => v.lang.toLowerCase().startsWith(langPrefix)) ||
        null;

      const items = [];
      if (tcText) items.push({ text: tcText, lang: 'zh-HK', voice: pickGoogleVoice('zh-hk') || pickGoogleVoice('yue') });
      if (enText) items.push({ text: enText, lang: 'en-GB', voice: pickGoogleVoice('en-gb') || pickGoogleVoice('en') });
      if (scText) items.push({ text: scText, lang: 'zh-CN', voice: pickGoogleVoice('zh-cn') });
      if (items.length === 0) { resolve(); return; }

      let idx = 0;
      const speakNext = () => {
        if (seqToken !== audioPlaySeqId || idx >= items.length) { resolve(); return; }
        const it = items[idx++];
        const u = new SpeechSynthesisUtterance(it.text);
        u.lang = it.lang;
        if (it.voice) u.voice = it.voice;
        u.volume = state.volume;
        u.onend = speakNext;
        u.onerror = speakNext;
        window.speechSynthesis.speak(u);
      };
      speakNext();
    } catch (_) {
      resolve();
    }
  });
}

async function playSingleSegment(relPaths, fallbackTc, fallbackEn, fallbackSc, seqToken) {
  if (seqToken !== audioPlaySeqId) return;
  const urls = Array.from(new Set(
    (relPaths || [])
      .filter(Boolean)
      .map(p => buildAudioUrl(resolveManifestPath(p)))
      .filter(Boolean)
  ));
  if (urls.length > 0) {
    const ok = await playUrlListAsync(urls, seqToken);
    if (ok || seqToken !== audioPlaySeqId) return;
  }
  const ttsUrls = [
    fallbackTc ? buildGoogleTtsUrl(fallbackTc, 'yue') : '',
    fallbackEn ? buildGoogleTtsUrl(fallbackEn, 'en') : '',
    fallbackSc ? buildGoogleTtsUrl(fallbackSc, 'zh-CN') : ''
  ].filter(Boolean);
  const ttsOk = await playUrlListAsync(ttsUrls, seqToken);
  if (!ttsOk && seqToken === audioPlaySeqId) {
    await speakWebSpeechAsync(fallbackTc, fallbackEn, fallbackSc, seqToken);
  }
}

async function playAnnouncementSegments(segments) {
  stopAllAudio();
  const seqToken = audioPlaySeqId;
  for (const seg of (segments || [])) {
    if (seqToken !== audioPlaySeqId) break;
    if (seg.chime === 'section') {
      await playSectionFareChime();
      continue;
    }
    if (seg.chime === 'dcp') {
      await playSynthChime([[659, 0.14, 0.04], [880, 0.16, 0.04], [1046, 0.24, 0.04]]);
      continue;
    }
    await playSingleSegment(seg.files, seg.tc, seg.en, seg.sc, seqToken);
  }
  return seqToken === audioPlaySeqId;
}

function getWelcomeAudioFile() {
  const firstStop = state.tripStops[0];
  if (firstStop && firstStop.stopAudioFile) {
    const stem = String(firstStop.stopAudioFile).split('/').pop().replace(/\.[^.]+$/, '').toLowerCase();
    if (stem && !/^\d+_[a-z]$/i.test(stem)) return firstStop.stopAudioFile;
  }
  const routeNo = String(state.selectedRouteNo || '').toLowerCase();
  if (routeNo && state.audioStemMap.size > 0) {
    const prefix = routeNo + '_';
    const matches = [];
    for (const [stem, path] of state.audioStemMap.entries()) {
      if (stem.startsWith(prefix) && !/^\d+_[a-z]$/i.test(stem)) matches.push(path);
    }
    if (matches.length === 1) return matches[0];
  }
  return '';
}

function getWelcomeAudioFiles() {
  const rno = String(state.selectedRouteNo || '').trim().toUpperCase();
  const isFlyer = /^(A|NA)\d+/.test(rno);
  const all = state.audioManifest || [];

  const findByKw = (kws) => {
    for (const kw of kws) {
      const hit = all.find(p => p.toLowerCase().includes(kw));
      if (hit) return hit;
    }
    return '';
  };

  if (isFlyer) {
    const flyerHit = findByKw(['welcome_cityflyer', 'welcome_flyer', 'cityflyer_welcome']);
    if (flyerHit) return [flyerHit];
  }

  const stdHit = findByKw(['welcome_citybus', 'welcome_ctb', 'welcome.mp3', 'welcome']);
  if (stdHit) return [stdHit];

  if (state.audioStemMap && state.audioStemMap.has('welcome')) {
    return [state.audioStemMap.get('welcome')];
  }
  return ['Welcome.mp3'];
}

function getStudioCurrentTripCandidates() {
  const names = new Set();
  const trip = state.selectedTrip || {};
  const rno = String(state.selectedRouteNo || trip.routeId || trip.route || '').replace(/^CTB-/i, '').trim().toUpperCase();
  const bnd = String(trip.bound || trip.dir || 'O').trim().toUpperCase();
  const stype = String(trip.serviceType || trip.service_type || '1').trim();
  const tKey = `${rno}|${bnd}|${stype}`;

  const customMap = state.studioTripNames || {};
  if (customMap[tKey]?.name) names.add(String(customMap[tKey].name).trim());

  [trip.tripName, trip.trip_name, trip.name, trip.label, trip.title].forEach(v => {
    if (v && String(v).trim()) names.add(String(v).trim());
  });

  const cleanDest = (rawStr) => {
    const s = String(rawStr || '').trim();
    if (!s || !s.includes('/')) return s;
    const parts = s.split(/\s*\/\s*/).map(p => p.trim()).filter(Boolean);
    if (parts.length !== 2) return s;
    if (/^(G|UG|LG|M|B\d?|\d+)$/i.test(parts[0]) && /^F$/i.test(parts[1])) return s;
    if (/\/\s+/.test(s) || (parts[0] === parts[0].toUpperCase() && parts[1] !== parts[1].toUpperCase())) return parts[1];
    return s;
  };

  let destTc = cleanDest(trip.destTc || trip.dest_tc || '');
  const stopArr = Array.isArray(state.currentStops) ? state.currentStops : (Array.isArray(state.stops) ? state.stops : []);
  if (!destTc && stopArr.length > 0) {
    const lastSt = stopArr[stopArr.length - 1];
    destTc = cleanDest(typeof getStopNameTc === 'function' ? getStopNameTc(lastSt) : (lastSt?.nameTc || ''));
  }
  if (rno && destTc) names.add(`${rno}-${destTc}-${stype}`);
  if (rno) names.add(`${rno}-${bnd === 'I' ? '??' : '??'}-${stype}`);
  return { rno, tripNames: names };
}

function resolveStudioStopAudio(st) {
  const rules = state.studioRules;
  if (!Array.isArray(rules) || !rules.length || !st) return null;
  const rawId = String(st.stopId ?? st.stop ?? st.id ?? '').trim();
  if (!rawId) return null;
  const numId = rawId.replace(/^0+/, '') || '0';
  const { rno, tripNames } = getStudioCurrentTripCandidates();

  let bestPath = null;
  let bestScore = 0;

  for (const rule of rules) {
    if (!rule || !rule.audioPath || !Array.isArray(rule.stopIds)) continue;
    const stopHit = rule.stopIds.some(id => {
      const s = String(id).trim();
      return s === rawId || (s.replace(/^0+/, '') || '0') === numId;
    });
    if (!stopHit) continue;

    const rSpecific = rule.routeMode === 'specific';
    const tSpecific = rule.tripMode === 'specific';

    if (rSpecific) {
      const routes = Array.isArray(rule.routes) ? rule.routes.map(x => String(x).trim().toUpperCase()) : [];
      if (!rno || !routes.includes(rno)) continue;
    }
    if (tSpecific) {
      const tList = Array.isArray(rule.tripNames) ? rule.tripNames.map(x => String(x).trim()) : [];
      if (!tList.some(tn => tripNames.has(tn))) continue;
    }

    const score = (tSpecific ? 4 : 0) + (rSpecific ? 2 : 0) + 1;
    if (score > bestScore) {
      bestScore = score;
      bestPath = rule.audioPath;
    }
  }
  return bestPath;
}

function resolveStudioWelcomeFiles() {
  const wRules = state.studioWelcomeRules;
  const { rno, tripNames } = getStudioCurrentTripCandidates();

  if (Array.isArray(wRules) && wRules.length) {
    for (const w of wRules) {
      if (w?.audioPath && w.scope === 'trips' && Array.isArray(w.tripNames)) {
        if (w.tripNames.some(tn => tripNames.has(String(tn).trim()))) return [w.audioPath];
      }
    }
    for (const w of wRules) {
      if (w?.audioPath && w.scope === 'routes' && Array.isArray(w.routes)) {
        const routes = w.routes.map(x => String(x).trim().toUpperCase());
        if (rno && routes.includes(rno)) return [w.audioPath];
      }
    }
  }
  if (state.studioDefaultWelcome) return [state.studioDefaultWelcome];
  if (Array.isArray(wRules)) {
    const def = wRules.find(w => w?.audioPath && w.scope === 'default');
    if (def) return [def.audioPath];
  }
  return null;
}

function buildWelcomeSegment() {
  const rno = String(state.selectedRouteNo || '').trim().toUpperCase();
  const isFlyer = /^(A|NA)\d+/.test(rno);
  return {
    files: resolveStudioWelcomeFiles() || getWelcomeAudioFiles(),
    tc: isFlyer ? '歡迎乘搭城巴機場快線。' : '歡迎乘搭城巴。',
    en: isFlyer ? 'Welcome aboard Cityflyer.' : 'Welcome aboard Citybus.',
    sc: isFlyer ? '欢迎乘坐城巴机场快线。' : '欢迎乘坐城巴。'
  };
}

function buildStopSegment(st) {
  const files = [];
  const mainAudio = resolveStudioStopAudio(st) || getEffectiveStopAudio(st);
  if (mainAudio) files.push(mainAudio);
  if (st.approachAudioFile) files.push(st.approachAudioFile);
  const tcName = getStopNameTc(st);
  const enName = getStopNameEn(st);
  return {
    files,
    tc: `下一站，${tcName}`,
    en: enName ? `Next stop, ${enName}` : '',
    sc: `下一站，${tcName}`
  };
}

function getTerminusAudioFile() {
  const candidates = [
    'Terminus.mp3',
    'terminus.mp3',
    'audio/Terminus.mp3',
    'audio/terminus.mp3',
    'audio/announcements/Terminus.wav',
    'audio/announcements/terminus.wav'
  ];
  for (const c of candidates) {
    if (state.audioManifest.includes(c)) return c;
    const lowerHit = state.audioManifest.find(p => String(p).toLowerCase() === c.toLowerCase());
    if (lowerHit) return lowerHit;
  }
  if (state.audioStemMap.has('terminus')) {
    return state.audioStemMap.get('terminus');
  }
  return 'Terminus.mp3';
}

function buildTerminusSegment(st) {
  const tcName = getStopNameTc(st);
  const enName = getStopNameEn(st);
  return {
    files: [getTerminusAudioFile()],
    tc: `本班車已到達總站 ${tcName}，多謝乘搭城巴。`,
    en: enName ? `This bus has arrived at the terminus, ${enName}. Thank you for riding Citybus.` : 'This bus has arrived at the terminus. Thank you for riding Citybus.',
    sc: `本班车已到达总站 ${tcName}，感谢乘坐城巴。`
  };
}

function triggerStopAnnouncement(idx, force = false) {
  if (state.incidentState.stage !== 'idle') return;
  const st = state.tripStops[idx];
  if (!st) return;
  const modeTag = state.gpsEnabled ? 'auto' : 'manual';
  const key = `${state.selectedTrip?.routeId || ''}|${state.selectedTrip?.bound || ''}|${modeTag}|${idx}`;
  if (!force && state.lastAnnouncedKey === key) return;
  state.lastAnnouncedKey = key;

  const isTerminus = idx === state.tripStops.length - 1;
  const sections = computeTripSections(state.tripStops, state.selectedTrip);
  const secInfo = sections[idx] || {};
  const segments = [];

  if (idx > 0 && secInfo.badgeFare != null && state.octopusMode === 0) {
    segments.push({ files: ['./assets/check_fare.mp3'], tc: '請檢查八達通收費', en: '', sc: '' });
    showToast(`八達通轉分段：分段 ${secInfo.sectionNo}（${fmtFare(secInfo.badgeFare)}）`);
  }

  if (isTerminus) {
    segments.push(buildTerminusSegment(st));
    playAnnouncementSegments(segments);
    return;
  }

  if (state.gpsEnabled) {
    if (idx === 0) {
      stopAllAudio();
      return;
    }
    if (idx === 1) {
      segments.push(buildWelcomeSegment(), buildStopSegment(st));
      playAnnouncementSegments(segments);
      return;
    }
    segments.push(buildStopSegment(st));
    playAnnouncementSegments(segments);
    return;
  }

  if (idx === 0) {
    playAnnouncementSegments([buildWelcomeSegment()]);
    return;
  }
  segments.push(buildStopSegment(st));
  playAnnouncementSegments(segments);
}

  }
  if (score >= 65) {
    return `<svg class="${sizeClass} shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9.5"/><circle cx="9" cy="10" r="1.25" fill="currentColor" stroke="none"/><circle cx="15" cy="10" r="1.25" fill="currentColor" stroke="none"/><line x1="8.2" y1="15.2" x2="15.8" y2="15.2" stroke-linecap="round"/></svg>`;
  }
  return `<svg class="${sizeClass} shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9.5"/><circle cx="9" cy="10" r="1.25" fill="currentColor" stroke="none"/><circle cx="15" cy="10" r="1.25" fill="currentColor" stroke="none"/><path d="M8 16.6c1-1.9 2.4-2.8 4-2.8s3 .9 4 2.8" stroke-linecap="round"/></svg>`;
}

  if (score >= 85) return { label: '好', en: 'Good', bg: 'bg-[#64e800]', text: 'text-[#111]' };
  if (score >= 65) return { label: '留意', en: 'Attention', bg: 'bg-[#facc15]', text: 'text-[#111]' };
  return { label: '需改善', en: 'Need Improvement', bg: 'bg-[#ef4444]', text: 'text-white' };

function playGreenroadSound(level) {
  if (level === 'red') {
    playShortAssetAudio('./assets/greenroad_breaking.mp3', [[960, 0.14, 0.05], [960, 0.14, 0.05], [960, 0.2, 0.02]]);
  } else if (level === 'yellow') {
    playShortAssetAudio('./assets/greenroad_bleep.mp3', [[780, 0.12, 0.06], [780, 0.12, 0.02]]);
  } else {
    playShortAssetAudio('./assets/speed_alert.mp3', [[880, 0.16, 0.05], [700, 0.18, 0.02]]);
  }
}

function triggerCleverDriveEvent(kind, severity = 'yellow') {
  const cd = state.cleverDrive;
  const normKind = kind === 'turn' ? 'steer' : kind;

  // 超速：只出提示與聲效，完全唔扣分
  if (normKind === 'overspeed') {
    cd.overspeed++;
    cd.lastEvent = '超速警示 (>70 km/h · 不扣分)';
    cd.warningType = 'overspeed';
    cd.warningLevel = 'speed';
    cd.warningText = cd.lastEvent;
    playGreenroadSound('speed');
    renderTopStatus();
    renderCleverDriveModalContent();
    clearTimeout(window._cdBannerTimer);
    window._cdBannerTimer = setTimeout(() => {
      cd.warningType = '';
      cd.warningLevel = '';
      cd.warningText = '';
      renderCleverDriveBottomWarning();
    }, 3500);
    return;
  }

  const level = severity === 'red' ? 'red' : 'yellow';
  const deduct = level === 'red' ? 5 : 3;
  const levelLabel = level === 'red' ? '紅色警告' : '黃色警告';
  const typeNames = {
    accel: '急加速',
    brake: '急煞車',
    steer: '急轉彎',
    slope: '車身傾側'
  };

  if (normKind === 'accel') cd.harshAccel++;
  else if (normKind === 'brake') cd.harshBrake++;
  else if (normKind === 'steer') cd.sharpTurn++;
  else if (normKind === 'slope') cd.slope++;

  cd.score = Math.max(0, cd.score - deduct);
  cd.lastEvent = `${levelLabel}：${typeNames[normKind] || normKind} (-${deduct}分)`;
  cd.warningType = normKind;
  cd.warningLevel = level;
  cd.warningText = cd.lastEvent;

  playGreenroadSound(level);
  renderTopStatus();
  renderCleverDriveModalContent();

  clearTimeout(window._cdBannerTimer);
  window._cdBannerTimer = setTimeout(() => {
    cd.warningType = '';
    cd.warningLevel = '';
    cd.warningText = '';
    renderCleverDriveBottomWarning();
  }, 3600);
}

// ============ GPS 自動追蹤引擎（離開 A 站後即跳至 B 站並播 B 站） ============
function calcDistanceMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = d => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function stopGpsTracking() {
  if (state.gpsWatchId != null && 'geolocation' in navigator) {
    navigator.geolocation.clearWatch(state.gpsWatchId);
    state.gpsWatchId = null;
  }
}

function startGpsTracking() {
  if (!('geolocation' in navigator)) {
    showToast('此瀏覽器不支援 GPS 定位');
    state.gpsEnabled = false;
    renderAll();
    return;
  }
  stopGpsTracking();
  state.gpsEnabled = true;

  const ARRIVE_RADIUS_M = 45;
  const LEAVE_RADIUS_M = 55;
  const OFFSET_PASS_DELTA = 45;

  state.gpsWatchId = navigator.geolocation.watchPosition(
    pos => {
      const nowMs = Date.now();
      const { latitude, longitude, speed } = pos.coords;
      state.gpsLat = latitude;
      state.gpsLng = longitude;
      const kmh = typeof speed === 'number' && !Number.isNaN(speed) ? Math.round(speed * 3.6) : 0;

      if (state.lastGpsTimeMs > 0) {
        const dtSec = Math.max(0.5, (nowMs - state.lastGpsTimeMs) / 1000);
        const deltaKmh = kmh - state.lastGpsSpeedKmh;
        if (dtSec <= 4 && deltaKmh <= -22) triggerCleverDriveEvent('brake', 'red');
        else if (dtSec <= 4 && deltaKmh <= -14) triggerCleverDriveEvent('brake', 'yellow');
        else if (dtSec <= 4 && deltaKmh >= 22) triggerCleverDriveEvent('accel', 'red');
        else if (dtSec <= 4 && deltaKmh >= 14) triggerCleverDriveEvent('accel', 'yellow');
      }
      if (kmh > 70 && state.lastGpsSpeedKmh <= 70) triggerCleverDriveEvent('overspeed', 'speed');

      state.lastGpsSpeedKmh = kmh;
      state.lastGpsTimeMs = nowMs;
      setVehicleStoppedState(kmh < 3, kmh, false);

      if (state.incidentState.stage !== 'idle') return; // 事故模式下暫停自動報站

      if (state.routeStage === 'stops' && state.tripStops.length > 0) {
        const curIdx = state.currentStopIdx;
        const hasNext = curIdx < state.tripStops.length - 1;
        const curSt = state.tripStops[curIdx];
        const prevSt = curIdx > 0 ? state.tripStops[curIdx - 1] : null;
        const nextSt = hasNext ? state.tripStops[curIdx + 1] : null;

        const cLat = getStopLat(curSt);
        const cLng = getStopLng(curSt);

        if (Number.isFinite(cLat) && Number.isFinite(cLng)) {
          const distCur = Math.round(calcDistanceMeters(latitude, longitude, cLat, cLng));
          state.gpsDistanceM = distCur;
          if (distCur < state.gpsMinDistToCur) state.gpsMinDistToCur = distCur;

          if (distCur <= ARRIVE_RADIUS_M) state.gpsArrivedCur = true;

          if (state.gpsArrivedCur) {
            state.stopProgressPct = 100;
          } else if (prevSt) {
            const pLat = getStopLat(prevSt);
            const pLng = getStopLng(prevSt);
            let leg = 450;
            if (Number.isFinite(pLat) && Number.isFinite(pLng)) {
              leg = Math.max(80, Math.round(calcDistanceMeters(pLat, pLng, cLat, cLng)));
            }
            const ratio = Math.max(0, Math.min(1, 1 - distCur / leg));
            state.stopProgressPct = Math.round(15 + ratio * 80);
          } else {
            state.stopProgressPct = 15;
          }

          if (hasNext && nextSt) {
            const nLat = getStopLat(nextSt);
            const nLng = getStopLng(nextSt);
            const hasNextCoord = Number.isFinite(nLat) && Number.isFinite(nLng);
            const distNext = hasNextCoord ? Math.round(calcDistanceMeters(latitude, longitude, nLat, nLng)) : Infinity;
            const legToNext = hasNextCoord ? Math.max(80, Math.round(calcDistanceMeters(cLat, cLng, nLat, nLng))) : 450;

            const standardLeave = state.gpsArrivedCur && distCur >= LEAVE_RADIUS_M;
            const offsetLeave = !state.gpsArrivedCur &&
                                state.gpsMinDistToCur <= 120 &&
                                distCur >= state.gpsMinDistToCur + OFFSET_PASS_DELTA &&
                                distCur >= 65 &&
                                (!hasNextCoord || distNext < legToNext);
            const alreadyAtNext = hasNextCoord && distNext <= ARRIVE_RADIUS_M && distCur > ARRIVE_RADIUS_M;

            if (standardLeave || offsetLeave || alreadyAtNext) {
              state.currentStopIdx = curIdx + 1;
              state.stopsPage = 0;
              state.etaMap = {};
              state.gpsArrivedCur = alreadyAtNext;
              state.gpsMinDistToCur = alreadyAtNext ? distNext : Infinity;
              state.gpsDistanceM = hasNextCoord ? distNext : null;
              state.stopProgressPct = alreadyAtNext ? 100 : 15;
              renderAll();
              triggerStopAnnouncement(state.currentStopIdx);
              return;
            }
          }
        }
      }

      const distEl = document.getElementById('etaCurDist');
      if (distEl && state.gpsEnabled && state.gpsDistanceM != null) {
        distEl.textContent = formatDistanceLabel(state.gpsDistanceM);
      }
      const bar = document.getElementById('stopProgressFill');
      if (bar) bar.style.width = `${state.stopProgressPct}%`;
      if (state.routeStage === 'stops') refreshRouteEtas(false);
    },
    err => {
      if (err.code === 1) {
        showToast('請允許瀏覽器存取 GPS 權限，已切回手動模式');
        state.gpsEnabled = false;
        stopGpsTracking();
        renderAll();
      }
    },
    { enableHighAccuracy: true, maximumAge: 1500, timeout: 10000 }
  );
}

function toggleGpsMode() {
  if (state.gpsEnabled) {
    state.gpsEnabled = false;
    stopGpsTracking();
    state.gpsLat = null;
    state.gpsLng = null;
    state.gpsDistanceM = null;
    state.gpsArrivedCur = false;
    state.gpsMinDistToCur = Infinity;
    state.etaMap = {};

    state.gpsEnabled = true;

    startGpsTracking();
    showToast('已開啟 GPS 自動報站');
  }
  renderAll();
}

async function ensureStopsLoaded(trip) {
  if (!state.stopsLoaded) {
    const vp = document.getElementById('mainViewport');
    if (vp) renderInFrameDiagnostic(vp, `LOADING ROUTE ${getRouteNo(trip)} DATA...`);
    const res = await fetch('./data/stops.json');
    if (!res.ok) throw new Error('無法載入站點資料庫');
    const rawStops = await res.json();
    const arr = Array.isArray(rawStops) ? rawStops : [];

    state.audioByStopName.clear();
    state.audioByBaseName.clear();

    for (const s of arr) {
      const k1 = `${s.routeId || ''}|${String(s.bound || '').toUpperCase()}|${s.patternId || ''}`;
      if (!state.stopsByTrip.has(k1)) state.stopsByTrip.set(k1, []);
      state.stopsByTrip.get(k1).push(s);

      const k2 = `${s.routeId || ''}|${String(s.bound || '').toUpperCase()}`;
      if (!state.stopsByRouteBound.has(k2)) state.stopsByRouteBound.set(k2, []);
      state.stopsByRouteBound.get(k2).push(s);

      if (s.stopAudioFile) {
        const tc = getStopNameTc(s);
        const en = normStopName(tc);
        const bn = normBaseName(tc);
        if (en && !state.audioByStopName.has(en)) state.audioByStopName.set(en, s.stopAudioFile);
        if (bn && bn.length >= 2 && !state.audioByBaseName.has(bn)) state.audioByBaseName.set(bn, s.stopAudioFile);
      }
    }
    for (const list of state.stopsByTrip.values()) list.sort((a, b) => (a.seq ?? 0) - (b.seq ?? 0));

    state.stopsLoaded = true;
  }

  const keyExact = `${trip.routeId || ''}|${getBound(trip)}|${trip.patternId || ''}`;
  let stops = state.stopsByTrip.get(keyExact);
  if (!stops || stops.length === 0) {
    const keyFallback = `${trip.routeId || ''}|${getBound(trip)}`;
    const allForBound = state.stopsByRouteBound.get(keyFallback) || [];
    if (allForBound.length > 0) {
      const firstPat = allForBound[0].patternId || '';
      stops = allForBound.filter(x => (x.patternId || '') === firstPat).sort((a, b) => (a.seq ?? 0) - (b.seq ?? 0));
    }
  }
  return stops || [];
}

function openNumericModal(opts) {
  clearAnnAutoPlayTimers();
  const modal = document.getElementById('numModal');
  const titleEl = document.getElementById('numModalTitle');
  const subEl = document.getElementById('numModalSub');
  const dispEl = document.getElementById('numModalDisplay');
  const hintEl = document.getElementById('numModalHint');
  const gridEl = document.getElementById('numModalGrid');

  let value = opts.initialValue || '';
  titleEl.textContent = opts.title || '輸入數字';
  subEl.textContent = opts.subtitle || '';

  const updateView = () => {
    dispEl.textContent = opts.mask ? '●'.repeat(value.length) : value;
    if (opts.onChange) opts.onChange(value, hintEl, closeNumModal);
  };

  const keys = ['1','2','3','4','5','6','7','8','9','X','0','✓'];
  gridEl.innerHTML = keys.map(k => {
    let cls = 'bg-zinc-800 border-zinc-600 text-white active:bg-[#007AFF]';
    if (k === 'X') cls = 'bg-red-700 border-red-500 text-white active:brightness-90';
    if (k === '✓') cls = 'bg-emerald-600 border-emerald-500 text-white active:brightness-90';
    return `<button data-nk="${k}" class="num-key h-14 rounded-xl border font-black text-2xl ${cls}">${k}</button>`;
  }).join('');

  gridEl.querySelectorAll('.num-key').forEach(btn => {
    btn.onclick = () => {
      const k = btn.dataset.nk;
      if (k === 'X') {
        value = '';
        updateView();
      } else if (k === '✓') {
        clearAnnAutoPlayTimers();
        if (opts.onConfirm) opts.onConfirm(value, hintEl, closeNumModal);
      } else if (value.length < (opts.maxLen || 5)) {
        value += k;
        updateView();
      }
    };
  });

  document.getElementById('btnCloseNumModal').onclick = closeNumModal;
  hintEl.textContent = opts.initialHint || '';
  updateView();

}

      hintEl.textContent = val.length === 4 ? '按 ✓ 確認進入訓練模式' : '請輸入 4 位數密碼';

    onConfirm: (val, hintEl, close) => {
      if (val === '9999') {
        state.trainingMode = true;
        close();
        state.settingsPage = 'menu';
        renderAll();
        showToast('已啟動「訓練模式」，電子路線牌已轉為暫停載客');
      } else {
        hintEl.textContent = '密碼錯誤，請輸入 9999';
        playAlertBeep(true);
      }
    }
  });
}

// 3) 特別廣播數字鍵盤（輸入編號後 3 秒自動播放，播完跳回路線）
function openAnnounceKeypadModal() {
  openNumericModal({
    title: '輸入特別訊息編號',
    subtitle: '輸入編號後系統將於 3 秒後自動播放，播畢自動返回路線畫面',
    maxLen: 3,
    initialHint: '請輸入特別訊息編號（例如 1、33）',
    onChange: (val, hintEl, close) => {
      clearAnnAutoPlayTimers();
      if (!val) {
        hintEl.textContent = '請輸入特別訊息編號';
        return;
      }
      const numVal = String(Number(val));
      const item = state.announcements.find(a => String(a.code) === val || String(Number(a.code)) === numVal);
      if (!item) {
        hintEl.textContent = `找不到編號 #${val} 的特別訊息`;
        return;
      }
      const title = state.lang === 'en' ? (item.titleEn || item.titleTc) : (item.titleTc || item.titleEn);
      let remain = 3;
      hintEl.textContent = `#${item.code} ${title}（${remain} 秒後自動播放）`;
      annCountdownInterval = setInterval(() => {
        remain--;
        if (remain > 0) hintEl.textContent = `#${item.code} ${title}（${remain} 秒後自動播放）`;
      }, 1000);
      annAutoPlayTimer = setTimeout(() => {
        close();
        playSpecialAnnouncementByItem(item);
      }, 3000);
    },
    onConfirm: (val, hintEl, close) => {
      if (!val) { close(); return; }
      const numVal = String(Number(val));
      const item = state.announcements.find(a => String(a.code) === val || String(Number(a.code)) === numVal);
      if (!item) {
        hintEl.textContent = `找不到編號 #${val} 的特別訊息`;
        playAlertBeep(false);
        return;
      }
      close();
      playSpecialAnnouncementByItem(item);
    }
  });
}

// ============ 各主畫面渲染 ============
function renderMain() {
  const vp = document.getElementById('mainViewport');
  const bar = document.getElementById('bottomBar');
  if (!vp || !bar) return;
  bar.className = themeClasses().botBar;

  if (state.currentTab === 'route') {
    if (state.routeStage === 'route') renderRouteList(vp, bar);
    else if (state.routeStage === 'bound') renderBoundList(vp, bar);
    else if (state.routeStage === 'trip') renderTripList(vp, bar);
    else if (state.routeStage === 'start_stop') renderStartStopList(vp, bar);
    else renderStopsView(vp, bar);
  } else if (state.currentTab === 'announce') {
    renderAnnounceView(vp, bar);
  } else if (state.currentTab === 'message') {
    renderMessageView(vp, bar);
  } else if (state.currentTab === 'incident') {
    renderIncidentView(vp, bar);
  } else {
    renderSettingsView(vp, bar);
  }
}

const LECIP_KEYPAD_SPEC = [
  { digit: '1', letters: ['A', 'B', 'C'] },
  { digit: '2', letters: ['D', 'E', 'F'] },
  { digit: '3', letters: ['G', 'H', 'I'] },
  { digit: '4', letters: ['J', 'K', 'L'] },
  { digit: '5', letters: ['M', 'N', 'O'] },
  { digit: '6', letters: ['P', 'Q', 'R'] },
  { digit: '7', letters: ['S', 'T', 'U'] },
  { digit: '8', letters: ['V', 'W', 'X'] },
  { digit: '9', letters: ['Y', 'Z'] },
  { digit: '0', letters: ['.'] }
];

function renderLecipInlineKeypadHtml(activeDigit = null) {
  return `
    <div class="grid grid-cols-5 bg-[#0057d8] gap-[1px] border-t border-[#0044aa] shrink-0 select-none">
      ${LECIP_KEYPAD_SPEC.map(k => {
        const isHeld = activeDigit === k.digit;
        const sub = k.letters.join('');
        return `
          <button data-kdigit="${k.digit}"
                  class="lecip-kb-key h-[52px] flex flex-col items-center justify-center leading-none transition-colors ${isHeld ? 'bg-[#3b3a36] text-[#0070ff]' : 'bg-[#0074f0] active:bg-[#0058bd] text-white'}">
            <span class="text-[24px] font-black leading-none">${k.digit}</span>
            <span class="text-[11px] font-black tracking-wider mt-0.5">${sub}</span>
          </button>
        `;
      }).join('')}
    </div>
  `;
}

function bindLecipInlineKeypad(container, onDigit, onLongPressDigit) {
  container.querySelectorAll('.lecip-kb-key').forEach(btn => {
    const digit = btn.dataset.kdigit;
    let holdTimer = null;
    let heldFired = false;

    const startHold = e => {
      if (e.type === 'mousedown' && e.button !== 0) return;
      heldFired = false;
      clearTimeout(holdTimer);
      if (onLongPressDigit) {
        holdTimer = setTimeout(() => {
          heldFired = true;
          onLongPressDigit(digit);
        }, 380);
      }
    };
    const cancelHold = () => {
      clearTimeout(holdTimer);
    };

    btn.addEventListener('mousedown', startHold);
    btn.addEventListener('touchstart', startHold, { passive: true });
    btn.addEventListener('mouseup', cancelHold);
    btn.addEventListener('mouseleave', cancelHold);
    btn.addEventListener('touchend', cancelHold);
    btn.addEventListener('touchcancel', cancelHold);

    btn.addEventListener('contextmenu', e => {
      if (!onLongPressDigit) return;
      e.preventDefault();
      clearTimeout(holdTimer);
      onLongPressDigit(digit);
    });

    btn.addEventListener('click', () => {
      if (heldFired) {
        heldFired = false;
        return;
      }
      onDigit(digit);
    });
  });
}

function renderRouteList(vp, bar) {
  const th = themeClasses();

    ? state.uniqueRouteNos.filter(no => no.startsWith(state.searchQuery) || no.includes(state.searchQuery))
        .sort((a, b) => {
          const as = a.startsWith(state.searchQuery) ? 0 : 1;
          const bs = b.startsWith(state.searchQuery) ? 0 : 1;
          return as !== bs ? as - bs : compareRouteNo(a, b);
        })
    : state.uniqueRouteNos;

  const hasLetterBar = state.routeKbOpen && !!state.routeLetterKey;
  const visibleRows = state.routeKbOpen ? (hasLetterBar ? 2 : 3) : PAGE_SIZE;

  if (state.pageOffset < 0) state.pageOffset = 0;

  const slice = filtered.slice(state.pageOffset * visibleRows, (state.pageOffset + 1) * visibleRows);
  const activeSpec = hasLetterBar ? LECIP_KEYPAD_SPEC.find(x => x.digit === state.routeLetterKey) : null;

  const rowBg = th.dark ? 'bg-[#3b3a36] active:bg-[#4b4944] text-white border-[#52504a]' : 'bg-white active:bg-blue-50 text-zinc-900 border-zinc-400';

  const inputBg = th.dark ? 'bg-[#3b3a36] text-white border-zinc-400' : 'bg-white text-black border-zinc-500';

  vp.innerHTML = `
    <!-- 淺紫藍「輸入路線」實機輸入列 -->

      <div class="font-black text-[15px] leading-tight shrink-0 min-w-[66px]">${state.lang === 'en' ? 'Route' : '輸入路線'}</div>
      <button id="routeInputField" class="flex-1 h-10 rounded-xl border ${inputBg} px-3 flex items-center justify-between text-left active:opacity-90">
        <span class="text-2xl font-black tracking-wider leading-none">${esc(state.searchQuery)}${state.routeKbOpen ? '<span class="inline-block w-[2px] h-6 bg-current align-middle ml-0.5 animate-pulse"></span>' : ''}</span>
        ${!state.routeKbOpen ? `<span class="text-[11px] font-bold opacity-60">${state.pageOffset + 1}/${totalPages}</span>` : ''}
      </button>
      <button id="btnRouteBackspace" title="退格（長按全部清除）" class="w-12 h-10 rounded-xl bg-[#0074f0] active:brightness-90 text-white flex items-center justify-center shrink-0 shadow-sm">
        <svg class="w-7 h-7" viewBox="0 0 28 22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.5 3.5h14a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-14L2.5 11l7-7.5z"/>
          <line x1="14" y1="8.2" x2="20" y2="14.2"/>
          <line x1="20" y1="8.2" x2="14" y2="14.2"/>
        </svg>
      </button>
    </div>

    <!-- 路線列表（收合鍵盤 5 行／展開鍵盤 3 行／展開字母列 2 行） -->
    <div class="flex-1 flex flex-col overflow-hidden">
      ${slice.length === 0 ? `
        <div class="flex-1 flex flex-col items-center justify-center ${th.muted} text-sm font-bold gap-2 px-4 text-center">
          <div>找不到符合「${esc(state.searchQuery)}」的路線</div>
          <button id="btnResetSearch" class="px-3 py-1.5 rounded-lg bg-[#0074f0] text-white text-xs font-black">清除輸入</button>
        </div>
      ` : slice.map(no => `
        <button data-route="${esc(no)}" class="pick-route-btn flex-1 px-4 flex items-center justify-between border-b ${rowBg} text-left">
          <span class="text-2xl font-black tracking-tight">${esc(no)}</span>
          <span class="text-zinc-400 text-2xl font-black">›</span>
        </button>
      `).join('')}
      ${slice.length > 0 && slice.length < visibleRows ? Array(visibleRows - slice.length).fill(`
        <div class="flex-1 px-4 flex items-center justify-end border-b ${emptyBg}">
          <span class="text-zinc-500/40 text-2xl font-black">›</span>
        </div>
      `).join('') : ''}
    </div>

    <!-- 長按數字鍵展開嘅 5 格字母選擇列（例如 [ ][A][B][C][›]） -->
    ${activeSpec ? `
      <div class="grid grid-cols-5 h-[56px] border-t border-zinc-500 shrink-0 ${letterBg} divide-x ${th.dark ? 'divide-[#52504a]' : 'divide-zinc-400'}">
        <button id="btnLetterCancel" class="flex items-center justify-center text-xs font-bold ${th.muted} active:opacity-70"></button>
        ${[0, 1, 2].map(i => {
          const ch = activeSpec.letters[i] || '';
          return ch
            ? `<button data-lchar="${esc(ch)}" class="pick-letter-btn flex items-center justify-center text-3xl font-black text-[#0070ff] active:bg-[#0074f0] active:text-white">${esc(ch)}</button>`
            : `<div class="flex items-center justify-center"></div>`;
        }).join('')}
        <button id="btnLetterClose" class="flex items-center justify-center text-zinc-400 text-3xl font-black active:opacity-70">›</button>
      </div>

    <!-- 實機內嵌 2×5 藍色鍵盤 -->

  const canPrev = state.pageOffset > 0;
  const canNext = state.pageOffset < totalPages - 1;
  bar.className = 'grid grid-cols-10 gap-1 p-1 bg-black border-t border-zinc-800 shrink-0';
  bar.innerHTML = `
    <!-- 實機 Auto-A 機械人按鈕 -->
    <button id="botAutoA" title="長按數字鍵 1-9 可輸入英文字母" class="col-span-2 h-11 rounded-lg bg-[#0074f0] active:brightness-90 flex items-center justify-center">
      <svg class="w-9 h-9" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="18" fill="white"/>
        <line x1="15" y1="7" x2="18.5" y2="12" stroke="black" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="25" y1="7" x2="21.5" y2="12" stroke="black" stroke-width="2.2" stroke-linecap="round"/>
        <rect x="11" y="12" width="18" height="17" rx="3" stroke="black" stroke-width="2.8" fill="white"/>
        <path d="M8.5 16v8M31.5 16v8M16 29v4M24 29v4" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
        <text x="20" y="25" text-anchor="middle" fill="black" font-size="13.5" font-weight="900" font-family="sans-serif">A</text>
      </svg>
    </button>
    <button id="botPrev" class="col-span-3 h-11 rounded-lg ${canPrev ? 'bg-[#0074f0] text-white' : 'bg-[#6b6b6b] text-white/90'} font-black text-2xl flex items-center justify-center active:brightness-90">↑</button>
    <button id="botNext" class="col-span-3 h-11 rounded-lg ${canNext ? 'bg-[#0074f0] text-white' : 'bg-[#6b6b6b] text-white/90'} font-black text-2xl flex items-center justify-center active:brightness-90">↓</button>
    <button id="botSearch" title="開啟／關閉鍵盤" class="col-span-2 h-11 rounded-lg ${state.routeKbOpen ? 'bg-white text-[#0074f0]' : 'bg-[#0074f0] text-white'} flex items-center justify-center active:brightness-90">
      <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="6.5"/>
        <line x1="16" y1="16" x2="21" y2="21"/>
      </svg>
    </button>
  `;

  // 綁定路線點選
  vp.querySelectorAll('.pick-route-btn').forEach(btn => {
    btn.onclick = () => {
      state.selectedRouteNo = btn.dataset.route;
      state.routeStage = 'bound';
      state.routeKbOpen = false;
      state.routeLetterKey = null;
      state.pageOffset = 0;
      renderAll();
    };
  });

  // 綁定輸入框（點擊即開啟鍵盤）
  document.getElementById('routeInputField').onclick = () => {
    if (!state.routeKbOpen) {
      state.routeKbOpen = true;
      state.routeLetterKey = null;
      renderMain();
    }
  };

  // 退格掣（短按刪一字，長按全部清除）
  const bsBtn = document.getElementById('btnRouteBackspace');
  let bsTimer = null;
  let bsHeld = false;
  const startBs = () => {
    bsHeld = false;
    clearTimeout(bsTimer);
    bsTimer = setTimeout(() => {
      bsHeld = true;
      state.searchQuery = '';
      state.routeLetterKey = null;
      state.pageOffset = 0;
      renderMain();
    }, 450);
  };
  const stopBs = () => clearTimeout(bsTimer);
  bsBtn.addEventListener('mousedown', startBs);
  bsBtn.addEventListener('touchstart', startBs, { passive: true });
  bsBtn.addEventListener('mouseup', stopBs);
  bsBtn.addEventListener('mouseleave', stopBs);
  bsBtn.addEventListener('touchend', stopBs);
  bsBtn.onclick = () => {
    if (bsHeld) { bsHeld = false; return; }
    if (state.routeLetterKey) {
      state.routeLetterKey = null;
      renderMain();
      return;
    }
    if (state.searchQuery.length > 0) {
      state.searchQuery = state.searchQuery.slice(0, -1);
      state.pageOffset = 0;
      renderMain();
    }
  };

  const resetBtn = document.getElementById('btnResetSearch');
  if (resetBtn) resetBtn.onclick = () => { state.searchQuery = ''; state.routeLetterKey = null; state.pageOffset = 0; renderMain(); };

  // 綁定展開字母列

      }

      renderMain();

        renderMain();
      },
      digit => {
        if (digit === '0') {

    state.routeKbOpen = !state.routeKbOpen;
    state.routeLetterKey = null;
    state.pageOffset = 0;
    renderMain();
  };
  document.getElementById('botPrev').onclick = () => { if (canPrev) { state.pageOffset--; renderMain(); } };
  document.getElementById('botNext').onclick = () => { if (canNext) { state.pageOffset++; renderMain(); } };
}

// ============ 地圖 API (OSRM) 實時距離與 ETA 分鐘計算 ============
function formatDistanceLabel(meters) {
  if (meters == null || !Number.isFinite(Number(meters))) return '--';
  const m = Math.max(0, Math.round(Number(meters)));
  if (m >= 1000) return `${(m / 1000).toFixed(1)}km`;
  return `${m}m`;
}

function estimateFallbackEtas(curIdx) {
  const stops = state.tripStops || [];
  if (!stops[curIdx]) return;

  const hasLiveGps = state.gpsEnabled && Number.isFinite(state.gpsLat) && Number.isFinite(state.gpsLng);
  let prevLat = null;
  let prevLng = null;

  if (hasLiveGps) {
    prevLat = state.gpsLat;
    prevLng = state.gpsLng;
  } else if (curIdx > 0) {
    const pLat = getStopLat(stops[curIdx - 1]);
    const pLng = getStopLng(stops[curIdx - 1]);
    if (Number.isFinite(pLat) && Number.isFinite(pLng)) {
      prevLat = pLat;
      prevLng = pLng;
    }
  }

  let cumSec = 0;
  const maxIdx = Math.min(stops.length - 1, curIdx + Math.max(3, (state.stopsPage + 1) * 3));
  for (let i = curIdx; i <= maxIdx; i++) {
    const lat = getStopLat(stops[i]);
    const lng = getStopLng(stops[i]);
    let legDistM = 450;
    if (Number.isFinite(lat) && Number.isFinite(lng) && Number.isFinite(prevLat) && Number.isFinite(prevLng)) {
      legDistM = Math.round(calcDistanceMeters(prevLat, prevLng, lat, lng) * 1.32);
    } else if (i === curIdx && !hasLiveGps && curIdx === 0) {
      legDistM = 0;
    }
    if (Number.isFinite(lat) && Number.isFinite(lng)) {
      prevLat = lat;
      prevLng = lng;
    }
    const legSec = (legDistM / 7.8) + (i > curIdx ? 22 : 0); // 約 28 km/h 市區巴士均速 + 停站
    cumSec += legSec;
    if (!state.etaMap[i] || state.etaMap[i].source !== 'osrm') {
      state.etaMap[i] = {
        mins: Math.max(1, Math.round(cumSec / 60)),
        distM: legDistM,
        source: 'est'
      };
    }
  }
}

function updateEtaDomInPlace() {
  if (!state.gpsEnabled) return;
  const curIdx = state.currentStopIdx;
  const curEta = state.etaMap[curIdx];
  const minEl = document.getElementById('etaCurMins');
  const distEl = document.getElementById('etaCurDist');
  if (minEl && curEta) {
    minEl.textContent = state.lang === 'en' ? `${curEta.mins} min` : `${curEta.mins}分鐘`;
  }
  if (distEl) {
    const d = (state.gpsEnabled && state.gpsDistanceM != null && curEta?.source !== 'osrm')
      ? state.gpsDistanceM
      : (curEta ? curEta.distM : state.gpsDistanceM);
    distEl.textContent = formatDistanceLabel(d);
  }
  document.querySelectorAll('[data-eta-idx]').forEach(el => {
    const idx = Number(el.dataset.etaIdx);
    const info = state.etaMap[idx];
    if (info) el.textContent = String(info.mins);
  });
}

async function refreshRouteEtas(force = false) {
  if (!state.gpsEnabled || state.routeStage !== 'stops' || !state.tripStops.length) return;
  const curIdx = state.currentStopIdx;
  estimateFallbackEtas(curIdx);
  updateEtaDomInPlace();

  const now = Date.now();
  const hasLiveGps = state.gpsEnabled && Number.isFinite(state.gpsLat) && Number.isFinite(state.gpsLng);
  const fetchKey = `${state.selectedTrip?.routeId || ''}|${state.selectedTrip?.bound || ''}|${curIdx}|p${state.stopsPage}|${hasLiveGps ? 'gps' : 'sim'}`;

  if (!force && state.etaLastFetchKey === fetchKey) {
    const elapsed = now - state.etaLastFetchMs;
    const movedM = (hasLiveGps && Number.isFinite(state.etaLastLat) && Number.isFinite(state.etaLastLng))
      ? calcDistanceMeters(state.etaLastLat, state.etaLastLng, state.gpsLat, state.gpsLng)
      : 0;
    if (elapsed < 12000 && movedM < 80) return;
  }

  const coords = [];
  const stopIndices = [];
  let startIsCurStop = false;

  if (hasLiveGps) {
    coords.push(`${state.gpsLng.toFixed(6)},${state.gpsLat.toFixed(6)}`);
  } else if (curIdx > 0) {
    const pLat = getStopLat(state.tripStops[curIdx - 1]);
    const pLng = getStopLng(state.tripStops[curIdx - 1]);
    if (Number.isFinite(pLat) && Number.isFinite(pLng)) {
      coords.push(`${pLng.toFixed(6)},${pLat.toFixed(6)}`);
    } else {
      startIsCurStop = true;
    }
  } else {
    startIsCurStop = true;
  }

  const maxIdx = Math.min(state.tripStops.length - 1, curIdx + 6);
  for (let i = curIdx; i <= maxIdx; i++) {
    const lat = getStopLat(state.tripStops[i]);
    const lng = getStopLng(state.tripStops[i]);
    if (Number.isFinite(lat) && Number.isFinite(lng)) {
      coords.push(`${lng.toFixed(6)},${lat.toFixed(6)}`);
      stopIndices.push(i);
    }
  }

  if (coords.length < 2) return;

  state.etaLastFetchKey = fetchKey;
  state.etaLastFetchMs = now;
  if (hasLiveGps) {
    state.etaLastLat = state.gpsLat;
    state.etaLastLng = state.gpsLng;
  }

  try {
    const url = `https://router.project-osrm.org/route/v1/driving/${coords.join(';')}?overview=false&steps=false`;
    const res = await fetch(url);
    if (!res.ok) return;
    const data = await res.json();
    const legs = data?.routes?.[0]?.legs;
    if (!Array.isArray(legs) || legs.length === 0) return;

    // 確認回覆時仍停留在同一個班次與站位
    if (!state.gpsEnabled || state.routeStage !== 'stops' || state.currentStopIdx !== curIdx) return;

    let cumSec = 0;
    if (startIsCurStop) {
      // 起點本身就是目前站 (curIdx)
      state.etaMap[stopIndices[0]] = { mins: 1, distM: 0, source: 'osrm' };
      for (let li = 0; li < legs.length && (li + 1) < stopIndices.length; li++) {
        const leg = legs[li];
        cumSec += (leg.duration || 0) * 1.22 + 22;
        state.etaMap[stopIndices[li + 1]] = {
          mins: Math.max(1, Math.round(cumSec / 60)),
          distM: Math.round(leg.distance || 0),
          source: 'osrm'
        };
      }
    } else {
      for (let li = 0; li < legs.length && li < stopIndices.length; li++) {
        const leg = legs[li];
        cumSec += (leg.duration || 0) * 1.22 + (li > 0 ? 22 : 0);
        state.etaMap[stopIndices[li]] = {
          mins: Math.max(1, Math.round(cumSec / 60)),
          distM: Math.round(leg.distance || 0),
          source: 'osrm'
        };
      }
    }
    updateEtaDomInPlace();
  } catch (_) {
    // 離線或限流時維持本地推算 ETA
  }
}

  const th = themeClasses();

  const cur = state.tripStops[state.currentStopIdx];

    return;
  }

  const UPCOMING_PER_PAGE = 3; // 連同正在前往的車站，每頁同時最多顯示 4 個車站
  const remainingTotal = Math.max(0, state.tripStops.length - 1 - state.currentStopIdx);
  const totalStopPages = Math.max(1, Math.ceil(remainingTotal / UPCOMING_PER_PAGE));
  if (state.stopsPage >= totalStopPages) state.stopsPage = totalStopPages - 1;
  if (state.stopsPage < 0) state.stopsPage = 0;

  if (state.gpsEnabled) estimateFallbackEtas(state.currentStopIdx);
  const curEta = state.etaMap[state.currentStopIdx] || { mins: 1, distM: state.gpsDistanceM ?? 0 };
  const sections = computeTripSections(state.tripStops, state.selectedTrip);
  const curSec = sections[state.currentStopIdx] || { sectionNo: 1, activeFare: null, badgeFare: null };
  const trip = state.selectedTrip || {};
  const dest = state.lang === 'en' ? (getDestEn(trip) || getDestTc(trip)) : (getDestTc(trip) || getDestEn(trip));
  const remark = getRealTripRemark(trip) || (state.lang === 'en' ? 'Normal Route' : '正常路線');

  const startOffset = state.stopsPage * UPCOMING_PER_PAGE;
  const upcoming = state.tripStops.slice(
    state.currentStopIdx + 1 + startOffset,
    state.currentStopIdx + 1 + startOffset + UPCOMING_PER_PAGE
  );

  const curPanelCls = th.dark ? 'bg-[#12161f] border-b border-zinc-700 text-white' : 'bg-white border-b border-zinc-400 text-[#111827]';
  const upRowCls = th.dark ? 'bg-[#171d29] active:bg-zinc-800 text-zinc-100 border-zinc-800' : 'bg-white active:bg-blue-50 text-[#111827] border-zinc-400';

  const curMinsText = state.lang === 'en' ? `${curEta.mins} min` : `${curEta.mins}分鐘`;
  const curDistText = formatDistanceLabel(curEta.distM);

  vp.innerHTML = `

    <div class="px-3.5 py-2 ${headerBg} flex items-stretch justify-between gap-2 shrink-0">
      <div class="min-w-0 flex flex-col justify-center">
        <div class="text-[20px] font-black tracking-tight leading-snug truncate">${esc(state.selectedRouteNo)}-${esc(dest || '終點')}-${esc(state.selectedTripSeq || 1)}</div>
        <div class="text-[15px] font-extrabold leading-snug truncate mt-0.5 opacity-90">${esc(remark)}</div>
      </div>
      <div class="w-[74px] py-1 rounded-[3px] border ${secBoxCls} flex flex-col items-center justify-center shrink-0">
        <div class="text-[12px] font-extrabold leading-none opacity-85">分段</div>

      </div>
    </div>

    <div class="px-3.5 py-3 ${curPanelCls} shrink-0">
      <button id="btnReplayCurrent" class="w-full text-left active:opacity-80">
        <div class="text-[23px] font-black leading-snug">${state.currentStopIdx + 1}. ${esc(curName)}</div>
        ${curSub ? `<div class="text-xs font-bold ${th.muted} mt-0.5 truncate">${esc(curSub)}</div>` : ''}
      </button>

      ${!state.gpsEnabled ? `
        <div class="grid grid-cols-2 gap-3 mt-3.5">
          <button id="btnManualStop" class="h-14 rounded-xl bg-[#d92b1c] active:brightness-90 text-white font-black text-lg shadow">

        </div>
      ` : `

          <div class="flex items-center justify-end gap-5 text-[15px] font-extrabold ${th.dark ? 'text-zinc-200' : 'text-[#2b303a]'}">
            <div class="flex items-center gap-1.5">
              <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9.5"/>
                <polyline points="8.2 10.5 12 13 16.2 9.5"/>

              <span id="etaCurDist" class="font-mono font-extrabold">${esc(curDistText)}</span>

                <line x1="8" y1="15" x2="14" y2="15"/>

        <div class="px-4 py-6 text-center text-sm font-black ${th.dark ? 'text-amber-400' : 'text-zinc-800'}">已到達本班次終點站</div>
      ` : upcoming.map((st, offset) => {
        const targetIdx = state.currentStopIdx + 1 + startOffset + offset;
        const nm = state.lang === 'en' ? (getStopNameEn(st) || getStopNameTc(st)) : getStopNameTc(st);
        const sInfo = sections[targetIdx] || {};
        const uEta = state.etaMap[targetIdx] || { mins: Math.max(2, (startOffset + offset + 1) * 3) };

          </button>

  const canPrev = state.stopsPage > 0;
  const canNext = state.stopsPage < totalStopPages - 1;
  bar.className = 'grid grid-cols-4 gap-1.5 p-1.5 bg-[#0d1118] border-t border-zinc-800 shrink-0';
  bar.innerHTML = `
    <button id="botBack" class="h-11 rounded-lg bg-[#e53935] text-white font-black text-2xl flex items-center justify-center active:brightness-90">‹</button>
    <button id="botPrev" class="h-11 rounded-lg ${canPrev ? 'bg-[#0074f0] text-white active:brightness-90' : 'bg-[#5a6069] text-zinc-200'}" ${canPrev ? '' : 'disabled'}>↑</button>
    <button id="botNext" class="h-11 rounded-lg ${canNext ? 'bg-[#0074f0] text-white active:brightness-90' : 'bg-[#5a6069] text-zinc-200'}" ${canNext ? '' : 'disabled'}>↓</button>
    <button id="botMore" class="h-11 rounded-lg bg-[#0074f0] text-white font-black text-xl flex items-center justify-center active:brightness-90">•••</button>

      state.currentStopIdx++;
      state.stopsPage = 0;
      state.stopProgressPct = 20;
      state.gpsDistanceM = null;
      state.gpsArrivedCur = false;
      state.gpsMinDistToCur = Infinity;
      state.etaMap = {};

      triggerStopAnnouncement(state.currentStopIdx, true);

    };
  });

  document.getElementById('botBack').onclick = () => {
    stopAllAudio();
    stopGpsTracking();
    state.stopsPage = 0;
    state.routeStage = 'start_stop';
    renderAll();
  };
  if (bPrev) bPrev.onclick = () => { if (canPrev) { state.stopsPage--; renderMain(); } };
  if (bNext) bNext.onclick = () => { if (canNext) { state.stopsPage++; renderMain(); } };
  document.getElementById('botMore').onclick = () => document.getElementById('moreModal').classList.remove('hidden');

  if (state.gpsEnabled) refreshRouteEtas(false);
}

// ============ 特別廣播分頁（實機螢光綠 ▶ / 紅 ■ ＋ 內嵌 2×5 鍵盤 3 秒自動播） ============
function scheduleInlineAnnAutoPlay() {
  clearAnnAutoPlayTimers();
  const val = state.annInputCode;
  const badgeEl = document.getElementById('annCountdownText');
  if (!val) {
    if (badgeEl) badgeEl.textContent = '';
    return;
  }
  const numVal = String(Number(val));
  const item = state.announcements.find(a => String(a.code) === val || String(Number(a.code)) === numVal);
  if (!item) {
    if (badgeEl) badgeEl.textContent = `#${val} (無此編號)`;
    return;
  }
  let remain = 3;
  if (badgeEl) badgeEl.textContent = `#${item.code} (${remain}s 自動播)`;
  annCountdownInterval = setInterval(() => {
    remain--;
    const b = document.getElementById('annCountdownText');
    if (b && remain > 0) b.textContent = `#${item.code} (${remain}s 自動播)`;
  }, 1000);
  annAutoPlayTimer = setTimeout(() => {
    clearAnnAutoPlayTimers();
    state.annInputCode = '';
    state.annKbOpen = false;
    playSpecialAnnouncementByItem(item);
  }, 3000);
}

function renderAnnounceView(vp, bar) {
  const th = themeClasses();
  vp.className = th.dark ? 'flex-1 flex flex-col overflow-hidden bg-[#3b3a36] text-white' : 'flex-1 flex flex-col overflow-hidden bg-white text-black';

  const filtered = state.annInputCode
    ? state.announcements.filter(a => {
        const c = String(a.code ?? '');
        return c === state.annInputCode || c.startsWith(state.annInputCode) || String(Number(c)) === String(Number(state.annInputCode));
      })
    : state.announcements;

  const visibleRows = state.annKbOpen ? 3 : PAGE_SIZE;
  const totalPages = Math.max(1, Math.ceil(filtered.length / visibleRows));
  if (state.announcePage >= totalPages) state.announcePage = totalPages - 1;
  if (state.announcePage < 0) state.announcePage = 0;

  const slice = filtered.slice(state.announcePage * visibleRows, (state.announcePage + 1) * visibleRows);
  const rowBg = th.dark ? 'bg-[#3b3a36] text-white border-[#52504a]' : 'bg-white text-zinc-900 border-zinc-400';

  vp.innerHTML = `
    <!-- 淺紫藍「播放特別訊息」實機標題列 -->
    <div class="px-3 py-2 bg-[#d4dcff] text-black border-b border-zinc-500 flex items-center justify-between gap-2 shrink-0">
      <span class="font-black text-[15px]">${state.lang === 'en' ? 'Special Announcements' : '播放特別訊息'}</span>
      <div class="flex items-center gap-1.5">
        <span id="annCountdownText" class="text-xs font-black text-[#0057d8]">${state.annInputCode ? '#' + esc(state.annInputCode) : ''}</span>
        ${state.annInputCode ? `<button id="btnAnnClearCode" class="px-2 py-0.5 rounded bg-[#0074f0] text-white text-[11px] font-black">⌫</button>` : `<span class="text-xs font-bold text-zinc-600">${state.announcePage + 1} / ${totalPages}</span>`}
      </div>
    </div>

    <!-- 特別訊息列表（無鍵盤 5 行／展開鍵盤 3 行） -->
    <div class="flex-1 flex flex-col overflow-hidden">
      ${slice.length === 0 ? `
        <div class="flex-1 flex flex-col items-center justify-center ${th.muted} text-sm font-bold gap-2">
          <div>找不到編號「${esc(state.annInputCode)}」的特別訊息</div>
          <button id="btnAnnResetEmpty" class="px-3 py-1.5 rounded-lg bg-[#0074f0] text-white text-xs font-black">清除編號</button>
        </div>
      ` : slice.map(item => {
        const code = String(item.code ?? '');
        const title = state.lang === 'en' ? (item.titleEn || item.titleTc) : (item.titleTc || item.titleEn);
        const isPlaying = state.playingAnnCode === code;
        return `
          <div class="flex-1 flex items-stretch border-b ${rowBg}">
            <div class="flex-1 px-4 flex items-center gap-3 min-w-0">
              <span class="text-xl font-black shrink-0 w-9">${esc(code)}.</span>
              <span class="text-lg font-extrabold truncate">${esc(title)}</span>
            </div>
            <button data-acode="${esc(code)}" class="play-ann-btn w-[72px] shrink-0 flex items-center justify-center ${isPlaying ? 'bg-[#e51c23]' : 'bg-[#00e600]'} active:brightness-90">
              ${isPlaying
                ? '<span class="w-7 h-7 rounded-[3px] bg-black block"></span>'
                : '<svg class="w-8 h-8 text-black" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>'
              }
            </button>
          </div>
        `;
      }).join('')}
      ${slice.length > 0 && slice.length < visibleRows ? Array(visibleRows - slice.length).fill(`<div class="flex-1 border-b ${rowBg}"></div>`).join('') : ''}
    </div>

    <!-- 實機內嵌 2×5 藍色鍵盤 -->
    ${state.annKbOpen ? renderLecipInlineKeypadHtml(null) : ''}
  `;

  const canPrev = state.announcePage > 0;
  const canNext = state.announcePage < totalPages - 1;
  bar.className = 'grid grid-cols-5 gap-1 p-1 bg-black border-t border-zinc-800 shrink-0';
  bar.innerHTML = `
    <button id="botPrev" class="col-span-2 h-11 rounded-lg ${canPrev ? 'bg-[#0074f0] text-white' : 'bg-[#2b2a27] text-white/80'} font-black text-2xl flex items-center justify-center active:brightness-90">↑</button>
    <button id="botNext" class="col-span-2 h-11 rounded-lg ${canNext ? 'bg-[#0074f0] text-white' : 'bg-[#2b2a27] text-white/80'} font-black text-2xl flex items-center justify-center active:brightness-90">↓</button>
    <button id="botAnnKeypad" title="開啟／關閉數字鍵盤" class="col-span-1 h-11 rounded-lg ${state.annKbOpen ? 'bg-white text-[#0074f0]' : 'bg-[#0074f0] text-white'} flex items-center justify-center active:brightness-90">
      <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="6.5"/>
        <line x1="16" y1="16" x2="21" y2="21"/>
      </svg>
    </button>
  `;

  vp.querySelectorAll('.play-ann-btn').forEach(btn => {
    btn.onclick = () => {
      clearAnnAutoPlayTimers();
      const code = btn.dataset.acode;
      if (state.playingAnnCode === code) {
        stopAllAudio();
        renderMain();
        showToast('已中止播放特別訊息');
        return;
      }
      const item = state.announcements.find(a => String(a.code) === code);
      if (item) {
        state.annInputCode = '';
        playSpecialAnnouncementByItem(item);
      }
    };
  });

  const clrBtn = document.getElementById('btnAnnClearCode');
  if (clrBtn) clrBtn.onclick = () => {
    clearAnnAutoPlayTimers();
    state.annInputCode = state.annInputCode.slice(0, -1);
    state.announcePage = 0;
    renderMain();
    scheduleInlineAnnAutoPlay();
  };
  const rstBtn = document.getElementById('btnAnnResetEmpty');
  if (rstBtn) rstBtn.onclick = () => {
    clearAnnAutoPlayTimers();
    state.annInputCode = '';
    state.announcePage = 0;
    renderMain();
  };

  if (state.annKbOpen) {
    bindLecipInlineKeypad(
      vp,
      digit => {
        if (state.annInputCode.length < 3) {
          state.annInputCode += digit;
          state.announcePage = 0;
          renderMain();
          scheduleInlineAnnAutoPlay();
        }
      },
      null
    );
  }

  document.getElementById('botPrev').onclick = () => { if (canPrev) { state.announcePage--; renderMain(); } };
  document.getElementById('botNext').onclick = () => { if (canNext) { state.announcePage++; renderMain(); } };
  document.getElementById('botAnnKeypad').onclick = () => {
    clearAnnAutoPlayTimers();
    state.annKbOpen = !state.annKbOpen;
    if (!state.annKbOpen) state.annInputCode = '';
    state.announcePage = 0;
    renderMain();
  };
}

// ============ 訊息收件匣（停車 ≥3s 安全鎖＋聲音訊息綠色播放掣＋行車自動彈回） ============
function playVoiceMessage(m) {
  if (!m) return;
  m.unread = false;
  renderTopStatus();
  if (state.currentTab === 'message') renderMain();
  showToast(`播放聲音訊息：${m.title}`);
  playAnnouncementSegments([
    { files: m.voiceFile ? [m.voiceFile] : [], tc: m.body, en: '', sc: '' }
  ]);
}

// ============ 三段式紅頂「事故」功能（停車 ≥3s 安全鎖 -> 完成過客／繼續行程 -> 完成處理） ============
function renderIncidentView(vp, bar) {
  const th = themeClasses();
  vp.className = th.vp;

  // 階段二：事故進行中（紅頂、暫停自動報站、電子牌暫停載客）

    vp.innerHTML = `
      <div class="px-3 py-2 bg-red-700 text-white font-black text-sm flex items-center justify-between shrink-0">
        <span>⚠ 事故模式進行中</span>
        <span class="font-mono text-xs">${esc(inc.startTime)}</span>
      </div>
      <div class="flex-1 flex flex-col justify-between p-4">

          <div class="p-3.5 rounded-xl bg-red-600/15 border-2 border-red-600">
            <div class="text-xs font-black text-red-500">已啟動事故類別</div>
            <div class="text-2xl font-black mt-0.5">${esc(inc.type)}</div>
            <div class="text-xs font-bold ${th.muted} mt-2 space-y-1">
              <div>• 已回報位置並中止預計抵站時間</div>
              <div>• 自動報站已暫停，電子牌轉為「暫停載客」</div>
              <div>• 請按程序致電控制中心，依督導人員指示操作</div>
            </div>
          </div>

          <div class="grid grid-cols-1 gap-3 pt-1">
            <button id="btnIncTransfer" class="h-14 rounded-xl bg-amber-500 active:brightness-90 text-black font-black text-lg shadow">
              完成過客
            </button>
            <button id="btnIncResume" class="h-14 rounded-xl bg-emerald-600 active:brightness-90 text-white font-black text-lg shadow">
              繼續行程
            </button>
          </div>
        </div>
        <div class="text-[11px] font-bold ${th.muted} text-center">如遇緊急情況，請先報警及安頓乘客</div>
      </div>
    `;
    bar.innerHTML = `
      <button id="botIncReplay" class="col-span-4 h-11 rounded-lg bg-red-700 text-white font-black text-sm">重播事故車廂廣播</button>
    `;
    document.getElementById('btnIncTransfer').onclick = () => {
      state.incidentState.stage = 'transferred';
      renderAll();
      showToast('已完成過客，電子牌維持「暫停載客」');
    };
    document.getElementById('btnIncResume').onclick = () => {
      state.incidentState = { stage: 'idle', type: '', startTime: '' };
      state.currentTab = 'route';
      renderAll();
      showToast('已結束事故模式，繼續餘下行程');
    };
    document.getElementById('botIncReplay').onclick = () => {
      playAnnouncementSegments([{
        files: [],
        tc: '各位乘客請注意，因發生突發事故，本班車暫時停止行駛，不便之處，敬請見諒。',
        en: 'Attention passengers, due to an incident, this bus service is temporarily suspended. We apologize for the inconvenience.',
        sc: '各位乘客请注意，因发生突发事故，本班车暂时停止行驶。'
      }]);
    };
    return;
  }

  // 階段三：已完成過客，待巴士離開現場按「完成處理」
  if (inc.stage === 'transferred') {
    vp.innerHTML = `
      <div class="px-3 py-2 bg-red-700 text-white font-black text-sm flex items-center justify-between shrink-0">
        <span>⚠ 事故模式 · 已完成過客</span>
        <span class="font-mono text-xs">${esc(inc.startTime)}</span>
      </div>
      <div class="flex-1 flex flex-col justify-center p-4 space-y-4">
        <div class="p-4 rounded-xl border-2 border-amber-500 bg-amber-500/10 space-y-2 text-center">
          <div class="text-lg font-black">${esc(inc.type)}（已過客）</div>
          <div class="text-xs font-bold ${th.muted} leading-relaxed">
            電子路線牌已轉為「暫停載客」。<br/>
            當巴士準備離開現場時，請按下「完成處理」，系統將中途中止車程並自動記錄於電子站長紙。
          </div>
        </div>
        <button id="btnIncFinish" class="h-16 rounded-xl bg-red-600 active:brightness-90 text-white font-black text-xl shadow-lg">

    `;

      state.incidents.unshift({
        type: inc.type,
        time: inc.startTime,
        endTime: new Date().toTimeString().slice(0, 8),
        route: state.selectedRouteNo || '未入線'
      });
      state.incidentState = { stage: 'idle', type: '', startTime: '' };
      stopAllAudio();
      stopGpsTracking();
      state.routeStage = 'route';
      state.currentTab = 'route';
      renderAll();
      showToast('已完成事故處理並記錄於電子站長紙');
    };
    document.getElementById('botIncBackStep2').onclick = () => {
      state.incidentState.stage = 'active';
      renderAll();
    };
    return;
  }

  // 階段一：停車 ≥3 秒安全鎖檢查 + 選擇事故類別
  if (!state.isStopped3s) {
    vp.innerHTML = `
      <div class="px-3 py-2 ${th.subBar} font-black text-sm shrink-0">事故功能</div>
      <div class="flex-1 flex flex-col items-center justify-center p-6 text-center space-y-3">

        <div class="text-base font-black">行車期間停用「事故」功能</div>
        <div class="text-xs font-bold ${th.muted} leading-relaxed">
          為保障駕駛安全，必須於安全位置停下達 3 秒或以上才可使用事故功能。<br/>
          （電腦測試可點右上角 [123] 切換回停車狀態）
        </div>
      </div>
    `;
    bar.innerHTML = `
      <button id="botBackRoute" class="col-span-4 h-11 rounded-lg bg-[#0068FF] text-white font-black text-sm">返回路線</button>
    `;

  vp.innerHTML = `
    <div class="px-3 py-2 ${th.subBar} font-black text-sm shrink-0">選擇事故類別（停車 ≥3s 可用）</div>
    <div class="p-3 grid grid-cols-2 gap-2 shrink-0">
      ${types.map(t => `
        <button data-itype="${esc(t)}" class="inc-btn py-3.5 rounded-lg bg-red-600 active:brightness-90 text-white font-black text-sm shadow-sm">${esc(t)}</button>
      `).join('')}
    </div>
    <div class="px-3 py-1.5 ${th.subBar} text-xs font-black shrink-0">電子站長紙事故記錄 (${state.incidents.length})</div>
    <div class="flex-1 overflow-y-auto no-scrollbar divide-y ${th.divider} px-3">
      ${state.incidents.length === 0 ? `<div class="py-6 text-center text-xs ${th.muted} font-bold">暫無已中止車程事故記錄</div>` : state.incidents.map(rec => `
        <div class="py-2 flex items-center justify-between text-xs">
          <span class="font-black text-red-500">${esc(rec.route)} · ${esc(rec.type)}</span>
          <span class="font-mono ${th.muted}">${esc(rec.time)}-${esc(rec.endTime || '')}</span>
        </div>
      `).join('')}
    </div>
  `;
  bar.innerHTML = `
    <button id="botClearInc" class="col-span-2 h-11 rounded-lg bg-zinc-700 text-white font-black text-sm">清除記錄</button>
    <button id="botBackRoute" class="col-span-2 h-11 rounded-lg bg-[#0068FF] text-white font-black text-sm">返回路線</button>
  `;
  vp.querySelectorAll('.inc-btn').forEach(btn => {
    btn.onclick = () => {
      const t = new Date().toTimeString().slice(0, 8);
      state.incidentState = { stage: 'active', type: btn.dataset.itype, startTime: t };
      stopAllAudio();
      playAlertBeep(true);
      renderAll();
      playAnnouncementSegments([{
        files: [],
        tc: '各位乘客請注意，因發生突發事故，本班車暫時停止行駛，請遵從車長指示。',
        en: 'Attention passengers, due to an incident, this bus service is temporarily suspended.',
        sc: ''
      }]);
    };
  });
  document.getElementById('botClearInc').onclick = () => { state.incidents = []; renderAll(); };
  document.getElementById('botBackRoute').onclick = () => { state.currentTab = 'route'; renderAll(); };
}

  document.getElementById('optDiag').onclick = () => { state.settingsPage = 'diag'; renderAll(); };
  document.getElementById('optMaint').onclick = () => { state.settingsPage = 'maint'; renderAll(); };
  document.getElementById('optTrain').onclick = () => handleTrainingModeToggle();
  document.getElementById('optStaff').onclick = () => openStaffIdModal();
