// ============ 地圖 API (OSRM) 實時距離與 ETA 分鐘計算 ============
function formatDistanceLabel(meters) {
  if (meters == null || !Number.isFinite(Number(meters))) return '--';
  const m = Math.max(0, Math.round(Number(meters)));
  if (m >= 1000) return `${(m / 1000).toFixed(1)}km`;
  return `${m}m`;
}

function estimateFallbackEtas(curIdx) {
  const stops = state.tripStops || [];
  if (!stops[curIdx]) return;

  const hasLiveGps = state.gpsEnabled && Number.isFinite(state.gpsLat) && Number.isFinite(state.gpsLng);
  let prevLat = null;
  let prevLng = null;

  if (hasLiveGps) {
    prevLat = state.gpsLat;
    prevLng = state.gpsLng;
  } else if (curIdx > 0) {
    const pLat = getStopLat(stops[curIdx - 1]);
    const pLng = getStopLng(stops[curIdx - 1]);
    if (Number.isFinite(pLat) && Number.isFinite(pLng)) {
      prevLat = pLat;
      prevLng = pLng;
    }
  }

  let cumSec = 0;
  const maxIdx = Math.min(stops.length - 1, curIdx + Math.max(3, (state.stopsPage + 1) * 3));
  for (let i = curIdx; i <= maxIdx; i++) {
    const lat = getStopLat(stops[i]);
    const lng = getStopLng(stops[i]);
    let legDistM = 450;
    if (Number.isFinite(lat) && Number.isFinite(lng) && Number.isFinite(prevLat) && Number.isFinite(prevLng)) {
      legDistM = Math.round(calcDistanceMeters(prevLat, prevLng, lat, lng) * 1.32);
    } else if (i === curIdx && !hasLiveGps && curIdx === 0) {
      legDistM = 0;
    }
    if (Number.isFinite(lat) && Number.isFinite(lng)) {
      prevLat = lat;
      prevLng = lng;
    }
    const legSec = (legDistM / 7.8) + (i > curIdx ? 22 : 0); // 約 28 km/h 市區巴士均速 + 停站
    cumSec += legSec;
    if (!state.etaMap[i] || state.etaMap[i].source !== 'osrm') {
      state.etaMap[i] = {
        mins: Math.max(1, Math.round(cumSec / 60)),
        distM: legDistM,
        source: 'est'
      };
    }
  }
}

function updateEtaDomInPlace() {
  if (!state.gpsEnabled) return;
  const curIdx = state.currentStopIdx;
  const curEta = state.etaMap[curIdx];
  const minEl = document.getElementById('etaCurMins');
  const distEl = document.getElementById('etaCurDist');
  if (minEl && curEta) {
    minEl.textContent = state.lang === 'en' ? `${curEta.mins} min` : `${curEta.mins}分鐘`;
  }
  if (arrowEl) arrowEl.classList.toggle('hidden', isArrived);
  if (distEl) {
    const d = (state.gpsEnabled && state.gpsDistanceM != null && curEta?.source !== 'osrm')
      ? state.gpsDistanceM
      : (curEta ? curEta.distM : state.gpsDistanceM);
    distEl.textContent = formatDistanceLabel(d);
  }
  document.querySelectorAll('[data-eta-idx]').forEach(el => {
    const idx = Number(el.dataset.etaIdx);
    const info = state.etaMap[idx];
    if (info) el.textContent = String(info.mins);
  });
}

async function refreshRouteEtas(force = false) {
  if (!state.gpsEnabled || state.routeStage !== 'stops' || !state.tripStops.length) return;
  const curIdx = state.currentStopIdx;
  estimateFallbackEtas(curIdx);
  updateEtaDomInPlace();

  const now = Date.now();
  const hasLiveGps = state.gpsEnabled && Number.isFinite(state.gpsLat) && Number.isFinite(state.gpsLng);
  const fetchKey = `${state.selectedTrip?.routeId || ''}|${state.selectedTrip?.bound || ''}|${curIdx}|p${state.stopsPage}|${hasLiveGps ? 'gps' : 'sim'}`;

  if (!force && state.etaLastFetchKey === fetchKey) {
    const elapsed = now - state.etaLastFetchMs;
    const movedM = (hasLiveGps && Number.isFinite(state.etaLastLat) && Number.isFinite(state.etaLastLng))
      ? calcDistanceMeters(state.etaLastLat, state.etaLastLng, state.gpsLat, state.gpsLng)
      : 0;
    if (elapsed < 12000 && movedM < 80) return;
  }

  const coords = [];
  const stopIndices = [];
  let startIsCurStop = false;

  if (hasLiveGps) {
    coords.push(`${state.gpsLng.toFixed(6)},${state.gpsLat.toFixed(6)}`);
  } else if (curIdx > 0) {
    const pLat = getStopLat(state.tripStops[curIdx - 1]);
    const pLng = getStopLng(state.tripStops[curIdx - 1]);
    if (Number.isFinite(pLat) && Number.isFinite(pLng)) {
      coords.push(`${pLng.toFixed(6)},${pLat.toFixed(6)}`);
    } else {
      startIsCurStop = true;
    }
  } else {
    startIsCurStop = true;
  }

  const maxIdx = Math.min(state.tripStops.length - 1, curIdx + 6);
  for (let i = curIdx; i <= maxIdx; i++) {
    const lat = getStopLat(state.tripStops[i]);
    const lng = getStopLng(state.tripStops[i]);
    if (Number.isFinite(lat) && Number.isFinite(lng)) {
      coords.push(`${lng.toFixed(6)},${lat.toFixed(6)}`);
      stopIndices.push(i);
    }
  }

  if (coords.length < 2) return;

  state.etaLastFetchKey = fetchKey;
  state.etaLastFetchMs = now;
  if (hasLiveGps) {
    state.etaLastLat = state.gpsLat;
    state.etaLastLng = state.gpsLng;
  }

  try {
    const url = `https://router.project-osrm.org/route/v1/driving/${coords.join(';')}?overview=false&steps=false`;
    const res = await fetch(url);
    if (!res.ok) return;
    const data = await res.json();
    const legs = data?.routes?.[0]?.legs;
    if (!Array.isArray(legs) || legs.length === 0) return;

    // 確認回覆時仍停留在同一個班次與站位
    if (!state.gpsEnabled || state.routeStage !== 'stops' || state.currentStopIdx !== curIdx) return;

    let cumSec = 0;
    if (startIsCurStop) {
      // 起點本身就是目前站 (curIdx)
      state.etaMap[stopIndices[0]] = { mins: 1, distM: 0, source: 'osrm' };
      for (let li = 0; li < legs.length && (li + 1) < stopIndices.length; li++) {
        const leg = legs[li];
        cumSec += (leg.duration || 0) * 1.22 + 22;
        state.etaMap[stopIndices[li + 1]] = {
          mins: Math.max(1, Math.round(cumSec / 60)),
          distM: Math.round(leg.distance || 0),
          source: 'osrm'
        };
      }
    } else {
      for (let li = 0; li < legs.length && li < stopIndices.length; li++) {
        const leg = legs[li];
        cumSec += (leg.duration || 0) * 1.22 + (li > 0 ? 22 : 0);
        state.etaMap[stopIndices[li]] = {
          mins: Math.max(1, Math.round(cumSec / 60)),
          distM: Math.round(leg.distance || 0),
          source: 'osrm'
        };
      }
    }
    updateEtaDomInPlace();
  } catch (_) {
    // 離線或限流時維持本地推算 ETA
  }
}

// ============ 報站主畫面（還原實機排版：分段框、正常路線、綠進度條、時鐘＋巴士站距離、右側疊排 ETA 分鐘） ============
// === TRAINING MAP MODULE START ===
let _trainMap = null;
let _trainRouteLayer = null;
let _trainStopsLayer = null;
let _trainGpsMarker = null;

function destroyTrainingMap() {
  if (_trainMap) {
    try { _trainMap.remove(); } catch (_) {}
    _trainMap = null;
  }
  _trainRouteLayer = null;
  _trainStopsLayer = null;
  _trainGpsMarker = null;
}

function buildTrainingGpsArrowIcon(deg = 0) {
  const angle = Number.isFinite(Number(deg)) ? Number(deg) : 0;
  return L.divIcon({
    className: 'lecip-gps-arrow-wrap',
    iconSize: [30, 30],
    iconAnchor: [15, 15],
    html: `
      <div style="width:30px;height:30px;display:flex;align-items:center;justify-content:center;transform:rotate(${angle}deg);transition:transform 0.25s linear;">
        <svg width="28" height="28" viewBox="0 0 32 32" style="filter:drop-shadow(0 1px 3px rgba(0,0,0,0.65));">
          <circle cx="16" cy="16" r="13" fill="#0f2f24" stroke="#ffffff" stroke-width="2.2"/>
          <polygon points="16,5 23,23 16,19 9,23" fill="#22c55e" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
        </svg>
      </div>
    `
  });
}

function getTrainingRouteLatLngs() {
  const pts = [];
  const rawPath = state.selectedTrip?.routePath;
  if (Array.isArray(rawPath) && rawPath.length >= 2) {
    for (const p of rawPath) {
      const la = Array.isArray(p) ? Number(p[0]) : Number(p?.lat ?? p?.latitude);
      const ln = Array.isArray(p) ? Number(p[1]) : Number(p?.lng ?? p?.lon ?? p?.long ?? p?.longitude);
      if (Number.isFinite(la) && Number.isFinite(ln)) pts.push([la, ln]);
    }
  }
  if (pts.length >= 2) return pts;
  for (const st of (state.tripStops || [])) {
    const la = getStopLat(st);
    const ln = getStopLng(st);
    if (Number.isFinite(la) && Number.isFinite(ln)) pts.push([la, ln]);
  }
  return pts;
}

function zoomTrainingMap(delta) {
  if (!_trainMap) return;
  const curZ = _trainMap.getZoom();
  const nextZ = Math.max(11, Math.min(20, curZ + delta));
  state.trainingMapZoom = nextZ;
  _trainMap.setZoom(nextZ);
}

function recenterTrainingMap() {
  state.trainingMapFollow = true;
  if (!_trainMap) return;
  const hasGps = Number.isFinite(state.gpsLat) && Number.isFinite(state.gpsLng);
  if (hasGps) {
    _trainMap.setView([state.gpsLat, state.gpsLng], state.trainingMapZoom || 17, { animate: true });
    showToast('地圖已鎖定實時 GPS 位置');
  } else {
    const curSt = state.tripStops?.[state.currentStopIdx];
    const la = curSt ? getStopLat(curSt) : NaN;
    const ln = curSt ? getStopLng(curSt) : NaN;
    if (Number.isFinite(la) && Number.isFinite(ln)) {
      _trainMap.setView([la, ln], state.trainingMapZoom || 17, { animate: true });
    }
    showToast('等待 GPS 定位訊號中...');
  }
}

function updateTrainingMapGps(lat, lng, headingDeg = 0) {
  if (!state.trainingMode || !state.gpsEnabled || !_trainMap) return;
  if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;
  const pos = [lat, lng];
  if (!_trainGpsMarker) {
    _trainGpsMarker = L.marker(pos, { icon: buildTrainingGpsArrowIcon(headingDeg), zIndexOffset: 1000 }).addTo(_trainMap);
  } else {
    _trainGpsMarker.setLatLng(pos);
    _trainGpsMarker.setIcon(buildTrainingGpsArrowIcon(headingDeg));
  }
  const badge = document.getElementById('trainingMapGpsBadge');
  if (badge) badge.classList.add('hidden');
  if (state.trainingMapFollow) {
    _trainMap.panTo(pos, { animate: true, duration: 0.35 });
  }
}

function initOrUpdateTrainingMap() {
  const el = document.getElementById('trainingLeafletMap');
  if (!el) return;
  if (typeof L === 'undefined') {
    el.innerHTML = `<div class="w-full h-full flex items-center justify-center text-xs font-bold text-zinc-700 px-4 text-center">地圖元件載入中，請確認網路連線後重試</div>`;
    return;
  }

  destroyTrainingMap();

  const curSt = state.tripStops?.[state.currentStopIdx];
  const curLat = curSt ? getStopLat(curSt) : NaN;
  const curLng = curSt ? getStopLng(curSt) : NaN;
  const hasGps = Number.isFinite(state.gpsLat) && Number.isFinite(state.gpsLng);
  const routePts = getTrainingRouteLatLngs();

  let center = [22.3193, 114.1694];
  if (hasGps) center = [state.gpsLat, state.gpsLng];
  else if (Number.isFinite(curLat) && Number.isFinite(curLng)) center = [curLat, curLng];
  else if (routePts.length) center = routePts[0];

  const zoom = Math.max(11, Math.min(20, Number(state.trainingMapZoom) || 17));
  _trainMap = L.map(el, {
    center,
    zoom,
    zoomControl: false,
    attributionControl: false
  });

  const hkLabelLang = state.lang === 'en' ? 'en' : 'tc';
  L.tileLayer('https://mapapi.hkmapservice.gov.hk/gs/api/v1.0.0/xyz/basemap/WGS84/{z}/{x}/{y}.png', {
    minZoom: 10,
    maxZoom: 20
  }).addTo(_trainMap);
  L.tileLayer(`https://mapapi.hkmapservice.gov.hk/gs/api/v1.0.0/xyz/label/hk/${hkLabelLang}/WGS84/{z}/{x}/{y}.png`, {
    minZoom: 10,
    maxZoom: 20
  }).addTo(_trainMap);

  _trainMap.on('dragstart', () => { state.trainingMapFollow = false; });
  _trainMap.on('zoomend', () => {
    if (_trainMap) state.trainingMapZoom = _trainMap.getZoom();
  });

  // 繪製路線藍線（外白框＋內鮮藍）
  _trainRouteLayer = L.layerGroup().addTo(_trainMap);
  if (routePts.length >= 2) {
    L.polyline(routePts, { color: '#ffffff', weight: 8, opacity: 0.9, lineCap: 'round', lineJoin: 'round' }).addTo(_trainRouteLayer);
    L.polyline(routePts, { color: '#0068FF', weight: 5, opacity: 0.96, lineCap: 'round', lineJoin: 'round' }).addTo(_trainRouteLayer);
  }

  // 繪製沿途巴士站點（高亮即將到達嘅站）
  _trainStopsLayer = L.layerGroup().addTo(_trainMap);
  (state.tripStops || []).forEach((st, idx) => {
    const la = getStopLat(st);
    const ln = getStopLng(st);
    if (!Number.isFinite(la) || !Number.isFinite(ln)) return;
    const isCur = idx === state.currentStopIdx;
    const isPast = idx < state.currentStopIdx;
    const marker = L.circleMarker([la, ln], {
      radius: isCur ? 7 : 4.5,
      color: '#ffffff',
      weight: isCur ? 2.5 : 1.5,
      fillColor: isCur ? '#00a846' : (isPast ? '#94a3b8' : '#0068FF'),
      fillOpacity: 1
    }).addTo(_trainStopsLayer);
    marker.bindTooltip(`${idx + 1}. ${getLecipStopDisplayName(st)}`, { direction: 'top', offset: [0, -6] });
  });

  if (hasGps) {
    _trainGpsMarker = L.marker([state.gpsLat, state.gpsLng], {
      icon: buildTrainingGpsArrowIcon(state.gpsHeading || 0),
      zIndexOffset: 1000
    }).addTo(_trainMap);
  }

  requestAnimationFrame(() => {
    if (_trainMap) _trainMap.invalidateSize(false);
  });
}
// === TRAINING MAP MODULE END ===

// === STOP ARRIVAL SKIN START ===
function syncStopArrivalSkin() {
  const isArrived = Boolean(state.gpsEnabled && (state.gpsArrivedCur || state.stopProgressPct >= 100));
  const timeWrap = document.getElementById('etaCurTimeWrap');
  const distEl = document.getElementById('etaCurDist');
  const fill = document.getElementById('stopProgressFill');
  const lbl = document.getElementById('stopArrivedLabel');

  if (timeWrap) {
    timeWrap.classList.toggle('hidden', isArrived);
    timeWrap.classList.toggle('flex', !isArrived);
  }
  if (distEl) {
    distEl.classList.toggle('hidden', isArrived);
    if (!isArrived && state.gpsDistanceM != null) {
      distEl.textContent = formatDistanceLabel(state.gpsDistanceM);
    }
  }
  if (fill) {
    fill.style.width = `${isArrived ? 100 : Math.max(12, state.stopProgressPct)}%`;
    fill.classList.toggle('bg-[#00c824]', isArrived);
    fill.classList.toggle('bg-[#00a846]', !isArrived);
  }
  if (lbl) {
    lbl.textContent = state.lang === 'en' ? 'Arrived' : '已到達';
    lbl.classList.toggle('hidden', !isArrived);
    lbl.classList.toggle('flex', isArrived);
  }
}
// === STOP ARRIVAL SKIN END ===

function renderStopsView(vp, bar) {
  const th = themeClasses();
  vp.className = th.dark
    ? 'flex-1 flex flex-col overflow-hidden bg-[#3A3937] text-white'
    : 'flex-1 flex flex-col overflow-hidden bg-[#D8DAFF] text-zinc-900';

  const cur = state.tripStops[state.currentStopIdx];
  if (!cur) {
    destroyTrainingMap();
    vp.innerHTML = `<div class="flex-1 flex items-center justify-center ${th.muted} font-bold">無站點資料</div>`;
    return;
  }

  const showTrainingMap = Boolean(state.trainingMode && state.gpsEnabled);
  if (!showTrainingMap) destroyTrainingMap();

  const UPCOMING_PER_PAGE = 3; // 連同正在前往的車站，每頁同時最多顯示 4 個車站
  const remainingTotal = Math.max(0, state.tripStops.length - 1 - state.currentStopIdx);
  const totalStopPages = Math.max(1, Math.ceil(remainingTotal / UPCOMING_PER_PAGE));
  if (state.stopsPage >= totalStopPages) state.stopsPage = totalStopPages - 1;
  if (state.stopsPage < 0) state.stopsPage = 0;

  if (state.gpsEnabled) estimateFallbackEtas(state.currentStopIdx);
  const curEta = state.etaMap[state.currentStopIdx] || { mins: 1, distM: state.gpsDistanceM ?? 0 };
  const sections = computeTripSections(state.tripStops, state.selectedTrip);
  const curSec = sections[state.currentStopIdx] || { sectionNo: 1, activeFare: null, badgeFare: null };
  const trip = state.selectedTrip || {};
  const dest = state.lang === 'en' ? (getDestEn(trip) || getDestTc(trip)) : (getDestTc(trip) || getDestEn(trip));
  const studioTripLbl = (typeof getStudioTripLabel === 'function')
    ? getStudioTripLabel(trip, Math.max(0, (state.selectedTripSeq || 1) - 1))
    : '';
  const remark = studioTripLbl || getRealTripRemark(trip) || (state.lang === 'en' ? 'Normal Route' : '正常路線');

  const startOffset = state.stopsPage * UPCOMING_PER_PAGE;
  const upcoming = state.tripStops.slice(
    state.currentStopIdx + 1 + startOffset,
    state.currentStopIdx + 1 + startOffset + UPCOMING_PER_PAGE
  );
  const curName = getLecipStopDisplayName(cur);

  const headerBg = 'bg-[#D8DAFF] border-b border-[#989cc4] text-[#111827]';
  const secBoxCls = 'border-[#5a5e7a] bg-[#D8DAFF] text-[#111827]';
  const curPanelCls = th.dark ? 'bg-[#3A3937] border-b border-[#555350] text-white' : 'bg-white border-b border-zinc-400 text-[#111827]';

// ============ 特別廣播分頁（實機螢光綠 ▶ / 紅 ■ ＋ 內嵌 2×5 鍵盤 3 秒自動播） ============
function scheduleInlineAnnAutoPlay() {
  clearAnnAutoPlayTimers();
  const val = state.annInputCode;
  const badgeEl = document.getElementById('annCountdownText');
  if (!val) {
    if (badgeEl) badgeEl.textContent = '';
    return;
  }
  const numVal = String(Number(val));
  const item = state.announcements.find(a => String(a.code) === val || String(Number(a.code)) === numVal);
  if (!item) {
    if (badgeEl) badgeEl.textContent = `#${val} (無此編號)`;
    return;
  }
  let remain = 3;
  if (badgeEl) badgeEl.textContent = `#${item.code} (${remain}s 自動播)`;
  annCountdownInterval = setInterval(() => {
    remain--;
    const b = document.getElementById('annCountdownText');
    if (b && remain > 0) b.textContent = `#${item.code} (${remain}s 自動播)`;
  }, 1000);
  annAutoPlayTimer = setTimeout(() => {
    clearAnnAutoPlayTimers();
    state.annInputCode = '';
    state.annKbOpen = false;
    playSpecialAnnouncementByItem(item);
  }, 3000);
}

function renderAnnounceView(vp, bar) {
  const th = themeClasses();
  vp.className = th.dark ? 'flex-1 flex flex-col overflow-hidden bg-[#3e3d39] text-white' : 'flex-1 flex flex-col overflow-hidden bg-white text-black';

  const filtered = state.annInputCode
    ? state.announcements.filter(a => {
        const c = String(a.code ?? '');
        return c === state.annInputCode || c.startsWith(state.annInputCode) || String(Number(c)) === String(Number(state.annInputCode));
      })
    : state.announcements;

  const visibleRows = state.annKbOpen ? 3 : PAGE_SIZE;
  const totalPages = Math.max(1, Math.ceil(filtered.length / visibleRows));
  if (state.announcePage >= totalPages) state.announcePage = totalPages - 1;
  if (state.announcePage < 0) state.announcePage = 0;

  const slice = filtered.slice(state.announcePage * visibleRows, (state.announcePage + 1) * visibleRows);
  const rowBg = th.dark ? 'bg-[#3b3a36] text-white border-[#52504a]' : 'bg-white text-zinc-900 border-zinc-400';

  vp.innerHTML = `
    <!-- 淺紫藍「播放特別訊息」實機標題列 -->
    <div class="px-3 py-2 bg-[#d4dcff] text-black border-b border-zinc-500 flex items-center justify-between gap-2 shrink-0">
      <span class="font-black text-[15px]">${state.lang === 'en' ? 'Special Announcements' : '播放特別訊息'}</span>
      <div class="flex items-center gap-1.5">
        <span id="annCountdownText" class="text-xs font-black text-[#0057d8]">${state.annInputCode ? '#' + esc(state.annInputCode) : ''}</span>
        ${state.annInputCode ? `<button id="btnAnnClearCode" class="px-2 py-0.5 rounded bg-[#0074f0] text-white text-[11px] font-black">⌫</button>` : `<span class="text-xs font-bold text-zinc-600">${state.announcePage + 1} / ${totalPages}</span>`}
      </div>
    </div>

    <!-- 特別訊息列表（無鍵盤 5 行／展開鍵盤 3 行） -->
    <div class="flex-1 flex flex-col overflow-hidden">
      ${slice.length === 0 ? `
        <div class="flex-1 flex flex-col items-center justify-center ${th.muted} text-sm font-bold gap-2">
          <div>找不到編號「${esc(state.annInputCode)}」的特別訊息</div>
          <button id="btnAnnResetEmpty" class="px-3 py-1.5 rounded-lg bg-[#0074f0] text-white text-xs font-black">清除編號</button>
        </div>
      ` : slice.map(item => {
        const code = String(item.code ?? '');
        const title = state.lang === 'en' ? (item.titleEn || item.titleTc) : (item.titleTc || item.titleEn);
        const isPlaying = state.playingAnnCode === code;
        return `
          <div class="flex-1 flex items-stretch border-b ${rowBg}">
            <div class="flex-1 px-4 flex items-center gap-3 min-w-0">
              <span class="text-xl font-black shrink-0 w-9">${esc(code)}.</span>
              <span class="text-lg font-extrabold truncate">${esc(title)}</span>
            </div>
            <button data-acode="${esc(code)}" class="play-ann-btn w-[72px] shrink-0 flex items-center justify-center ${isPlaying ? 'bg-[#e51c23]' : 'bg-[#00e600]'} active:brightness-90">
              ${isPlaying
                ? '<span class="w-7 h-7 rounded-[3px] bg-black block"></span>'
                : '<svg class="w-8 h-8 text-black" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>'
              }
            </button>
          </div>
        `;
      }).join('')}
      ${slice.length > 0 && slice.length < visibleRows ? Array(visibleRows - slice.length).fill(`<div class="flex-1 border-b ${rowBg}"></div>`).join('') : ''}
    </div>

    <!-- 實機內嵌 2×5 藍色鍵盤 -->
    ${state.annKbOpen ? renderLecipInlineKeypadHtml(null) : ''}
  `;

  const canPrev = state.announcePage > 0;
  const canNext = state.announcePage < totalPages - 1;
  bar.className = 'grid grid-cols-5 gap-1 p-1 bg-black border-t border-zinc-800 shrink-0';
  bar.innerHTML = `
    <button id="botPrev" class="col-span-2 h-11 rounded-lg ${canPrev ? 'bg-[#0074f0] text-white' : 'bg-[#2b2a27] text-white/80'} font-black text-2xl flex items-center justify-center active:brightness-90">↑</button>
    <button id="botNext" class="col-span-2 h-11 rounded-lg ${canNext ? 'bg-[#0074f0] text-white' : 'bg-[#2b2a27] text-white/80'} font-black text-2xl flex items-center justify-center active:brightness-90">↓</button>
    <button id="botAnnKeypad" title="開啟／關閉數字鍵盤" class="col-span-1 h-11 rounded-lg ${state.annKbOpen ? 'bg-white text-[#0074f0]' : 'bg-[#0074f0] text-white'} flex items-center justify-center active:brightness-90">
      <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="6.5"/>
        <line x1="16" y1="16" x2="21" y2="21"/>
      </svg>
    </button>
  `;

  vp.querySelectorAll('.play-ann-btn').forEach(btn => {
    btn.onclick = () => {
      clearAnnAutoPlayTimers();
      const code = btn.dataset.acode;
      if (state.playingAnnCode === code) {
        stopAllAudio();
        renderMain();
        showToast('已中止播放特別訊息');
        return;
      }
      const item = state.announcements.find(a => String(a.code) === code);
      if (item) {
        state.annInputCode = '';
        playSpecialAnnouncementByItem(item);
      }
    };
  });

  const clrBtn = document.getElementById('btnAnnClearCode');
  if (clrBtn) clrBtn.onclick = () => {
    clearAnnAutoPlayTimers();
    state.annInputCode = state.annInputCode.slice(0, -1);
    state.announcePage = 0;
    renderMain();
    scheduleInlineAnnAutoPlay();
  };
  const rstBtn = document.getElementById('btnAnnResetEmpty');
  if (rstBtn) rstBtn.onclick = () => {
    clearAnnAutoPlayTimers();
    state.annInputCode = '';
    state.announcePage = 0;
    renderMain();
  };

  if (state.annKbOpen) {
    bindLecipInlineKeypad(
      vp,
      digit => {
        if (state.annInputCode.length < 3) {
          state.annInputCode += digit;
          state.announcePage = 0;
          renderMain();
          scheduleInlineAnnAutoPlay();
        }
      },
      null
    );
  }

  document.getElementById('botPrev').onclick = () => { if (canPrev) { state.announcePage--; renderMain(); } };
  document.getElementById('botNext').onclick = () => { if (canNext) { state.announcePage++; renderMain(); } };
  document.getElementById('botAnnKeypad').onclick = () => {
    clearAnnAutoPlayTimers();
    state.annKbOpen = !state.annKbOpen;
    if (!state.annKbOpen) state.annInputCode = '';
    state.announcePage = 0;
    renderMain();
  };
}

// ============ 訊息收件匣（停車 ≥3s 安全鎖＋聲音訊息綠色播放掣＋行車自動彈回） ============
function playVoiceMessage(m) {
  if (!m) return;
  m.unread = false;
  renderTopStatus();
  if (state.currentTab === 'message') renderMain();
  showToast(`播放聲音訊息：${m.title}`);
  playAnnouncementSegments([
    { files: m.voiceFile ? [m.voiceFile] : [], tc: m.body, en: '', sc: '' }
  ]);
}

  `;
  bar.innerHTML = `
    <button id="botReadAll" class="col-span-2 h-11 rounded-lg bg-emerald-600 text-white font-black text-sm">全部標為已讀</button>
    <button id="botBackRoute" class="col-span-2 h-11 rounded-lg bg-[#0068FF] text-white font-black text-sm">返回路線</button>
  `;

  vp.querySelectorAll('.voice-play-btn').forEach(btn => {
    btn.onclick = e => {
      e.stopPropagation();
      const m = state.messages.find(x => x.id === Number(btn.dataset.vplay));
      if (m) playVoiceMessage(m);
    };
  });
  vp.querySelectorAll('.msg-row').forEach(el => {
    el.onclick = () => {
      const m = state.messages.find(x => x.id === Number(el.dataset.mid));
      if (m) m.unread = false;
      renderAll();
    };
  });
  document.getElementById('botReadAll').onclick = () => {
    state.messages.forEach(m => { m.unread = false; });
    renderAll();
  };
  document.getElementById('botBackRoute').onclick = () => { state.currentTab = 'route'; renderAll(); };
}

// ============ 三段式紅頂「事故」功能（停車 ≥3s 安全鎖 -> 完成過客／繼續行程 -> 完成處理） ============
function getIncidentBroadcastSegment(type) {
  const t = String(type || '');
  if (t.includes('故障')) {
    return {
      files: [],
      tc: '各位乘客請注意，因機件故障，本班車暫時未能繼續行駛，請遵從車長指示，不便之處，敬請見諒。',
      en: 'Attention passengers, due to a mechanical fault, this bus is unable to continue its journey. Please follow the bus captain instructions. We apologize for the inconvenience.',
      sc: '各位乘客请注意，因机件故障，本班车暂时未能继续行驶，请遵从车长指示。'
    };
  }
  if (t.includes('交通意外')) {
    return {
      files: [],
      tc: '各位乘客請注意，因發生交通意外，本班車暫時停止行駛，請保持鎮定並遵從車長指示，不便之處，敬請見諒。',
      en: 'Attention passengers, due to a traffic accident, this bus service is temporarily suspended. Please remain calm and follow the bus captain instructions.',
      sc: '各位乘客请注意，因发生交通意外，本班车暂时停止行驶，请保持镇定并遵从车长指示。'
    };
  }
  if (t.includes('乘客')) {
    return {
      files: [],
      tc: '各位乘客請注意，因車上發生乘客事件，本班車暫時停駛處理，請保持鎮定並遵從車長指示，不便之處，敬請見諒。',
      en: 'Attention passengers, due to a passenger incident on board, this bus is temporarily stopped. Please remain calm and follow the bus captain instructions.',
      sc: '各位乘客请注意，因车上发生乘客事件，本班车暂时停驶处理，请保持镇定并遵从车长指示。'
    };
  }
  return {
    files: [],
    tc: '各位乘客請注意，因發生突發事故，本班車暫時停止行駛，請遵從車長指示，不便之處，敬請見諒。',
    en: 'Attention passengers, due to an unexpected incident, this bus service is temporarily suspended. Please follow the bus captain instructions.',
    sc: '各位乘客请注意，因发生突发事故，本班车暂时停止行驶，请遵从车长指示。'
  };
}

function renderIncidentView(vp, bar) {
  const th = themeClasses();
  const inc = state.incidentState;
  const blackBarCls = 'grid grid-cols-4 gap-1.5 p-1.5 bg-black border-t border-black shrink-0';
  const pageBg = th.dark
    ? 'flex-1 flex flex-col overflow-hidden bg-[#1b2029] text-white'
    : 'flex-1 flex flex-col overflow-hidden bg-[#e5e7eb] text-[#111827]';
  const panelBg = th.dark
    ? 'bg-[#141923] border-zinc-700 text-zinc-100'
    : 'bg-white border-zinc-300 text-[#111827]';

  // 步驟 2：事故進行中（顯示所選事故類別、5 項車長處理指引、完成過客 / 繼續行程）
  if (inc.stage === 'active') {
    vp.className = pageBg;
    vp.innerHTML = `
      <div class="px-3.5 py-2.5 bg-[#dc2626] text-white flex items-center justify-between gap-2 shrink-0 shadow-sm">
        <span class="text-base font-black tracking-wide truncate">${esc(inc.type)}</span>
        <span class="font-mono text-xs font-bold opacity-90 shrink-0">${esc(inc.startTime)}</span>
      </div>

      <div class="flex-1 overflow-y-auto no-scrollbar px-3.5 py-3 flex flex-col justify-between gap-3">
        <div class="p-3.5 rounded-xl border ${panelBg} space-y-2 shadow-sm">
          <div class="text-sm font-black">車長依照下列步驟處理：</div>
          <ol class="text-[13px] font-bold leading-snug space-y-1.5 list-decimal pl-5">
            <li>安全情況下停車</li>
            <li>了解車上乘客狀況（有否受傷、受傷情況）</li>
            <li>致電控制中心（新巴：<span class="font-mono font-black text-[#0074f0]">21362323</span>／城一：<span class="font-mono font-black text-[#0074f0]">21362422</span>／城二：<span class="font-mono font-black text-[#0074f0]">21362432</span>）</li>
            <li>報上員工編號、車號、路線、方向、事故位置、事故項目、乘客狀況及數量、車輛損毀情況</li>
            <li>依照控制中心發出的指示處理</li>
          </ol>
        </div>

        <div class="space-y-2 shrink-0">
          <div class="grid grid-cols-2 gap-2.5">
            <button id="btnIncTransfer" class="h-14 rounded-xl bg-[#0074f0] active:brightness-90 text-white font-black text-lg shadow">
              完成過客
            </button>
            <button id="btnIncResume" class="h-14 rounded-xl bg-[#16a34a] active:brightness-90 text-white font-black text-lg shadow">
              繼續行程
            </button>
          </div>
          <div class="text-[11px] font-bold ${th.muted} text-center">如遇任何緊急情況，應先行報警並安頓乘客</div>
        </div>
      </div>
    `;
    bar.className = blackBarCls;
    bar.innerHTML = `
      <button id="botIncReplay" class="col-span-4 h-11 rounded-lg bg-[#b91c1c] active:brightness-90 text-white font-black text-sm">重播事故車廂廣播</button>
    `;
    document.getElementById('btnIncTransfer').onclick = () => {
      state.incidentState.stage = 'transferred';
      renderAll();
      showToast('已完成過客，電子牌已轉為「暫停載客」');
    };
    document.getElementById('btnIncResume').onclick = () => {
      state.incidentState = { stage: 'idle', type: '', startTime: '' };
      state.currentTab = 'route';
      renderAll();
      showToast('已結束事故模式，返回正常報站程序');
    };
    document.getElementById('botIncReplay').onclick = () => {
      playAnnouncementSegments([getIncidentBroadcastSegment(inc.type)]);
    };
    return;
  }

  // 步驟 3：已完成過客 → 等候處理（督察/工程人員到場、控制中心電話、離開現場按「完成處理」）
  if (inc.stage === 'transferred') {
    vp.className = pageBg;
    vp.innerHTML = `
      <div class="px-3.5 py-2.5 bg-[#dc2626] text-white flex items-center justify-between gap-2 shrink-0 shadow-sm">
        <span class="text-base font-black tracking-wide">等候處理</span>
        <span class="font-mono text-xs font-bold opacity-90 shrink-0">${esc(inc.type)}</span>
      </div>

      <div class="flex-1 overflow-y-auto no-scrollbar px-4 py-4 flex flex-col justify-between gap-4">
        <div class="p-4 rounded-xl border ${panelBg} space-y-3.5 shadow-sm">
          <div class="text-sm font-black leading-relaxed">
            請耐心等待督察／工程人員到場處理，如有需要，可致電控制中心尋求進一步協助
          </div>
          <div class="p-3 rounded-lg ${th.dark ? 'bg-[#1f2937] text-zinc-100' : 'bg-zinc-100 text-zinc-900'} space-y-1.5 text-sm font-black font-mono">
            <div class="flex items-center justify-between"><span>新巴：</span><span class="text-[#0074f0]">21362323</span></div>
            <div class="flex items-center justify-between"><span>城一：</span><span class="text-[#0074f0]">21362422</span></div>
            <div class="flex items-center justify-between"><span>城二：</span><span class="text-[#0074f0]">21362432</span></div>
          </div>
          <div class="text-[11px] font-bold ${th.muted} leading-relaxed">
            電子路線牌已轉為「暫停載客」。巴士離開現場時請按下「完成處理」，車程將中途中止並自動記錄於電子站長紙。
          </div>
        </div>

        <button id="btnIncFinish" class="h-14 rounded-xl bg-[#0074f0] active:brightness-90 text-white font-black text-xl shadow-lg shrink-0">
          完成處理
        </button>
      </div>
    `;
    bar.className = blackBarCls;
    bar.innerHTML = `
      <button id="botIncBackStep2" class="h-11 rounded-lg bg-[#0074f0] active:brightness-90 text-white font-black text-3xl flex items-center justify-center">‹</button>
      <button id="botIncReplay" class="col-span-3 h-11 rounded-lg bg-[#b91c1c] active:brightness-90 text-white font-black text-sm">重播事故車廂廣播</button>
    `;
    document.getElementById('btnIncFinish').onclick = () => {
      state.incidents.unshift({
        type: inc.type,
        time: inc.startTime,
        endTime: new Date().toTimeString().slice(0, 8),
        route: state.selectedRouteNo || '未入線'
      });
      state.incidentState = { stage: 'idle', type: '', startTime: '' };
      stopAllAudio();
      stopGpsTracking();
      state.etaMap = {};
      state.routeStage = 'route';
      state.currentTab = 'route';
      renderAll();
      showToast('車程已中途中止，並自動記錄於電子站長紙');
    };
    document.getElementById('botIncBackStep2').onclick = () => {
      state.incidentState.stage = 'active';
      renderAll();
    };
    document.getElementById('botIncReplay').onclick = () => {
      playAnnouncementSegments([getIncidentBroadcastSegment(inc.type)]);
    };
    return;
  }

  // 步驟 1 前置安全鎖：必須於安全位置停車達 3 秒或以上
  if (!state.isStopped3s) {
    vp.className = th.vp;
    vp.innerHTML = `
      <div class="px-3 py-2.5 ${th.subBar} font-black text-sm text-center shrink-0">選擇事故項目</div>
      <div class="flex-1 flex flex-col items-center justify-center p-6 text-center space-y-3">
        <div class="w-14 h-14 rounded-full bg-red-600/20 text-red-500 flex items-center justify-center text-3xl font-black">!</div>
        <div class="text-base font-black">行車期間停用「事故」功能</div>
        <div class="text-xs font-bold ${th.muted} leading-relaxed">
          為保障駕駛安全，此功能只能在巴士停下達 3 秒或以上時才能使用。<br/>
          （電腦測試可點右上角 [123] 切換回停車狀態）
        </div>
      </div>
    `;
    bar.className = blackBarCls;
    bar.innerHTML = `
      <button id="botBackRoute" class="h-11 rounded-lg bg-[#0074f0] active:brightness-90 text-white font-black text-3xl flex items-center justify-center">‹</button>
    `;
    document.getElementById('botBackRoute').onclick = () => { state.currentTab = 'route'; renderAll(); };
    return;
  }

  // 步驟 1：選擇事故項目（實機 4 項：1.巴士故障 / 2.發生交通意外 / 3.乘客事件 / 4.其他事故）
  const incidentItems = [
    { no: '1', label: '巴士故障' },
    { no: '2', label: '發生交通意外' },
    { no: '3', label: '乘客事件' },
    { no: '4', label: '其他事故' }
  ];
  vp.className = th.vp;
  vp.innerHTML = `
    <div class="px-3.5 py-2.5 ${th.subBar} font-black text-base text-center shrink-0">選擇事故項目</div>
    <div class="divide-y ${th.divider} shrink-0">
      ${incidentItems.map(it => `
        <button data-itype="${esc(it.label)}" class="inc-btn w-full px-4 py-4 flex items-center justify-between ${th.row} text-left">
          <span class="text-xl font-black">${it.no}. ${esc(it.label)}</span>
          <span class="${th.muted} text-2xl font-bold">›</span>
        </button>
      `).join('')}
    </div>
    ${state.incidents.length > 0 ? `
      <div class="px-3.5 py-1.5 ${th.subBar} text-xs font-black flex items-center justify-between shrink-0 mt-auto">
        <span>電子站長紙事故記錄 (${state.incidents.length})</span>
        <button id="btnClearIncInline" class="text-[11px] font-bold text-red-500 active:opacity-70">清除</button>
      </div>
      <div class="max-h-24 overflow-y-auto no-scrollbar divide-y ${th.divider} px-3.5 shrink-0">
        ${state.incidents.map(rec => `
          <div class="py-1.5 flex items-center justify-between text-xs">
            <span class="font-black text-red-500 truncate pr-2">${esc(rec.route)} · ${esc(rec.type)}</span>
            <span class="font-mono ${th.muted} shrink-0">${esc(rec.time)}-${esc(rec.endTime || '')}</span>
          </div>
        `).join('')}
      </div>
    ` : `<div class="flex-1 flex items-end justify-center pb-3 px-4 text-[11px] font-bold ${th.muted} text-center">如遇任何緊急情況，應先行報警及安頓乘客，才使用報站器之「事故」功能</div>`}
  `;
  bar.className = blackBarCls;
  bar.innerHTML = `
    <button id="botBackRoute" class="h-11 rounded-lg bg-[#0074f0] active:brightness-90 text-white font-black text-3xl flex items-center justify-center">‹</button>
  `;

  vp.querySelectorAll('.inc-btn').forEach(btn => {
    btn.onclick = () => {
      const t = new Date().toTimeString().slice(0, 8);
      const chosenType = btn.dataset.itype;
      state.incidentState = { stage: 'active', type: chosenType, startTime: t };
      state.etaMap = {};
      stopAllAudio();
      playAlertBeep(true);
      renderAll();
      playAnnouncementSegments([getIncidentBroadcastSegment(chosenType)]);
    };
  });
  const btnClr = document.getElementById('btnClearIncInline');
  if (btnClr) btnClr.onclick = () => { state.incidents = []; renderAll(); };
  document.getElementById('botBackRoute').onclick = () => { state.currentTab = 'route'; renderAll(); };
}

// ============ 系統設定分頁（實機「選項」六宮格＋「車長喜好設定」含日夜模式、DCP 聲音測試） ============
function renderSettingsView(vp, bar) {
  const th = themeClasses();
  const gridVpCls = th.dark
    ? 'flex-1 flex flex-col overflow-hidden bg-[#3b3a36] text-white'
    : 'flex-1 flex flex-col overflow-hidden bg-[#cfcfcf] text-black';
  const blackBarCls = 'grid grid-cols-4 gap-1.5 p-1.5 bg-black border-t border-black shrink-0';

  // === TRAINING MODE SUBPAGES START ===
  // 子頁 T1：訓練模式輸入密碼（9999，還原實機 V1.2 步驟 3）
  if (state.settingsPage === 'train_auth') {
    vp.className = gridVpCls;
    const isEn = state.lang === 'en';
    const curVal = String(state.trainPwdInput || '');
    const dots = '•'.repeat(curVal.length);
    const errMsg = state.trainPwdErr || '';

    vp.innerHTML = `
      <div class="pt-3 pb-1 text-center text-[19px] font-black tracking-wide shrink-0">${isEn ? 'Training Mode' : '訓練模式'}</div>
      <div class="px-4 pb-2 text-center text-sm font-black ${th.dark ? 'text-zinc-200' : 'text-zinc-800'} shrink-0">${isEn ? 'Enter Password' : '輸入密碼'}</div>

      <div class="px-3.5 pb-2 flex items-center gap-2 shrink-0">
        <div id="trainPwdDisplay" class="flex-1 h-12 rounded-xl border-2 ${errMsg ? 'border-red-500' : (th.dark ? 'border-zinc-500' : 'border-zinc-400')} ${th.dark ? 'bg-zinc-900 text-white' : 'bg-[#f8f7ec] text-black'} flex items-center justify-center text-3xl font-black tracking-[0.45em] pl-3 shadow-inner">
          ${dots || '<span class="text-sm font-bold tracking-normal opacity-40">----</span>'}
        </div>
        <button id="btnTrainPwdDel" title="刪除" class="w-16 h-12 rounded-xl bg-[#0074f0] active:brightness-90 text-white flex items-center justify-center shadow shrink-0">
          <svg class="w-7 h-7" viewBox="0 0 28 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H10l-7-8 7-8z"/>
            <line x1="14" y1="9" x2="20" y2="15"/>
            <line x1="20" y1="9" x2="14" y2="15"/>
          </svg>
        </button>
      </div>

      <div id="trainPwdHint" class="px-4 pb-2 min-h-[20px] text-center text-xs font-black ${errMsg ? 'text-red-500' : (th.dark ? 'text-zinc-300' : 'text-zinc-700')} shrink-0">
        ${esc(errMsg || (isEn ? 'Please enter 4-digit password (9999)' : '請輸入 4 位數密碼（9999）'))}
      </div>

      <div class="flex-1 px-3.5 pb-3 grid grid-cols-3 gap-2">
        ${['1','2','3','4','5','6','7','8','9'].map(d => `
          <button data-tpwd="${d}" class="train-pwd-key rounded-xl ${th.dark ? 'bg-[#1d2430] text-white border border-zinc-600' : 'bg-white text-black border border-zinc-400'} active:bg-[#0074f0] active:text-white font-black text-2xl shadow-sm flex items-center justify-center">${d}</button>
        `).join('')}
        <button id="btnTrainPwdClear" class="rounded-xl bg-[#6b7280] active:brightness-90 text-white font-black text-base shadow-sm flex items-center justify-center">${isEn ? 'Clear' : '清除'}</button>
        <button data-tpwd="0" class="train-pwd-key rounded-xl ${th.dark ? 'bg-[#1d2430] text-white border border-zinc-600' : 'bg-white text-black border border-zinc-400'} active:bg-[#0074f0] active:text-white font-black text-2xl shadow-sm flex items-center justify-center">0</button>
        <button id="btnTrainPwdOk" class="rounded-xl bg-[#16a34a] active:brightness-90 text-white font-black text-xl shadow-sm flex items-center justify-center">✓</button>
      </div>
    `;
    bar.className = blackBarCls;
    bar.innerHTML = `
      <button id="botTrainAuthBack" class="h-11 rounded-lg bg-[#0074f0] text-white font-black text-3xl flex items-center justify-center active:brightness-90">‹</button>
    `;

    const submitPwd = () => {
      const code = String(state.trainPwdInput || '');
      if (code === '9999') {
        state.trainingMode = true;
        state.trainingMapFollow = true;
        state.trainPwdInput = '';
        state.trainPwdErr = '';
        if (state.gpsEnabled && state.routeStage === 'stops' && state.gpsWatchId == null) {
          startGpsTracking();
        }
        state.settingsPage = 'menu';
        state.currentTab = 'route';
        renderAll();
        showToast('已啟動訓練模式，電子牌已轉為「暫停載客」');
      } else {
        state.trainPwdInput = '';
        state.trainPwdErr = isEn ? 'Incorrect password (9999)' : '密碼錯誤，請輸入 9999';
        playAlertBeep(true);
        renderMain();
      }
    };

    vp.querySelectorAll('.train-pwd-key').forEach(btn => {
      btn.onclick = () => {
        if ((state.trainPwdInput || '').length >= 4) return;
        state.trainPwdErr = '';
        state.trainPwdInput = (state.trainPwdInput || '') + btn.dataset.tpwd;
        renderMain();
        if (state.trainPwdInput.length === 4) {
          setTimeout(submitPwd, 120);
        }
      };
    });
    document.getElementById('btnTrainPwdDel').onclick = () => {
      state.trainPwdInput = String(state.trainPwdInput || '').slice(0, -1);
      state.trainPwdErr = '';
      renderMain();
    };
    document.getElementById('btnTrainPwdClear').onclick = () => {
      state.trainPwdInput = '';
      state.trainPwdErr = '';
      renderMain();
    };
    document.getElementById('btnTrainPwdOk').onclick = submitPwd;
    document.getElementById('botTrainAuthBack').onclick = () => {
      state.trainPwdInput = '';
      state.trainPwdErr = '';
      state.settingsPage = 'prefs';
      renderAll();
    };
    return;
  }

  // 子頁 T2：確定離開訓練模式（還原實機 V1.2 步驟 5）
  if (state.settingsPage === 'train_exit') {
    vp.className = gridVpCls;
    const isEn = state.lang === 'en';
    vp.innerHTML = `
      <div class="pt-5 pb-2 text-center text-[20px] font-black tracking-wide shrink-0">${isEn ? 'Training Mode' : '訓練模式'}</div>
      <div class="flex-1 flex flex-col items-center justify-center px-5 pb-6 space-y-6">
        <div class="text-center space-y-2">
          <div class="text-xl font-black">${isEn ? 'Exit Training Mode?' : '確定離開訓練模式?'}</div>
          <div class="text-xs font-bold ${th.dark ? 'text-zinc-300' : 'text-zinc-700'}">
            ${isEn ? 'Turning off the engine also exits Training Mode.' : '（離開後將恢復正常營運；關閉引擎亦會自動退出訓練模式）'}
          </div>
        </div>
        <div class="w-full grid grid-cols-2 gap-3.5 max-w-[300px]">
          <button id="btnTrainExitNo" class="h-16 rounded-[14px] bg-[#dc2626] active:brightness-90 text-white font-black text-2xl shadow">
            ${isEn ? 'No' : '否'}
          </button>
          <button id="btnTrainExitYes" class="h-16 rounded-[14px] bg-[#0074f0] active:brightness-90 text-white font-black text-2xl shadow">
            ${isEn ? 'Yes' : '是'}
          </button>
        </div>
      </div>
    `;
    bar.className = blackBarCls;
    bar.innerHTML = `

// ============ 機身內嵌開機序列 + 輕量路線名載入 ============
async function fetchInitialLightData() {
  const [rRes, aRes] = await Promise.all([
    fetch('./data/routes.json'),
    fetch('./data/announcements.json')
  ]);
  const routes = await rRes.json();
  const anns = await aRes.json();
  state.baseRoutes = Array.isArray(routes) ? routes : [];
  state.routes = state.baseRoutes.slice();
  state.announcements = Array.isArray(anns) ? anns : [];
  const set = new Set(state.routes.map(getRouteNo).filter(Boolean));
  state.uniqueRouteNos = Array.from(set).sort(compareRouteNo);

  function applyStudioTripsToWebRoutes() {
    const map = state.studioTripNames;
    if (!map || typeof map !== 'object') return;
    const base = Array.isArray(state.baseRoutes) ? state.baseRoutes : [];
    const nextRoutes = [];
    const matchedKeys = new Set();

    for (const orig of base) {
      const rno = getRouteNo(orig);
      const bnd = getBound(orig);
      const patId = String(orig?.patternId ?? '').trim();
      const svc = String(orig?.serviceType || orig?.service_type || '1').trim();
      const k = patId ? `${rno}|${bnd}|${patId}` : `${rno}|${bnd}|${svc}`;
      const rec = map[k] || (!patId ? map[`${rno}|${bnd}|1`] : null);
      if (rec && rec.deleted) {
        matchedKeys.add(k);
        continue;
      }
      if (rec && !rec.isManual) {
        matchedKeys.add(k);
        const cloned = { ...orig, _studioTripRec: rec };
        if (rec.fullFare != null && Number.isFinite(Number(rec.fullFare))) cloned.fullFare = Number(rec.fullFare);
        if (rec.destTc && Array.isArray(rec.customStops) && rec.customStops.length) {
          cloned.destTc = rec.destTc;
          cloned.endStopNameTc = rec.destTc;
        }
        nextRoutes.push(cloned);
      } else {
        nextRoutes.push(orig);
      }
    }

    for (const [k, rec] of Object.entries(map)) {
      if (!rec || rec.deleted || matchedKeys.has(k)) continue;
      if (!rec.isManual) continue;
      const rno = String(rec.routeId || '').trim().toUpperCase();
      if (!rno) continue;
      const bnd = String(rec.bound || 'O').trim().toUpperCase();
      nextRoutes.push({
        routeId: `CTB-${rno}`,
        bound: bnd,
        companyCode: 'CTB',
        externalRouteNo: rno,
        displayTc: rno,
        displayEn: rno,
        patternId: rec.tripKey || k,
        patternNameTc: rec.tripLabel || rec.name || '自訂班次',
        destTc: rec.destTc || (bnd === 'I' ? '回程' : '去程'),
        startStopNameTc: rec.origTc || '',
        endStopNameTc: rec.destTc || '',
        fullFare: (rec.fullFare != null && Number.isFinite(Number(rec.fullFare))) ? Number(rec.fullFare) : null,
        tripKey: rec.tripKey || k,
        _studioManual: true,
        _studioTripRec: rec
      });
    }

    state.routes = nextRoutes;
    state.uniqueRouteNos = Array.from(new Set(state.routes.map(getRouteNo).filter(Boolean))).sort(compareRouteNo);
    if (state.currentTab === 'route' && ['route', 'bound', 'trip'].includes(state.routeStage)) {
      renderMain();
    }
  }

  // 載入已確認的站號音檔對照表（雲端 data/audio_mapping.json + 本機 admin.html 即時確認快取）
  fetch(`./data/audio_mapping.json?v=${Date.now()}`)
    .then(r => (r.ok ? r.json() : {}))
    .then(obj => {
      state.studioRules = Array.isArray(obj?.rules) ? obj.rules : [];
      state.studioWelcomeRules = Array.isArray(obj?.welcomeRules) ? obj.welcomeRules : [];
      state.studioDefaultWelcome = typeof obj?.defaultWelcome === 'string' ? obj.defaultWelcome : '';
      state.studioTripNames = (obj?.tripNames && typeof obj.tripNames === 'object') ? obj.tripNames : {};
      state.studioSpecialBroadcasts = Array.isArray(obj?.specialBroadcasts) ? obj.specialBroadcasts : [];
      startRandomBroadcastTicker();
      if (typeof applyStudioTripsToWebRoutes === 'function') applyStudioTripsToWebRoutes();
      let merged = {};
      if (Array.isArray(obj?.rules)) {
        const sortedRules = [...obj.rules].sort((a, b) => (Date.parse(b?.updatedAt || '') || 0) - (Date.parse(a?.updatedAt || '') || 0));
        for (const r of sortedRules) {
          if (!r?.audioPath || !Array.isArray(r.stopIds)) continue;
          if (r.routeMode === 'specific' || r.tripMode === 'specific') continue;
          for (const rawId of r.stopIds) {
            const sid = String(rawId || '').trim();
            const nid = sid.replace(/^0+/, '');
            if (sid && !merged[sid]) merged[sid] = r.audioPath;
            if (nid && !merged[nid]) merged[nid] = r.audioPath;
          }
        }
      } else {
        merged = Object.assign({}, obj?.confirmed || obj || {});
      }
      try {
        const localRaw = localStorage.getItem('ctb_lecip_gemini_audio_db_v1');
        if (localRaw) {
          const db = JSON.parse(localRaw);
          for (const [path, rec] of Object.entries(db || {})) {
            if (rec?.status === 'confirmed' && rec?.matchedStopId) {
              const nid = String(rec.matchedStopId).replace(/^0+/, '');
              if (nid) merged[nid] = path;
              merged[String(rec.matchedStopId)] = path;
            }
          }
        }
      } catch (_) {}
      state.confirmedAudioMap = merged;
      // 同步建立「同站名共用」索引：來回不同 stopId 只要中文站名相同即共用同一把聲
      const byName = {};
      const addNameAlias = (tcName, audioPath) => {
        if (!tcName || !audioPath) return;
        const n1 = normStopName(tcName);
        const n2 = normBaseName(tcName);
        if (n1 && !byName[n1]) byName[n1] = audioPath;
        if (n2 && n2.length >= 2 && !byName[n2]) byName[n2] = audioPath;
      };
      const details = obj?.details || {};
      for (const [path, info] of Object.entries(details)) {
        if (info?.scope === 'bidirectional' && (info?.stopId || info?.heardTc)) {
          addNameAlias(info.heardTc || '', path);
        }
      }
      try {
        const localRaw = localStorage.getItem('ctb_lecip_gemini_audio_db_v1');
        if (localRaw) {
          const db = JSON.parse(localRaw);
          for (const [path, rec] of Object.entries(db || {})) {
            if (rec?.status === 'confirmed' && rec?.scope === 'bidirectional' && rec?.heardTc) {
              addNameAlias(rec.heardTc, path);
            }
          }
        }
      } catch (_) {}
      state.confirmedAudioByName = byName;
    })
    .catch(() => {});

    fetch(`${AUDIO_CDN_BASE}/audio_manifest.json?v=44`)
    .then(r => (r.ok ? r.json() : []))
    .then(list => {
      if (!Array.isArray(list)) return;
      state.audioManifest = list.map(x => String(x).replace(/\\/g, '/'));
      state.audioStemMap.clear();
      for (const p of state.audioManifest) {
        const stem = p.split('/').pop().replace(/\.[^.]+$/, '').toLowerCase();
        if (stem && !state.audioStemMap.has(stem)) state.audioStemMap.set(stem, p);
        const idMatch = stem.match(/^(\d+)_/);
        if (idMatch) {
          const numId = idMatch[1].replace(/^0+/, '') || '0';
          const slotKey = stem.endsWith('_b') ? `id_${numId}_b` : `id_${numId}_a`;
          if (!state.audioStemMap.has(slotKey)) state.audioStemMap.set(slotKey, p);
        }
      }
    })
    .catch(() => {});
}

// === BOOT LECIP_TEST START ===
let _bootTestAudio = null;
let _bootTestUnlockCleanup = null;

function stopBootLecipTestAudio() {
  if (typeof _bootTestUnlockCleanup === 'function') {
    try { _bootTestUnlockCleanup(); } catch (_) {}
    _bootTestUnlockCleanup = null;
  }
  if (_bootTestAudio) {
    try {
      _bootTestAudio.onended = null;
      _bootTestAudio.onerror = null;
      _bootTestAudio.pause();
      _bootTestAudio.currentTime = 0;
    } catch (_) {}
    _bootTestAudio = null;
  }
}

function resolveBootLecipTestUrls(extraRelPaths = []) {
  const cdnBase = (typeof AUDIO_CDN_BASE !== 'undefined' && AUDIO_CDN_BASE)
    ? String(AUDIO_CDN_BASE).replace(/\/+$/, '')
    : 'https://kenyip0244.github.io/CTB-LECIP-Audio';
  const rawList = [
    ...["CDN::audio/announcements/LECIP_test (9-5).mp3", "CDN::audio/announcements/LECIP_test.mp3"],
    ...extraRelPaths,
    './assets/LECIP_test.mp3',
    './assets/LECIP_test.wav',
    './assets/LECIP_test.m4a',
    './assets/LECIP_test.ogg',
    './LECIP_test.mp3',
    './LECIP_test.wav',
    'CDN::LECIP_test.mp3',
    'CDN::LECIP_test.wav',
    'CDN::audio/LECIP_test.mp3',
    'CDN::audio/LECIP_test.wav'
  ];

  // 從已載入的 audioManifest 尋找檔名含 LECIP_test 的音檔
  if (Array.isArray(state?.audioManifest)) {
    for (const item of state.audioManifest) {
      if (typeof item === 'string' && /lecip_test/i.test(item)) {
        rawList.unshift('CDN::' + item.replace(/^\/+/, ''));
      }
    }
  }

  const urls = [];
  const seen = new Set();
  for (const entry of rawList) {
    if (!entry || typeof entry !== 'string') continue;
    let url = entry;
    if (entry.startsWith('CDN::')) {
      const rel = entry.slice(5).replace(/^\/+/, '');
      url = (typeof buildAudioUrl === 'function')
        ? buildAudioUrl(rel)
        : `${cdnBase}/${rel.split('/').map(encodeURIComponent).join('/')}`;
    }
    if (!seen.has(url)) {
      seen.add(url);
      urls.push(url);
    }
  }
  return urls;
}

async function playBootLecipTestAudio() {
  stopBootLecipTestAudio();
  let urls = resolveBootLecipTestUrls();
  let fetchedManifest = false;

  const tryAt = async (idx) => {
    if (idx >= urls.length) {
      if (!fetchedManifest) {
        fetchedManifest = true;
        try {
          const cdnBase = (typeof AUDIO_CDN_BASE !== 'undefined' && AUDIO_CDN_BASE)
            ? String(AUDIO_CDN_BASE).replace(/\/+$/, '')
            : 'https://kenyip0244.github.io/CTB-LECIP-Audio';
          const r = await fetch(`${cdnBase}/audio_manifest.json?v=${Date.now()}`);
          if (r.ok) {
            const arr = await r.json();
            if (Array.isArray(arr)) {
              const hits = arr
                .filter(p => typeof p === 'string' && /lecip_test/i.test(p))
                .map(p => 'CDN::' + p.replace(/^\/+/, ''));
              if (hits.length) {
                const prevLen = urls.length;
                const extra = resolveBootLecipTestUrls(hits).filter(u => !urls.includes(u));
                if (extra.length) {
                  urls = urls.concat(extra);
                  tryAt(prevLen);
                  return;
                }
              }
            }
          }
        } catch (_) {}
      }
      return;
    }

    const audio = new Audio(urls[idx]);
    audio.preload = 'auto';
    audio.volume = (typeof state?.volume === 'number' && Number.isFinite(state.volume)) ? state.volume : 1;
    _bootTestAudio = audio;

    let movedNext = false;
    const goNext = () => {
      if (movedNext || _bootTestAudio !== audio) return;
      movedNext = true;
      tryAt(idx + 1);
    };

    audio.onerror = goNext;
    audio.onended = () => {
      if (_bootTestAudio === audio) _bootTestAudio = null;
    };

    try {
      await audio.play();
    } catch (err) {
      if (_bootTestAudio !== audio) return;
      const isAutoplayBlock = err && (
        err.name === 'NotAllowedError' ||
        /user didn't interact|not allowed|autoplay/i.test(String(err.message || ''))
      );
      if (isAutoplayBlock) {
        // 瀏覽器阻擋自動播放時，等待首次觸碰畫面即刻補播
        const onFirstGesture = () => {
          if (typeof _bootTestUnlockCleanup === 'function') {
            _bootTestUnlockCleanup();
            _bootTestUnlockCleanup = null;
          }
          if (_bootTestAudio === audio) {
            tryAt(idx);
          }
        };
        window.addEventListener('pointerdown', onFirstGesture, { capture: true, once: true });
        window.addEventListener('keydown', onFirstGesture, { capture: true, once: true });
        _bootTestUnlockCleanup = () => {
          window.removeEventListener('pointerdown', onFirstGesture, { capture: true });
          window.removeEventListener('keydown', onFirstGesture, { capture: true });
        };
      } else {
        goNext();
      }
    }
  };

  tryAt(0);
}

(function initBootLecipTestWatcher() {
  const attach = () => {
    const overlay = document.getElementById('lecipBootOverlay');
    if (!overlay || overlay.dataset.lecipTestBound === '1') return;
    overlay.dataset.lecipTestBound = '1';

    const isClosed = () =>
      overlay.classList.contains('hidden') ||
      overlay.classList.contains('opacity-0') ||
      overlay.style.display === 'none';

    let wasOpen = !isClosed();

    const obs = new MutationObserver(() => {
      const closed = isClosed();
      if (wasOpen && closed) {
        wasOpen = false;
        playBootLecipTestAudio();
      } else if (!closed) {
        wasOpen = true;
      }
    });
    obs.observe(overlay, { attributes: true, attributeFilter: ['class', 'style'] });
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', attach, { once: true });
  } else {
    attach();
  }
})();

function runBootSequence(isReplay = false) {
  state.trainingMode = false;
  const overlay = document.getElementById('lecipBootOverlay');
  const pAndroid = document.getElementById('bootPhaseAndroid');
  const pDiag = document.getElementById('bootPhaseDiag');
  const diagStatus = document.getElementById('bootDiagStatus');
  if (!overlay || !pAndroid || !pDiag) return;

  overlay.classList.remove('hidden');
  overlay.style.opacity = '1';
  pAndroid.classList.remove('hidden');
  pDiag.classList.add('hidden');
  if (diagStatus) diagStatus.textContent = 'INITIALIZING...';

  let closed = false;
  let dataDone = isReplay;

  const tryClose = () => {
    if (closed || !dataDone) return;
    closed = true;
    renderAll();
    overlay.style.opacity = '0';
    setTimeout(() => overlay.classList.add('hidden'), 300);
  };

  overlay.onclick = () => { if (dataDone) tryClose(); };

  setTimeout(() => {
    if (closed) return;
    pAndroid.classList.add('hidden');
    pDiag.classList.remove('hidden');
  }, 1100);

  if (isReplay) {
    setTimeout(tryClose, 2600);
    return;
  }

  let minTimePassed = false;
  setTimeout(() => {
    minTimePassed = true;
    tryClose();
  }, 2400);

  fetchInitialLightData()
    .then(() => {
      dataDone = true;
      if (diagStatus) diagStatus.textContent = `READY (${state.uniqueRouteNos.length} ROUTES)`;
      if (minTimePassed) tryClose();
    })
    .catch(err => {
      dataDone = true;
      if (diagStatus) diagStatus.textContent = 'LOAD ERROR: ' + err.message;
    });
}

function bindGlobalEvents() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => {

      if (target === 'message' && !state.isStopped3s) {
        playAlertBeep(false);
        showToast('行車中禁止閱讀文字訊息（須停車 ≥3 秒）');
        return;
      }
      if (target === 'route' && state.currentTab === 'route' && state.routeStage === 'stops') {
        toggleGpsMode();
        return;
      }
      if (target === 'settings') state.settingsPage = 'menu';
      state.currentTab = target;
      renderAll();
    };
  });

  document.getElementById('btnOctopus').onclick = () => {
    state.octopusMode = (state.octopusMode + 1) % 3;
    const labels = ['八達通已完成連動', '八達通未完成連動／暫停收費', '八達通連動失效'];
    showToast(labels[state.octopusMode]);
    renderTopStatus();
  };

  document.getElementById('btnDisplayBox').onclick = () => {
    const nextStopped = !state.isStopped3s;
    setVehicleStoppedState(nextStopped, 32, false);
    if (nextStopped || state.currentTab !== 'route') {
      showToast(nextStopped ? '車輛狀態：已停 ≥3s' : '車輛狀態：行駛中 (32 km/h)');
    }
  };

  document.getElementById('btnGlobe').onclick = () => {
    state.lang = state.lang === 'tc' ? 'en' : 'tc';
    showToast(state.lang === 'tc' ? '語言：繁體中文' : 'Language: English');
    renderAll();
  };

  document.getElementById('btnCleverDriveBar').onclick = () => openCleverDriveModal();
  document.getElementById('btnCloseCD').onclick = () => document.getElementById('cleverDriveModal').classList.add('hidden');
  document.getElementById('btnDriverBadge').onclick = () => openStaffIdModal();

  const _nmp = document.getElementById('newMsgPopup');
  if (_nmp) _nmp.onclick = e => {
    if (e.target.id === 'btnDismissPopup') {
      state.dismissedPopup = true;
      renderTopStatus();
      return;
    }
    if (!state.isStopped3s) {
      showToast('須停車達 3 秒或以上方可閱讀訊息');
      return;
    }
    state.currentTab = 'message';
    renderAll();
  };

  const closeMore = () => document.getElementById('moreModal').classList.add('hidden');
  document.getElementById('btnCloseMore').onclick = closeMore;
  document.getElementById('moreReplayAudio').onclick = () => { closeMore(); triggerStopAnnouncement(state.currentStopIdx, true); };
  const _morePrev = document.getElementById('morePrevStop');
  if (_morePrev) _morePrev.onclick = () => {
    closeMore();
    if (state.routeStage === 'stops' && state.currentStopIdx > 0) {
      state.currentStopIdx--;
      state.stopsPage = 0;
      state.stopProgressPct = 20;
      state.gpsDistanceM = null;
      state.gpsArrivedCur = false;
      state.gpsMinDistToCur = Infinity;
      state.etaMap = {};
      renderAll();
      triggerStopAnnouncement(state.currentStopIdx, true);
    } else {
      showToast('已位於第 1 站');
    }
  };
  document.getElementById('moreToggleGps').onclick = () => { closeMore(); toggleGpsMode(); };
  document.getElementById('moreToggleTheme').onclick = () => {
    closeMore();
    state.currentTab = 'settings';
    state.settingsPage = 'prefs';
    renderAll();
  };
  document.getElementById('moreOpenCD').onclick = () => { closeMore(); openCleverDriveModal(); };
  document.getElementById('morePickStart').onclick = () => {
    closeMore();
    stopAllAudio();
    state.routeStage = 'start_stop';
    renderAll();
  };
  document.getElementById('moreBackRoutes').onclick = () => {
    closeMore();
    stopAllAudio();
    stopGpsTracking();
    state.routeStage = 'route';
    state.pageOffset = 0;
    renderAll();
  };

  document.getElementById('hwVolDown').onclick = () => {
    state.volume = Math.max(0.1, Math.round((state.volume - 0.1) * 10) / 10);
    if (currentAudio) currentAudio.volume = state.volume;
    showToast(`音量：${Math.round(state.volume * 100)}%`);
  };
  document.getElementById('hwVolUp').onclick = () => {
    state.volume = Math.min(1.0, Math.round((state.volume + 0.1) * 10) / 10);
    if (currentAudio) currentAudio.volume = state.volume;
    showToast(`音量：${Math.round(state.volume * 100)}%`);
  };
  const applyBrightness = () => {
    const sb = document.getElementById('screenBox');
    if (sb) sb.style.filter = `brightness(${state.brightness})`;
    showToast(`螢幕亮度：${Math.round(state.brightness * 100)}%`);
  };
  document.getElementById('hwBriDown').onclick = () => {
    state.brightness = Math.max(0.4, Math.round((state.brightness - 0.1) * 10) / 10);
    applyBrightness();
  };
  document.getElementById('hwBriUp').onclick = () => {
    state.brightness = Math.min(1.2, Math.round((state.brightness + 0.1) * 10) / 10);
    applyBrightness();
  };
  // 電腦實體鍵盤直接輸入支援（路線／廣播內嵌鍵盤開啟時）
  window.addEventListener('keydown', e => {
    if (e.target && ['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
    if (!document.getElementById('numModal').classList.contains('hidden')) return;
    if (state.currentTab === 'route' && state.routeStage === 'route' && state.routeKbOpen) {
      if (/^[0-9a-zA-Z]$/.test(e.key) && state.searchQuery.length < 6) {
        state.searchQuery += e.key.toUpperCase();
        state.routeLetterKey = null;
        state.pageOffset = 0;
        renderMain();
      } else if (e.key === 'Backspace') {
        state.searchQuery = state.searchQuery.slice(0, -1);
        state.routeLetterKey = null;
        state.pageOffset = 0;
        renderMain();
      } else if (e.key === 'Escape') {
        state.routeKbOpen = false;
        state.routeLetterKey = null;
        renderMain();
      }
    } else if (state.currentTab === 'announce' && state.annKbOpen) {
      if (/^[0-9]$/.test(e.key) && state.annInputCode.length < 3) {
        state.annInputCode += e.key;
        state.announcePage = 0;
        renderMain();
        scheduleInlineAnnAutoPlay();
      } else if (e.key === 'Backspace') {
        clearAnnAutoPlayTimers();
        state.annInputCode = state.annInputCode.slice(0, -1);
        state.announcePage = 0;
        renderMain();
        scheduleInlineAnnAutoPlay();
      } else if (e.key === 'Escape') {
        clearAnnAutoPlayTimers();
        state.annKbOpen = false;
        state.annInputCode = '';
        renderMain();
      }
    }
  });

}

// ============ 啟動應用 ============
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(reg => reg.update()).catch(() => {});
}
bindGlobalEvents();
renderTopStatus();
setInterval(renderTopStatus, 1000);
runBootSequence(false);

// === LECIP TAB CORNERS JS START ===
(function initLecipTabCorners() {
  let syncing = false;
  const getTabButtons = () => {
    let btns = Array.from(document.querySelectorAll('[data-tab]'));
    if (btns.length < 4) {
      btns = Array.from(document.querySelectorAll('#tabRoute, #tabBroadcast, #tabMessage, #tabIncident, #tabSettings, #navRoute, #navBroadcast, #navMessage, #navIncident, #navSettings'));
    }
    return btns;
  };

  const syncTabs = () => {
    if (syncing) return;
    const btns = getTabButtons();
    if (!btns.length) return;
    syncing = true;
    try {
      const onStops = typeof state !== 'undefined' && state.currentTab === 'route' && state.routeStage === 'stops';
      // 先清除行內覆蓋色，準確讀取原本的選中狀態
      btns.forEach(btn => { btn.style.backgroundColor = ''; });

      btns.forEach((btn, idx) => {
        if (!btn.classList.contains('lecip-nav-tab')) btn.classList.add('lecip-nav-tab');
        const bg = getComputedStyle(btn).backgroundColor;
        const isInactive = !bg || bg === 'rgba(0, 0, 0, 0)' || bg === 'transparent' || bg === 'rgb(0, 0, 0)';
        const isActive = !isInactive;

        if (btn.classList.contains('lecip-tab-active') !== isActive) btn.classList.toggle('lecip-tab-active', isActive);
        if (btn.classList.contains('lecip-tab-first') !== (idx === 0)) btn.classList.toggle('lecip-tab-first', idx === 0);
        if (btn.classList.contains('lecip-tab-last') !== (idx === btns.length - 1)) btn.classList.toggle('lecip-tab-last', idx === btns.length - 1);

        if (isActive) {
          const isRouteTab = idx === 0 || btn.dataset.tab === 'route';
          const finalBg = (onStops && isRouteTab) ? '#D8DAFF' : bg;
          if (onStops && isRouteTab) btn.style.backgroundColor = '#D8DAFF';
          btn.style.setProperty('--lecip-tab-bg', finalBg);
        } else {
          btn.style.removeProperty('--lecip-tab-bg');
        }
      });
    } finally {
      syncing = false;
    }
  };

  const attach = () => {
    syncTabs();
    const btns = getTabButtons();
    if (!btns.length) return;
    const nav = btns[0].parentElement;
    if (!nav || nav.dataset.lecipTabCornerObs === '1') return;
    nav.dataset.lecipTabCornerObs = '1';

    let rafId = 0;
    const schedule = () => {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(syncTabs);
    };
    const obs = new MutationObserver(schedule);
    obs.observe(nav, { attributes: true, subtree: true, attributeFilter: ['class'] });
    const vp = document.getElementById('mainViewport');
    if (vp) obs.observe(vp, { childList: true });
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', attach, { once: true });
  } else {
    attach();
  }
})();
// === LECIP TAB CORNERS JS END ===
</script>
